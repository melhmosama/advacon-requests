<!DOCTYPE html>
<html lang="en" dir="ltr" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

<title>ADVACON — Housing &amp; Offices</title>
<style>
  :root{
    --navy:#15406E; --med:#2A5C8A; --accent:#3E6E9E; --steel:#5B7A99;
    --green:#3C7D5A; --amber:#C08A3E; --red:#B0504A;
    --bg:#f5f7fa; --card:#ffffff; --text:#1a2634; --muted:#6b7885;
    --border:#e1e6ec; --border-soft:#eef1f5;
    --shadow:0 4px 20px rgba(21,64,110,.08);
    --shadow-lg:0 12px 40px rgba(21,64,110,.14);
    --hdrh:64px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
    min-height:100vh;
  }
  body.rtl{ direction:rtl; font-family:'Segoe UI',Tahoma,Arial,sans-serif; }
  a{color:var(--med); text-decoration:none}
  a:hover{text-decoration:underline}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}

  /* ============ Login screen ============ */
  .lg-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px }
  .lg-card{ background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:36px 32px; max-width:420px; width:100% }
  .lg-eye{ color:var(--steel); font-size:12px; text-transform:uppercase; letter-spacing:1.5px; margin-bottom:6px; font-weight:600 }
  .lg-title{ color:var(--navy); font-size:22px; margin:0 0 20px; font-weight:700 }
  .lg-field{ margin-bottom:14px }
  .lg-label{ display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:500 }
  .lg-input{ width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:8px; font-size:15px; background:#fff; color:var(--text) }
  .lg-input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(62,110,158,.15) }
  .lg-btn{ width:100%; padding:12px; background:var(--navy); color:#fff; border:0; border-radius:10px; font-size:15px; font-weight:600; margin-top:6px }
  .lg-btn:disabled{ opacity:.5; cursor:not-allowed }
  .lg-btn:hover:not(:disabled){ background:var(--med) }
  .lg-err{ background:rgba(176,80,74,.08); color:var(--red); border:1px solid rgba(176,80,74,.3); padding:10px 12px; border-radius:8px; font-size:13px; margin-top:12px }
  .lg-info{ background:rgba(46,92,138,.06); color:var(--med); border:1px solid rgba(46,92,138,.2); padding:10px 12px; border-radius:8px; font-size:13px; margin-top:12px }

  /* ============ App shell ============ */
  .app{ min-height:100vh }
  .hdr{
    position:sticky; top:0; z-index:20; background:#fff; border-bottom:1px solid var(--border);
    padding:0 22px; height:var(--hdrh); display:flex; align-items:center; gap:18px;
  }
  .hdr-brand{ font-size:15px; font-weight:700; color:var(--navy); white-space:nowrap; display:flex; align-items:center; gap:8px }
  .hdr-brand .em{ color:var(--steel); font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase }
  .hdr-tabs{ display:flex; gap:2px; flex:1; overflow-x:auto; scrollbar-width:none }
  .hdr-tabs::-webkit-scrollbar{ display:none }
  .hdr-tab{
    background:transparent; border:0; color:var(--muted); font-size:14px; font-weight:600;
    padding:8px 14px; border-radius:8px; white-space:nowrap; display:flex; align-items:center; gap:6px;
  }
  .hdr-tab:hover:not(:disabled){ background:var(--border-soft); color:var(--text) }
  .hdr-tab.active{ background:var(--navy); color:#fff }
  .hdr-tab:disabled{ opacity:.5; cursor:not-allowed }
  .hdr-tab .soon{ font-size:10px; padding:1px 6px; background:#fff; color:var(--muted); border-radius:8px; margin-inline-start:4px }
  .hdr-tab.active .soon{ background:rgba(255,255,255,.2); color:#fff }
  .hdr-right{ display:flex; align-items:center; gap:10px }
  .hdr-user{ font-size:13px; color:var(--muted); max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .hdr-btn{ background:transparent; border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:13px; color:var(--text); font-weight:500 }
  .hdr-btn:hover{ background:var(--border-soft) }
  .hdr-btn.danger:hover{ background:rgba(176,80,74,.08); color:var(--red); border-color:rgba(176,80,74,.3) }

  /* ============ Content wrapper ============ */
  .wrap{ max-width:1280px; margin:0 auto; padding:26px 22px 60px }
  .phead{ display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:22px }
  .phead-l h1{ margin:2px 0 4px; font-size:24px; color:var(--navy); font-weight:700 }
  .phead-l .sub{ color:var(--muted); font-size:14px }
  .phead-l .eye{ color:var(--steel); font-size:11px; text-transform:uppercase; letter-spacing:1.2px; font-weight:600 }

  /* ============ Toolbar (filters + search + New button) ============ */
  .tb{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; background:#fff; padding:12px 14px; border:1px solid var(--border); border-radius:12px; box-shadow:0 1px 3px rgba(21,64,110,.04) }
  .tb-search{ display:flex; align-items:center; gap:6px; flex:1; min-width:180px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:0 12px }
  .tb-search input{ flex:1; border:0; background:transparent; padding:10px 0; outline:none; font-size:14px }
  .tb-search .ic{ color:var(--muted); font-size:14px }
  .tb-sel{ padding:9px 10px; border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--text); font-size:14px; min-width:140px }
  .tb-sel:focus{ outline:none; border-color:var(--accent) }
  .tb-chk{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text); cursor:pointer; user-select:none }
  .tb-chk input{ margin:0 }
  .btn{ background:var(--navy); color:#fff; border:0; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:6px }
  .btn:hover:not(:disabled){ background:var(--med) }
  .btn:disabled{ opacity:.5; cursor:not-allowed }
  .btn-sm{ padding:6px 10px; font-size:13px }
  .btn-alt{ background:transparent; color:var(--navy); border:1px solid var(--navy) }
  .btn-alt:hover:not(:disabled){ background:var(--navy); color:#fff }
  .btn-ghost{ background:transparent; color:var(--muted); border:1px solid var(--border) }
  .btn-ghost:hover:not(:disabled){ background:var(--border-soft); color:var(--text) }
  .btn-danger{ background:var(--red); color:#fff; border:0 }
  .btn-danger:hover:not(:disabled){ background:#8f4039 }

  /* ============ Empty / loading states ============ */
  .empty{ background:#fff; border:1px dashed var(--border); border-radius:12px; padding:44px 20px; text-align:center; color:var(--muted); font-size:14px }
  .empty .em-em{ font-size:32px; margin-bottom:6px; opacity:.6 }
  .load{ background:#fff; border:1px solid var(--border); border-radius:12px; padding:32px; text-align:center; color:var(--muted) }
  .spin{ display:inline-block; width:14px; height:14px; border:2px solid var(--med); border-top-color:transparent; border-radius:50%; animation:spin .8s linear infinite; vertical-align:-2px; margin-inline-end:6px }
  @keyframes spin{ to{transform:rotate(360deg)} }

  /* ============ Data list / cards ============ */
  .list{ display:flex; flex-direction:column; gap:8px }
  .row{
    background:#fff; border:1px solid var(--border); border-radius:12px; padding:14px 16px;
    display:flex; gap:14px; align-items:center; transition:box-shadow .15s;
  }
  .row:hover{ box-shadow:0 4px 12px rgba(21,64,110,.08); border-color:var(--accent) }
  .row-main{ flex:1; min-width:0 }
  .row-title{ font-size:15px; font-weight:600; color:var(--text); display:flex; align-items:center; gap:8px; flex-wrap:wrap }
  .row-sub{ font-size:12.5px; color:var(--muted); margin-top:3px; display:flex; gap:12px; flex-wrap:wrap }
  .row-sub .sep{ opacity:.4 }
  .row-right{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end }

  .badge{ display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.4px }
  .badge-code{ background:#eef2f7; color:var(--navy); font-family:ui-monospace,'SF Mono',Consolas,monospace; text-transform:none; letter-spacing:0 }
  .badge-ok{ background:rgba(60,125,90,.12); color:var(--green) }
  .badge-warn{ background:rgba(192,138,62,.12); color:var(--amber) }
  .badge-err{ background:rgba(176,80,74,.12); color:var(--red) }
  .badge-mut{ background:var(--border-soft); color:var(--muted) }

  /* ============ Modal ============ */
  .mask{ position:fixed; inset:0; background:rgba(21,32,50,.55); backdrop-filter:blur(3px); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px }
  .mdl{ background:#fff; border-radius:16px; box-shadow:var(--shadow-lg); max-width:640px; width:100%; max-height:92vh; display:flex; flex-direction:column; overflow:hidden }
  .mdl-hd{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border) }
  .mdl-tt{ font-size:17px; font-weight:700; color:var(--navy) }
  .mdl-x{ background:transparent; border:0; font-size:22px; color:var(--muted); line-height:1; padding:0 4px }
  .mdl-x:hover{ color:var(--text) }
  .mdl-bd{ padding:18px 20px; overflow:auto; flex:1 }
  .mdl-ft{ padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; background:#fafbfc }

  .fld{ margin-bottom:14px }
  .fld-lbl{ display:block; font-size:13px; color:var(--muted); font-weight:500; margin-bottom:5px }
  .fld-lbl .req{ color:var(--red); margin-inline-start:2px }
  .fld-inp, .fld-sel, .fld-ta{
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px;
    font-size:14px; background:#fff; color:var(--text);
  }
  .fld-sel{ appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-inline-end:32px }
  body.rtl .fld-sel{ background-position:15px 50%,10px 50%; padding-inline-end:11px; padding-inline-start:32px }
  .fld-ta{ min-height:70px; resize:vertical; font-family:inherit }
  .fld-inp:focus, .fld-sel:focus, .fld-ta:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(62,110,158,.15) }
  .fld-hint{ font-size:12px; color:var(--muted); margin-top:4px }
  .fld-warn{ font-size:12.5px; color:var(--amber); margin-top:6px; background:rgba(192,138,62,.08); padding:6px 10px; border-radius:6px; border-inline-start:3px solid var(--amber) }
  .fld-good{ font-size:12.5px; color:var(--green); margin-top:6px }
  .fld-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px }
  .fld-row-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px }
  @media (max-width:520px){ .fld-row, .fld-row-3{ grid-template-columns:1fr } }
  .mdl-err{ background:rgba(176,80,74,.08); color:var(--red); border:1px solid rgba(176,80,74,.3); padding:10px 12px; border-radius:8px; font-size:13px; margin-bottom:12px }

  /* ============ Toast ============ */
  .toast-root{ position:fixed; top:78px; left:50%; transform:translateX(-50%); z-index:120; pointer-events:none }
  .toast{ background:var(--navy); color:#fff; padding:11px 18px; border-radius:10px; box-shadow:var(--shadow-lg); font-size:14px; font-weight:500; pointer-events:auto; max-width:520px; text-align:center; animation:slideDown .2s }
  .toast-ok{ background:var(--green) } .toast-warn{ background:var(--amber) } .toast-err{ background:var(--red) }
  @keyframes slideDown{ from{ transform:translate(-50%,-10px); opacity:0 } to{ transform:translate(-50%,0); opacity:1 } }

  /* ============ Small helpers ============ */
  .grow{ flex:1 } .nowrap{ white-space:nowrap } .mono{ font-family:ui-monospace,'SF Mono',Consolas,monospace }
</style>
</head>

/* ---------- tiny helpers ---------- */
function t(k){ const d = T[state.lang]; return (d && d[k]) || T.en[k] || k; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtNum(n){ if(n==null||n===''||isNaN(n)) return '—'; const num = Number(n); return num.toLocaleString(state.lang==='ar' ? 'ar-SA-u-nu-latn' : 'en-US', {maximumFractionDigits:2}); }
function fmtDate(d){ if(!d) return '—'; try{ return new Date(d).toISOString().slice(0,10); }catch{ return String(d); } }
function daysBetween(a, b){ const ta = new Date(a).getTime(); const tb = new Date(b).getTime(); return Math.round((tb - ta) / 86400000); }
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ---------- Storage ---------- */
function getSess(){
  try {
    const raw = localStorage.getItem(SESS_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !s.access_token) return null;
    return s;
  } catch(e){ return null; }
}
function saveSess(s){ try{ localStorage.setItem(SESS_KEY, JSON.stringify(s)); }catch(e){} }
function clearSess(){ try{ localStorage.removeItem(SESS_KEY); }catch(e){} state.sess = null; }
function getLang(){
  try { const v = localStorage.getItem(LANG_KEY); if(v==='ar'||v==='en') return v; }catch(e){}
  return 'en';
}
function saveLang(l){ try{ localStorage.setItem(LANG_KEY, l); }catch(e){} }

/* ---------- Auth ---------- */
async function signIn(email, password){
  let login;
  try {
    const r = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
      method:'POST',
      headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    login = await r.json();
    if (!r.ok || !login.access_token) {
      return { ok:false, error: (login && (login.error_description || login.msg || login.error)) || 'auth_failed' };
    }
  } catch(e){ return { ok:false, error:'network' }; }

  // verify admin
  let isAdmin = false;
  try {
    const ar = await fetch(SB_URL + '/rest/v1/rpc/is_admin', {
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+login.access_token,'Content-Type':'application/json'},
      body:'{}'
    });
    isAdmin = (await ar.json()) === true;
  } catch(e){ return { ok:false, error:'network' }; }

  if (!isAdmin) return { ok:false, error:'not_admin' };

  const sess = {
    access_token:  login.access_token,
    refresh_token: login.refresh_token,
    expires_at:    new Date(Date.now() + (login.expires_in || 3600) * 1000).toISOString(),
    user_id:       login.user && login.user.id,
    email:         login.user && login.user.email
  };
  saveSess(sess);
  state.sess = sess;
  return { ok:true };
}

async function signOut(){
  const s = state.sess;
  if (s) {
    // best-effort; ignore errors
    try {
      await fetch(SB_URL + '/auth/v1/logout', {
        method:'POST',
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+s.access_token,'Content-Type':'application/json'},
        body:'{}'
      });
    } catch(e){}
  }
  clearSess();
  state.screen = 'units';
  state.units = state.landlords = state.contracts = [];
  toast(t('tcSignedOut'), 'ok');
  render();
}

async function refreshSession(){
  const s = state.sess;
  if (!s || !s.refresh_token) throw new Error('no_refresh');
  const r = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
    method:'POST',
    headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
    body: JSON.stringify({refresh_token: s.refresh_token})
  });
  const body = await r.json();
  if (!r.ok || !body.access_token) throw new Error('refresh_failed');
  const next = {
    ...s,
    access_token:  body.access_token,
    refresh_token: body.refresh_token || s.refresh_token,
    expires_at:    new Date(Date.now() + (body.expires_in || 3600) * 1000).toISOString()
  };
  saveSess(next);
  state.sess = next;
}

async function ensureSession(){
  if (!state.sess) throw new Error('no_session');
  const exp = new Date(state.sess.expires_at).getTime();
  if (isNaN(exp) || exp - Date.now() < 60_000) {
    await refreshSession();
  }
}

/* ---------- RPC ---------- */
async function hoRpc(fn, args){
  try { await ensureSession(); }
  catch(e){ return { ok:false, error:'unauthorized', status:401 }; }
  try {
    const res = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method:'POST',
      headers:{
        'apikey':SB_KEY,
        'Authorization':'Bearer '+state.sess.access_token,
        'Content-Type':'application/json'
      },
      body: JSON.stringify(args || {})
    });
    const txt = await res.text();
    let body = null;
    try { body = txt ? JSON.parse(txt) : null; } catch(e){}
    if (!res.ok) {
      let err = (body && (body.message || body.hint || body.error)) || ('http_' + res.status);
      // Session-expired shape from PostgREST → treat as unauthorized
      if (res.status === 401 || res.status === 403 || /jwt|expired|invalid/i.test(err)) err = 'unauthorized';
      return { ok:false, error:err, status:res.status };
    }
    return { ok:true, data:body, status:res.status };
  } catch(e){
    return { ok:false, error:'network', status:0 };
  }
}

/* ---------- Toast ---------- */
let _toastTimer = null;
function toast(text, type){
  const el = document.getElementById('toast-root');
  if (!el) return;
  const cls = type === 'ok' ? 'toast-ok' : type === 'warn' ? 'toast-warn' : type === 'err' ? 'toast-err' : '';
  el.innerHTML = '<div class="toast '+cls+'">'+esc(text)+'</div>';
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>{ el.innerHTML=''; }, 2600);
}

function hoLangToggle(){
  state.lang = state.lang === 'en' ? 'ar' : 'en';
  saveLang(state.lang);
  render();
}

async function hoSignInSubmit(ev){
  if (ev && ev.preventDefault) ev.preventDefault();
  const em = (document.getElementById('lg_email')||{}).value || '';
  const pw = (document.getElementById('lg_password')||{}).value || '';
  state.bootError = null;
  const btn = document.getElementById('lg_btn');
  if (btn) { btn.disabled = true; btn.textContent = t('lgSigningIn'); }
  const r = await signIn(em.trim(), pw);
  if (btn) { btn.disabled = false; btn.textContent = t('lgSignIn'); }
  if (!r.ok) {
    state.bootError = r.error === 'not_admin' ? 'lgNotAdmin'
                    : r.error === 'network'   ? 'lgNetwork'
                    : 'lgAuthFail';
    render();
    return;
  }
  state.bootError = null;
  await bootstrapAfterAuth();
}

async function bootstrapAfterAuth(){
  render();  // show shell immediately
  const r = await loadRefs();
  if (!r.ok) { toast(errMsg(r.error), 'err'); return; }
  await loadUnits();
  // eager preload of other tabs so nav is instant
  loadLandlords();
  loadContracts();
}

async function hoSignOutClick(){ await signOut(); }

function hoNav(scr){
  state.screen = scr;
  render();
  if (scr === 'units'     && state.units.length === 0     && !state.ui.units.loading)     loadUnits();
  if (scr === 'landlords' && state.landlords.length === 0 && !state.ui.landlords.loading) loadLandlords();
  if (scr === 'contracts' && state.contracts.length === 0 && !state.ui.contracts.loading) loadContracts();
}

function hoRefresh(){
  if (state.screen === 'units')     loadUnits();
  if (state.screen === 'landlords') loadLandlords();
  if (state.screen === 'contracts') loadContracts();
}

/* filters — set without re-render for text inputs (preserve focus) */
function hoFiltSet(scr, field, value, quiet){
  state.ui[scr][field] = value;
  if (!quiet) render();
}
function hoFiltClear(scr){
  const u = state.ui[scr];
  Object.keys(u).forEach(k => { if (k !== 'loading') u[k] = (k === 'activeOnly' ? true : ''); });
  render();
}

/* ---------- Modal open / close ---------- */
function openModal(type, data){
  state.modal = { type, data: data || {}, busy:false, error:null, warning:null };
  render();
  // focus first input
  setTimeout(()=>{
    const el = document.querySelector('.mdl-bd input, .mdl-bd select, .mdl-bd textarea');
    if (el) el.focus();
  }, 40);
}
function closeModal(){ state.modal = null; render(); }
function mdSet(field, value, quiet){
  if (!state.modal) return;
  state.modal.data[field] = value;
  if (!quiet) render();
}
function mdSetBusy(b){ if (state.modal){ state.modal.busy = b; render(); } }
function mdSetError(e){ if (state.modal){ state.modal.error = e; render(); } }
function mdSetWarn(w){ if (state.modal){ state.modal.warning = w; render(); } }

   ===================================================================== */

function render(){
  // Apply direction + document lang
  document.documentElement.lang = state.lang;
  document.documentElement.dir = T[state.lang].dir;
  document.body.classList.toggle('rtl', state.lang === 'ar');
  document.title = 'ADVACON — ' + t('lgTitle');

  const app = document.getElementById('app');
  if (!state.sess) {
    app.innerHTML = viewLogin();
  } else {
    app.innerHTML = viewApp();
  }

  // Modal overlay
  const mroot = document.getElementById('modal-root');
  mroot.innerHTML = state.modal ? viewModal() : '';
}

function contractRow(c){
  const st = c.status;
  const badge =
    st === 'active'    ? '<span class="badge badge-ok">'+esc(t('rowActive'))+'</span>' :
    st === 'expired'   ? '<span class="badge badge-mut">'+esc(t('rowExpired'))+'</span>' :
                         '<span class="badge badge-err">'+esc(t('rowCancelled'))+'</span>';

  const days = c.days_remaining;
  let daysHtml = '';
  if (typeof days === 'number' && st === 'active') {
    if (days < 0)  daysHtml = '<span class="badge badge-err">'+esc(t('rowOverdue'))+' '+esc(String(-days))+' '+esc(t('rowDays'))+'</span>';
    else if (days <= 60) daysHtml = '<span class="badge badge-warn">'+fmtNum(days)+' '+esc(t('rowDays'))+'</span>';
  }

  const uCode = c.unit && c.unit.code ? c.unit.code : '';
  const uName = c.unit && c.unit.name_ar ? c.unit.name_ar : '';
  const uLoc  = c.unit && c.unit.location ? c.unit.location : '';
  const lName = c.landlord && c.landlord.name ? c.landlord.name : '';

  const pm = labelFor(refFind('payment_methods', c.payment_method));

  const bits = [];
  if (uLoc) bits.push('📍 '+esc(uLoc));
  if (lName) bits.push('👤 '+esc(lName));
  if (pm) bits.push(esc(pm));
  if (c.contract_no) bits.push('#'+esc(c.contract_no));

  const money = fmtNum(c.monthly_rent)+' '+esc(t('rowMonthly'))+' · '+esc(t('rowStart'))+' '+esc(fmtDate(c.start_date))+' → '+esc(t('rowEnd'))+' '+esc(fmtDate(c.end_date));

  return (
    '<div class="row">'+
      '<div class="row-main">'+
        '<div class="row-title">'+
          (uCode ? '<span class="badge badge-code">'+esc(uCode)+'</span>' : '')+
          '<span>'+esc(uName||'—')+'</span>'+
        '</div>'+
        '<div class="row-sub">'+ bits.join('<span class="sep">·</span>') +'</div>'+
        '<div class="row-sub" style="margin-top:4px">'+esc(money)+'</div>'+
      '</div>'+
      '<div class="row-right">'+
        badge + daysHtml +
        '<button class="btn btn-ghost btn-sm" type="button" onclick="openModal(\'status_change\',{contract_id:\''+esc(c.id)+'\',current_status:\''+esc(c.status)+'\',preview:\''+esc((c.unit&&c.unit.code)||'')+' — '+esc((c.unit&&c.unit.name_ar)||'')+'\'})">'+esc(t('actChangeStatus'))+'</button>'+
      '</div>'+
    '</div>'
  );
}

/* ---------- ref helpers ---------- */
function refFind(list, id){
  if (!state.refs || !id) return null;
  const arr = state.refs[list];
  if (!arr) return null;
  return arr.find(x => x.id === id) || null;
}
function labelFor(ref){
  if (!ref) return '';
  return state.lang === 'ar' ? (ref.name_ar || ref.name_en) : (ref.name_en || ref.name_ar);
}

function viewModal(){
  const m = state.modal;
  if (!m) return '';
  let body='', title='', save='', saveFn='';
  if (m.type === 'unit_create')     { title = t('mdUnitCreate');      body = modalUnitCreate(m);      saveFn = 'hoSubmitUnit()'; }
  else if (m.type === 'landlord_create'){ title = t('mdLandlordCreate'); body = modalLandlordCreate(m); saveFn = 'hoSubmitLandlord()'; }
  else if (m.type === 'contract_create'){ title = t('mdContractCreate'); body = modalContractCreate(m); saveFn = 'hoSubmitContract()'; }
  else if (m.type === 'status_change')  { title = t('mdStatusChange');   body = modalStatusChange(m);   saveFn = 'hoSubmitStatus()'; }

  save = m.busy
    ? '<button class="btn" disabled><span class="spin"></span>'+esc(t('mSaving'))+'</button>'
    : '<button class="btn" type="button" onclick="'+saveFn+'">'+esc(t('mSave'))+'</button>';

  return (
    '<div class="mask" onclick="if(event.target===this) closeModal()">'+
      '<div class="mdl">'+
        '<div class="mdl-hd">'+
          '<div class="mdl-tt">'+esc(title)+'</div>'+
          '<button class="mdl-x" type="button" onclick="closeModal()" '+(m.busy?'disabled':'')+'>×</button>'+
        '</div>'+
        '<div class="mdl-bd">'+
          (m.error ? '<div class="mdl-err">'+esc(t('err_'+m.error) || t('errGeneric'))+'</div>' : '')+
          body+
        '</div>'+
        '<div class="mdl-ft">'+
          '<button class="btn btn-ghost" type="button" onclick="closeModal()" '+(m.busy?'disabled':'')+'>'+esc(t('mCancel'))+'</button>'+
          save+
        '</div>'+
      '</div>'+
    '</div>'
  );
}

async function hoSubmitUnit(){
  const m = state.modal; if (!m) return;
  const d = m.data;
  mdSetError(null); mdSetBusy(true);
  const r = await hoRpc('housing_create_unit', {
    p_code:          (d.code || '').toUpperCase().trim(),
    p_name_ar:       (d.name_ar || '').trim(),
    p_category:      d.category || '',
    p_location:      (d.location || '').trim(),
    p_use_type:      d.use_type || '',
    p_name_en:       (d.name_en || '').trim() || null,
    p_purpose_label: (d.purpose_label || '').trim() || null,
    p_room_count:    d.room_count ? Number(d.room_count) : null,
    p_capacity:      d.capacity   ? Number(d.capacity)   : null,
    p_notes:         (d.notes || '').trim() || null
  });
  mdSetBusy(false);
  if (!r.ok) { mdSetError(r.error); return; }
  closeModal();
  toast(t('tcUnitCreated'), 'ok');
  await loadUnits();
}

  const d = m.data;
  const activeUnits = state.units.filter(u => u.is_active);
  const activeLandlords = state.landlords.filter(l => l.is_active);
  const pays = (state.refs && state.refs.payment_methods)   || [];
  const stats= (state.refs && state.refs.contract_statuses) || [];

  const optUnit = '<option value="">'+esc(t('optChoose'))+'</option>' +
    activeUnits.map(u => '<option value="'+esc(u.id)+'"'+(d.unit_id===u.id?' selected':'')+'>'+esc(u.code)+' — '+esc(u.name_ar||'')+'</option>').join('');
  const optLandlord = '<option value="">'+esc(t('optChoose'))+'</option>' +
    activeLandlords.map(l => '<option value="'+esc(l.id)+'"'+(d.landlord_id===l.id?' selected':'')+'>'+esc(l.name)+'</option>').join('');
  const optPay = '<option value="">'+esc(t('optChoose'))+'</option>' +
    pays.map(p => '<option value="'+esc(p.id)+'"'+(d.payment_method===p.id?' selected':'')+'>'+esc(labelFor(p))+'</option>').join('');
  const optStat = stats.map(s => '<option value="'+esc(s.id)+'"'+((d.status||'active')===s.id?' selected':'')+'>'+esc(labelFor(s))+'</option>').join('');

  // client-side variance preview
  let varHtml = '';
  const m_r = Number(d.monthly_rent);
  const t_v = Number(d.total_value);
  if (d.start_date && d.end_date && !isNaN(m_r) && !isNaN(t_v) && m_r >= 0 && t_v >= 0) {
    const days = daysBetween(d.start_date, d.end_date) + 1;
    if (days > 0) {
      const months = days / 30.4375;
      const expected = Math.round(m_r * months * 100) / 100;
      const diff = t_v - expected;
      const pct = expected > 0 ? Math.abs(diff) / expected : 0;
      const sig = pct > 0.02;
      if (expected > 0) {
        const line = esc(t('varExpected'))+' '+fmtNum(expected)+' · '+esc(t('varDiff'))+' '+fmtNum(diff)+' ('+fmtNum(pct*100)+'%)';
        varHtml = sig
          ? '<div class="fld-warn">⚠️ '+esc(t('varWarn'))+'<br><span style="opacity:.85">'+line+'</span></div>'
          : '<div class="fld-good">✅ '+esc(t('varOk'))+'<br><span style="opacity:.85">'+line+'</span></div>';
      }
    }
  }

  return (
    '<div class="fld-row">'+
      '<div class="fld"><label class="fld-lbl">'+esc(t('fUnit'))+'<span class="req">*</span></label>'+
        '<select class="fld-sel" onchange="mdSet(\'unit_id\',this.value,true)">'+optUnit+'</select>'+
      '</div>'+
      '<div class="fld"><label class="fld-lbl">'+esc(t('fLandlord'))+'<span class="req">*</span></label>'+
        '<select class="fld-sel" onchange="mdSet(\'landlord_id\',this.value,true)">'+optLandlord+'</select>'+
      '</div>'+
    '</div>'+

    '<div class="fld-row">'+
      '<div class="fld"><label class="fld-lbl">'+esc(t('fPaymentMethod'))+'<span class="req">*</span></label>'+
        '<select class="fld-sel" onchange="mdSet(\'payment_method\',this.value,true)">'+optPay+'</select>'+
      '</div>'+
      '<div class="fld"><label class="fld-lbl">'+esc(t('fContractNo'))+'</label>'+
        '<input class="fld-inp" type="text" value="'+esc(d.contract_no||'')+'" oninput="mdSet(\'contract_no\',this.value,true)" maxlength="100">'+
      '</div>'+
    '</div>'+

    '<div class="fld"><label class="fld-lbl">'+esc(t('fAccountRef'))+'</label>'+
      '<input class="fld-inp" type="text" value="'+esc(d.account_ref||'')+'" oninput="mdSet(\'account_ref\',this.value,true)" maxlength="100">'+
      '<div class="fld-hint">'+esc(t('fAccountRefHint'))+'</div>'+
    '</div>'+

    '<div class="fld-row-3">'+
      '<div class="fld"><label class="fld-lbl">'+esc(t('fStartDate'))+'<span class="req">*</span></label>'+
        '<input class="fld-inp" type="date" value="'+esc(d.start_date||'')+'" onchange="mdSet(\'start_date\',this.value)">'+
      '</div>'+
      '<div class="fld"><label class="fld-lbl">'+esc(t('fEndDate'))+'<span class="req">*</span></label>'+
        '<input class="fld-inp" type="date" value="'+esc(d.end_date||'')+'" onchange="mdSet(\'end_date\',this.value)">'+
      '</div>'+
      '<div class="fld"><label class="fld-lbl">'+esc(t('fDuration'))+'</label>'+
        '<input class="fld-inp" type="text" value="'+esc(d.duration_label||'')+'" oninput="mdSet(\'duration_label\',this.value,true)" maxlength="100">'+
        '<div class="fld-hint">'+esc(t('fDurationHint'))+'</div>'+
      '</div>'+
    '</div>'+

    '<div class="fld-row">'+
      '<div class="fld"><label class="fld-lbl">'+esc(t('fMonthlyRent'))+'<span class="req">*</span></label>'+
        '<input class="fld-inp" type="number" min="0" step="0.01" value="'+esc(d.monthly_rent||'')+'" oninput="mdSet(\'monthly_rent\',this.value)">'+
      '</div>'+
      '<div class="fld"><label class="fld-lbl">'+esc(t('fTotalValue'))+'<span class="req">*</span></label>'+
        '<input class="fld-inp" type="number" min="0" step="0.01" value="'+esc(d.total_value||'')+'" oninput="mdSet(\'total_value\',this.value)">'+
        varHtml+
      '</div>'+
    '</div>'+

    '<div class="fld-row">'+
      '<div class="fld"><label class="fld-lbl">'+esc(t('fNextPaymentDue'))+'</label>'+
        '<input class="fld-inp" type="date" value="'+esc(d.next_payment_due||'')+'" onchange="mdSet(\'next_payment_due\',this.value,true)">'+
      '</div>'+
      '<div class="fld"><label class="fld-lbl">'+esc(t('fStatus'))+'</label>'+
        '<select class="fld-sel" onchange="mdSet(\'status\',this.value,true)">'+optStat+'</select>'+
      '</div>'+
    '</div>'+

    '<div class="fld"><label class="fld-lbl">'+esc(t('fPayStatusNote'))+'</label>'+
      '<input class="fld-inp" type="text" value="'+esc(d.payment_status_note||'')+'" oninput="mdSet(\'payment_status_note\',this.value,true)" maxlength="500">'+
    '</div>'+

    '<div class="fld"><label class="fld-lbl">'+esc(t('fNotes'))+'</label>'+
      '<textarea class="fld-ta" oninput="mdSet(\'notes\',this.value,true)" maxlength="2000">'+esc(d.notes||'')+'</textarea>'+
    '</div>'
  );
}

async function hoSubmitContract(){
  const m = state.modal; if (!m) return;
  const d = m.data;
  mdSetError(null); mdSetBusy(true);
  const r = await hoRpc('housing_create_contract', {
    p_unit_id:              d.unit_id     || null,
    p_landlord_id:          d.landlord_id || null,
    p_payment_method:       d.payment_method || '',
    p_start_date:           d.start_date  || null,
    p_end_date:             d.end_date    || null,
    p_monthly_rent:         d.monthly_rent === '' || d.monthly_rent == null ? null : Number(d.monthly_rent),
    p_total_value:          d.total_value  === '' || d.total_value  == null ? null : Number(d.total_value),
    p_status:               d.status || 'active',
    p_contract_no:          (d.contract_no || '').trim() || null,
    p_account_ref:          (d.account_ref || '').trim() || null,
    p_duration_label:       (d.duration_label || '').trim() || null,
    p_next_payment_due:     d.next_payment_due || null,
    p_payment_status_note:  (d.payment_status_note || '').trim() || null,
    p_notes:                (d.notes || '').trim() || null
  });
  mdSetBusy(false);
  if (!r.ok) { mdSetError(r.error); return; }
  closeModal();
  toast(t('tcContractCreated'), 'ok');
  if (r.data && r.data.variance && r.data.variance.has_significant_variance) {
    setTimeout(()=> toast('⚠️ '+t('varWarn'), 'warn'), 1200);
  }
  await loadContracts();
}

/* ---------- STATUS CHANGE modal ---------- */
function modalStatusChange(m){
  const d = m.data;
  const stats = (state.refs && state.refs.contract_statuses) || [];
  const opts = stats.map(s => '<option value="'+esc(s.id)+'"'+(d.new_status===s.id?' selected':'')+'>'+esc(labelFor(s))+'</option>').join('');
  const curLabel = labelFor(refFind('contract_statuses', d.current_status)) || d.current_status;
  return (
    '<div class="fld"><label class="fld-lbl">'+esc(t('fUnit'))+'</label>'+
      '<div class="fld-inp" style="background:var(--bg);color:var(--muted)">'+esc(d.preview||'')+'</div>'+
    '</div>'+
    '<div class="fld"><label class="fld-lbl">'+esc(t('fStatus'))+' → '+esc(t('fNewStatus'))+'</label>'+
      '<select class="fld-sel" onchange="mdSet(\'new_status\',this.value,true)">'+
        '<option value="">'+esc(t('optChoose'))+' ('+esc(t('fStatus'))+': '+esc(curLabel)+')</option>'+
        opts+
      '</select>'+
    '</div>'+
    '<div class="fld"><label class="fld-lbl">'+esc(t('fReason'))+'</label>'+
      '<textarea class="fld-ta" oninput="mdSet(\'reason\',this.value,true)" maxlength="500">'+esc(d.reason||'')+'</textarea>'+
      '<div class="fld-hint">'+esc(t('fReasonHint'))+'</div>'+
    '</div>'
  );
}

async function hoSubmitStatus(){
  const m = state.modal; if (!m) return;
  const d = m.data;
  if (!d.new_status) { mdSetError('status_required'); return; }
  mdSetError(null); mdSetBusy(true);
  const r = await hoRpc('housing_update_contract_status', {
    p_contract_id: d.contract_id,
    p_new_status:  d.new_status,
    p_reason:      (d.reason || '').trim() || null
  });
  mdSetBusy(false);
  if (!r.ok) { mdSetError(r.error); return; }
  closeModal();
  toast(r.data && r.data.no_op ? t('tcNoOp') : t('tcStatusChanged'), r.data && r.data.no_op ? 'info' : 'ok');
  await loadContracts();
}

/* =====================================================================
   Expose action functions to inline onclick handlers
   ===================================================================== */
window.hoLangToggle    = hoLangToggle;
window.hoSignInSubmit  = hoSignInSubmit;
window.hoSignOutClick  = hoSignOutClick;
window.hoNav           = hoNav;
window.hoRefresh       = hoRefresh;
window.hoFiltSet       = hoFiltSet;
window.hoFiltClear     = hoFiltClear;
window.openModal       = openModal;
window.closeModal      = closeModal;
window.mdSet           = mdSet;
window.hoSubmitUnit    = hoSubmitUnit;
window.hoSubmitLandlord= hoSubmitLandlord;
window.hoSubmitContract= hoSubmitContract;
window.hoSubmitStatus  = hoSubmitStatus;
window.rerenderUnitList     = rerenderUnitList;
window.rerenderLandlordList = rerenderLandlordList;
window.rerenderContractList = rerenderContractList;

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot(){
  state.lang = getLang();
  state.sess = getSess();
  render();
  if (state.sess) {
    // silently refresh + verify then load data
    try {
      await ensureSession();
      await bootstrapAfterAuth();
    } catch(e) {
      clearSess();
      state.bootError = 'lgAuthFail';
      render();
    }
  }
})();

// Escape key closes modal
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.modal && !state.modal.busy) closeModal();
});
</script>
