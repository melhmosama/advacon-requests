<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

    --bg: #F4F6FA; --panel: #FFFFFF; --panel-alt: #F8FAFD;
    --border: #DDE4EE; --border-strong: #B8C4D6;
    --text: #14202E; --muted: #5A6B80; --faint: #93A0B5;
    --shadow-sm: 0 1px 2px rgba(20,32,46,.06);
    --shadow-md: 0 4px 14px rgba(20,32,46,.08);
    --shadow-lg: 0 10px 30px rgba(20,32,46,.12);
    --radius: 6px; --radius-lg: 10px;
    --sidebar-w: 240px; --topbar-h: 56px;
    --font-ar: "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    --font-en: "Inter", "Segoe UI", -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background: var(--bg); color: var(--text); font-family: var(--font-ar); font-size: 14px; line-height: 1.5; }
  html[dir="ltr"] body { font-family: var(--font-en); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; }
  code, pre { font-family: "SFMono-Regular", "Consolas", monospace; }

  /* ------- LAYOUT ------- */
  #app { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar-w) 1fr; grid-template-rows: var(--topbar-h) 1fr; grid-template-areas: "sidebar topbar" "sidebar main"; }
  html[dir="rtl"] #app { grid-template-areas: "topbar sidebar" "main sidebar"; grid-template-columns: 1fr var(--sidebar-w); }
  .topbar { grid-area: topbar; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 16px; position: sticky; top: 0; z-index: 30; }
  .topbar .logo { font-weight: 700; color: var(--navy); font-size: 16px; }
  .topbar .spacer { flex: 1; }
  .topbar .user-info { color: var(--muted); font-size: 13px; }
  .sidebar { grid-area: sidebar; background: var(--panel); border-inline-end: 1px solid var(--border); padding: 20px 0; overflow-y: auto; }
  .sidebar .brand { padding: 0 20px 20px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .sidebar .brand-title { font-weight: 700; color: var(--navy); font-size: 15px; }
  .sidebar .brand-sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: var(--muted); border-inline-start: 3px solid transparent; cursor: pointer; user-select: none; }
  .nav-item:hover { background: var(--panel-alt); color: var(--text); text-decoration: none; }
  .nav-item.active { background: var(--panel-alt); color: var(--navy); border-inline-start-color: var(--accent); font-weight: 600; }
  .nav-item .icon { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; opacity: .7; }
  .nav-item.active .icon { opacity: 1; }
  main { grid-area: main; padding: 24px; overflow-y: auto; }
  .page-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .page-header h1 { margin: 0; font-size: 22px; color: var(--navy); font-weight: 700; }
  .page-header .spacer { flex: 1; }
  .breadcrumb { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .breadcrumb a { color: var(--muted); }
  .breadcrumb .sep { opacity: .5; }

  /* ------- BUTTONS ------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--panel); color: var(--text); font-weight: 500; transition: all .15s; white-space: nowrap; }
  .btn:hover { background: var(--panel-alt); border-color: var(--accent); text-decoration: none; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  .btn-primary:hover { background: var(--med); border-color: var(--med); }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-accent:hover { background: var(--med); border-color: var(--med); }
  .btn-danger { background: var(--red); border-color: var(--red); color: #fff; }
  .btn-danger:hover { background: #96453f; border-color: #96453f; }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 6px 10px; }
  .btn-ghost:hover { background: var(--panel-alt); color: var(--text); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-lg { padding: 10px 18px; font-size: 15px; }
  .btn-icon { padding: 6px; min-width: 32px; }

  /* ------- CARDS ------- */
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow-sm); }
  .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .card-title { font-weight: 700; color: var(--navy); font-size: 15px; margin: 0; }
  .card-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }

  /* ------- STAT ------- */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .stat-label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .stat-value { color: var(--navy); font-weight: 700; font-size: 22px; }
  .stat-hint { color: var(--faint); font-size: 11px; margin-top: 4px; }

  /* ------- BADGES ------- */
  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; background: var(--panel-alt); color: var(--muted); border: 1px solid var(--border); }
  .badge-green { background: rgba(60,125,90,.1); color: var(--green); border-color: rgba(60,125,90,.3); }
  .badge-amber { background: rgba(192,138,62,.12); color: var(--amber); border-color: rgba(192,138,62,.3); }
  .badge-red { background: rgba(176,80,74,.1); color: var(--red); border-color: rgba(176,80,74,.3); }
  .badge-blue { background: rgba(62,110,158,.1); color: var(--accent); border-color: rgba(62,110,158,.3); }
  .badge-gray { background: var(--panel-alt); color: var(--muted); }

  /* ------- TABLES ------- */
  .table-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th { background: var(--panel-alt); color: var(--muted); font-weight: 600; text-align: start; padding: 10px 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; white-space: nowrap; }
  table.data td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.data tr:last-child td { border-bottom: none; }
  table.data tr:hover td { background: var(--panel-alt); }
  table.data .row-actions { display: flex; gap: 4px; justify-content: flex-end; }
  table.data .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-style: italic; }
  .code-cell { font-family: monospace; color: var(--accent); font-weight: 600; }
  .num-cell { text-align: end; font-variant-numeric: tabular-nums; }

  /* ------- FORMS ------- */
  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .form-grid.cols-1 { grid-template-columns: 1fr; }
  .form-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.span-all { grid-column: 1 / -1; }
  .field label { color: var(--muted); font-size: 12px; font-weight: 600; }
  .field label .req { color: var(--red); }
  .field input, .field select, .field textarea { padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--panel); color: var(--text); }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(62,110,158,.15); }
  .field textarea { min-height: 60px; resize: vertical; }
  .field .hint { color: var(--faint); font-size: 11px; }
  .field .err { color: var(--red); font-size: 12px; }
  .field input[readonly] { background: var(--panel-alt); color: var(--muted); }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; padding-top: 12px; border-top: 1px solid var(--border); margin-top: 16px; }

  /* ------- FILTERS BAR ------- */
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; padding: 12px 16px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 16px; }
  .filters .field { min-width: 140px; }
  .filters .field label { font-size: 11px; }
  .filters .field input, .filters .field select { padding: 6px 8px; font-size: 13px; }
  .filters .spacer { flex: 1; }

  /* ------- MODAL ------- */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(20,32,46,.5); z-index: 100; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 40px 20px; }
  .modal { background: var(--panel); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 100%; max-width: 640px; max-height: calc(100vh - 80px); display: flex; flex-direction: column; overflow: hidden; }
  .modal.wide { max-width: 900px; }
  .modal.narrow { max-width: 420px; }
  .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  .modal-title { margin: 0; font-size: 16px; font-weight: 700; color: var(--navy); flex: 1; }
  .modal-close { background: none; border: none; font-size: 20px; color: var(--muted); padding: 4px 8px; border-radius: var(--radius); }
  .modal-close:hover { background: var(--panel-alt); color: var(--text); }
  .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
  .modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; background: var(--panel-alt); }

  /* ------- TOAST ------- */
  #toast-mount { position: fixed; top: 20px; inset-inline-end: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast { pointer-events: auto; padding: 12px 16px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow-md); min-width: 260px; max-width: 380px; display: flex; gap: 10px; align-items: flex-start; animation: toast-in .2s ease-out; }
  .toast.success { border-inline-start: 4px solid var(--green); }
  .toast.error { border-inline-start: 4px solid var(--red); }
  .toast.warn { border-inline-start: 4px solid var(--amber); }
  .toast.info { border-inline-start: 4px solid var(--accent); }
  .toast-body { flex: 1; font-size: 13px; color: var(--text); }
  .toast-close { background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; }

  .tab { padding: 10px 14px; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; font-weight: 500; user-select: none; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--navy); border-bottom-color: var(--accent); font-weight: 600; }

  /* ------- ALERTS PANEL ------- */
  .alert-section { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: border-color .15s; }
  .alert-section:hover { border-color: var(--accent); }
  .alert-section .icon-badge { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; }

  .alert-section .icon-badge.red { background: rgba(176,80,74,.15); color: var(--red); }
  .alert-section .icon-badge.blue { background: rgba(62,110,158,.15); color: var(--accent); }

  .alert-section .alert-name { color: var(--text); font-weight: 600; font-size: 13px; }
  .alert-section .alert-hint { color: var(--muted); font-size: 11px; }
  .alert-section .alert-count { font-weight: 700; font-size: 20px; color: var(--navy); font-variant-numeric: tabular-nums; }
  .alert-section .alert-count.zero { color: var(--faint); }

  /* ------- MISC ------- */
  .loading { padding: 40px; text-align: center; color: var(--muted); font-style: italic; }
  .error-box { padding: 14px 16px; background: rgba(176,80,74,.08); border: 1px solid rgba(176,80,74,.3); color: var(--red); border-radius: var(--radius); }
  .info-box { padding: 12px 14px; background: rgba(62,110,158,.06); border: 1px solid rgba(62,110,158,.2); color: var(--text); border-radius: var(--radius); font-size: 13px; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 14px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; color: var(--text); }
  .flex { display: flex; align-items: center; gap: 8px; }
  .flex-col { display: flex; flex-direction: column; gap: 8px; }
  .flex-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grow { flex: 1; }
  .text-muted { color: var(--muted); }
  .text-faint { color: var(--faint); }
  .text-end { text-align: end; }
  .text-center { text-align: center; }
  .mb-0 { margin-bottom: 0; }
  .mb-1 { margin-bottom: 4px; }
  .mb-2 { margin-bottom: 8px; }
  .mb-3 { margin-bottom: 16px; }
  .mb-4 { margin-bottom: 24px; }
  .mt-3 { margin-top: 16px; }
  .hidden { display: none !important; }

  @media (max-width: 900px) {
    #app { grid-template-columns: 1fr; grid-template-areas: "topbar" "main"; }
    .sidebar { display: none; }
    main { padding: 16px; }
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

/* =====================================================================
   SESSION
   ===================================================================== */
async function getAdminSession() {
  // 1) Supabase auto-restores its own session on createClient. Try that first.
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session && session.access_token) return session;
  } catch (e) { console.warn('[session] getSession failed:', e); }

  // 2) Fallback: manual key set by /admin
  const raw = localStorage.getItem(CFG.adminSessionKey);
  if (raw) {
    try {
      const stored = JSON.parse(raw);
      if (stored && stored.access_token) {
        await sb.auth.setSession({
          access_token: stored.access_token,
          refresh_token: stored.refresh_token || ''
        });
        const { data: { session } } = await sb.auth.getSession();
        if (session) return session;
      }
    } catch (e) { console.warn('[session] manual restore failed:', e); }
  }
  return null;
}

async function requireAdmin() {
  const sess = await getAdminSession();
  if (!sess) { showSignInRequired('no_session'); return false; }
  try {
    // Validate by calling any admin-only RPC we know exists (from Phase 1)
    const { data, error } = await sb.rpc('housing_list_refs', { p_list_key: null });
    if (error) throw error;
    if (!data || data.ok !== true) throw new Error('invalid_response');
    // Extract user info from the session itself
    const uid = sess.user?.id || sess.user_id;
    const email = sess.user?.email;
    document.getElementById('userInfo').textContent = email || (uid ? uid.slice(0, 8) + '…' : '');
    return true;
  } catch (e) {
    console.error('[requireAdmin] validation failed:', e);
    showSignInRequired('validation_failed: ' + (e.message || e));
    return false;
  }
}

function showSignInRequired(reason) {
  // Diagnostic: what session-like keys exist
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && (k.includes('supabase') || k.includes('sb-') || k.includes('admin') || k.includes('auth'))) keys.push(k);
  }
  document.getElementById('content').innerHTML = `
    <div style="max-width: 560px; margin: 80px auto; text-align: center;">
      <div class="card" style="padding: 32px;">
        <h2 style="color: var(--navy); margin: 0 0 12px;">${t('signInRequired')}</h2>
        <p class="text-muted mb-3">${t('sessionInvalid')}</p>
        <div style="text-align:start; background:var(--panel-alt); padding:10px 14px; border-radius:var(--radius); font-size:12px; margin-bottom:16px; font-family:monospace; color:var(--muted);">
          reason: ${escapeHtml(reason||'unknown')}<br>
          keys found: ${keys.length ? keys.map(escapeHtml).join(', ') : '(none)'}
        </div>
        <a href="/admin" class="btn btn-primary">/admin</a>
      </div>
    </div>`;
}

/* =====================================================================
   RPC CLIENT
   ===================================================================== */
async function rpc(fn, args = {}) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) {
    console.error('[RPC]', fn, error);
    throw new Error(error.message || 'rpc_error');
  }
  return data;
}

/* =====================================================================
   FORMATTERS
   ===================================================================== */
function fmtNum(n, opts = {}) {
  if (n == null || n === '') return '—';
  const num = Number(n);
  if (isNaN(num)) return String(n);
  const decimals = opts.decimals != null ? opts.decimals : (num % 1 === 0 ? 0 : 2);
  return num.toLocaleString(LANG === 'ar' ? 'ar-SA' : 'en-US', {
    minimumFractionDigits: decimals, maximumFractionDigits: decimals
  });
}
function fmtSAR(n) {
  if (n == null || n === '') return '—';
  return fmtNum(n) + ' ' + t('currency');
}
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d.getTime())) return String(s);
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function fmtDateTime(s) {
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d.getTime())) return String(s);
  return fmtDate(s) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function fmtStatus(status) {
  const map = {
    active: { class: 'badge-green', label: 'active' },
    expired: { class: 'badge-amber', label: 'expired' },
    cancelled: { class: 'badge-gray', label: 'cancelled' },
    pending: { class: 'badge-blue', label: 'pending' },
    paid: { class: 'badge-green', label: 'paid' },
    overdue: { class: 'badge-red', label: 'overdue' },
    disputed: { class: 'badge-amber', label: 'disputed' },
  };
  const s = map[status] || { class: 'badge-gray', label: status };
  return `<span class="badge ${s.class}">${escapeHtml(t(s.label))}</span>`;
}
function fmtIsActive(active) {
  return `<span class="badge ${active ? 'badge-green' : 'badge-gray'}">${active ? t('active') : t('inactive')}</span>`;
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[m]);
}
function pickName(obj) {
  if (!obj) return '';
  if (LANG === 'ar' && obj.name_ar) return obj.name_ar;
  if (obj.name_en) return obj.name_en;
  if (obj.name_ar) return obj.name_ar;
  if (obj.name) return obj.name;
  return '';
}

/* =====================================================================
   UI HELPERS (toast, modal, confirm)
   ===================================================================== */
function toast(message, kind = 'info', ms = 3500) {
  const mount = document.getElementById('toast-mount');
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<div class="toast-body">${escapeHtml(message)}</div><button class="toast-close">×</button>`;
  el.querySelector('.toast-close').addEventListener('click', () => el.remove());
  mount.appendChild(el);
  if (ms > 0) setTimeout(() => el.remove(), ms);
}

function openModal({ title, body, footer, wide, narrow, onClose }) {
  const mount = document.getElementById('modal-mount');
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  const cls = wide ? 'wide' : (narrow ? 'narrow' : '');
  backdrop.innerHTML = `
    <div class="modal ${cls}" role="dialog">
      <div class="modal-header">
        <h3 class="modal-title">${escapeHtml(title || '')}</h3>
        <button class="modal-close" aria-label="Close">×</button>
      </div>
      <div class="modal-body"></div>
      ${footer !== false ? '<div class="modal-footer"></div>' : ''}
    </div>`;
  const modal = backdrop.querySelector('.modal');
  const bodyEl = modal.querySelector('.modal-body');
  const footerEl = modal.querySelector('.modal-footer');
  if (typeof body === 'string') bodyEl.innerHTML = body;
  else if (body instanceof Node) bodyEl.appendChild(body);
  if (footer && footerEl) {
    if (typeof footer === 'string') footerEl.innerHTML = footer;
    else if (footer instanceof Node) footerEl.appendChild(footer);
  }
  const close = () => { backdrop.remove(); if (onClose) onClose(); };
  modal.querySelector('.modal-close').addEventListener('click', close);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
  mount.appendChild(backdrop);
  return { backdrop, modal, bodyEl, footerEl, close };
}

async function confirmAction({ title, message, danger, confirmLabel, cancelLabel } = {}) {
  return new Promise(resolve => {
    const body = document.createElement('div');
    body.innerHTML = `<div style="font-size:14px; color:var(--text);">${escapeHtml(message || t('confirmDelete'))}</div>`;
    const footer = document.createElement('div');
    footer.className = 'flex';
    footer.style.gap = '8px';
    footer.style.justifyContent = 'flex-end';
    footer.style.flex = '1';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn';
    cancelBtn.textContent = cancelLabel || t('cancel');
    const okBtn = document.createElement('button');
    okBtn.className = 'btn ' + (danger ? 'btn-danger' : 'btn-primary');
    okBtn.textContent = confirmLabel || t('ok');
    footer.appendChild(cancelBtn);
    footer.appendChild(okBtn);
    const m = openModal({ title: title || '', body, footer, narrow: true, onClose: () => resolve(false) });
    cancelBtn.addEventListener('click', () => { m.close(); resolve(false); });
    okBtn.addEventListener('click', () => { m.close(); resolve(true); });
  });
}

/* =====================================================================
   FORM BUILDER (schema-driven)
   ===================================================================== */
function buildForm(schema, values = {}) {
  // schema: [{ name, label, type, required, options, min, max, hint, cols, placeholder, readonly }]
  const form = document.createElement('div');
  form.className = 'form-grid' + (schema.__cols ? ' cols-' + schema.__cols : '');
  (schema.fields || schema).forEach(f => {
    const field = document.createElement('div');
    field.className = 'field' + (f.spanAll ? ' span-all' : '');
    const lbl = document.createElement('label');
    lbl.innerHTML = escapeHtml(f.label) + (f.required ? ' <span class="req">*</span>' : '');
    field.appendChild(lbl);
    let inp;
    if (f.type === 'select') {
      inp = document.createElement('select');
      inp.innerHTML = `<option value="">— ${t('none')} —</option>` +
        (f.options || []).map(o =>
          `<option value="${escapeHtml(o.value)}" ${values[f.name] == o.value ? 'selected' : ''}>${escapeHtml(o.label)}</option>`
        ).join('');
    } else if (f.type === 'textarea') {
      inp = document.createElement('textarea');
      inp.value = values[f.name] != null ? values[f.name] : '';
      inp.rows = f.rows || 3;
    } else if (f.type === 'checkbox') {
      inp = document.createElement('input');
      inp.type = 'checkbox';
      inp.checked = !!values[f.name];
      field.classList.add('flex');
    } else {
      inp = document.createElement('input');
      inp.type = f.type || 'text';
      inp.value = values[f.name] != null ? values[f.name] : '';
      if (f.min != null) inp.min = f.min;
      if (f.max != null) inp.max = f.max;
      if (f.step != null) inp.step = f.step;
      if (f.placeholder) inp.placeholder = f.placeholder;
    }
    inp.name = f.name;
    inp.dataset.field = f.name;
    if (f.readonly) inp.readOnly = true;
    field.appendChild(inp);
    if (f.hint) {
      const h = document.createElement('div');
      h.className = 'hint';
      h.textContent = f.hint;
      field.appendChild(h);
    }
    form.appendChild(field);
  });
  return form;
}

function readForm(formEl) {
  const out = {};
  formEl.querySelectorAll('[data-field]').forEach(el => {
    if (el.type === 'checkbox') out[el.dataset.field] = el.checked;
    else if (el.type === 'number') out[el.dataset.field] = el.value === '' ? null : Number(el.value);
    else if (el.value === '') out[el.dataset.field] = null;
    else out[el.dataset.field] = el.value;
  });
  return out;
}

function renderNav(activeRoute) {
  const nav = document.getElementById('mainNav');
  nav.innerHTML = NAV_ITEMS.map(item => `
    <a class="nav-item ${item.route === activeRoute ? 'active' : ''}" href="#${item.route}">
      <span class="icon">${item.icon}</span>
      <span>${escapeHtml(t(item.key))}</span>
    </a>`).join('');

async function route() {
  const hash = location.hash.slice(1);
  // Split path from query string first — otherwise IDs like UUIDs get
  // contaminated with '?tab=xxx' and downstream RPC calls fail with
  // 'invalid input syntax for type uuid'. The query part is still readable
  // via location.hash.split('?tab=')[1] where needed.
  const pathOnly = hash.split('?')[0];
  const [head, ...rest] = pathOnly.split('/');
  const mainRoute = head || '';
  renderNav(mainRoute);
  const content = document.getElementById('content');
  content.innerHTML = `<div class="loading">${t('loading')}</div>`;
  try {
    switch (mainRoute) {
      case '': case 'dashboard': await screenDashboard(content); break;
      case 'properties':
        if (rest.length > 0) await screenPropertyDetail(content, rest[0]);
        else await screenProperties(content);
        break;
      case 'contracts': await screenContracts(content); break;
      case 'meters': await screenMeters(content); break;
      case 'bills': await screenBills(content); break;
      case 'residents': await screenResidents(content); break;
      case 'expenses': await screenExpenses(content); break;
      case 'reports': await screenReports(content); break;
      case 'settings': await screenSettings(content); break;
      default:
        content.innerHTML = `<div class="error-box">Unknown route: ${escapeHtml(mainRoute)}</div>`;
    }
  } catch (e) {
    console.error(e);
    content.innerHTML = `<div class="error-box">${escapeHtml(t('errorOccurred'))}: ${escapeHtml(e.message || e)}</div>`;
  }
}

async function screenPropertyDetail(el, id) {
  const load = async () => {
    const res = await rpc('housing_get_property', { p_id: id });
    if (!res.ok || !res.property) { el.innerHTML = `<div class="error-box">Not found</div>`; return; }
    const p = res.property;
    const tabs = ['summary','structure','contracts','meters','residents','expenses','attachments'];
    const activeTab = location.hash.split('?tab=')[1] || 'summary';
    el.innerHTML = `
      <div class="breadcrumb">
        <a href="#properties">${t('properties')}</a>
        <span class="sep">›</span>
        <span>${escapeHtml(p.code)}</span>
      </div>
      <div class="page-header">
        <div>
          <h1>${escapeHtml(LANG==='ar'?p.name_ar:(p.name_en||p.name_ar))} <span class="text-muted" style="font-size:15px; font-weight:400;">${escapeHtml(p.code)}</span></h1>
          <div class="text-muted mb-1">${escapeHtml(p.location||'')}</div>
        </div>
        <span class="spacer"></span>
        ${fmtIsActive(p.is_active)}
        <button class="btn" id="btnEditProp">${t('edit')}</button>
        <button class="btn ${p.is_active?'btn-ghost':'btn-primary'}" id="btnToggleActive">${p.is_active?t('deactivate'):t('activate')}</button>
      </div>
      <div class="tabs">
        ${tabs.map(k => `<a class="tab ${k===activeTab?'active':''}" href="#properties/${id}?tab=${k}">${t('tab'+k.charAt(0).toUpperCase()+k.slice(1))}</a>`).join('')}
      </div>
      <div id="tabContent"><div class="loading">${t('loading')}</div></div>`;
    document.getElementById('btnEditProp').addEventListener('click', () => openPropertyForm(p, load));
    document.getElementById('btnToggleActive').addEventListener('click', async () => {
      if (p.is_active && !await confirmAction({ title: t('confirmDeactivate'), message: t('confirmDeactivate') })) return;
      await rpc('housing_toggle_property_active', { p_id: id, p_active: !p.is_active });
      toast(t('savedSuccessfully'), 'success'); load();
    });
    await renderPropertyTab(document.getElementById('tabContent'), p, activeTab, load);
  };
  await load();
}

async function renderPropTabStructure(container, p, refresh) {
  const res = await rpc('housing_get_space_tree', { p_property_id: p.id });
  const nodes = res.nodes || [];
  container.innerHTML = `
    <div class="mb-3 flex" style="justify-content:flex-end;">
      <button class="btn btn-primary" id="btnAddSpace">+ ${t('add')} ${LANG==='ar'?'حيّز':'Space'}</button>
    </div>
    <div class="card">
      ${nodes.length ? renderSpaceTree(nodes) : `<div class="text-muted text-center" style="padding:30px;">${t('noItems')}</div>`}
    </div>`;
  document.getElementById('btnAddSpace').addEventListener('click', () => openSpaceForm(null, p.id, null, refresh));
  container.querySelectorAll('[data-space-edit]').forEach(b => b.addEventListener('click', (e) => {
    const sid = e.currentTarget.getAttribute('data-space-edit');
    const s = findSpaceInTree(nodes, sid);
    openSpaceForm(s, p.id, s.parent_id, refresh);
  }));
  container.querySelectorAll('[data-space-del]').forEach(b => b.addEventListener('click', async (e) => {
    const sid = e.currentTarget.getAttribute('data-space-del');
    if (!await confirmAction({ title: t('delete'), message: t('confirmDelete'), danger: true })) return;
    try { await rpc('housing_delete_space', { p_id: sid }); toast(t('deletedSuccessfully'),'success'); refresh(); }
    catch(err) { toast(err.message, 'error'); }
  }));
  container.querySelectorAll('[data-space-addchild]').forEach(b => b.addEventListener('click', (e) => {
    const parentId = e.currentTarget.getAttribute('data-space-addchild');
    openSpaceForm(null, p.id, parentId, refresh);
  }));
}

function findSpaceInTree(nodes, id) {
  for (const n of nodes) { if (n.id === id) return n; if (n.children) { const f = findSpaceInTree(n.children, id); if (f) return f; } }
  return null;
}

function renderSpaceTree(nodes, depth = 0) {
  return `<ul style="list-style:none; padding:0; margin:0;">${nodes.map(n => `
    <li style="padding: 6px 0; border-bottom: 1px solid var(--border);">
      <div class="flex" style="padding-inline-start:${depth*24}px;">
        <span class="badge badge-blue">${escapeHtml(n.space_type?.key||n.type||'')}</span>
        <span class="code-cell">${escapeHtml(n.code||'')}</span>
        <span>${escapeHtml(n.name||'')}</span>
        <span class="text-muted" style="font-size:12px;">${n.capacity!=null?`(${n.capacity})`:''}</span>
        <span class="spacer"></span>
        <button class="btn btn-sm btn-ghost" data-space-addchild="${n.id}">+</button>
        <button class="btn btn-sm btn-ghost" data-space-edit="${n.id}">${t('edit')}</button>
        <button class="btn btn-sm btn-ghost" style="color:var(--red);" data-space-del="${n.id}">×</button>
      </div>
      ${n.children && n.children.length ? renderSpaceTree(n.children, depth+1) : ''}
    </li>`).join('')}</ul>`;
}

async function handleAttachmentUpload(file, entityType, entityId, onSaved) {
  const kinds = await getRefOptions('attachment_kinds');
  const body = document.createElement('div');
  body.innerHTML = `<div class="field mb-2"><label>${LANG==='ar'?'نوع المرفق':'Attachment Kind'} <span class="req">*</span></label><select id="attKind">${kinds.map(k=>`<option value="${escapeHtml(k.value)}">${escapeHtml(k.label)}</option>`).join('')}</select></div>
  <div class="field mb-2"><label>${t('notes')}</label><textarea id="attNotes" rows="2"></textarea></div>
  <div class="info-box">${escapeHtml(file.name)} — ${fmtNum(Math.round(file.size/1024))} KB</div>`;
  const footer = document.createElement('div'); footer.className='flex'; footer.style.gap='8px'; footer.style.justifyContent='flex-end'; footer.style.flex='1';
  const cancel = document.createElement('button'); cancel.className='btn'; cancel.textContent = t('cancel');
  const save = document.createElement('button'); save.className='btn btn-primary'; save.textContent = LANG==='ar'?'رفع':'Upload';
  footer.appendChild(cancel); footer.appendChild(save);
  const m = openModal({ title: LANG==='ar'?'رفع مرفق':'Upload Attachment', body, footer });
  cancel.addEventListener('click', m.close);
  save.addEventListener('click', async () => {
    save.disabled = true;
    try {
      const kindKey = document.getElementById('attKind').value;
      const notes = document.getElementById('attNotes').value;
      const path = `${entityType}/${entityId}/${Date.now()}_${file.name.replace(/[^\w.-]/g,'_')}`;
      const { error: upErr } = await sb.storage.from('housing-attachments').upload(path, file, { contentType: file.type });
      if (upErr) throw upErr;
      await rpc('housing_register_attachment', {
        p_entity_type: entityType, p_entity_id: entityId, p_kind_key: kindKey,
        p_storage_path: path, p_filename: file.name, p_mime_type: file.type, p_size_bytes: file.size,
        p_notes: notes || null,
      });
      toast(t('savedSuccessfully'),'success'); m.close(); if (onSaved) onSaved();
    } catch(e){ toast(e.message || e,'error'); save.disabled=false; }
  });
}

      document.getElementById('summary').innerHTML = `
        <div class="stat-grid">
          <div class="stat"><div class="stat-label">${t('count')}</div><div class="stat-value">${fmtNum(res.count||items.length,{decimals:0})}</div></div>
          <div class="stat"><div class="stat-label">${t('total')}</div><div class="stat-value">${fmtSAR(res.total_amount||0)}</div></div>

            <th>${t('status')}</th><th></th>
          </tr></thead>

              <td><span class="code-cell">${escapeHtml(b.meter?.code||'')}</span>${b.meter?.meter_type?' — '+escapeHtml(pickName(b.meter.meter_type)):''}</td>
              <td>${fmtDate(b.bill_period_start)} → ${fmtDate(b.bill_period_end)}</td>
              <td class="num-cell">${fmtSAR(b.amount)}</td>
              <td class="num-cell">${b.consumption!=null?fmtNum(b.consumption):'—'}</td>
              <td>${fmtDate(b.due_date)}</td>
              <td class="num-cell" style="${od>0?'color:var(--red); font-weight:600':''}">${od>0?fmtNum(od,{decimals:0}):'—'}</td>
              <td>${fmtStatus(b.status)}${b.is_amended?` <span class="badge badge-gray">${LANG==='ar'?'معدّل':'amended'}</span>`:''}</td>
              <td class="row-actions">

async function openBillForm(existing, onSaved) {

    { name: 'p_bill_period_start', label: LANG==='ar'?'بداية الفترة':'Period Start', type: 'date', required: true },
    { name: 'p_bill_period_end', label: LANG==='ar'?'نهاية الفترة':'Period End', type: 'date', required: true },
    { name: 'p_issue_date', label: LANG==='ar'?'تاريخ الإصدار':'Issue Date', type: 'date' },

      {value:'overdue', label: t('overdue')}, {value:'disputed', label: t('disputed')}
    ]},
    { name: 'p_paid_date', label: LANG==='ar'?'تاريخ الدفع':'Paid Date', type: 'date', hint: LANG==='ar'?'مطلوب فقط إذا كانت الحالة "مدفوع"':'Only if status = paid' },
    { name: 'p_notes', label: t('notes'), type: 'textarea', spanAll: true },
  ]};
  const initial = existing || { p_status: 'pending' };
  const formEl = buildForm(schema, initial);

  const save = document.createElement('button'); save.className='btn btn-primary'; save.textContent = t('save');
  footer.appendChild(cancel); footer.appendChild(save);

  cancel.addEventListener('click', m.close);
  save.addEventListener('click', async () => {
    save.disabled = true;
    try {
      const vals = readForm(formEl);
      for (const req of ['p_meter_id','p_bill_period_start','p_bill_period_end','p_amount']) {
        if (vals[req] == null || vals[req] === '') { toast(t('requiredField')+': '+req,'error'); save.disabled=false; return; }

      if (existing) vals.p_id = existing.id;

      toast(t('savedSuccessfully'),'success'); m.close(); if (onSaved) onSaved();
    } catch(e){ toast(e.message,'error'); save.disabled=false; }
  });
}

    { name: 'p_date_of_birth', label: LANG==='ar'?'تاريخ الميلاد':'Date of Birth', type: 'date' },
    { name: 'p_notes', label: t('notes'), type: 'textarea', spanAll: true },
  ]};
  const initial = existing ? {
    p_resident_type_key: existing.resident_type?.key,
    p_name_ar: existing.name_ar, p_name_en: existing.name_en,
    p_id_number: existing.id_number, p_phone: existing.phone, p_email: existing.email,
    p_nationality: existing.nationality, p_date_of_birth: existing.date_of_birth, p_notes: existing.notes,
  } : {};
  const formEl = buildForm(schema, initial);
  const footer = document.createElement('div'); footer.className='flex'; footer.style.gap='8px'; footer.style.justifyContent='flex-end'; footer.style.flex='1';
  const cancel = document.createElement('button'); cancel.className='btn'; cancel.textContent = t('cancel');
  const save = document.createElement('button'); save.className='btn btn-primary'; save.textContent = t('save');
  footer.appendChild(cancel); footer.appendChild(save);
  const m = openModal({ title: existing ? t('edit') : t('add') + ' ' + t('residents'), body: formEl, footer, wide: true });
  cancel.addEventListener('click', m.close);
  save.addEventListener('click', async () => {
    save.disabled = true;
    try {
      const vals = readForm(formEl);
      for (const req of ['p_resident_type_key','p_name_ar']) {
        if (!vals[req]) { toast(t('requiredField')+': '+req,'error'); save.disabled=false; return; }
      }
      const fn = existing ? 'housing_update_resident' : 'housing_create_resident';
      if (existing) vals.p_id = existing.id;
      await rpc(fn, vals);
      toast(t('savedSuccessfully'),'success'); m.close(); if (onSaved) onSaved();
    } catch(e){ toast(e.message,'error'); save.disabled=false; }
  });
}

        </div>`;
      const listEl = document.getElementById('list');
      if (!items.length) { listEl.innerHTML = `<div class="empty" style="padding:40px; text-align:center; color:var(--muted);">${t('noItems')}</div>`; return; }
      listEl.innerHTML = `
        <table class="data">
          <thead><tr>
            <th>${LANG==='ar'?'الوصف':'Description'}</th><th>${LANG==='ar'?'الكيان':'Entity'}</th>
            <th>${t('category')}</th><th>${LANG==='ar'?'الدورية':'Frequency'}</th>
            <th>${t('amount')}</th><th>${t('startDate')}</th><th>${LANG==='ar'?'التالي':'Next'}</th><th>${t('isActive')}</th>

              <td>${escapeHtml(pickName(e.frequency))}</td>

  document.getElementById('btnClear').addEventListener('click', () => {
    ['fEntity','fCat','fFreq','fFrom','fTo'].forEach(id => document.getElementById(id).value = '');

  });

  const body = document.getElementById('setBody');
  if (active === 'alerts') await renderAlertSettings(body);
  else if (active === 'refs') await renderRefsSettings(body);
  else if (active === 'templates') await renderTemplatesSettings(body);
}

async function renderAlertSettings(container) {
  const res = await rpc('housing_get_settings', { p_prefix: 'alert.' });
  const items = res.items || [];
  container.innerHTML = `
    <div class="card">
      <table class="data">
        <thead><tr><th>${LANG==='ar'?'المفتاح':'Key'}</th><th>${LANG==='ar'?'القيمة':'Value'}</th><th>${LANG==='ar'?'الوصف':'Description'}</th><th></th></tr></thead>
        <tbody>${items.map(s=>`<tr>
          <td class="code-cell">${escapeHtml(s.key)}</td>
          <td><input data-set-key="${escapeHtml(s.key)}" value="${escapeHtml(JSON.stringify(s.value))}" style="width:100%;"></td>
          <td class="text-muted">${escapeHtml(s.description||'—')}</td>
          <td><button class="btn btn-sm btn-primary" data-save-key="${escapeHtml(s.key)}">${t('save')}</button></td>
        </tr>`).join('')}</tbody>
      </table>
    </div>`;
  container.querySelectorAll('[data-save-key]').forEach(b => b.addEventListener('click', async (e) => {
    const key = e.currentTarget.getAttribute('data-save-key');
    const inp = container.querySelector(`[data-set-key="${key}"]`);
    try {
      const parsed = JSON.parse(inp.value);
      await rpc('housing_update_setting', { p_key: key, p_value: parsed });
      toast(t('savedSuccessfully'),'success');
    } catch(err){ toast(err.message,'error'); }
  }));
}

async function renderRefsSettings(container) {
  const res = await rpc('housing_list_refs');
  const lists = res.lists || {};
  const keys = Object.keys(lists).sort();
  container.innerHTML = `
    <div class="card">
      <div class="mb-3"><label>${LANG==='ar'?'اختر قائمة':'Select List'}: </label>
        <select id="listPick">${keys.map(k => `<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`).join('')}</select>
      </div>
      <div id="refBody"></div>
    </div>`;
  const pick = document.getElementById('listPick');
  const renderList = async () => {
    const key = pick.value;
    const r = await rpc('housing_list_refs', { p_list_key: key });
    const items = r?.list?.items || [];
    document.getElementById('refBody').innerHTML = `
      <div class="flex mb-2"><h4 class="mb-0">${escapeHtml(pickName(r.list))}</h4><span class="spacer"></span><button class="btn btn-primary btn-sm" id="btnAddItem">+ ${t('add')}</button></div>
      <table class="data">
        <thead><tr><th>${LANG==='ar'?'المفتاح':'Key'}</th><th>${LANG==='ar'?'عربي':'Arabic'}</th><th>${LANG==='ar'?'إنجليزي':'English'}</th><th>${LANG==='ar'?'ترتيب':'Order'}</th><th>${t('isActive')}</th><th></th></tr></thead>
        <tbody>${items.map(i=>`<tr>
          <td class="code-cell">${escapeHtml(i.key)}${i.is_system?' <span class="badge badge-gray">sys</span>':''}</td>
          <td>${escapeHtml(i.name_ar)}</td>
          <td>${escapeHtml(i.name_en)}</td>
          <td class="num-cell">${fmtNum(i.sort_order,{decimals:0})}</td>
          <td>${fmtIsActive(i.is_active)}</td>
          <td class="row-actions">
            <button class="btn btn-sm" data-ref-edit="${escapeHtml(JSON.stringify(i))}">${t('edit')}</button>
            ${!i.is_system?`<button class="btn btn-sm" style="color:var(--red);" data-ref-del="${i.id}">×</button>`:''}
          </td>
        </tr>`).join('')}</tbody>
      </table>`;
    document.getElementById('btnAddItem').addEventListener('click', () => openRefItemForm(key, null, renderList));
    document.querySelectorAll('[data-ref-edit]').forEach(b => b.addEventListener('click', (e) => {
      const item = JSON.parse(e.currentTarget.getAttribute('data-ref-edit'));
      openRefItemForm(key, item, renderList);
    }));
    document.querySelectorAll('[data-ref-del]').forEach(b => b.addEventListener('click', async (e) => {
      if (!await confirmAction({ title: t('delete'), message: t('confirmDelete'), danger: true })) return;
      try { await rpc('housing_delete_ref_item', { p_id: e.currentTarget.getAttribute('data-ref-del') }); clearRefCache(); toast(t('deletedSuccessfully'),'success'); renderList(); }
      catch(err){ toast(err.message,'error'); }
    }));
  };
  pick.addEventListener('change', renderList);
  await renderList();
}

async function openRefItemForm(listKey, existing, onSaved) {
  const schema = { __cols: 2, fields: [
    { name: 'p_key', label: LANG==='ar'?'المفتاح':'Key', required: true, hint: 'a-z, 0-9, _' , readonly: !!existing },
    { name: 'p_sort_order', label: LANG==='ar'?'ترتيب':'Order', type: 'number' },
    { name: 'p_name_ar', label: LANG==='ar'?'عربي':'Arabic', required: true },
    { name: 'p_name_en', label: LANG==='ar'?'إنجليزي':'English', required: true },
  ]};
  const initial = existing ? { p_key: existing.key, p_sort_order: existing.sort_order, p_name_ar: existing.name_ar, p_name_en: existing.name_en } : {};
  const formEl = buildForm(schema, initial);
  const footer = document.createElement('div'); footer.className='flex'; footer.style.gap='8px'; footer.style.justifyContent='flex-end'; footer.style.flex='1';
  const cancel = document.createElement('button'); cancel.className='btn'; cancel.textContent = t('cancel');
  const save = document.createElement('button'); save.className='btn btn-primary'; save.textContent = t('save');
  footer.appendChild(cancel); footer.appendChild(save);
  const m = openModal({ title: existing ? t('edit') : t('add'), body: formEl, footer });
  cancel.addEventListener('click', m.close);
  save.addEventListener('click', async () => {
    save.disabled = true;
    try {
      const vals = readForm(formEl);
      let fn, args;
      if (existing) { fn = 'housing_update_ref_item'; args = { p_id: existing.id, p_name_ar: vals.p_name_ar, p_name_en: vals.p_name_en, p_sort_order: vals.p_sort_order }; }
      else { fn = 'housing_create_ref_item'; args = { p_list_key: listKey, p_key: vals.p_key, p_name_ar: vals.p_name_ar, p_name_en: vals.p_name_en, p_sort_order: vals.p_sort_order }; }
      await rpc(fn, args);
      clearRefCache();
      toast(t('savedSuccessfully'),'success'); m.close(); if (onSaved) onSaved();
    } catch(e){ toast(e.message,'error'); save.disabled=false; }
  });
}

async function renderTemplatesSettings(container) {
  const res = await rpc('housing_list_templates');
  const items = res.items || [];
  container.innerHTML = `
    <div class="card">
      <div class="flex mb-3"><h4 class="mb-0">${LANG==='ar'?'القوالب':'Templates'}</h4><span class="spacer"></span><button class="btn btn-primary btn-sm" id="btnAddTpl">+ ${t('add')}</button></div>
      <table class="data">
        <thead><tr><th>${LANG==='ar'?'الكيان':'Entity Type'}</th><th>${t('name')}</th><th>${LANG==='ar'?'الوصف':'Description'}</th><th>${t('isActive')}</th><th></th></tr></thead>
        <tbody>${items.map(tpl=>`<tr>
          <td><span class="badge badge-gray">${escapeHtml(tpl.entity_type)}</span></td>
          <td>${escapeHtml(tpl.name)}</td>
          <td class="text-muted">${escapeHtml(tpl.description||'—')}</td>
          <td>${fmtIsActive(tpl.is_active)}</td>
          <td class="row-actions">
            <button class="btn btn-sm" data-tpl-edit="${tpl.id}">${t('edit')}</button>
            <button class="btn btn-sm" style="color:var(--red);" data-tpl-del="${tpl.id}">×</button>
          </td>
        </tr>`).join('')||`<tr><td colspan="5" class="empty" style="text-align:center; padding:30px; color:var(--muted);">${t('noItems')}</td></tr>`}</tbody>
      </table>
    </div>`;
  document.getElementById('btnAddTpl').addEventListener('click', () => openTemplateForm(null, () => renderTemplatesSettings(container)));
  container.querySelectorAll('[data-tpl-edit]').forEach(b => b.addEventListener('click', async (e) => {
    const r = await rpc('housing_get_template', { p_id: e.currentTarget.getAttribute('data-tpl-edit') });
    openTemplateForm(r.template, () => renderTemplatesSettings(container));
  }));
  container.querySelectorAll('[data-tpl-del]').forEach(b => b.addEventListener('click', async (e) => {
    if (!await confirmAction({ title: t('delete'), message: t('confirmDelete'), danger: true })) return;
    try { await rpc('housing_delete_template', { p_id: e.currentTarget.getAttribute('data-tpl-del') }); toast(t('deletedSuccessfully'),'success'); renderTemplatesSettings(container); }
    catch(err){ toast(err.message,'error'); }
  }));
}

async function openTemplateForm(existing, onSaved) {
  const schema = { __cols: 2, fields: [
    { name: 'p_entity_type', label: LANG==='ar'?'الكيان':'Entity Type', type: 'select', options: [
      {value:'property',label:'property'},{value:'meter',label:'meter'},{value:'bill',label:'bill'},
      {value:'resident',label:'resident'},{value:'expense',label:'expense'},{value:'contract',label:'contract'}
    ], required: true, readonly: !!existing },
    { name: 'p_name', label: t('name'), required: true },
    { name: 'p_description', label: LANG==='ar'?'الوصف':'Description', spanAll: true },
    { name: 'p_defaults_json', label: LANG==='ar'?'القيم الافتراضية (JSON)':'Defaults (JSON)', type: 'textarea', spanAll: true, hint: '{ "key": "value" }' },
  ]};
  const initial = existing ? {
    p_entity_type: existing.entity_type, p_name: existing.name, p_description: existing.description,
    p_defaults_json: JSON.stringify(existing.defaults || {}, null, 2),
  } : { p_defaults_json: '{}' };
  const formEl = buildForm(schema, initial);
  const footer = document.createElement('div'); footer.className='flex'; footer.style.gap='8px'; footer.style.justifyContent='flex-end'; footer.style.flex='1';
  const cancel = document.createElement('button'); cancel.className='btn'; cancel.textContent = t('cancel');
  const save = document.createElement('button'); save.className='btn btn-primary'; save.textContent = t('save');
  footer.appendChild(cancel); footer.appendChild(save);
  const m = openModal({ title: existing ? t('edit') : t('add') + ' ' + (LANG==='ar'?'قالب':'Template'), body: formEl, footer, wide: true });
  cancel.addEventListener('click', m.close);
  save.addEventListener('click', async () => {
    save.disabled = true;
    try {
      const vals = readForm(formEl);
      if (!vals.p_entity_type || !vals.p_name) { toast(t('requiredField'),'error'); save.disabled=false; return; }
      let defaults;
      try { defaults = JSON.parse(vals.p_defaults_json || '{}'); }
      catch { toast('Invalid JSON','error'); save.disabled=false; return; }
      let fn, args;
      if (existing) { fn = 'housing_update_template'; args = { p_id: existing.id, p_name: vals.p_name, p_description: vals.p_description, p_defaults: defaults }; }
      else { fn = 'housing_create_template'; args = { p_entity_type: vals.p_entity_type, p_name: vals.p_name, p_description: vals.p_description, p_defaults: defaults }; }
      await rpc(fn, args);
      toast(t('savedSuccessfully'),'success'); m.close(); if (onSaved) onSaved();
    } catch(e){ toast(e.message,'error'); save.disabled=false; }
  });
}
