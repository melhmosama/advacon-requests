<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<style>
  :root {
    --navy: #15406E; --med: #2A5C8A; --accent: #3E6E9E; --steel: #5B7A99;
    --green: #3C7D5A; --amber: #C08A3E; --red: #B0504A;
    --bg: #F4F6FA; --panel: #FFFFFF; --panel-alt: #F8FAFD;
    --border: #DDE4EE; --border-strong: #B8C4D6;
    --text: #14202E; --muted: #5A6B80; --faint: #93A0B5;
    --shadow-sm: 0 1px 2px rgba(20,32,46,.06);
    --shadow-md: 0 4px 14px rgba(20,32,46,.08);
    --shadow-lg: 0 10px 30px rgba(20,32,46,.12);
    --radius: 6px; --radius-lg: 10px;
    --sidebar-w: 240px; --topbar-h: 56px;
    --font-ar: "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    --font-en: "Inter", "Segoe UI", -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background: var(--bg); color: var(--text); font-family: var(--font-ar); font-size: 14px; line-height: 1.5; }
  html[dir="ltr"] body { font-family: var(--font-en); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; }
  code, pre { font-family: "SFMono-Regular", "Consolas", monospace; }

  /* ------- LAYOUT ------- */
  #app { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar-w) 1fr; grid-template-rows: var(--topbar-h) 1fr; grid-template-areas: "sidebar topbar" "sidebar main"; }
  html[dir="rtl"] #app { grid-template-areas: "topbar sidebar" "main sidebar"; grid-template-columns: 1fr var(--sidebar-w); }
  .topbar { grid-area: topbar; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 16px; position: sticky; top: 0; z-index: 30; }
  .topbar .logo { font-weight: 700; color: var(--navy); font-size: 16px; }
  .topbar .spacer { flex: 1; }
  .topbar .user-info { color: var(--muted); font-size: 13px; }
  .sidebar { grid-area: sidebar; background: var(--panel); border-inline-end: 1px solid var(--border); padding: 20px 0; overflow-y: auto; }
  .sidebar .brand { padding: 0 20px 20px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .sidebar .brand-title { font-weight: 700; color: var(--navy); font-size: 15px; }
  .sidebar .brand-sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: var(--muted); border-inline-start: 3px solid transparent; cursor: pointer; user-select: none; }
  .nav-item:hover { background: var(--panel-alt); color: var(--text); text-decoration: none; }
  .nav-item.active { background: var(--panel-alt); color: var(--navy); border-inline-start-color: var(--accent); font-weight: 600; }
  .nav-item .icon { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; opacity: .7; }
  .nav-item.active .icon { opacity: 1; }
  main { grid-area: main; padding: 24px; overflow-y: auto; }
  .page-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .page-header h1 { margin: 0; font-size: 22px; color: var(--navy); font-weight: 700; }
  .page-header .spacer { flex: 1; }
  .breadcrumb { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .breadcrumb a { color: var(--muted); }
  .breadcrumb .sep { opacity: .5; }

  /* ------- BUTTONS ------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--panel); color: var(--text); font-weight: 500; transition: all .15s; white-space: nowrap; }
  .btn:hover { background: var(--panel-alt); border-color: var(--accent); text-decoration: none; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  .btn-primary:hover { background: var(--med); border-color: var(--med); }
  .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-accent:hover { background: var(--med); border-color: var(--med); }
  .btn-danger { background: var(--red); border-color: var(--red); color: #fff; }
  .btn-danger:hover { background: #96453f; border-color: #96453f; }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 6px 10px; }
  .btn-ghost:hover { background: var(--panel-alt); color: var(--text); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-lg { padding: 10px 18px; font-size: 15px; }
  .btn-icon { padding: 6px; min-width: 32px; }

  /* ------- CARDS ------- */
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow-sm); }
  .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .card-title { font-weight: 700; color: var(--navy); font-size: 15px; margin: 0; }
  .card-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }

  /* ------- STAT ------- */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .stat-label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .stat-value { color: var(--navy); font-weight: 700; font-size: 22px; }
  .stat-hint { color: var(--faint); font-size: 11px; margin-top: 4px; }

  /* ------- BADGES ------- */
  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; background: var(--panel-alt); color: var(--muted); border: 1px solid var(--border); }
  .badge-green { background: rgba(60,125,90,.1); color: var(--green); border-color: rgba(60,125,90,.3); }
  .badge-amber { background: rgba(192,138,62,.12); color: var(--amber); border-color: rgba(192,138,62,.3); }
  .badge-red { background: rgba(176,80,74,.1); color: var(--red); border-color: rgba(176,80,74,.3); }
  .badge-blue { background: rgba(62,110,158,.1); color: var(--accent); border-color: rgba(62,110,158,.3); }
  .badge-gray { background: var(--panel-alt); color: var(--muted); }

  /* ------- TABLES ------- */
  .table-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th { background: var(--panel-alt); color: var(--muted); font-weight: 600; text-align: start; padding: 10px 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; white-space: nowrap; }
  table.data td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.data tr:last-child td { border-bottom: none; }
  table.data tr:hover td { background: var(--panel-alt); }
  table.data .row-actions { display: flex; gap: 4px; justify-content: flex-end; }
  table.data .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-style: italic; }
  .code-cell { font-family: monospace; color: var(--accent); font-weight: 600; }
  .num-cell { text-align: end; font-variant-numeric: tabular-nums; }

  /* ------- FORMS ------- */
  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .form-grid.cols-1 { grid-template-columns: 1fr; }
  .form-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.span-all { grid-column: 1 / -1; }
  .field label { color: var(--muted); font-size: 12px; font-weight: 600; }
  .field label .req { color: var(--red); }
  .field input, .field select, .field textarea { padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--panel); color: var(--text); }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(62,110,158,.15); }
  .field textarea { min-height: 60px; resize: vertical; }
  .field .hint { color: var(--faint); font-size: 11px; }
  .field .err { color: var(--red); font-size: 12px; }
  .field input[readonly] { background: var(--panel-alt); color: var(--muted); }
  .field select.readonly-select { background: var(--panel-alt); color: var(--muted); cursor: not-allowed; opacity: 1; }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; padding-top: 12px; border-top: 1px solid var(--border); margin-top: 16px; }

  /* ------- FILTERS BAR ------- */
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; padding: 12px 16px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 16px; }
  .filters .field { min-width: 140px; }
  .filters .field label { font-size: 11px; }
  .filters .field input, .filters .field select { padding: 6px 8px; font-size: 13px; }
  .filters .spacer { flex: 1; }

  /* ------- MODAL ------- */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(20,32,46,.5); z-index: 100; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 40px 20px; }
  .modal { background: var(--panel); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 100%; max-width: 640px; max-height: calc(100vh - 80px); display: flex; flex-direction: column; overflow: hidden; }
  .modal.wide { max-width: 900px; }
  .modal.narrow { max-width: 420px; }
  .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  .modal-title { margin: 0; font-size: 16px; font-weight: 700; color: var(--navy); flex: 1; }
  .modal-close { background: none; border: none; font-size: 20px; color: var(--muted); padding: 4px 8px; border-radius: var(--radius); }
  .modal-close:hover { background: var(--panel-alt); color: var(--text); }
  .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
  .modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; background: var(--panel-alt); }

  /* ------- TOAST ------- */
  #toast-mount { position: fixed; top: 20px; inset-inline-end: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast { pointer-events: auto; padding: 12px 16px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow-md); min-width: 260px; max-width: 380px; display: flex; gap: 10px; align-items: flex-start; animation: toast-in .2s ease-out; }
  .toast.success { border-inline-start: 4px solid var(--green); }
  .toast.error { border-inline-start: 4px solid var(--red); }
  .toast.warn { border-inline-start: 4px solid var(--amber); }
  .toast.info { border-inline-start: 4px solid var(--accent); }
  .toast-body { flex: 1; font-size: 13px; color: var(--text); }
  .toast-close { background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; }
  @keyframes toast-in { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ------- TABS ------- */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
  .tab { padding: 10px 14px; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; font-weight: 500; user-select: none; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--navy); border-bottom-color: var(--accent); font-weight: 600; }

  /* ------- ALERTS PANEL ------- */
  .alert-section { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: border-color .15s; }
  .alert-section:hover { border-color: var(--accent); }
  .alert-section .icon-badge { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; }
  .alert-section .icon-badge.amber { background: rgba(192,138,62,.15); color: var(--amber); }
  .alert-section .icon-badge.red { background: rgba(176,80,74,.15); color: var(--red); }
  .alert-section .icon-badge.blue { background: rgba(62,110,158,.15); color: var(--accent); }
  .alert-section .alert-label { flex: 1; }
  .alert-section .alert-name { color: var(--text); font-weight: 600; font-size: 13px; }
  .alert-section .alert-hint { color: var(--muted); font-size: 11px; }
  .alert-section .alert-count { font-weight: 700; font-size: 20px; color: var(--navy); font-variant-numeric: tabular-nums; }
  .alert-section .alert-count.zero { color: var(--faint); }

  /* ------- MISC ------- */
  .loading { padding: 40px; text-align: center; color: var(--muted); font-style: italic; }

  .info-box { padding: 12px 14px; background: rgba(62,110,158,.06); border: 1px solid rgba(62,110,158,.2); color: var(--text); border-radius: var(--radius); font-size: 13px; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 14px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; color: var(--text); }
  .flex { display: flex; align-items: center; gap: 8px; }
  .flex-col { display: flex; flex-direction: column; gap: 8px; }
  .flex-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grow { flex: 1; }
  .text-muted { color: var(--muted); }
  .text-faint { color: var(--faint); }
  .text-end { text-align: end; }
  .text-center { text-align: center; }
  .mb-0 { margin-bottom: 0; }
  .mb-1 { margin-bottom: 4px; }
  .mb-2 { margin-bottom: 8px; }
  .mb-3 { margin-bottom: 16px; }
  .mb-4 { margin-bottom: 24px; }
  .mt-3 { margin-top: 16px; }
  .hidden { display: none !important; }

  /* Hamburger — only visible on mobile */
  .nav-toggle { display: none; }

  /* Backdrop — only rendered on mobile when the drawer is open */
  .drawer-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    z-index: 90; opacity: 0; transition: opacity 0.2s ease;
  }
  .drawer-backdrop.open { display: block; opacity: 1; }

  @media (max-width: 900px) {
    /* Collapse to single column; sidebar becomes an off-canvas drawer */
    #app { grid-template-columns: 1fr; grid-template-areas: "topbar" "main"; }
    html[dir="rtl"] #app { grid-template-columns: 1fr; grid-template-areas: "topbar" "main"; }
    main { padding: 16px; }
    .form-grid { grid-template-columns: 1fr; }

    /* Show the hamburger */
    .nav-toggle {
      display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border: 1px solid var(--border); background: var(--panel);
      border-radius: 6px; cursor: pointer; font-size: 18px; line-height: 1;
      margin-inline-end: 8px; color: var(--text);
    }
    .nav-toggle:hover { background: var(--panel-alt); }

    /* Sidebar → off-canvas drawer */
    .sidebar {
      position: fixed; top: 0; bottom: 0; width: 280px; max-width: 85vw;
      z-index: 100; padding-top: calc(var(--topbar-h) + 16px);
      transition: transform 0.25s ease;
      box-shadow: 0 0 24px rgba(0,0,0,0.15);
      overflow-y: auto;
      display: block;  /* override any 'display:none' from earlier iterations */
    }
    /* LTR: drawer slides in from the LEFT */
    html[dir="ltr"] .sidebar { inset-inline-start: 0; transform: translateX(-100%); border-inline-end: 1px solid var(--border); border-inline-start: none; }
    html[dir="ltr"] .sidebar.open { transform: translateX(0); }
    /* RTL: drawer slides in from the RIGHT */
    html[dir="rtl"] .sidebar { inset-inline-start: 0; transform: translateX(100%); border-inline-start: 1px solid var(--border); border-inline-end: none; }
    html[dir="rtl"] .sidebar.open { transform: translateX(0); }
  }
[hidden] { display: none !important; }

function assetGetSession(){
  try { const raw=localStorage.getItem(CFG.assetSessionKey); if(!raw)return null; const s=JSON.parse(raw); return s&&s.access_token?s:null; }
  catch(e){ return null; }
}
function assetSetSession(s){ try{localStorage.setItem(CFG.assetSessionKey,JSON.stringify(s));}catch(e){} }
function assetClearSession(){ try{localStorage.removeItem(CFG.assetSessionKey);}catch(e){} CTX.role=null; CTX.permissions={}; }
async function assetRefresh(refreshToken){
  try{
    const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refreshToken})});
    const j=await r.json(); if(!r.ok||!j.access_token)return null;
    return {access_token:j.access_token,refresh_token:j.refresh_token||refreshToken,expires_at:j.expires_at||null,user_id:(j.user&&j.user.id)||null};
  }catch(e){return null;}
}
async function tokenRpc(accessToken, fn, args={}){
  const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  if(!r.ok)return {ok:false,http:r.status}; return {ok:true,data:await r.json()};
}
async function assetEnsureSession(){
  let sess=assetGetSession(); if(!sess||!sess.access_token||!sess.refresh_token){assetClearSession();return false;}
  const nowSec=Math.floor(Date.now()/1000), exp=Number(sess.expires_at||0);
  if(!exp||exp<=nowSec+60){ const fresh=await assetRefresh(sess.refresh_token); if(!fresh){assetClearSession();return false;} assetSetSession(fresh); sess=fresh; }
  const roleR=await tokenRpc(sess.access_token,'asset_my_role',{});
  const permR=await tokenRpc(sess.access_token,'asset_my_permissions',{p_module_key:'housing'});
  if(!roleR.ok||roleR.data!=='housing_manager'||!permR.ok||!permR.data){assetClearSession();return false;}
  const perms=permR.data||{};
  if(!Object.values(perms).some(v=>v&&v!=='deny')){assetClearSession();return false;}
  CTX.role=roleR.data; CTX.permissions=perms;
  await syncSbAuth(sess); return true;
}

const SB_URL = CFG.supabaseUrl;
const SB_KEY = CFG.supabaseAnonKey;

function admGetSession() {
  try {
    const raw = localStorage.getItem(CFG.adminSessionKey);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !s.access_token) return null;
    return s;
  } catch(e) { return null; }
}
function admSetSession(s) { try { localStorage.setItem(CFG.adminSessionKey, JSON.stringify(s)); } catch(e){} }
function admClearSession() { try { localStorage.removeItem(CFG.adminSessionKey); } catch(e){} }

async function admRefresh(refreshToken) {
  try {
    const r = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', headers: {'apikey': SB_KEY, 'Content-Type': 'application/json'},
      body: JSON.stringify({refresh_token: refreshToken})
    });
    const j = await r.json();
    if (!r.ok || !j.access_token) return null;
    return { access_token: j.access_token, refresh_token: j.refresh_token || refreshToken,
      expires_at: j.expires_at || null, user_id: (j.user && j.user.id) || null };
  } catch(e) { return null; }
}

async function admVerifyIsAdmin(accessToken) {
  try {
    const r = await fetch(SB_URL + '/rest/v1/rpc/is_admin', {
      method: 'POST',
      headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json'},
      body: '{}'
    });
    if (!r.ok) return false;
    return (await r.json()) === true;
  } catch(e) { return false; }
}

async function admEnsureSession() {
  let sess = admGetSession();
  if (!sess || !sess.access_token || !sess.refresh_token) { admClearSession(); return false; }
  const nowSec = Math.floor(Date.now() / 1000);
  const exp = Number(sess.expires_at || 0);
  // Refresh if expired or within 60s of expiring
  if (!exp || exp <= nowSec + 60) {
    const fresh = await admRefresh(sess.refresh_token);
    if (!fresh) { admClearSession(); return false; }
    admSetSession(fresh); sess = fresh;
  }
  // Server-side confirmation that this token maps to an admin
  const ok = await admVerifyIsAdmin(sess.access_token);
  if (!ok) {
    // Token might have expired between the refresh check and is_admin call → one retry
    const fresh = await admRefresh(sess.refresh_token);
    if (fresh) {
      admSetSession(fresh);
      if (await admVerifyIsAdmin(fresh.access_token)) { await syncSbAuth(fresh); return true; }
    }
    admClearSession(); return false;
  }
  // Sync the sb.auth session so sb.storage.* calls carry the JWT (RLS needs it)
  await syncSbAuth(sess);
  return true;
}

/* Mirror the localStorage-managed session into the Supabase JS client so that
   sb.storage.* / sb.auth.getUser() etc. carry the admin JWT. Without this,
   storage uploads/downloads run as `anon` and RLS rejects them. */
async function syncSbAuth(sess) {
  if (!sess || !sess.access_token) return;
  try {
    await sb.auth.setSession({
      access_token:  sess.access_token,
      refresh_token: sess.refresh_token || ''
    });
  } catch(e) { /* best-effort */ }
}

async function admSignOut() {
  const sess = admGetSession();
  if (sess && sess.access_token) {
    try {
      await fetch(SB_URL + '/auth/v1/logout?scope=local', {
        method: 'POST',
        headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + sess.access_token, 'Content-Type': 'application/json'},
        body: '{}'
      });
    } catch(e) { /* best-effort */ }
  }
  admClearSession();
}

async function requireContext() {
  // ?from= chooses the intended portal; the selected JWT is verified server-side.
  if(CTX.mode==='admin'){
    const ok=await admEnsureSession();
    if(!ok){ showSignInRequired('no_admin_session'); return false; }
    CTX.role='admin'; CTX.permissions={};
  }else if(CTX.mode==='asset'){
    const ok=await assetEnsureSession();
    if(!ok){ showSignInRequired('no_housing_manager_session'); return false; }

  }
  const el=document.getElementById('userInfo');
  if(el) el.textContent=CTX.role || (CTX.mode==='admin'?'admin':'housing_manager');
  return true;
}

/* Translates Supabase Storage errors to Arabic/English. The bucket-not-found
   case is by far the most common cause of "PDF upload appears to succeed but
   file never shows" in this project — the SDK sometimes returns a very
   generic message that hides the real cause. */
function translateStorageError(err) {
  const raw = String((err && (err.message || err.error || err)) || '');
  const lower = raw.toLowerCase();
  if (LANG === 'ar') {
    if (lower.includes('bucket not found') || lower.includes('bucket does not exist')) {
      return 'مستودع الملفات "housing-attachments" غير موجود. أنشئه في Supabase Dashboard → Storage → New bucket (خاص، ليس عام).';
    }
    if (lower.includes('violates row-level security') || lower.includes('permission denied')) {
      return 'لا توجد صلاحية للرفع على المستودع. تحقق من سياسات الوصول (RLS) للـ bucket.';
    }
    if (lower.includes('duplicate') || lower.includes('already exists')) {
      return 'ملف بنفس المسار موجود مسبقاً — جرّب مرة ثانية.';
    }
    if (lower.includes('payload too large') || lower.includes('too large')) {
      return 'حجم الملف تجاوز الحد المسموح به.';
    }
    if (lower.includes('network') || lower.includes('failed to fetch')) {
      return 'فشل الاتصال أثناء رفع الملف. تحقق من الشبكة وأعد المحاولة.';
    }
    return `خطأ في رفع الملف: ${raw}`;
  }
  return raw || 'Storage error';
}

/* =====================================================================
   ATTACHMENT INTEGRITY — upload + register + delete with compensation
   ---------------------------------------------------------------------
   These helpers turn the two-step Storage + DB flow into an atomic-like
   operation. If DB register fails after a successful Storage upload, we
   compensate by removing the uploaded file. If Storage cleanup fails
   after a successful DB delete, we log the orphan to audit_log so the
   operator can find and clean it later.
   ===================================================================== */

/* Lifecycle v2: the server reserves uploads and durably queues cleanup.
   Never compensate an uncertain registration by deleting its Storage object. */
async function uploadAndRegisterAttachment({entityType,entityId,file,kindKey,notes}){
 if(!await ensureHousingSession())throw new Error('session_expired');
 if(!can('attachments.upload'))throw new Error('not_authorized');
 const reservation=await rawRpc('advacon_begin_attachment_upload',{p_entity_type:entityType,p_entity_id:entityId,p_filename:file.name},true);
 if(reservation?.ok!==true||typeof reservation.storage_path!=='string'||!reservation.storage_path.startsWith('_advacon/'))throw new Error('attachment_reservation_failed');
 const {error}=await sb.storage.from('housing-attachments').upload(reservation.storage_path,file,{contentType:file.type,upsert:false});
 if(error)throw new Error(translateStorageError(error));
 return await rpc('housing_register_attachment',{p_entity_type:entityType,p_entity_id:entityId,p_kind_key:kindKey,p_storage_path:reservation.storage_path,p_filename:file.name,p_mime_type:file.type,p_size_bytes:file.size,p_notes:notes||null});
}

    if(readAction&&!can(readAction))throw new Error('not_authorized');

    if(action){
      const mode=permissionMode(action);
      if(!['direct','approval'].includes(mode)) throw new Error(LANG==='ar'?'لا تملك صلاحية تنفيذ هذه العملية':'You do not have permission for this action');
      if(mode==='approval' && args.p_dry_run!==true){

  try{return await rawRpc(fn,args,true);}catch(e){throw new Error(translateError(e.message||String(e)));}
}

function fmtNum(n, opts = {}) {
  if (n == null || n === '') return '—';
  const num = Number(n);
  if (isNaN(num)) return String(n);
  const decimals = opts.decimals != null ? opts.decimals : (num % 1 === 0 ? 0 : 2);
  return num.toLocaleString(LANG === 'ar' ? 'ar-SA' : 'en-US', {
    minimumFractionDigits: decimals, maximumFractionDigits: decimals
  });
}
function fmtSAR(n) {
  if (n == null || n === '') return '—';
  return fmtNum(n) + ' ' + t('currency');
}
function fmtDate(s) {
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d.getTime())) return String(s);
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function fmtDateTime(s) {
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d.getTime())) return String(s);
  return fmtDate(s) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function fmtStatus(status) {
  const map = {
    active: { class: 'badge-green', label: 'active' },
    expired: { class: 'badge-amber', label: 'expired' },
    cancelled: { class: 'badge-gray', label: 'cancelled' },
    pending: { class: 'badge-blue', label: 'pending' },
    paid: { class: 'badge-green', label: 'paid' },
    overdue: { class: 'badge-red', label: 'overdue' },
    disputed: { class: 'badge-amber', label: 'disputed' },
  };
  const s = map[status] || { class: 'badge-gray', label: status };
  return `<span class="badge ${s.class}">${escapeHtml(t(s.label))}</span>`;
}
function fmtIsActive(active) {
  return `<span class="badge ${active ? 'badge-green' : 'badge-gray'}">${active ? t('active') : t('inactive')}</span>`;
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[m]);
}
function pickName(obj) {
  if (!obj) return '';
  if (LANG === 'ar' && obj.name_ar) return obj.name_ar;
  if (obj.name_en) return obj.name_en;
  if (obj.name_ar) return obj.name_ar;
  if (obj.name) return obj.name;
  return '';
}

let housingFieldSerial=0;
function buildForm(schema, values = {}) {
  // schema: [{ name, label, type, required, options, min, max, hint, cols, placeholder, readonly }]
  const form = document.createElement('div');
  form.className = 'form-grid' + (schema.__cols ? ' cols-' + schema.__cols : '');
  (schema.fields || schema).forEach(f => {
    const field = document.createElement('div');
    field.className = 'field' + (f.spanAll ? ' span-all' : '');
    const lbl = document.createElement('label');
    lbl.innerHTML = escapeHtml(f.label) + (f.required ? ' <span class="req">*</span>' : '');
    field.appendChild(lbl);
    let inp;
    if (f.type === 'select') {
      inp = document.createElement('select');
      inp.innerHTML = `<option value="">— ${t('none')} —</option>` +
        (f.options || []).map(o =>
          `<option value="${escapeHtml(o.value)}" ${values[f.name] == o.value ? 'selected' : ''}>${escapeHtml(o.label)}</option>`
        ).join('');
    } else if (f.type === 'textarea') {
      inp = document.createElement('textarea');
      inp.value = values[f.name] != null ? values[f.name] : '';
      inp.rows = f.rows || 3;
    } else if (f.type === 'checkbox') {
      inp = document.createElement('input');
      inp.type = 'checkbox';
      inp.checked = !!values[f.name];
      field.classList.add('flex');
    } else {
      inp = document.createElement('input');
      inp.type = f.type || 'text';
      inp.value = values[f.name] != null ? values[f.name] : '';
      if (f.min != null) inp.min = f.min;
      if (f.max != null) inp.max = f.max;
      if (f.step != null) inp.step = f.step;
      if (f.placeholder) inp.placeholder = f.placeholder;
    }
    inp.name = f.name;
    inp.id = 'housing-field-'+(++housingFieldSerial);
    lbl.htmlFor = inp.id;
    inp.required = !!f.required;
    if(f.required)inp.setAttribute('aria-required','true');
    inp.dataset.field = f.name;
    // "readonly" support: <input>/<textarea> support the readOnly property,
    // but <select> does not — for selects we use `disabled` and add a class
    // to match the visual. readForm() still reads disabled fields because
    // it queries by data-field, not by form serialization.
    if (f.readonly) {
      if (inp.tagName === 'SELECT') {
        inp.disabled = true;
        inp.classList.add('readonly-select');
      } else {
        inp.readOnly = true;
      }
    }
    field.appendChild(inp);
    if (f.hint) {
      const h = document.createElement('div');
      h.className = 'hint';
      h.textContent = f.hint;
      h.id=inp.id+'-hint'; inp.setAttribute('aria-describedby',h.id);
      field.appendChild(h);
    }
    form.appendChild(field);
  });
  return form;
}

function readForm(formEl) {
  const invalid=[...formEl.querySelectorAll('[data-field]')].find(input=>!input.disabled&&!input.readOnly&&!input.checkValidity());
  if(invalid){
    const name=invalid.labels?.[0]?.textContent?.replace('*','').trim()||t('requiredField');
    const errorId=invalid.id+'-error';let error=formEl.querySelector('[id="'+errorId+'"]');
    if(!error){error=document.createElement('p');error.id=errorId;error.className='au-field-error';error.setAttribute('role','alert');invalid.after(error);const previous=invalid.getAttribute('aria-describedby')||'';invalid.setAttribute('aria-describedby',(previous+' '+errorId).trim());invalid.addEventListener('input',()=>{error.remove();invalid.removeAttribute('aria-invalid');if(previous)invalid.setAttribute('aria-describedby',previous);else invalid.removeAttribute('aria-describedby');},{once:true});}
    error.textContent=invalid.validity.valueMissing?t('requiredField'):AdvaconUI.text('راجع قيمة هذا الحقل.','Check this field’s value.');invalid.setAttribute('aria-invalid','true');invalid.focus();invalid.reportValidity();throw new Error(error.textContent+': '+name);
  }
  const out = {};
  formEl.querySelectorAll('[data-field]').forEach(el => {
    if (el.type === 'checkbox') out[el.dataset.field] = el.checked;
    else if (el.type === 'number') out[el.dataset.field] = el.value === '' ? null : Number(el.value);
    else if (el.value === '') out[el.dataset.field] = null;
    else out[el.dataset.field] = el.value;
  });
  return out;
}

async function route() {
  const hash = location.hash.slice(1);
  // Split path from query string first — otherwise IDs like UUIDs get
  // contaminated with '?tab=xxx' and downstream RPC calls fail with
  // 'invalid input syntax for type uuid'. The query part is still readable
  // via location.hash.split('?tab=')[1] where needed.
  const pathOnly = hash.split('?')[0];
  const [head, ...rest] = pathOnly.split('/');
  const mainRoute = head || '';
  renderNav(mainRoute);
  const previousContent = document.getElementById('content');
  const content=previousContent.cloneNode(false);previousContent.replaceWith(content);
  content.innerHTML = `<div class="loading">${t('loading')}</div>`;
  try {
    if(!await ensureHousingSession())throw new Error('session_expired');
    if(!content.isConnected)return;
    const navItem=NAV_ITEMS.find(x=>x.route===(mainRoute==='dashboard'?'':mainRoute));
    if(navItem&&!navAllowed(navItem))throw new Error('not_authorized');
    switch (mainRoute) {
      case '': case 'dashboard': await screenDashboard(content); break;
      case 'properties':
        if (rest.length > 0) await screenPropertyDetail(content, rest[0]);
        else await screenProperties(content);
        break;
      case 'alerts': await screenHousingAlert(content,rest[0]); break;
      case 'contracts': await screenContracts(content); break;
      case 'landlords': await screenLandlords(content); break;
      case 'meters': await screenMeters(content); break;
      case 'bills': await screenBills(content); break;
      case 'residents': await screenResidents(content); break;
      case 'expenses': await screenExpenses(content); break;
      case 'reports': await screenReports(content); break;
      case 'approvals': if(CTX.mode!=='admin') throw new Error('not_admin'); await screenApprovals(content); break;
      case 'permissions': if(CTX.mode!=='admin') throw new Error('not_admin'); await screenPermissions(content); break;
      case 'activity': if(CTX.mode!=='admin') throw new Error('not_admin'); await screenActivity(content); break;
      case 'attachment-health': if(CTX.mode!=='admin')throw new Error('not_admin');await screenAttachmentHealth(content);break;
      case 'settings': await screenSettings(content); break;
      default:
        content.innerHTML = `<div class="error-box">Unknown route: ${escapeHtml(mainRoute)}</div>`;
    }
  } catch (e) {
    console.error(e);
    if(content.isConnected)AdvaconUI.errorState(content,e,route);
  }
}

   let action='';
   if(x.bill_id&&can('bills.view'))action='<button class="btn" data-alert-open="'+index+'">'+tr('فتح الفاتورة','Open bill')+'</button>';
   else if(x.meter_id&&can('meters.view'))action='<button class="btn" data-alert-open="'+index+'">'+tr('فتح العداد','Open meter')+'</button>';
   else if((x.property_id||property?.id)&&can('properties.view'))action='<a class="btn" href="#properties/'+encodeURIComponent(x.property_id||property.id)+(x.contract_id?'?tab=contracts':'')+'">'+tr('فتح العقار','Open property')+'</a>';
   else if(x.expense_id&&can('expenses.view'))action='<button class="btn" data-alert-open="'+index+'">'+tr('فتح المصروف','Open expense')+'</button>';
   return '<article class="au-request-card"><h3>'+esc(title)+'</h3>'+(property?'<div>'+esc(property.code||'')+' · '+esc(property.name_ar||'')+'</div>':'')+'<div class="au-review-summary"><div><small>'+tr('التاريخ المرتبط بالتنبيه','Relevant date')+'</small>'+fmtDate(date)+'</div><div><small>'+tr('الأيام حسب التنبيه','Days for this alert')+'</small>'+esc(days??'—')+'</div>'+((x.amount??x.monthly_rent)!=null?'<div><small>'+tr('المبلغ','Amount')+'</small>'+fmtSAR(x.amount??x.monthly_rent)+'</div>':'')+'</div>'+action+'</article>';
  }).join('')||'<div class="empty">'+t('noItems')+'</div>';
  box.querySelectorAll('[data-alert-open]').forEach(b=>b.onclick=()=>AdvaconUI.busy(b,async()=>{const x=filtered[Number(b.dataset.alertOpen)];try{if(x.bill_id)await openBillDetail(x.bill_id,()=>screenHousingAlert(content,key));else if(x.meter_id)await openMeterDetail(x.meter_id,()=>screenHousingAlert(content,key));else if(x.expense_id){const r=await rpc('housing_get_expense',{p_id:x.expense_id});const entity=r.expense||r.item||r;if(can('expenses.edit'))await openExpenseForm(entity,entity.entity_type,entity.entity_id,()=>screenHousingAlert(content,key));else{const body=document.createElement('div');body.innerHTML=housingRequestDetails({payload:entity});openModal({title:tr('تفاصيل المصروف','Expense details'),body,footer:null});}}}catch(e){toast(e.message,'error');}}));
  AdvaconUI.enhance(content);
 }
 content.querySelector('#alertSearch').oninput=render;content.querySelector('#alertRefresh').onclick=e=>AdvaconUI.busy(e.currentTarget,()=>screenHousingAlert(content,key));render();
}

async function screenProperties(el) {
  const [cats, uses, owns, projectData] = await Promise.all([
    getRefOptions('building_categories'),
    getRefOptions('use_types'),
    getRefOptions('ownership_types'), rpc('advacon_project_options'),
  ]);
  el.innerHTML = `
    <div class="page-header">
      <h1>${t('properties')}</h1>
      <span class="spacer"></span>
      <button class="btn btn-primary" id="btnAddProp" ${housingActionAttrs('properties.create')}>+ ${t('add')}</button>
    </div>
    <div class="filters">
      <div class="field"><label>${t('search')}</label><input id="fSearch" placeholder="${t('search')}..."></div>
      <div class="field"><label>${t('category')}</label><select id="fCategory"><option value="">${t('all')}</option>${cats.map(c=>`<option value="${escapeHtml(c.value)}">${escapeHtml(c.label)}</option>`).join('')}</select></div>
      <div class="field"><label>${t('useType')}</label><select id="fUse"><option value="">${t('all')}</option>${uses.map(u=>`<option value="${escapeHtml(u.value)}">${escapeHtml(u.label)}</option>`).join('')}</select></div>
      <div class="field"><label>${t('isActive')}</label><select id="fActive"><option value="">${t('all')}</option><option value="true">${t('active')}</option><option value="false">${t('inactive')}</option></select></div>
      <span class="spacer"></span>
      <button class="btn btn-ghost" id="btnClear">↺</button>
    </div>
    <div id="propList" class="table-wrap"><div class="loading">${t('loading')}</div></div>`;
  const listEl = el.querySelector('#propList');
  AdvaconExperience.rememberFilters(el,location.pathname+location.hash);
  let loadSerial=0, searchCache=null;
  const load = async (localSearch=false) => {
    const version=++loadSerial;
    localSearch=localSearch===true;
    listEl.innerHTML = `<div class="loading">${t('loading')}</div>`;
    try {
      const activeVal = el.querySelector('#fActive').value;
      const args = {};
      if (activeVal === 'true') args.p_active_only = true;
      if (el.querySelector('#fCategory').value) args.p_category_key = el.querySelector('#fCategory').value;
      if (el.querySelector('#fUse').value) args.p_use_type_key = el.querySelector('#fUse').value;
      const requestArgs=args, signature=JSON.stringify(requestArgs);
      const res=localSearch&&searchCache?.signature===signature?searchCache.data:await rpc('housing_list_properties',requestArgs);
      if(version!==loadSerial||!el.isConnected)return;
      searchCache={signature,data:res,time:localSearch&&searchCache?.signature===signature?searchCache.time:Date.now()};
      AdvaconExperience.dataStatus(el,searchCache.time);
      let items = res.items || [];
      const q = el.querySelector('#fSearch').value.trim().toLowerCase();
      if (q) items = items.filter(p => (p.code||'').toLowerCase().includes(q) || (p.name_ar||'').toLowerCase().includes(q) || (p.name_en||'').toLowerCase().includes(q) || (p.location||'').toLowerCase().includes(q));
      if (activeVal === 'false') items = items.filter(p => !p.is_active);
      renderPropTable(listEl, items);AdvaconUI.enhance(listEl);
    } catch(e) { if(version!==loadSerial||!el.isConnected)return;
      AdvaconUI.errorState(listEl,e,()=>load());
    }
  };
  el.querySelector('#fSearch').addEventListener('input', debounce(()=>load(true), 200));
  ['fCategory','fUse','fActive'].forEach(id => el.querySelector('[id="'+id+'"]').addEventListener('input', load));
  el.querySelector('#btnClear').addEventListener('click', () => {
    ['fSearch','fCategory','fUse','fActive'].forEach(id => el.querySelector('[id="'+id+'"]').value = '');
    load();
  });
  el.querySelector('#btnAddProp').addEventListener('click', () => openPropertyForm(null, load));
  const refresh=document.createElement('button');refresh.className='btn';refresh.textContent=AdvaconUI.text('تحديث','Refresh');refresh.onclick=()=>AdvaconUI.busy(refresh,()=>load());
  el.querySelector('.filters')?.append(refresh);
  AdvaconUI.enhance(el);
  await load();
}

    <table class="data">

async function openPropertyForm(existing, onSaved) {
  if(!can(existing?'properties.edit':'properties.create')){toast('not_authorized','error');return;}
  const [cats, uses, owns] = await Promise.all([
    getRefOptions('building_categories'),
    getRefOptions('use_types'),
    getRefOptions('ownership_types'),
  ]);
  const schema = { __cols: 2, fields: [
    { name: 'p_name_ar', label: LANG==='ar'?'الاسم بالعربي':'Arabic Name', required: true, spanAll: true },
    { name: 'p_name_en', label: LANG==='ar'?'الاسم بالإنجليزي':'English Name', spanAll: true },
    { name: 'p_category_key', label: t('category'), type: 'select', options: cats, required: true },
    { name: 'p_use_type_key', label: t('useType'), type: 'select', options: uses, required: true },
    { name: 'p_ownership_key', label: t('ownership'), type: 'select', options: owns, required: true },
    { name: 'p_location', label: t('location'), required: true },
    { name: 'p_total_capacity', label: t('totalCapacity'), type: 'number', min: 0 },
    { name: 'p_purpose_label', label: LANG==='ar'?'الغرض التفصيلي':'Purpose Label' },
    { name: 'p_area_sqm', label: LANG==='ar'?'المساحة (م²)':'Area (m²)', type: 'number', step: '0.01', min: 0 },
    { name: 'p_project_ref', label: LANG==='ar'?'المشروع':'Project', type:'select', options:projectData.projects.filter(p=>p.active||p.code===existing?.project_ref).map(p=>({value:p.code,label:p.code+(p.name?' — '+p.name:'')})) },
    { name: 'p_notes', label: t('notes'), type: 'textarea', spanAll: true },
  ]};
  const initial = existing ? {
    p_name_ar: existing.name_ar, p_name_en: existing.name_en,
    p_category_key: existing.category?.key, p_use_type_key: existing.use_type?.key,
    p_ownership_key: existing.ownership?.key, p_location: existing.location,
    p_total_capacity: existing.total_capacity, p_purpose_label: existing.purpose_label,
    p_area_sqm: existing.area_sqm, p_project_ref: existing.project_ref, p_notes: existing.notes,
  } : {};
  const formEl = buildForm(schema, initial);
  const footer = document.createElement('div'); footer.className='flex'; footer.style.gap='8px'; footer.style.justifyContent='flex-end'; footer.style.flex='1';
  const cancel = document.createElement('button'); cancel.className='btn'; cancel.textContent = t('cancel');
  const save = document.createElement('button'); save.className='btn btn-primary'; save.textContent = AdvaconUI.requestLabel(permissionMode('properties.'+(existing?'edit':'create')),t('save'));
  footer.appendChild(cancel); footer.appendChild(save);
  const m = openModal({ title: existing ? t('edit') : t('add') + ' ' + t('properties'), body: formEl, footer, wide: true });
  cancel.addEventListener('click', m.dismiss);
  save.addEventListener('click', async () => {
    save.disabled = true;
    try {
      const vals = readForm(formEl);
      for (const req of ['p_name_ar','p_category_key','p_use_type_key','p_ownership_key','p_location']) {
        if (!vals[req]) { toast(t('requiredField') + ': ' + req, 'error'); save.disabled = false; return; }
      }
      const fn = existing ? 'housing_update_property' : 'housing_create_property';
      if (existing) vals.p_id = existing.id;
      await rpc(fn, vals);
      toast(t('savedSuccessfully'), 'success');
      m.close(); if (onSaved) onSaved();
    } catch (e) { toast(e.message, 'error'); save.disabled = false; }
  });
}

async function screenPropertyDetail(el, id) {
  const load = async () => {
    const res = await rpc('housing_get_property', { p_id: id });
    if (!res.ok || !res.property) { el.innerHTML = `<div class="error-box">Not found</div>`; return; }
    const p = res.property;
    const tabs = ['summary','structure','contracts','meters','residents','expenses','finance','attachments'];
    const activeTab = new URLSearchParams(location.hash.split('?')[1]||'').get('tab') || 'summary';
    el.innerHTML = `
      ${new URLSearchParams(location.hash.split('?')[1]||'').get('from')==='contracts'&&can('contracts.view')?'<a class="btn btn-ghost" href="#contracts">'+(LANG==='ar'?'العودة لقائمة العقود':'Back to contracts')+'</a>':''}
      <div class="breadcrumb">
        <a href="#properties">${t('properties')}</a>
        <span class="sep">›</span>
        <span>${escapeHtml(p.code)}</span>
      </div>
      <div class="page-header">
        <div>
          <h1>${escapeHtml(LANG==='ar'?p.name_ar:(p.name_en||p.name_ar))} <span class="text-muted" style="font-size:15px; font-weight:400;">${escapeHtml(p.code)}</span></h1>
          <div class="text-muted mb-1">${escapeHtml(p.location||'')}</div>
        </div>
        <span class="spacer"></span>
        ${fmtIsActive(p.is_active)}
        <button class="btn" id="btnEditProp" ${housingActionAttrs('properties.edit')}>${t('edit')}</button>
        <button class="btn ${p.is_active?'btn-ghost':'btn-primary'}" id="btnToggleActive" ${housingActionAttrs('properties.activate')}>${p.is_active?t('deactivate'):t('activate')}</button>
        <button class="btn btn-ghost" id="btnDeleteProp" ${housingActionAttrs('properties.delete')} style="color:var(--red); border-color:var(--red);">${t('delete')}</button>
      </div>
      <div class="tabs">
        ${tabs.map(k => `<a class="tab ${k===activeTab?'active':''}" href="#properties/${id}?tab=${k}">${k==='finance'?(LANG==='ar'?'الاستحقاقات والدفع':'Dues & payments'):t('tab'+k.charAt(0).toUpperCase()+k.slice(1))}</a>`).join('')}
      </div>
      <div id="tabContent"><div class="loading">${t('loading')}</div></div>`;
    el.querySelector('#btnEditProp').addEventListener('click', () => openPropertyForm(p, load));
    el.querySelector('#btnToggleActive').addEventListener('click', async () => {
      if (p.is_active && !await confirmAction({ title: t('confirmDeactivate'), message: t('confirmDeactivate') })) return;
      await rpc('housing_toggle_property_active', { p_id: id, p_active: !p.is_active });
      toast(t('savedSuccessfully'), 'success'); load();
    });
    el.querySelector('#btnDeleteProp').addEventListener('click', async () => {
      // Step 1: TRUE probe — dry_run=true never deletes, only reports counts
      let probe;
      try {
        probe = await rpc('housing_delete_property', { p_id: id, p_cascade: false, p_dry_run: true });
      } catch (e) { toast(e.message || String(e), 'error'); return; }
      if (!probe || probe.ok !== true) { toast(t('errorOccurred'), 'error'); return; }

      const c = probe.counts || {};
      const rows = [];
      if (c.contracts        > 0) rows.push([LANG==='ar'?'العقود':'Contracts',                          c.contracts]);
      if (c.meters_to_delete > 0) {
        rows.push([LANG==='ar'?'العدادات (خاصة بهذا العقار فقط)':'Meters (exclusive)',                 c.meters_to_delete]);
        if (c.bills_to_delete    > 0) rows.push([LANG==='ar'?'الفواتير المرتبطة':'Bills',              c.bills_to_delete]);
        if (c.readings_to_delete > 0) rows.push([LANG==='ar'?'قراءات العدادات':'Meter readings',       c.readings_to_delete]);
      }
      if (c.attachments      > 0) rows.push([LANG==='ar'?'المرفقات':'Attachments',                     c.attachments]);
      if (c.expenses         > 0) rows.push([LANG==='ar'?'المصاريف':'Expenses',                        c.expenses]);
      if (c.active_residents > 0) rows.push([LANG==='ar'?'تخصيصات السكان النشطة (السكان يبقوا)':'Active resident assignments (residents preserved)', c.active_residents]);

      const body = document.createElement('div');
      body.innerHTML = probe.has_dependents
        ? `
          <div style="font-size:14px; color:var(--text); margin-bottom:12px;">
            ${LANG==='ar'
              ? `عند حذف <strong>${escapeHtml(p.code)} — ${escapeHtml(p.name_ar||'')}</strong> سيتم حذف ما يلي معاً:`
              : `Deleting <strong>${escapeHtml(p.code)} — ${escapeHtml(p.name_ar||'')}</strong> will also delete:`}
          </div>
          <table class="data" style="margin-bottom:12px;">
            <tbody>${rows.map(([k,v]) => `<tr><td>${escapeHtml(k)}</td><td class="num-cell" style="font-weight:600;">${v}</td></tr>`).join('')}</tbody>
          </table>
          <div style="font-size:12px; color:var(--muted);">
            ${LANG==='ar' ? 'العدادات المشتركة مع عقارات أخرى لن تُحذف. لا يمكن التراجع.' : 'Meters shared with other properties are preserved. This cannot be undone.'}
          </div>`
        : `
          <div style="font-size:14px; color:var(--text); margin-bottom:8px;">
            ${LANG==='ar'
              ? `هل تريد حذف <strong>${escapeHtml(p.code)} — ${escapeHtml(p.name_ar||'')}</strong> نهائياً؟`
              : `Delete <strong>${escapeHtml(p.code)} — ${escapeHtml(p.name_ar||'')}</strong> permanently?`}
          </div>
          <div style="font-size:12px; color:var(--muted);">${LANG==='ar' ? 'العقار فارغ — لا يوجد ما يُحذف معه. لا يمكن التراجع.' : 'Property is empty — nothing to cascade. This cannot be undone.'}</div>`;

      const foot = document.createElement('div');
      foot.className='flex'; foot.style.gap='8px'; foot.style.justifyContent='flex-end'; foot.style.flex='1';
      const cx = document.createElement('button'); cx.className='btn'; cx.textContent = t('cancel');
      const del = document.createElement('button'); del.className='btn'; del.style.background='var(--red)'; del.style.color='#fff'; del.style.borderColor='var(--red)';
      del.textContent = probe.has_dependents
        ? (LANG==='ar' ? 'حذف الكل نهائياً' : 'Delete everything')
        : (LANG==='ar' ? 'حذف' : 'Delete');
      foot.appendChild(cx); foot.appendChild(del);
      const pm = openModal({ title: t('delete'), body, footer: foot });
      cx.addEventListener('click', pm.dismiss);
      del.addEventListener('click', async () => {
        del.disabled = true;
        try {
          const res = await rpc('housing_delete_property', {
            p_id: id, p_cascade: probe.has_dependents, p_dry_run: false
          });
          const paths = (res && res.attachment_paths) || [];
          if (paths.length > 0) {
            await removeStorageFilesWithFallback(paths, { context: 'property.cascade' });
          }
          const d = (res && res.deleted) || {};
          const summary = probe.has_dependents
            ? (LANG==='ar'
                ? `تم حذف العقار + ${d.contracts||0} عقد + ${d.meters_to_delete||0} عدّاد + ${d.bills_to_delete||0} فاتورة`
                : `Deleted property + ${d.contracts||0} contract(s) + ${d.meters_to_delete||0} meter(s) + ${d.bills_to_delete||0} bill(s)`)
            : t('deletedSuccessfully');
          toast(summary, 'success');
          pm.close();
          location.hash = 'properties';
        } catch (e) { toast(e.message || String(e), 'error'); del.disabled = false; }
      });
    });
    await renderPropertyTab(el.querySelector('#tabContent'), p, activeTab, load);
  };
  await load();
}

  container.querySelectorAll('[data-space-del]').forEach(b => b.addEventListener('click', async (e) => {

  }));

  }));

function findSpaceInTree(nodes, id) {
  for (const n of nodes) { if (n.id === id) return n; if (n.children) { const f = findSpaceInTree(n.children, id); if (f) return f; } }
  return null;
}

function renderSpaceTree(nodes, depth = 0) {
  return `<ul style="list-style:none; padding:0; margin:0;">${nodes.map(n => `
    <li style="padding: 6px 0; border-bottom: 1px solid var(--border);">
      <div class="flex" style="padding-inline-start:${depth*24}px;">
        <span class="badge badge-blue">${escapeHtml(n.space_type?.key||n.type||'')}</span>
        <span class="code-cell">${escapeHtml(n.code||'')}</span>
        <span>${escapeHtml(n.name||'')}</span>
        <span class="text-muted" style="font-size:12px;">${n.capacity!=null?`(${n.capacity})`:''}</span>
        <span class="spacer"></span>
        <button class="btn btn-sm btn-ghost" ${housingActionAttrs('spaces.manage')} data-space-addchild="${n.id}">+</button>
        <button class="btn btn-sm btn-ghost" ${housingActionAttrs('spaces.manage')} data-space-edit="${n.id}">${t('edit')}</button>
        <button class="btn btn-sm btn-ghost" style="color:var(--red);" ${housingActionAttrs('spaces.manage')} data-space-del="${n.id}">×</button>
      </div>
      ${n.children && n.children.length ? renderSpaceTree(n.children, depth+1) : ''}
    </li>`).join('')}</ul>`;
}

  const attPickBtn  = attachSection.querySelector('#attPickBtn');
  const attStatusEl = attachSection.querySelector('#attStatus');

      if (!okS) { toast(LANG==='ar'?'جلسة مسؤول الإسكان غير صالحة':'Housing manager session is invalid','error'); return; }
      const { data, error } = await sb.storage.from('housing-attachments').createSignedUrl(path, 300);
      if (error) { toast(translateStorageError(error),'error'); return; }
      window.open(data.signedUrl, '_blank');
    }));
    attListEl.querySelectorAll('[data-att-del]').forEach(b => b.addEventListener('click', async (e) => {

    const c = document.createElement('button'); c.className='btn'; c.textContent = t('cancel');
    const ok = document.createElement('button'); ok.className='btn btn-primary'; ok.textContent = existing ? (LANG==='ar'?'رفع':'Upload') : (LANG==='ar'?'أضف للقائمة':'Add to list');

    const pm = openModal({ title: LANG==='ar'?'إضافة مرفق':'Add attachment', body, footer: foot });
    c.addEventListener('click', pm.dismiss);
    ok.addEventListener('click', async () => {
      const kindKey = document.getElementById('pkKind').value;

      if (existing) {

      } else {
        pendingFiles.push({ file, kindKey, notes });
        pm.close();
        renderAttList();
      }

  });

  // -----------------------------------------------------------------------

  const footer = document.createElement('div'); footer.className='flex'; footer.style.gap='8px'; footer.style.justifyContent='flex-end'; footer.style.flex='1';
  const cancel = document.createElement('button'); cancel.className='btn'; cancel.textContent = t('cancel');
  const save = document.createElement('button'); save.className='btn btn-primary'; save.textContent = AdvaconUI.requestLabel(permissionMode('contracts.'+(existing?'edit':'create')),t('save'));
  footer.appendChild(cancel); footer.appendChild(save);
  const m = openModal({ title: existing ? t('edit') : t('add') + ' ' + t('contracts'), body: formEl, footer, wide: true });

    const addLink = document.createElement('button');
    addLink.type = 'button';

    addLink.style.marginInlineStart = '8px';

      else { fn = 'housing_create_contract'; args = { ...vals, p_property_id: propId }; }
      const res = await rpc(fn, args);

      // For NEW contracts: upload queued files now that we have the contract id
      const newContractId = existing ? existing.id : (res && res.id);
      if (!existing && newContractId && pendingFiles.length > 0) {
        attStatusEl.textContent = LANG==='ar' ? `يرفع المرفقات (${pendingFiles.length})...` : `Uploading attachments (${pendingFiles.length})...`;

        for (const pf of pendingFiles) {

/* Local (non-UTC) date helper — avoids UTC bugs during KSA night hours */
function localDateISO(d) {
  d = d || new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

/* Debounce helper — collapses rapid successive calls into one, fired
   after the last call has been idle for `ms` milliseconds. Used to keep
   fast typing in text-search filters from hammering the RPC endpoint. */
function debounce(fn, ms) {
  let timer = null;
  return function(...args) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(() => { timer = null; fn.apply(this, args); }, ms);
  };
}

/* Generic safe-delete flow used by meter / resident / expense list rows.
   Contract: probe with p_dry_run=true, show confirmation with counts,
   then delete with p_cascade set based on has_dependents.
   The RPC MUST accept (p_id, p_cascade, p_dry_run). */
async function deleteEntityWithProbe(opts) {
  const { rpcName, id, labelAr, labelEn, countRowsBuilder, onDone } = opts;
  let probe;
  try { probe = await rpc(rpcName, { p_id: id, p_cascade: false, p_dry_run: true }); }
  catch(err) { toast(err.message||err, 'error'); return; }
  if (!probe || probe.ok !== true) { toast(t('errorOccurred'), 'error'); return; }

  const label = (LANG==='ar' ? labelAr : labelEn) || id.slice(0,8);
  const rows = probe.has_dependents ? (countRowsBuilder(probe.counts || {}) || []) : [];
  const body = document.createElement('div');
  body.innerHTML = probe.has_dependents
    ? `
      <div style="font-size:14px; color:var(--text); margin-bottom:12px;">
        ${LANG==='ar' ? `عند حذف <strong>${escapeHtml(label)}</strong> سيتم حذف ما يلي معاً:` : `Deleting <strong>${escapeHtml(label)}</strong> will also delete:`}
      </div>
      ${rows.length ? `<table class="data" style="margin-bottom:12px;"><tbody>${rows.map(([k,v]) => `<tr><td>${escapeHtml(k)}</td><td class="num-cell" style="font-weight:600;">${v}</td></tr>`).join('')}</tbody></table>` : ''}
      <div style="font-size:12px; color:var(--muted);">${LANG==='ar' ? 'لا يمكن التراجع.' : 'This cannot be undone.'}</div>`
    : `
      <div style="font-size:14px; color:var(--text); margin-bottom:8px;">
        ${LANG==='ar' ? `هل تريد حذف <strong>${escapeHtml(label)}</strong> نهائياً؟` : `Delete <strong>${escapeHtml(label)}</strong> permanently?`}
      </div>
      <div style="font-size:12px; color:var(--muted);">${LANG==='ar' ? 'لا يمكن التراجع.' : 'This cannot be undone.'}</div>`;
  const foot = document.createElement('div'); foot.className='flex'; foot.style.gap='8px'; foot.style.justifyContent='flex-end'; foot.style.flex='1';
  const cx = document.createElement('button'); cx.className='btn'; cx.textContent = t('cancel');
  const del = document.createElement('button'); del.className='btn'; del.style.background='var(--red)'; del.style.color='#fff'; del.style.borderColor='var(--red)';
  del.textContent = probe.has_dependents ? (LANG==='ar'?'حذف الكل':'Delete all') : (LANG==='ar'?'حذف':'Delete');
  foot.appendChild(cx); foot.appendChild(del);
  const pm = openModal({ title: t('delete'), body, footer: foot });
  cx.addEventListener('click', pm.dismiss);
  del.addEventListener('click', async () => {
    del.disabled = true;
    try {
      const res = await rpc(rpcName, { p_id: id, p_cascade: probe.has_dependents, p_dry_run: false });
      const paths = (res && res.attachment_paths) || [];
      if (paths.length) { await removeStorageFilesWithFallback(paths, { context: 'cascade' }); }
      toast(t('deletedSuccessfully'), 'success');
      pm.close();
      if (onDone) onDone(res);
    } catch(err) { toast(err.message||err, 'error'); del.disabled = false; }
  });
}

async function openLandlordForm(existing, onSaved) {
  if(!can(existing?'landlords.edit':'landlords.create')){toast('not_authorized','error');return;}
  const schema = { __cols: 2, fields: [
    { name: 'p_name', label: t('name'), required: true, spanAll: true },
    { name: 'p_landlord_type', label: t('landlordType'), type: 'select', required: true,
      options: [{ value: 'individual', label: t('individual') }, { value: 'organization', label: t('organization') }] },
    { name: 'p_phone', label: t('phone') },
    { name: 'p_email', label: t('email') },
    { name: 'p_national_id', label: t('nationalId') },
    { name: 'p_notes', label: t('notes'), type: 'textarea', spanAll: true },
  ]};
  const initial = existing ? {
    p_name: existing.name,
    p_landlord_type: existing.landlord_type,
    p_phone: existing.phone,
    p_email: existing.email,
    p_national_id: existing.national_id,
    p_notes: existing.notes,
  } : { p_landlord_type: 'individual' };
  const formEl = buildForm(schema, initial);
  const footer = document.createElement('div');
  footer.className = 'flex';
  footer.style.gap = '8px';
  footer.style.justifyContent = 'flex-end';
  footer.style.flex = '1';
  const cancel = document.createElement('button'); cancel.className = 'btn'; cancel.textContent = t('cancel');
  const save = document.createElement('button'); save.className = 'btn btn-primary'; save.textContent = AdvaconUI.requestLabel(permissionMode('landlords.'+(existing?'edit':'create')),t('save'));
  footer.appendChild(cancel); footer.appendChild(save);
  const m = openModal({ title: (existing ? t('edit') : t('add')) + ' ' + t('landlords'), body: formEl, footer });
  cancel.addEventListener('click', m.dismiss);
  save.addEventListener('click', async () => {
    save.disabled = true;
    try {
      const vals = readForm(formEl);
      if (!vals.p_name || !vals.p_name.trim()) {
        toast(t('requiredField') + ': ' + t('name'), 'error');
        save.disabled = false; return;
      }
      if (!vals.p_landlord_type) vals.p_landlord_type = 'individual';
      let fn, args;
      if (existing) { fn = 'housing_update_landlord'; args = { ...vals, p_id: existing.id }; }
      else          { fn = 'housing_create_landlord'; args = vals; }
      const res = await rpc(fn, args);
      toast(t('savedSuccessfully'), 'success');
      m.close();
      if (onSaved) onSaved(res);
    } catch (e) {
      toast(e.message || String(e), 'error');
      save.disabled = false;
    }
  });
}

  edit.addEventListener('click', () => { modal.close(); openMeterForm(m, refresh); });
  body.querySelector('#btnAddR').addEventListener('click', () => openReadingForm(id, () => { modal.close(); openMeterDetail(id, refresh); }));
  body.querySelectorAll('[data-del-r]').forEach(b => b.addEventListener('click', async (e) => {
    if (!await confirmAction({ title: t('delete'), message: t('confirmDelete'), danger: true })) return;
    try { await rpc('housing_delete_reading', { p_id: e.currentTarget.getAttribute('data-del-r') }); toast(t('deletedSuccessfully'),'success'); modal.close(); openMeterDetail(id, refresh); }
    catch(err) { toast(err.message, 'error'); }
  }));
}

/* =====================================================================
   SCREEN: BILLS LIST
