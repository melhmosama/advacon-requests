async function screenBills(el) {
  const PAGE_SIZE = 100;
  const pageKey=location.pathname+location.hash;
  let currentOffset = AdvaconExperience.page(pageKey);
  el.innerHTML = `
    <div class="page-header">
      <h1>${t('bills')}</h1>
      <span class="spacer"></span>
      <button class="btn" id="btnBulkPay" ${housingActionAttrs('bills.bulk_mark_paid')} title="${LANG==='ar'?'علّم كل الفواتير المطابقة للفلاتر كمدفوعة':'Mark all bills matching filters as paid'}">${LANG==='ar'?'علّم الكل كمدفوع':'Bulk mark paid'}</button>
      <button class="btn btn-primary" id="btnAdd" ${housingActionAttrs('bills.create')}>+ ${t('add')}</button>
    </div>
    <div class="filters">
      <div class="field"><label>${t('status')}</label><select id="fStatus"><option value="">${t('all')}</option><option value="pending">${t('pending')}</option><option value="paid">${t('paid')}</option><option value="overdue">${t('overdue')}</option><option value="disputed">${t('disputed')}</option></select></div>
      <div class="field"><label>${LANG==='ar'?'من تاريخ':'From'}</label><input id="fFrom" type="date"></div>
      <div class="field"><label>${LANG==='ar'?'إلى تاريخ':'To'}</label><input id="fTo" type="date"></div>
      <span class="spacer"></span>
      <button class="btn btn-ghost" id="btnClear">↺</button>
    </div>
    <div id="summary" class="mb-3"></div>
    <div id="list" class="table-wrap"><div class="loading">${t('loading')}</div></div>
    <div id="pager" class="flex mb-3" style="justify-content:center; gap:12px; align-items:center; margin-top:12px;"></div>`;

  const initialStatus=new URLSearchParams(location.hash.split('?')[1]||'').get('status');
  if(['pending','paid','overdue','disputed','cancelled'].includes(initialStatus))el.querySelector('#fStatus').value=initialStatus;
  const buildFilters = () => {
    const f = {};
    if (el.querySelector('#fStatus').value) f.p_status = el.querySelector('#fStatus').value;
    if (el.querySelector('#fFrom').value)   f.p_period_from = el.querySelector('#fFrom').value;
    if (el.querySelector('#fTo').value)     f.p_period_to = el.querySelector('#fTo').value;
    return f;
  };

  AdvaconExperience.rememberFilters(el,location.pathname+location.hash);
  let loadSerial=0, searchCache=null;
  const load = async (localSearch=false) => {
    const version=++loadSerial;
    localSearch=localSearch===true;
    el.querySelector('#list').innerHTML = `<div class="loading">${t('loading')}</div>`;
    el.querySelector('#pager').innerHTML = '';
    try {
      const filters = buildFilters();
      const requestArgs={ ...filters, p_limit: PAGE_SIZE, p_offset: AdvaconExperience.page(pageKey,currentOffset) }, signature=JSON.stringify(requestArgs);
      const res=localSearch&&searchCache?.signature===signature?searchCache.data:await rpc('housing_list_bills',requestArgs);
      if(version!==loadSerial||!el.isConnected)return;
      searchCache={signature,data:res,time:localSearch&&searchCache?.signature===signature?searchCache.time:Date.now()};
      AdvaconExperience.dataStatus(el,searchCache.time);
      const items = res.items || [];
      const total = res.total_count || 0;
      el.querySelector('#summary').innerHTML = `
        <div class="stat-grid">
          <div class="stat"><div class="stat-label">${t('count')}</div><div class="stat-value">${fmtNum(total,{decimals:0})}</div></div>
          <div class="stat"><div class="stat-label">${t('total')}</div><div class="stat-value">${fmtSAR(res.total_amount||0)}</div></div>
        </div>`;
      const listEl = el.querySelector('#list');
      if (!items.length) { listEl.innerHTML = `<div class="empty" style="padding:40px; text-align:center; color:var(--muted);">${t('noItems')}</div>`; return; }
      listEl.innerHTML = `
        <table class="data">
          <thead><tr>
            <th>${LANG==='ar'?'العدّاد':'Meter'}</th><th>${LANG==='ar'?'الفترة':'Period'}</th><th>${t('amount')}</th>
            <th>${LANG==='ar'?'الاستهلاك':'Consumption'}</th><th>${t('dueDate')}</th><th>${t('daysOverdue')}</th>
            <th>${t('status')}</th><th></th>
          </tr></thead>
          <tbody>${items.map(b=>{
            const od = b.days_overdue || 0;
            return `<tr ${b.is_amended?'style="opacity:.5;"':''}>
              <td><span class="code-cell">${escapeHtml(b.meter?.code||'')}</span>${b.meter?.meter_type?' — '+escapeHtml(pickName(b.meter.meter_type)):''}</td>
              <td>${fmtDate(b.bill_period_start)} → ${fmtDate(b.bill_period_end)}</td>
              <td class="num-cell">${fmtSAR(b.amount)}</td>
              <td class="num-cell">${b.consumption!=null?fmtNum(b.consumption):'—'}</td>
              <td>${fmtDate(b.due_date)}</td>
              <td class="num-cell" style="${od>0?'color:var(--red); font-weight:600':''}">${od>0?fmtNum(od,{decimals:0}):'—'}</td>
              <td>${fmtStatus(b.status)}${b.is_amended?` <span class="badge badge-gray">${LANG==='ar'?'معدّل':'amended'}</span>`:''}</td>
              <td class="row-actions">
                ${b.status!=='paid'&&!b.is_amended?`<button class="btn btn-sm btn-primary" ${housingActionAttrs('bills.mark_paid')} data-pay="${b.id}">${LANG==='ar'?'دفع':'Pay'}</button>`:''}
                <button class="btn btn-sm" data-view="${b.id}">${t('view')}</button>
                <button class="btn btn-sm" style="color:var(--red);" ${housingActionAttrs('bills.delete')} data-del="${b.id}" data-name="${escapeHtml((b.meter?.code||'') + ' · ' + fmtDate(b.bill_period_start) + '→' + fmtDate(b.bill_period_end))}">×</button>
              </td>
            </tr>`;
          }).join('')}</tbody>
        </table>`;
      listEl.querySelectorAll('[data-pay]').forEach(btn => btn.addEventListener('click', (e) => openMarkPaid(e.currentTarget.getAttribute('data-pay'), load)));
      listEl.querySelectorAll('[data-view]').forEach(btn => btn.addEventListener('click', (e) => openBillDetail(e.currentTarget.getAttribute('data-view'), load)));
      listEl.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', (e) => {
        const bid  = e.currentTarget.getAttribute('data-del');
        const name = e.currentTarget.getAttribute('data-name');
        deleteEntityWithProbe({
          rpcName: 'housing_delete_bill', id: bid,
          labelAr: name, labelEn: name,
          countRowsBuilder: (c) => {
            const rr = [];
            if (c.attachments > 0) rr.push([LANG==='ar'?'المرفقات':'Attachments', c.attachments]);
            return rr;
          },
          onDone: () => load(),
        });
      }));

      // Pagination controls
      const pgEl = el.querySelector('#pager');
      const pageCount = Math.max(1, Math.ceil(total / PAGE_SIZE));
      const currentPage = Math.floor(currentOffset / PAGE_SIZE) + 1;
      if (total > PAGE_SIZE) {
        const fromN = currentOffset + 1;
        const toN   = Math.min(currentOffset + items.length, total);
        pgEl.innerHTML = `
          <button class="btn btn-sm" id="pgPrev" ${currentOffset<=0?'disabled':''}>‹ ${LANG==='ar'?'السابق':'Prev'}</button>
          <span class="text-muted" style="font-size:13px;">${LANG==='ar'?'صفحة':'Page'} ${currentPage} / ${pageCount} &nbsp;·&nbsp; ${fromN}–${toN} ${LANG==='ar'?'من':'of'} ${total}</span>
          <button class="btn btn-sm" id="pgNext" ${currentOffset+PAGE_SIZE>=total?'disabled':''}>${LANG==='ar'?'التالي':'Next'} ›</button>`;
        el.querySelector('#pgPrev').addEventListener('click', () => { if (currentOffset > 0) { currentOffset = Math.max(0, currentOffset - PAGE_SIZE); load(); } });
        el.querySelector('#pgNext').addEventListener('click', () => { if (currentOffset + PAGE_SIZE < total) { currentOffset += PAGE_SIZE; load(); } });
      }
    } catch(e) { if(version!==loadSerial||!el.isConnected)return; el.querySelector('#list').innerHTML = `<div class="error-box">${escapeHtml(e.message)}</div>`; }
  };

  ['fStatus','fFrom','fTo'].forEach(id => el.querySelector('[id="'+id+'"]').addEventListener('input', () => { currentOffset = 0; load(); }));
  el.querySelector('#btnClear').addEventListener('click', () => {
    ['fStatus','fFrom','fTo'].forEach(id => el.querySelector('[id="'+id+'"]').value = '');
    currentOffset = 0; load();
  });
  el.querySelector('#btnAdd').addEventListener('click', () => openBillForm(null, load));

  // Bulk mark paid — uses current filters, prompts for paid_date
  el.querySelector('#btnBulkPay').addEventListener('click', async () => {
    // Probe: how many pending/overdue match the current filters
    const filters = buildFilters();
    let candCount = 0;
    try {
      // Only bills currently pending or overdue will be affected; use both queries to be accurate
      const pending  = await rpc('housing_list_bills', { ...filters, p_status: 'pending',  p_limit: 1, p_offset: 0 });
      const overdue  = await rpc('housing_list_bills', { ...filters, p_status: 'overdue',  p_limit: 1, p_offset: 0 });
      // If filters already restrict status, use the total from that
      if (filters.p_status === 'pending')     candCount = pending.total_count || 0;
      else if (filters.p_status === 'overdue') candCount = overdue.total_count || 0;
      else                                     candCount = (pending.total_count || 0) + (overdue.total_count || 0);
    } catch(e) { toast(e.message,'error'); return; }

    if (candCount === 0) {
      toast(LANG==='ar' ? 'لا توجد فواتير مستحقة تطابق الفلاتر الحالية' : 'No pending/overdue bills match the current filters', 'error');
      return;
    }

    const body = document.createElement('div');
    body.innerHTML = `
      <div style="font-size:14px; color:var(--text); margin-bottom:12px;">
        ${LANG==='ar' ? `سيتم وضع علامة "مدفوعة" على <strong>${candCount}</strong> فاتورة (المستحقة و/أو المتأخرة) المطابقة للفلاتر الحالية.` : `Will mark <strong>${candCount}</strong> pending/overdue bill(s) matching current filters as paid.`}
      </div>
      <div class="field mb-2"><label>${LANG==='ar'?'تاريخ الدفع':'Paid Date'} <span class="req">*</span></label>
        <input id="bmpDate" type="date" value="${localDateISO()}">
      </div>
      <div style="font-size:12px; color:var(--muted);">${LANG==='ar' ? 'الفواتير المدفوعة أو الملغاة أو المتنازع عليها لن تتأثر. لا يمكن التراجع.' : 'Already-paid, cancelled or disputed bills are not affected. This cannot be undone.'}</div>`;
    const foot = document.createElement('div'); foot.className='flex'; foot.style.gap='8px'; foot.style.justifyContent='flex-end'; foot.style.flex='1';
    const cx = document.createElement('button'); cx.className='btn'; cx.textContent = t('cancel');
    const ok = document.createElement('button'); ok.className='btn btn-primary'; ok.textContent = LANG==='ar' ? 'علّم الكل' : 'Mark all';
    foot.appendChild(cx); foot.appendChild(ok);
    const pm = openModal({ title: LANG==='ar'?'دفع جماعي':'Bulk Mark Paid', body, footer: foot });
    cx.addEventListener('click', pm.dismiss);
    ok.addEventListener('click', async () => {
      const paidDate = el.querySelector('#bmpDate').value;
      if (!paidDate) { toast(LANG==='ar'?'اختر تاريخ الدفع':'Pick a paid date','error'); return; }
      ok.disabled = true;
      try {
        const res = await rpc('housing_bulk_mark_bills_paid', { p_paid_date: paidDate, ...filters });
        toast((LANG==='ar' ? 'تم تعليم ' : 'Marked ') + (res.updated || 0) + (LANG==='ar' ? ' فاتورة كمدفوعة' : ' bill(s) as paid'), 'success');
        pm.close();
        currentOffset = 0;
        load();
      } catch(e) { toast(e.message,'error'); ok.disabled = false; }
    });
  });

  const refresh=document.createElement('button');refresh.className='btn';refresh.textContent=AdvaconUI.text('تحديث','Refresh');refresh.onclick=()=>AdvaconUI.busy(refresh,()=>load());
  el.querySelector('.filters')?.append(refresh);
  AdvaconUI.enhance(el);
  await load();
}

async function openBillForm(existing, onSaved) {
  if(!can(existing?'bills.edit':'bills.create')){toast('not_authorized','error');return;}
  const meters = await rpc('housing_list_meters', { p_active_only: true });
  const meterOpts = (meters.items||[]).map(m => ({ value: m.id, label: `${m.code} — ${pickName(m.meter_type)} ${m.meter_number||''}` }));
  const schema = { __cols: 2, fields: [
    { name: 'p_meter_id', label: LANG==='ar'?'العدّاد':'Meter', type: 'select', options: meterOpts, required: true, spanAll: true },
    { name: 'p_bill_period_start', label: LANG==='ar'?'بداية الفترة':'Period Start', type: 'date', required: true },
    { name: 'p_bill_period_end', label: LANG==='ar'?'نهاية الفترة':'Period End', type: 'date', required: true },
    { name: 'p_issue_date', label: LANG==='ar'?'تاريخ الإصدار':'Issue Date', type: 'date' },
    { name: 'p_due_date', label: t('dueDate'), type: 'date' },
    { name: 'p_amount', label: t('amount'), type: 'number', step: '0.01', min: 0, required: true },
    { name: 'p_consumption', label: LANG==='ar'?'الاستهلاك':'Consumption', type: 'number', step: '0.001', min: 0 },
    { name: 'p_payment_reference', label: LANG==='ar'?'مرجع الدفع':'Payment Ref' },
    { name: 'p_status', label: t('status'), type: 'select', options: [
      {value:'pending', label: t('pending')}, {value:'paid', label: t('paid')},
      {value:'overdue', label: t('overdue')}, {value:'disputed', label: t('disputed')}
    ]},
    { name: 'p_paid_date', label: LANG==='ar'?'تاريخ الدفع':'Paid Date', type: 'date', hint: LANG==='ar'?'مطلوب فقط إذا كانت الحالة "مدفوع"':'Only if status = paid' },
    { name: 'p_notes', label: t('notes'), type: 'textarea', spanAll: true },
  ]};
  const initial = existing ? {
    p_meter_id:          existing.meter_id || existing.meter?.id,
    p_bill_period_start: existing.bill_period_start,
    p_bill_period_end:   existing.bill_period_end,
    p_issue_date:        existing.issue_date,
    p_due_date:          existing.due_date,
    p_amount:            existing.amount,
    p_consumption:       existing.consumption,
    p_payment_reference: existing.payment_reference,
    p_status:            existing.status,
    p_paid_date:         existing.paid_date,
    p_notes:             existing.notes,
  } : { p_status: 'pending' };
  const formEl = buildForm(schema, initial);
  const footer = document.createElement('div'); footer.className='flex'; footer.style.gap='8px'; footer.style.justifyContent='flex-end'; footer.style.flex='1';
  const cancel = document.createElement('button'); cancel.className='btn'; cancel.textContent = t('cancel');
  const save = document.createElement('button'); save.className='btn btn-primary'; save.textContent = AdvaconUI.requestLabel(permissionMode('bills.'+(existing?'edit':'create')),t('save'));
  footer.appendChild(cancel); footer.appendChild(save);
  const m = openModal({ title: existing ? t('edit') : t('add') + ' ' + t('bills'), body: formEl, footer, wide: true });
  cancel.addEventListener('click', m.dismiss);
  save.addEventListener('click', async () => {
    save.disabled = true;
    try {
      const vals = readForm(formEl);
      for (const req of ['p_meter_id','p_bill_period_start','p_bill_period_end','p_amount']) {
        if (vals[req] == null || vals[req] === '') { toast(t('requiredField')+': '+req,'error'); save.disabled=false; return; }
      }
      // Date sanity: end after start
      if (new Date(vals.p_bill_period_end) <= new Date(vals.p_bill_period_start)) {
        toast(LANG==='ar' ? 'نهاية الفترة لازم تكون بعد بدايتها' : 'Period end must be after start', 'error');
        save.disabled=false; return;
      }
      // Paid must have a paid_date (never auto-fill)
      if (vals.p_status === 'paid' && !vals.p_paid_date) {
        toast(LANG==='ar' ? 'اختر تاريخ الدفع (لا يتم افتراضه تلقائياً)' : 'Pick the paid date (not auto-set)', 'error');
        save.disabled=false; return;
      }
      const fn = existing ? 'housing_update_bill' : 'housing_create_bill';
      if (existing) {
        vals.p_id = existing.id;
        // Meter can't be changed after creation — strip it from update
        delete vals.p_meter_id;
      }
      await rpc(fn, vals);
      toast(t('savedSuccessfully'),'success'); m.close(); if (onSaved) onSaved();
    } catch(e){ toast(e.message,'error'); save.disabled=false; }
  });
}

async function openAmendBillForm(orig, onSaved) {
  const schema = { __cols: 1, fields: [
    { name: 'p_new_amount', label: LANG==='ar'?'المبلغ المعدّل':'New Amount', type: 'number', step: '0.01', min: 0, required: true },
    { name: 'p_issue_date', label: LANG==='ar'?'تاريخ الإصدار':'Issue Date', type: 'date' },
    { name: 'p_due_date', label: t('dueDate'), type: 'date' },
    { name: 'p_consumption', label: LANG==='ar'?'الاستهلاك':'Consumption', type: 'number', step: '0.001', min: 0 },
    { name: 'p_notes', label: t('notes'), type: 'textarea' },
  ]};
  const formEl = buildForm(schema, { p_new_amount: orig.amount, p_consumption: orig.consumption });
  const footer = document.createElement('div'); footer.className='flex'; footer.style.gap='8px'; footer.style.justifyContent='flex-end'; footer.style.flex='1';
  const cancel = document.createElement('button'); cancel.className='btn'; cancel.textContent = t('cancel');
  const save = document.createElement('button'); save.className='btn btn-primary'; save.textContent = LANG==='ar'?'إنشاء تعديل':'Create Amendment';
  footer.appendChild(cancel); footer.appendChild(save);
  const m = openModal({ title: LANG==='ar'?'تعديل فاتورة':'Amend Bill', body: formEl, footer });
  cancel.addEventListener('click', m.dismiss);
  save.addEventListener('click', async () => {
    save.disabled = true;
    try {
      const vals = readForm(formEl);
      if (vals.p_new_amount == null) { toast(t('requiredField'),'error'); save.disabled=false; return; }
      await rpc('housing_amend_bill', { ...vals, p_original_bill_id: orig.id });
      toast(t('savedSuccessfully'),'success'); m.close(); if (onSaved) onSaved();
    } catch(e){ toast(e.message,'error'); save.disabled=false; }
  });
}

/* =====================================================================
   SCREEN: RESIDENTS LIST
   ===================================================================== */
async function screenResidents(el) {
  const types = await getRefOptions('resident_types');
  el.innerHTML = `
    <div class="page-header">
      <h1>${t('residents')}</h1>
      <span class="spacer"></span>
      <button class="btn btn-primary" id="btnAdd" ${housingActionAttrs('residents.create')}>+ ${t('add')}</button>
    </div>
    <div class="filters">
      <div class="field"><label>${t('search')}</label><input id="fSearch" placeholder="${t('search')}..."></div>
      <div class="field"><label>${t('type')}</label><select id="fType"><option value="">${t('all')}</option>${types.map(x=>`<option value="${escapeHtml(x.value)}">${escapeHtml(x.label)}</option>`).join('')}</select></div>
      <div class="field"><label>${t('isActive')}</label><select id="fActive"><option value="">${t('all')}</option><option value="true">${t('active')}</option><option value="false">${t('inactive')}</option></select></div>
      <span class="spacer"></span>
      <button class="btn btn-ghost" id="btnClear">↺</button>
    </div>
    <div id="list" class="table-wrap"><div class="loading">${t('loading')}</div></div>`;
  AdvaconExperience.rememberFilters(el,location.pathname+location.hash);
  let loadSerial=0, searchCache=null;
  const load = async (localSearch=false) => {
    const version=++loadSerial;
    localSearch=localSearch===true;
    el.querySelector('#list').innerHTML = `<div class="loading">${t('loading')}</div>`;
    try {
      const args = {};
      const activeVal = el.querySelector('#fActive').value;
      if (activeVal === 'true') args.p_active_only = true;
      if (el.querySelector('#fType').value) args.p_type_key = el.querySelector('#fType').value;
      const requestArgs=args, signature=JSON.stringify(requestArgs);
      const res=localSearch&&searchCache?.signature===signature?searchCache.data:await rpc('housing_list_residents',requestArgs);
      if(version!==loadSerial||!el.isConnected)return;
      searchCache={signature,data:res,time:localSearch&&searchCache?.signature===signature?searchCache.time:Date.now()};
      AdvaconExperience.dataStatus(el,searchCache.time);
      let items = res.items || [];
      if (activeVal === 'false') items = items.filter(r => !r.is_active);
      const q = el.querySelector('#fSearch').value.trim().toLowerCase();
      if (q) items = items.filter(r => (r.code||'').toLowerCase().includes(q) || (r.name_ar||'').toLowerCase().includes(q) || (r.name_en||'').toLowerCase().includes(q) || (r.id_number||'').toLowerCase().includes(q) || (r.phone||'').toLowerCase().includes(q));
      const listEl = el.querySelector('#list');
      if (!items.length) { listEl.innerHTML = `<div class="empty" style="padding:40px; text-align:center; color:var(--muted);">${t('noItems')}</div>`; return; }
      listEl.innerHTML = `
        <table class="data">
          <thead><tr>
            <th>${t('code')}</th><th>${t('name')}</th><th>${t('type')}</th>
            <th>${LANG==='ar'?'رقم الهوية':'ID'}</th><th>${LANG==='ar'?'هاتف':'Phone'}</th>
            <th>${LANG==='ar'?'الجنسية':'Nationality'}</th><th>${t('isActive')}</th><th></th>
          </tr></thead>
          <tbody>${items.map(r=>`
            <tr>
              <td class="code-cell">${escapeHtml(r.code)}</td>
              <td>${escapeHtml(LANG==='ar'?r.name_ar:(r.name_en||r.name_ar))}</td>
              <td>${escapeHtml(pickName(r.resident_type))}</td>
              <td>${escapeHtml(r.id_number||'—')}</td>
              <td>${escapeHtml(r.phone||'—')}</td>
              <td>${escapeHtml(r.nationality||'—')}</td>
              <td>${fmtIsActive(r.is_active)}</td>
              <td class="row-actions">
                <button class="btn btn-sm" ${housingActionAttrs('residents.edit')} data-edit="${r.id}">${t('edit')}</button>
                <button class="btn btn-sm" style="color:var(--red);" ${housingActionAttrs('residents.delete')} data-del="${r.id}" data-name="${escapeHtml(r.code + ' — ' + r.name_ar)}">×</button>
              </td>
            </tr>`).join('')}</tbody>
        </table>`;
      listEl.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', async (e) => {
        const rid = e.currentTarget.getAttribute('data-edit');
        const rr = await rpc('housing_get_resident', { p_id: rid });
        openResidentForm(rr.resident, load);
      }));
      listEl.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', (e) => {
        const rid  = e.currentTarget.getAttribute('data-del');
        const name = e.currentTarget.getAttribute('data-name');
        deleteEntityWithProbe({
          rpcName: 'housing_delete_resident', id: rid,
          labelAr: name, labelEn: name,
          countRowsBuilder: (c) => {
            const rr = [];
            if (c.assignments > 0) rr.push([LANG==='ar'?'التخصيصات (السكان في العقارات)':'Assignments', c.assignments]);
            if (c.attachments > 0) rr.push([LANG==='ar'?'المرفقات':'Attachments',                       c.attachments]);
            return rr;
          },
          onDone: () => load(),
        });
      }));
    } catch(e) { if(version!==loadSerial||!el.isConnected)return; el.querySelector('#list').innerHTML = `<div class="error-box">${escapeHtml(e.message)}</div>`; }
  };
  el.querySelector('#fSearch').addEventListener('input', debounce(()=>load(true), 200));
  ['fType','fActive'].forEach(id => el.querySelector('[id="'+id+'"]').addEventListener('input', load));
  el.querySelector('#btnClear').addEventListener('click', () => {
    ['fSearch','fType','fActive'].forEach(id => el.querySelector('[id="'+id+'"]').value = '');
    load();
  });
  el.querySelector('#btnAdd').addEventListener('click', () => openResidentForm(null, load));
  const refresh=document.createElement('button');refresh.className='btn';refresh.textContent=AdvaconUI.text('تحديث','Refresh');refresh.onclick=()=>AdvaconUI.busy(refresh,()=>load());
  el.querySelector('.filters')?.append(refresh);
  AdvaconUI.enhance(el);
  await load();
}

async function openResidentForm(existing, onSaved) {
  if(!can(existing?'residents.edit':'residents.create')){toast('not_authorized','error');return;}
  const types = await getRefOptions('resident_types');
  const schema = { __cols: 2, fields: [
    { name: 'p_resident_type_key', label: t('type'), type: 'select', options: types, required: true },
    { name: 'p_name_ar', label: LANG==='ar'?'الاسم بالعربي':'Arabic Name', required: true },
    { name: 'p_name_en', label: LANG==='ar'?'الاسم بالإنجليزي':'English Name' },
    { name: 'p_id_number', label: LANG==='ar'?'رقم الهوية':'ID Number' },
    { name: 'p_phone', label: LANG==='ar'?'هاتف':'Phone' },
    { name: 'p_email', label: 'Email', type: 'email' },
    { name: 'p_nationality', label: LANG==='ar'?'الجنسية':'Nationality' },
    { name: 'p_date_of_birth', label: LANG==='ar'?'تاريخ الميلاد':'Date of Birth', type: 'date' },
    { name: 'p_notes', label: t('notes'), type: 'textarea', spanAll: true },
  ]};
  const initial = existing ? {
    p_resident_type_key: existing.resident_type?.key,
    p_name_ar: existing.name_ar, p_name_en: existing.name_en,
    p_id_number: existing.id_number, p_phone: existing.phone, p_email: existing.email,
    p_nationality: existing.nationality, p_date_of_birth: existing.date_of_birth, p_notes: existing.notes,
  } : {};
  const formEl = buildForm(schema, initial);
  const footer = document.createElement('div'); footer.className='flex'; footer.style.gap='8px'; footer.style.justifyContent='flex-end'; footer.style.flex='1';
  const cancel = document.createElement('button'); cancel.className='btn'; cancel.textContent = t('cancel');
  const save = document.createElement('button'); save.className='btn btn-primary'; save.textContent = AdvaconUI.requestLabel(permissionMode('residents.'+(existing?'edit':'create')),t('save'));
  footer.appendChild(cancel); footer.appendChild(save);
  const m = openModal({ title: existing ? t('edit') : t('add') + ' ' + t('residents'), body: formEl, footer, wide: true });
  cancel.addEventListener('click', m.dismiss);
  save.addEventListener('click', async () => {
    save.disabled = true;
    try {
      const vals = readForm(formEl);
      for (const req of ['p_resident_type_key','p_name_ar']) {
        if (!vals[req]) { toast(t('requiredField')+': '+req,'error'); save.disabled=false; return; }
      }
      const fn = existing ? 'housing_update_resident' : 'housing_create_resident';
      if (existing) vals.p_id = existing.id;
      await rpc(fn, vals);
      toast(t('savedSuccessfully'),'success'); m.close(); if (onSaved) onSaved();
    } catch(e){ toast(e.message,'error'); save.disabled=false; }
  });
}

async function screenExpenses(el) {
  const [cats, freqs] = await Promise.all([
    getRefOptions('expense_categories'), getRefOptions('expense_frequencies')
  ]);
  const PAGE_SIZE = 100;
  const pageKey=location.pathname+location.hash;
  let currentOffset = AdvaconExperience.page(pageKey);
  el.innerHTML = `
    <div class="page-header">
      <h1>${t('expenses')}</h1>
    </div>
    <div class="filters">
      <div class="field"><label>${LANG==='ar'?'الكيان':'Entity'}</label><select id="fEntity"><option value="">${t('all')}</option><option value="property">${t('property')}</option><option value="contract">${LANG==='ar'?'عقد':'Contract'}</option><option value="resident">${t('resident')}</option></select></div>
      <div class="field"><label>${t('category')}</label><select id="fCat"><option value="">${t('all')}</option>${cats.map(c=>`<option value="${escapeHtml(c.value)}">${escapeHtml(c.label)}</option>`).join('')}</select></div>
      <div class="field"><label>${LANG==='ar'?'الدورية':'Frequency'}</label><select id="fFreq"><option value="">${t('all')}</option>${freqs.map(f=>`<option value="${escapeHtml(f.value)}">${escapeHtml(f.label)}</option>`).join('')}</select></div>
      <div class="field"><label>${LANG==='ar'?'من':'From'}</label><input id="fFrom" type="date"></div>
      <div class="field"><label>${LANG==='ar'?'إلى':'To'}</label><input id="fTo" type="date"></div>
      <span class="spacer"></span>
      <button class="btn btn-ghost" id="btnClear">↺</button>
    </div>
    <div id="summary" class="mb-3"></div>
    <div id="list" class="table-wrap"><div class="loading">${t('loading')}</div></div>
    <div id="pager" class="flex mb-3" style="justify-content:center; gap:12px; align-items:center; margin-top:12px;"></div>`;
  AdvaconExperience.rememberFilters(el,location.pathname+location.hash);
  let loadSerial=0, searchCache=null;
  const load = async (localSearch=false) => {
    const version=++loadSerial;
    localSearch=localSearch===true;
    el.querySelector('#list').innerHTML = `<div class="loading">${t('loading')}</div>`;
    el.querySelector('#pager').innerHTML = '';
    try {
      const args = { p_limit: PAGE_SIZE, p_offset: AdvaconExperience.page(pageKey,currentOffset) };
      if (el.querySelector('#fEntity').value) args.p_entity_type = el.querySelector('#fEntity').value;
      if (el.querySelector('#fCat').value) args.p_category_key = el.querySelector('#fCat').value;
      if (el.querySelector('#fFreq').value) args.p_frequency_key = el.querySelector('#fFreq').value;
      if (el.querySelector('#fFrom').value) args.p_from_date = el.querySelector('#fFrom').value;
      if (el.querySelector('#fTo').value) args.p_to_date = el.querySelector('#fTo').value;
      const requestArgs=args, signature=JSON.stringify(requestArgs);
      const res=localSearch&&searchCache?.signature===signature?searchCache.data:await rpc('housing_list_expenses',requestArgs);
      if(version!==loadSerial||!el.isConnected)return;
      searchCache={signature,data:res,time:localSearch&&searchCache?.signature===signature?searchCache.time:Date.now()};
      AdvaconExperience.dataStatus(el,searchCache.time);
      const items = res.items || [];
      const total = res.total_count || 0;
      el.querySelector('#summary').innerHTML = `
        <div class="stat-grid">
          <div class="stat"><div class="stat-label">${t('count')}</div><div class="stat-value">${fmtNum(total,{decimals:0})}</div></div>
          <div class="stat"><div class="stat-label">${t('total')}</div><div class="stat-value">${fmtSAR(res.total_amount||0)}</div></div>
        </div>`;
      const listEl = el.querySelector('#list');
      if (!items.length) { listEl.innerHTML = `<div class="empty" style="padding:40px; text-align:center; color:var(--muted);">${t('noItems')}</div>`; return; }
      listEl.innerHTML = `
        <table class="data">
          <thead><tr>
            <th>${LANG==='ar'?'الوصف':'Description'}</th><th>${LANG==='ar'?'الكيان':'Entity'}</th>
            <th>${t('category')}</th><th>${LANG==='ar'?'الدورية':'Frequency'}</th>
            <th>${t('amount')}</th><th>${t('startDate')}</th><th>${LANG==='ar'?'التالي':'Next'}</th><th>${t('isActive')}</th><th></th>
          </tr></thead>
          <tbody>${items.map(e=>`
            <tr>
              <td>${escapeHtml(e.description)}</td>
              <td><span class="badge badge-gray">${escapeHtml(e.entity_type)}</span></td>
              <td>${escapeHtml(pickName(e.category))}</td>
              <td>${escapeHtml(pickName(e.frequency))}</td>
              <td class="num-cell">${fmtSAR(e.amount)}</td>
              <td>${fmtDate(e.start_date)}</td>
              <td>${fmtDate(e.next_due_date)}</td>
              <td>${fmtIsActive(e.is_active)}</td>
              <td class="row-actions">
                <button class="btn btn-sm" ${housingActionAttrs('expenses.edit')} data-edit="${e.id}">${t('edit')}</button>
                <button class="btn btn-sm" style="color:var(--red);" ${housingActionAttrs('expenses.delete')} data-del="${e.id}" data-name="${escapeHtml(e.description)}">×</button>
              </td>
            </tr>`).join('')}</tbody>
        </table>`;
      listEl.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', async (ev) => {
        const eid = ev.currentTarget.getAttribute('data-edit');
        const er  = await rpc('housing_get_expense', { p_id: eid });
        openExpenseForm(er.expense, er.expense.entity_type, er.expense.entity_id, load);
      }));
      listEl.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', (ev) => {
        const eid  = ev.currentTarget.getAttribute('data-del');
        const name = ev.currentTarget.getAttribute('data-name');
        deleteEntityWithProbe({
          rpcName: 'housing_delete_expense', id: eid,
          labelAr: name, labelEn: name,
          countRowsBuilder: (c) => {
            const rr = [];
            if (c.attachments > 0) rr.push([LANG==='ar'?'المرفقات':'Attachments', c.attachments]);
            return rr;
          },
          onDone: () => load(),
        });
      }));

      // Pagination
      const pgEl = el.querySelector('#pager');
      const pageCount = Math.max(1, Math.ceil(total / PAGE_SIZE));
      const currentPage = Math.floor(currentOffset / PAGE_SIZE) + 1;
      if (total > PAGE_SIZE) {
        const fromN = currentOffset + 1;
        const toN   = Math.min(currentOffset + items.length, total);
        pgEl.innerHTML = `
          <button class="btn btn-sm" id="pgPrev" ${currentOffset<=0?'disabled':''}>‹ ${LANG==='ar'?'السابق':'Prev'}</button>
          <span class="text-muted" style="font-size:13px;">${LANG==='ar'?'صفحة':'Page'} ${currentPage} / ${pageCount} &nbsp;·&nbsp; ${fromN}–${toN} ${LANG==='ar'?'من':'of'} ${total}</span>
          <button class="btn btn-sm" id="pgNext" ${currentOffset+PAGE_SIZE>=total?'disabled':''}>${LANG==='ar'?'التالي':'Next'} ›</button>`;
        el.querySelector('#pgPrev').addEventListener('click', () => { if (currentOffset > 0) { currentOffset = Math.max(0, currentOffset - PAGE_SIZE); load(); } });
        el.querySelector('#pgNext').addEventListener('click', () => { if (currentOffset + PAGE_SIZE < total) { currentOffset += PAGE_SIZE; load(); } });
      }
    } catch(e) { if(version!==loadSerial||!el.isConnected)return; el.querySelector('#list').innerHTML = `<div class="error-box">${escapeHtml(e.message)}</div>`; }
  };
  ['fEntity','fCat','fFreq','fFrom','fTo'].forEach(id => el.querySelector('[id="'+id+'"]').addEventListener('input', () => { currentOffset = 0; load(); }));
  el.querySelector('#btnClear').addEventListener('click', () => {
    ['fEntity','fCat','fFreq','fFrom','fTo'].forEach(id => el.querySelector('[id="'+id+'"]').value = '');
    currentOffset = 0; load();
  });
  const refresh=document.createElement('button');refresh.className='btn';refresh.textContent=AdvaconUI.text('تحديث','Refresh');refresh.onclick=()=>AdvaconUI.busy(refresh,()=>load());
  el.querySelector('.filters')?.append(refresh);
  AdvaconUI.enhance(el);
  await load();
}

async function openReport(kind) {
  const body = document.getElementById('reportBody');
  if (kind === 'financial_monthly') {
    const now = new Date();
    body.innerHTML = `
      <div class="card">
        <div class="filters" style="margin:0 0 12px;">
          <div class="field"><label>${LANG==='ar'?'السنة':'Year'}</label><input type="number" id="rYear" value="${now.getFullYear()}" min="2020" max="2100"></div>
          <div class="field"><label>${LANG==='ar'?'الشهر':'Month'}</label><input type="number" id="rMonth" value="${now.getMonth()+1}" min="1" max="12"></div>
          <span class="spacer"></span>
          <button class="btn btn-primary" id="btnRun">${LANG==='ar'?'تشغيل':'Run'}</button>
        </div>
        <div id="rOut"></div>
      </div>`;
    const run = async () => {
      document.getElementById('rOut').innerHTML = `<div class="loading">${t('loading')}</div>`;
      try {
        const res = await rpc('housing_report_financial_monthly', { p_year: Number(document.getElementById('rYear').value), p_month: Number(document.getElementById('rMonth').value) });
        document.getElementById('rOut').innerHTML = `
          <div class="stat-grid">
            <div class="stat"><div class="stat-label">${LANG==='ar'?'إيجار مستحق':'Rent Accrued'}</div><div class="stat-value">${fmtSAR(res.rent_accrued)}</div></div>
            <div class="stat"><div class="stat-label">${LANG==='ar'?'فواتير مرافق':'Utility Bills'}</div><div class="stat-value">${fmtSAR(res.utility_bills_total)}</div></div>
            <div class="stat"><div class="stat-label">${LANG==='ar'?'مصاريف مباشرة':'One-Time Expenses'}</div><div class="stat-value">${fmtSAR(res.expenses_incurred)}</div></div>
            <div class="stat"><div class="stat-label">${LANG==='ar'?'مصاريف دورية معدّلة':'Recurring Exp. (Norm)'}</div><div class="stat-value">${fmtSAR(res.expenses_recurring_normalized)}</div></div>
          </div>`;
      } catch(e){ document.getElementById('rOut').innerHTML = `<div class="error-box">${escapeHtml(e.message)}</div>`; }
    };
    document.getElementById('btnRun').addEventListener('click', run);
    await run();
  }
  else if (kind === 'financial_yearly') {
    const now = new Date();
    body.innerHTML = `
      <div class="card">
        <div class="filters" style="margin:0 0 12px;">
          <div class="field"><label>${LANG==='ar'?'السنة':'Year'}</label><input type="number" id="rYear" value="${now.getFullYear()}" min="2020" max="2100"></div>
          <span class="spacer"></span>
          <button class="btn btn-primary" id="btnRun">${LANG==='ar'?'تشغيل':'Run'}</button>
        </div>
        <div id="rOut"></div>
      </div>`;
    const run = async () => {
      document.getElementById('rOut').innerHTML = `<div class="loading">${t('loading')}</div>`;
      try {
        const res = await rpc('housing_report_financial_yearly', { p_year: Number(document.getElementById('rYear').value) });
        const yt = res.year_totals || {};
        document.getElementById('rOut').innerHTML = `
          <div class="mb-3"><h4>${LANG==='ar'?'إجماليات السنة':'Year Totals'}</h4>
            <div class="stat-grid">

async function screenSettings(el) {
  const tabs = ['alerts', 'refs', 'templates'];
  const active = location.hash.split('?tab=')[1] || 'alerts';
  el.innerHTML = `
    <div class="page-header"><h1>${t('settings')}</h1></div>
    <div class="tabs">
      <a class="tab ${active==='alerts'?'active':''}" href="#settings?tab=alerts">${LANG==='ar'?'التنبيهات':'Alerts'}</a>
      <a class="tab ${active==='refs'?'active':''}" href="#settings?tab=refs">${LANG==='ar'?'القوائم المرجعية':'Reference Lists'}</a>
      <a class="tab ${active==='templates'?'active':''}" href="#settings?tab=templates">${LANG==='ar'?'القوالب':'Templates'}</a>
    </div>
    <div id="setBody"><div class="loading">${t('loading')}</div></div>`;
  const body = el.querySelector('#setBody');
  if (active === 'alerts') await renderAlertSettings(body);
  else if (active === 'refs') await renderRefsSettings(body);
  else if (active === 'templates') await renderTemplatesSettings(body);
}

async function renderAlertSettings(container) {
  const res = await rpc('housing_get_settings', { p_prefix: 'alert.' });
  const items = res.items || [];
  container.innerHTML = `
    <div class="card">
      <table class="data">
        <thead><tr><th>${LANG==='ar'?'المفتاح':'Key'}</th><th>${LANG==='ar'?'القيمة':'Value'}</th><th>${LANG==='ar'?'الوصف':'Description'}</th><th></th></tr></thead>
        <tbody>${items.map(s=>`<tr>
          <td class="code-cell">${escapeHtml(s.key)}</td>
          <td><input data-set-key="${escapeHtml(s.key)}" value="${escapeHtml(JSON.stringify(s.value))}" style="width:100%;"></td>
          <td class="text-muted">${escapeHtml(s.description||'—')}</td>
          <td><button class="btn btn-sm btn-primary" data-save-key="${escapeHtml(s.key)}">${t('save')}</button></td>
        </tr>`).join('')}</tbody>
      </table>
    </div>`;
  container.querySelectorAll('[data-save-key]').forEach(b => b.addEventListener('click', async (e) => {
    const key = e.currentTarget.getAttribute('data-save-key');
    const inp = container.querySelector(`[data-set-key="${key}"]`);
    try {
      const parsed = JSON.parse(inp.value);
      await rpc('housing_update_setting', { p_key: key, p_value: parsed });
      toast(t('savedSuccessfully'),'success');
    } catch(err){ toast(err.message,'error'); }
  }));
}

async function renderRefsSettings(container) {
  const res = await rpc('housing_list_refs');
  const lists = res.lists || {};
  const keys = Object.keys(lists).sort();
  container.innerHTML = `
    <div class="card">
      <div class="mb-3"><label>${LANG==='ar'?'اختر قائمة':'Select List'}: </label>
        <select id="listPick">${keys.map(k => `<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`).join('')}</select>
      </div>
      <div id="refBody"></div>
    </div>`;
  const pick = document.getElementById('listPick');
  const renderList = async () => {
    const key = pick.value;
    const r = await rpc('housing_list_refs', { p_list_key: key });
    const items = r?.list?.items || [];
    document.getElementById('refBody').innerHTML = `
      <div class="flex mb-2"><h4 class="mb-0">${escapeHtml(pickName(r.list))}</h4><span class="spacer"></span><button class="btn btn-primary btn-sm" id="btnAddItem">+ ${t('add')}</button></div>
      <table class="data">
        <thead><tr><th>${LANG==='ar'?'المفتاح':'Key'}</th><th>${LANG==='ar'?'عربي':'Arabic'}</th><th>${LANG==='ar'?'إنجليزي':'English'}</th><th>${LANG==='ar'?'ترتيب':'Order'}</th><th>${t('isActive')}</th><th></th></tr></thead>
        <tbody>${items.map(i=>`<tr>
          <td class="code-cell">${escapeHtml(i.key)}${i.is_system?' <span class="badge badge-gray">sys</span>':''}</td>
          <td>${escapeHtml(i.name_ar)}</td>
          <td>${escapeHtml(i.name_en)}</td>
          <td class="num-cell">${fmtNum(i.sort_order,{decimals:0})}</td>
          <td>${fmtIsActive(i.is_active)}</td>
          <td class="row-actions">
            <button class="btn btn-sm" data-ref-edit="${escapeHtml(JSON.stringify(i))}">${t('edit')}</button>
            ${!i.is_system?`<button class="btn btn-sm" style="color:var(--red);" data-ref-del="${i.id}">×</button>`:''}
          </td>
        </tr>`).join('')}</tbody>
      </table>`;
    document.getElementById('btnAddItem').addEventListener('click', () => openRefItemForm(key, null, renderList));
    document.querySelectorAll('[data-ref-edit]').forEach(b => b.addEventListener('click', (e) => {
      const item = JSON.parse(e.currentTarget.getAttribute('data-ref-edit'));
      openRefItemForm(key, item, renderList);
    }));
    document.querySelectorAll('[data-ref-del]').forEach(b => b.addEventListener('click', async (e) => {
      if (!await confirmAction({ title: t('delete'), message: t('confirmDelete'), danger: true })) return;
      try { await rpc('housing_delete_ref_item', { p_id: e.currentTarget.getAttribute('data-ref-del') }); clearRefCache(); toast(t('deletedSuccessfully'),'success'); renderList(); }
      catch(err){ toast(err.message,'error'); }
    }));
  };
  pick.addEventListener('change', renderList);
  await renderList();
}

async function openRefItemForm(listKey, existing, onSaved) {
  const schema = { __cols: 2, fields: [
    { name: 'p_key', label: LANG==='ar'?'المفتاح':'Key', required: true, hint: 'a-z, 0-9, _' , readonly: !!existing },
    { name: 'p_sort_order', label: LANG==='ar'?'ترتيب':'Order', type: 'number' },
    { name: 'p_name_ar', label: LANG==='ar'?'عربي':'Arabic', required: true },
    { name: 'p_name_en', label: LANG==='ar'?'إنجليزي':'English', required: true },
  ]};
  const initial = existing ? { p_key: existing.key, p_sort_order: existing.sort_order, p_name_ar: existing.name_ar, p_name_en: existing.name_en } : {};
  const formEl = buildForm(schema, initial);
  const footer = document.createElement('div'); footer.className='flex'; footer.style.gap='8px'; footer.style.justifyContent='flex-end'; footer.style.flex='1';
  const cancel = document.createElement('button'); cancel.className='btn'; cancel.textContent = t('cancel');
  const save = document.createElement('button'); save.className='btn btn-primary'; save.textContent = t('save');
  footer.appendChild(cancel); footer.appendChild(save);
  const m = openModal({ title: existing ? t('edit') : t('add'), body: formEl, footer });
  cancel.addEventListener('click', m.dismiss);
  save.addEventListener('click', async () => {
    save.disabled = true;
    try {
      const vals = readForm(formEl);
      let fn, args;
      if (existing) { fn = 'housing_update_ref_item'; args = { p_id: existing.id, p_name_ar: vals.p_name_ar, p_name_en: vals.p_name_en, p_sort_order: vals.p_sort_order }; }
      else { fn = 'housing_create_ref_item'; args = { p_list_key: listKey, p_key: vals.p_key, p_name_ar: vals.p_name_ar, p_name_en: vals.p_name_en, p_sort_order: vals.p_sort_order }; }
      await rpc(fn, args);
      clearRefCache();
      toast(t('savedSuccessfully'),'success'); m.close(); if (onSaved) onSaved();
    } catch(e){ toast(e.message,'error'); save.disabled=false; }
  });
}

async function openTemplateForm(existing, onSaved) {
  const schema = { __cols: 2, fields: [
    { name: 'p_entity_type', label: LANG==='ar'?'الكيان':'Entity Type', type: 'select', options: [
      {value:'property',label:'property'},{value:'meter',label:'meter'},{value:'bill',label:'bill'},
      {value:'resident',label:'resident'},{value:'expense',label:'expense'},{value:'contract',label:'contract'}
    ], required: true, readonly: !!existing },
    { name: 'p_name', label: t('name'), required: true },
    { name: 'p_description', label: LANG==='ar'?'الوصف':'Description', spanAll: true },
    { name: 'p_defaults_json', label: LANG==='ar'?'القيم الافتراضية (JSON)':'Defaults (JSON)', type: 'textarea', spanAll: true, hint: '{ "key": "value" }' },
  ]};
  const initial = existing ? {
    p_entity_type: existing.entity_type, p_name: existing.name, p_description: existing.description,
    p_defaults_json: JSON.stringify(existing.defaults || {}, null, 2),
  } : { p_defaults_json: '{}' };
  const formEl = buildForm(schema, initial);
  const footer = document.createElement('div'); footer.className='flex'; footer.style.gap='8px'; footer.style.justifyContent='flex-end'; footer.style.flex='1';
  const cancel = document.createElement('button'); cancel.className='btn'; cancel.textContent = t('cancel');
  const save = document.createElement('button'); save.className='btn btn-primary'; save.textContent = t('save');
  footer.appendChild(cancel); footer.appendChild(save);
  const m = openModal({ title: existing ? t('edit') : t('add') + ' ' + (LANG==='ar'?'قالب':'Template'), body: formEl, footer, wide: true });
  cancel.addEventListener('click', m.dismiss);
  save.addEventListener('click', async () => {
    save.disabled = true;
    try {
      const vals = readForm(formEl);
      if (!vals.p_entity_type || !vals.p_name) { toast(t('requiredField'),'error'); save.disabled=false; return; }
      let defaults;
      try { defaults = JSON.parse(vals.p_defaults_json || '{}'); }
      catch { toast('Invalid JSON','error'); save.disabled=false; return; }
      let fn, args;
      if (existing) { fn = 'housing_update_template'; args = { p_id: existing.id, p_name: vals.p_name, p_description: vals.p_description, p_defaults: defaults }; }

 content.innerHTML='<div class="page-head"><div><h1>'+AdvaconUI.text('صلاحيات مشرف الإسكان','Housing Manager Permissions')+'</h1><p>'+escapeHtml(manager?.email||'')+'</p></div></div><p class="text-muted">'+AdvaconUI.text('اختر وضعًا واحدًا لكل صلاحية. يُحفظ كل تغيير مباشرة.','Choose one mode per permission. Each change saves immediately.')+'</p><div class="card" id="permMatrix"></div>';
 const root=content.querySelector('#permMatrix');
 if(!manager){root.textContent=AdvaconUI.text('لا يوجد مشرف إسكان نشط.','No active Housing Manager.');return;}
 try{const res=await rawRpc('asset_admin_permission_matrix',{p_module_key:'housing',p_user_id:manager.user_id});
 AdvaconUI.permissionMatrix(root,{items:(res.items||[]).filter(x=>!['settings','permissions','approvals','activity'].includes(x.action_key.split('.')[0])),onSave:async(key,mode)=>{const r=await rawRpc('asset_admin_set_user_permission',{p_user_id:manager.user_id,p_module_key:'housing',p_action_key:key,p_mode:mode});if(r?.ok===false)throw new Error(r.error||'permission_save_failed');}});
 }catch(e){AdvaconUI.errorState(root,e,()=>screenPermissions(content));}

function fmtDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return `${localDateISO(d)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

/* =====================================================================

document.addEventListener('DOMContentLoaded', async () => {
  applyLang();
  document.getElementById('langToggleBtn').addEventListener('click', toggleLang);
  document.getElementById('auditBtn').addEventListener('click', openAuditLog);
  document.getElementById('contextExitBtn').addEventListener('click', async () => {
    if(CTX.mode==='admin'){ location.href='/admin'; return; }
    await assetSignOut(); location.href='/asset';
  });

  // Mobile drawer wiring — hamburger + backdrop + Escape + auto-close on nav click
  const sidebar  = document.getElementById('sidebar');
  const backdrop = document.getElementById('drawerBackdrop');
  const toggle   = document.getElementById('navToggle');
  const openDrawer  = () => { sidebar.classList.add('open'); backdrop.classList.add('open'); };
  const closeDrawer = () => { sidebar.classList.remove('open'); backdrop.classList.remove('open'); };
  toggle.addEventListener('click', () => {
    if (sidebar.classList.contains('open')) closeDrawer(); else openDrawer();
  });
  backdrop.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && sidebar.classList.contains('open')) closeDrawer();
  });
  // Any nav-item click (delegated) also closes the drawer
  document.getElementById('mainNav').addEventListener('click', (e) => {
    if (e.target.closest('.nav-item')) closeDrawer();
  });
  // If the viewport is resized past the breakpoint while open, close cleanly
  window.addEventListener('resize', () => { if (window.innerWidth > 900) closeDrawer(); });

  window.addEventListener('hashchange', route);
  const exitBtn=document.getElementById('contextExitBtn');
  exitBtn.textContent=CTX.mode==='admin'?(LANG==='ar'?'← العودة للإدارة':'← Back to Admin'):(LANG==='ar'?'تسجيل خروج':'Logout');
  const ok = await requireContext();
  if (ok) await route();
});
