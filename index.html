<!DOCTYPE html>
<html lang="en" translate="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"><meta name="google" content="notranslate"><!-- Production: Warehouse module fully separated to /warehouse -->
<title>ADVACON — Service Requests</title><style>
:root{
  --navy:#15406E;--navy2:#1B4D7E;--med:#2A5C8A;--accent:#3E6E9E;--steel:#5B7A99;
  --lblue:#DCE6F0;--pale:#EEF2F7;--lgray:#F4F6F9;--head:#EAEEF3;--grid:#D3DAE3;
  --txt:#23303D;--grey:#6E7A87;--white:#fff;
  --green:#3C7D5A;--amber:#C08A3E;--red:#B0504A;--purple:#6E5C8A;
  --shadow:0 1px 3px rgba(21,64,110,.08),0 4px 16px rgba(21,64,110,.06);
  --sidew:230px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--lgray);color:var(--txt);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
html,body{overflow-x:hidden}
.app{width:100%}
.app:has(.emp-stage){display:block!important}
/* gate */
.gate{position:fixed;inset:0;background:linear-gradient(135deg,#15406E,#0E2C4D);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.gate-card{background:#fff;border-radius:18px;padding:40px 34px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35);max-width:460px;width:100%}
.gate-card img{height:58px;margin-bottom:8px}
.gate-card .co{font-size:11px;letter-spacing:.08em;color:var(--grey);font-weight:700}
.gate-card .intro{margin:16px 0 22px}
.gate-card .intro-ar{direction:rtl;font-size:15px;font-weight:700;color:var(--navy);line-height:1.6;margin-bottom:6px}
.gate-card .intro-ar-sub{direction:rtl;font-size:12.5px;color:var(--steel);line-height:1.6;margin-bottom:14px}
.gate-card .intro-en{font-size:13px;font-weight:600;color:var(--med);line-height:1.5;margin-bottom:5px}
.gate-card .intro-en-sub{font-size:11.5px;color:var(--grey);line-height:1.5}
.gate-card .intro::after{content:"";display:block;height:1px;background:var(--grid);margin:16px auto 0;width:70%}
.gate-card h2{font-size:18px;color:var(--navy);margin-bottom:4px}
.gate-card .sub{font-size:13px;color:var(--steel);margin-bottom:18px;direction:rtl}
.lang-btns{display:flex;gap:12px}
.lang-btns button{flex:1;padding:18px;border:2px solid var(--grid);background:var(--white);border-radius:13px;cursor:pointer;font-family:inherit;transition:.18s;display:flex;flex-direction:column;gap:3px;align-items:center}
.lang-btns button:hover{border-color:var(--accent);background:var(--pale)}
.lang-btns .big{font-size:19px;font-weight:700;color:var(--navy)}
.lang-btns .small{font-size:11px;color:var(--grey)}
.gate-card input{font-family:inherit;font-size:16px;padding:12px;border:1.5px solid var(--grid);border-radius:8px;width:100%}
/* ===== LAYOUT: sidebar + content ===== */
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidew);background:var(--white);border-inline-end:1px solid var(--grid);box-shadow:var(--shadow);display:flex;flex-direction:column;position:sticky;top:0;align-self:flex-start;height:100vh;max-height:100vh;flex-shrink:0;z-index:40}
.side-brand{padding:18px 16px;border-bottom:1px solid var(--grid);text-align:left;direction:ltr}
.side-brand img{height:38px;margin-bottom:6px}
.side-brand .co{font-size:8px;letter-spacing:.05em;color:var(--grey);font-weight:700;line-height:1.3;display:block}
.side-brand .sys{font-size:12.5px;font-weight:700;color:var(--navy);margin-top:3px;display:block}
.side-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.side-nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;padding:11px 13px;font-size:13.5px;font-weight:600;color:var(--grey);cursor:pointer;border-radius:9px;font-family:inherit;transition:.15s;text-align:start}
.side-nav button:hover{background:var(--lgray);color:var(--navy)}
.side-nav button.active{background:var(--navy);color:var(--white)}
.side-nav button .ic{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.side-nav button .badge{margin-inline-start:auto;background:var(--amber);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;min-width:18px;text-align:center}
.side-nav button.active .badge{background:#fff;color:var(--navy)}
.side-sep{height:1px;background:var(--grid);margin:8px 10px}
.side-nav .ext-ic{margin-inline-start:auto;font-size:12px;color:var(--grey);opacity:.7}
.side-foot{padding:10px;border-top:1px solid var(--grid);display:flex;gap:6px}
.side-foot button{flex:1;background:var(--white);border:1.5px solid var(--grid);color:var(--med);font-weight:700;padding:8px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12.5px}
.side-foot button:hover{background:var(--pale)}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.wrap{max-width:1600px;margin:0 auto;padding:24px 30px;width:100%;flex:1}
/* employee top (no sidebar) */
.empbar{background:var(--white);border-bottom:3px solid var(--navy);box-shadow:var(--shadow);position:sticky;top:0;z-index:50}
.empbar-inner{max-width:760px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.empbar img{height:34px;width:auto;max-width:160px;object-fit:contain;display:block}
.empbar .sys{font-size:15px;font-weight:700;color:var(--navy)}
.empbar .lt{margin-inline-start:auto;border:1.5px solid var(--grid);color:var(--med);font-weight:700;border-radius:7px;padding:7px 12px;background:none;cursor:pointer;font-family:inherit;font-size:12.5px}
/* heads */
.phead{margin-bottom:18px}
.phead .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.phead h1{font-size:24px;color:var(--navy);font-weight:700;margin-top:2px}
.phead p{color:var(--grey);margin-top:4px;font-size:13px}
.panel{background:var(--white);border:1px solid var(--grid);border-radius:12px;box-shadow:var(--shadow)}
.panel-pad{padding:22px}
/* form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:12.5px;font-weight:600;color:var(--med)}
label .req{color:var(--red)}
input,select,textarea{font-family:inherit;font-size:14px;padding:10px 12px;border:1.5px solid var(--grid);border-radius:8px;background:var(--white);color:var(--txt);transition:.15s;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(62,110,158,.13)}
textarea{resize:vertical;min-height:80px}
.hint{font-size:11.5px;color:var(--grey)}
.btn{background:var(--navy);color:var(--white);border:none;padding:11px 22px;font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--navy2)}
.btn.sm{padding:7px 13px;font-size:12.5px}
.btn.sec{background:var(--white);color:var(--navy);border:1.5px solid var(--grid)}
.btn.sec:hover{background:var(--lgray)}
.btn.danger{background:var(--white);color:var(--red);border:1.5px solid #E8C9C7}
.btn.danger:hover{background:#FBF0EF}
.btn.green{background:var(--green)}
.btn.green:hover{background:#346B4E}
.btnrow{display:flex;gap:10px;margin-top:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-120px);background:var(--green);color:#fff;padding:12px 22px;border-radius:10px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.2);z-index:200;transition:.35s;font-size:13.5px;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--white);border:1px solid var(--grid);border-radius:11px;padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lab{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--grey);font-weight:700}
.kpi .val{font-size:27px;font-weight:700;color:var(--navy);margin-top:4px}
.kpi .bar{position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--med)}
.qcount{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.qchip{background:var(--white);border:1px solid var(--grid);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow)}
.qchip .dot{width:9px;height:9px;border-radius:50%}
/* ===== TASK CARDS ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.tcard{background:var(--white);border:1px solid var(--grid);border-radius:13px;box-shadow:var(--shadow);overflow:hidden;border-inline-start:4px solid var(--med)}
.tcard.ov{border-inline-start-color:var(--red)}
.tcard.warn{border-inline-start-color:var(--amber)}
.tcard-head{display:flex;align-items:center;gap:8px;padding:12px 15px;background:var(--head);border-bottom:1px solid var(--grid);flex-wrap:wrap}
.tcard-head .id{font-weight:700;color:var(--med);font-size:13px}
.tcard-head .st{margin-inline-start:auto;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.tcard-head .prio{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px solid}
.prio.High{color:var(--red);border-color:#E8C9C7}.prio.Medium,.prio.Med{color:var(--amber);border-color:#E8D6BC}.prio.Low{color:var(--steel);border-color:var(--grid)}
.tcard-body{padding:14px 15px}
.tcard .req-q{font-size:14px;font-weight:600;color:var(--txt);margin-bottom:4px;line-height:1.45}
.tcard .meta{display:flex;flex-wrap:wrap;gap:5px 16px;margin:10px 0;font-size:12.5px}
.tcard .meta div{display:flex;flex-direction:column}
.tcard .meta .ml{font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--grey);font-weight:700}
.tcard .meta .mv{color:var(--txt);font-weight:600}
.tcard .field-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tcard .field-row .fr{flex:1;min-width:120px;display:flex;flex-direction:column;gap:3px}
.tcard .field-row label{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--grey)}
.tcard .mini{padding:7px 9px;font-size:13px;border:1px solid var(--grid);border-radius:7px;font-family:inherit;width:100%}
.tcard .notes-in{width:100%;padding:8px 10px;font-size:13px;border:1px solid var(--grid);border-radius:7px;font-family:inherit;margin-top:8px;background:#FBF8F2}
.dl{font-weight:700;font-size:12.5px}
.tcard-foot{display:flex;gap:8px;padding:11px 15px;border-top:1px solid var(--grid);background:var(--lgray);flex-wrap:wrap}
.tcard-foot .btn{flex:1;justify-content:center;min-width:90px}
.progress-wrap{background:var(--grid);border-radius:10px;height:16px;overflow:hidden;position:relative;margin-top:10px}
.progress-bar{height:100%;border-radius:10px;background:var(--accent)}
.progress-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--txt)}
.empty{padding:44px 20px;text-align:center;color:var(--grey)}
.filterbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filterbar select,.filterbar input{padding:8px 10px;font-size:13px;width:auto;min-width:130px}
.filterbar .spacer{flex:1}
.count-chip{background:var(--lblue);color:var(--navy);padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:700;white-space:nowrap}
.section-head{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--navy);margin:4px 0 12px;flex-wrap:wrap}
.sec-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.sec-dot.inbox{background:var(--amber)}.sec-dot.periodic{background:#7C5CBF}
.stf-future{margin:12px 0;padding:10px 14px;background:#EEF2FF;border:1px solid #C7D2FE;border-radius:10px;color:#3730A3;font-size:14px}
.stf-future-block{margin:14px 0 4px;padding:14px;background:#F8FAFC;border:1px dashed #CBD5E1;border-radius:10px;color:#64748B;text-align:center;font-size:14px}
.stf-ready{margin:14px 0 4px;text-align:center}
.stf-ready-msg{padding:10px;background:#ECFDF5;border:1px solid #A7F3D0;border-radius:10px;color:#065F46;font-size:14px;margin-bottom:12px}
.stf-start{background:var(--accent);color:#fff}
.co-note-box{margin-top:8px;padding:8px 12px;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:8px;color:#166534;font-size:13px}
.sched-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.sched-badge.future{background:#EEF2FF;color:#3730A3}
.sched-badge.ready{background:#ECFDF5;color:#065F46}
.sec-dot.work{background:var(--green)}.sec-dot.pend{background:#C08A3E}
/* incoming cards (simpler) */
.in-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px;margin-bottom:26px}
.in-card{background:var(--white);border:1px solid var(--grid);border-inline-start:4px solid var(--amber);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.in-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.in-card .q{font-size:14px;font-weight:600;margin-bottom:10px;line-height:1.4}
.in-card .meta{font-size:12.5px;color:var(--steel);margin-bottom:4px}
.in-card .meta b{color:var(--txt)}
.in-card .acts{display:flex;gap:8px;margin-top:12px}
.in-card .acts .btn{flex:1;justify-content:center}
/* pagination */
.pager{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:18px;flex-wrap:wrap}
.pager button{min-width:36px;height:36px;border:1px solid var(--grid);background:var(--white);border-radius:7px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--med);padding:0 10px}
.pager button:hover:not(:disabled){background:var(--pale)}
.pager button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.pager button:disabled{opacity:.4;cursor:default}
.pager .pinfo{font-size:12.5px;color:var(--grey);margin:0 8px}
/* charts */
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px;margin-top:18px}
.chart-card{background:var(--white);border:1px solid var(--grid);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.chart-card h3{font-size:14px;color:var(--navy);margin-bottom:14px}
.bar-row{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.bar-row .blab{font-size:12px;width:130px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;background:var(--lgray);border-radius:6px;height:21px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-inline-start:7px;color:#fff;font-size:11px;font-weight:700;min-width:22px}
.alert-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--navy);padding:13px 16px;border-bottom:1px solid var(--grid)}
.alert-row{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--grid);font-size:13px}
.alert-row:last-child{border-bottom:none}
.alert-row .alert-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert-row .alert-meta{color:var(--grey);font-size:12px;min-width:80px;text-align:end;white-space:nowrap}
.alert-row .alert-days{font-weight:700;font-size:12px;color:var(--amber);min-width:100px;text-align:end;white-space:nowrap}
.alert-row.ov .alert-days{color:var(--red)}
/* settings */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.list-card{background:var(--white);border:1px solid var(--grid);border-radius:11px;overflow:hidden}
.list-card h3{background:var(--head);color:var(--navy);padding:11px 15px;font-size:13px;border-bottom:1px solid var(--grid);display:flex;justify-content:space-between;align-items:center}
.list-card .items{padding:8px;max-height:260px;overflow-y:auto}
.list-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px}
.list-item:hover{background:var(--lgray)}
.list-item span{flex:1;font-size:13px}
.list-item button{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px}
.additem{display:flex;gap:8px;padding:10px;border-top:1px solid var(--grid)}
.additem input{flex:1}
/* #4 Drag & drop reordering of settings lists (pointer-based, touch+mouse) */
.list-item{position:relative;touch-action:pan-y}
.li-grip{cursor:grab;color:var(--grey);font-size:15px;line-height:1;padding:2px 4px;border-radius:4px;flex:none;touch-action:none;user-select:none;-webkit-user-select:none}
.li-grip:active{cursor:grabbing}
.list-item.dragging{background:var(--white);box-shadow:0 6px 18px rgba(10,16,22,.18);opacity:.96;z-index:5}
.list-item.li-ph{background:var(--head);border:1px dashed var(--med);border-radius:7px}
.list-item.li-ph>*{visibility:hidden}
.list-card .items.dnd-active{position:relative}

.wtoggle-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px}
.wtoggle{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--grid);font-size:13.5px}
.switch{width:42px;height:24px;border-radius:14px;background:var(--grid);border:none;cursor:pointer;position:relative;transition:.2s;padding:0;flex-shrink:0}
.switch.on{background:var(--green)}
.switch .knob{position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on .knob{inset-inline-start:21px}
/* thanks */
.thanks-wrap{display:flex;align-items:center;justify-content:center;min-height:70vh;padding:18px}
.thanks-card{background:var(--white);border:1px solid var(--grid);border-radius:18px;box-shadow:var(--shadow);padding:40px 32px;text-align:center;max-width:460px;width:100%}
.thanks-check{width:68px;height:68px;border-radius:50%;background:var(--green);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.thanks-card h1{font-size:24px;color:var(--navy);margin-bottom:8px}
.thanks-msg{color:var(--steel);font-size:14px;margin-bottom:16px}
.thanks-id{display:inline-block;background:var(--lblue);color:var(--navy);font-weight:700;padding:7px 18px;border-radius:24px;font-size:15px;letter-spacing:1px;margin-bottom:22px}
.thanks-contact{background:var(--lgray);border-radius:12px;padding:16px;margin-bottom:22px;text-align:center}
.thanks-contact p{font-size:12.5px;color:var(--grey);margin-bottom:8px}
.thanks-name{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:6px;text-align:center}
.thanks-phone{font-size:18px;font-weight:700;color:var(--med);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;direction:ltr}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,40,70,.5);display:flex;align-items:center;justify-content:center;z-index:160;padding:16px}
.modal{background:#fff;border-radius:14px;padding:26px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow-y:auto}
.modal h3{font-size:17px;color:var(--navy);margin-bottom:10px}
.modal p{font-size:13.5px;color:var(--steel);margin-bottom:18px;line-height:1.6}
/* mobile */
.menu-btn{display:none}
@media(max-width:860px){
  .form-grid,.settings-grid,.charts,.wtoggle-grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .cards,.in-cards{grid-template-columns:1fr}
  .sidebar{position:fixed;inset-inline-start:0;top:0;height:100vh;transform:translateX(-110%);transition:.25s}
  body[dir="rtl"] .sidebar{transform:translateX(110%)}
  .sidebar.open{transform:translateX(0)!important}
  .menu-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:none;background:var(--navy);color:#fff;border-radius:9px;font-size:20px;cursor:pointer;position:fixed;top:12px;inset-inline-start:12px;z-index:45;box-shadow:var(--shadow)}
  .content{padding-top:8px}
  .wrap{padding:64px 14px 20px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39}
}

/* images */
.img-upload{display:flex;flex-direction:column;gap:8px}
.img-btn{display:inline-flex;align-items:center;gap:8px;background:var(--pale);color:var(--navy);border:1.5px dashed var(--accent);border-radius:9px;padding:12px 16px;font-size:13.5px;font-weight:600;cursor:pointer;width:fit-content;transition:.15s}
.img-btn:hover{background:var(--lblue)}
.img-previews{display:flex;flex-wrap:wrap;gap:8px}
.img-prev{position:relative;width:72px;height:72px;border-radius:9px;overflow:hidden;border:1px solid var(--grid);background:var(--lgray);display:flex;align-items:center;justify-content:center}
.img-prev img{width:100%;height:100%;object-fit:cover}
.img-prev .upl{font-size:10px;color:var(--grey);text-align:center;padding:4px}
.img-prev button{position:absolute;top:2px;inset-inline-end:2px;width:20px;height:20px;border-radius:50%;background:rgba(176,80,74,.92);color:#fff;border:none;cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
.card-imgs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.card-imgs img{width:58px;height:58px;object-fit:cover;border-radius:7px;border:1px solid var(--grid);cursor:pointer;transition:.15s}
.card-imgs img:hover{transform:scale(1.05)}
.note-box{background:#FBF8F2;border:1px solid #E8D6BC;border-radius:8px;padding:9px 11px;font-size:13px;color:var(--txt);margin:8px 0;line-height:1.5}
.note-box .ml{display:block;font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:3px}
/* ===== CLEAN TABLES ===== */
.tbl-wrap{background:var(--white);border:1px solid var(--grid);border-radius:12px;box-shadow:var(--shadow);overflow-x:auto;overflow-y:hidden;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.tbl-wrap::-webkit-scrollbar{height:9px}
.tbl-wrap::-webkit-scrollbar-track{background:var(--lgray);border-radius:0 0 12px 12px}
.tbl-wrap::-webkit-scrollbar-thumb{background:#c3ccd6;border-radius:6px}
.tbl-wrap::-webkit-scrollbar-thumb:hover{background:#a7b3c0}
.tbl{width:100%;border-collapse:collapse;font-size:12px;min-width:680px}
.tbl thead th{background:var(--head);color:var(--navy);font-weight:700;font-size:10px;letter-spacing:.02em;text-transform:uppercase;text-align:start;padding:8px 9px;border-bottom:2px solid var(--grid);white-space:nowrap}
.tbl tbody td{padding:8px 9px;border-bottom:1px solid var(--grid);vertical-align:middle;color:var(--txt)}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--lgray)}
.tbl tbody tr.ov{background:#FBF0EF}
.tbl tbody tr.ov:hover{background:#F7E6E4}
.tbl tbody tr.warn{background:#FBF6EC}
.tbl .c-id{font-weight:700;color:var(--med);white-space:nowrap;font-size:11px}
.tbl .c-title{min-width:160px;max-width:280px}
.tbl .c-title .ttl{font-weight:600;line-height:1.35;font-size:12.5px}
.tbl .c-title .nt{font-size:11px;color:var(--amber);margin-top:2px;line-height:1.35;max-width:280px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pdf-lk{display:inline-block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.tbl .st{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:14px;white-space:nowrap}
.tbl .dl{font-weight:700;white-space:nowrap}
.tbl .c-act{white-space:nowrap;text-align:end}
.tbl .ico{width:26px;height:26px;border:1px solid var(--grid);background:var(--white);border-radius:6px;cursor:pointer;font-size:12.5px;margin-inline-start:3px;transition:.15s;line-height:1}
.tbl .ico:hover{background:var(--pale);border-color:var(--accent)}
.tbl .ico.ok{color:var(--green);border-color:#BFD9CB}
.tbl .ico.ok:hover{background:#EAF3EE}
.tbl .ico.del{color:var(--red);border-color:#E8C9C7}
.tbl .ico.del:hover{background:#FBF0EF}
.tbl .lk{background:var(--lblue);color:var(--navy);border:none;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;cursor:pointer;margin-top:4px}
.tbl .lk:hover{background:#CDDcEC}
@media(max-width:860px){
  .tbl{min-width:640px}
}
/* archive row details */
.arch-det{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:12px;color:var(--steel)}
.arch-det span{white-space:nowrap}
.arch-det b{color:var(--grey);font-weight:700}
.arch-reason{margin-top:6px;font-size:12px;color:#8B3A3A;background:#F9F0F0;border-radius:6px;padding:6px 10px;line-height:1.5}
.arch-reason b{color:#8B3A3A;font-weight:700}
.trk-reason{margin-top:8px;font-size:12.5px;color:#8B3A3A;background:#F9F0F0;border-radius:8px;padding:8px 12px;line-height:1.55}
.trk-reason-lab{display:block;font-weight:700;font-size:11px;color:#A05050;margin-bottom:2px}
.tbl .ico.wide{display:inline-flex;align-items:center;gap:5px;width:auto;padding:0 12px;height:32px;white-space:nowrap;font-weight:700;font-size:12.5px}
/* ===== IMAGE GALLERY ===== */
.gal-bg{background:rgba(10,20,35,.92)!important;flex-direction:column;gap:14px}
.gal-close{position:fixed;top:18px;inset-inline-end:18px;width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:22px;cursor:pointer;z-index:170;display:flex;align-items:center;justify-content:center;transition:.15s}
.gal-close:hover{background:rgba(255,255,255,.3)}
.gal-count{color:#fff;font-size:14px;font-weight:700;letter-spacing:.05em;background:rgba(0,0,0,.4);padding:5px 14px;border-radius:20px}
.gal-stage{position:relative;display:flex;align-items:center;justify-content:center;max-width:94vw;max-height:74vh}
.gal-img{max-width:94vw;max-height:74vh;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.5);object-fit:contain}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.85);color:var(--navy);font-size:28px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.3);transition:.15s;line-height:1}
.gal-nav:hover{background:#fff}
.gal-nav.prev{inset-inline-start:10px}
.gal-nav.next{inset-inline-end:10px}
body[dir="rtl"] .gal-nav.prev{transform:translateY(-50%) scaleX(-1)}
body[dir="rtl"] .gal-nav.next{transform:translateY(-50%) scaleX(-1)}
.gal-thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:94vw;padding:4px}
.gal-thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent;opacity:.55;transition:.15s}
.gal-thumbs img:hover{opacity:.85}
.gal-thumbs img.on{border-color:#fff;opacity:1}
/* ===== EMPLOYEE VIEW — balanced & elegant ===== */
.emp-wrap{max-width:720px;margin:0 auto;padding:36px 22px 60px;width:100%}
.empbar-inner{max-width:720px}
.req-head{text-align:center;margin-bottom:24px}
.req-head h1{font-size:28px}
.req-head .eyebrow{display:block}
.req-head p{max-width:520px;margin:6px auto 0}
.emp-wrap .panel{border-radius:16px}
.emp-wrap .panel-pad{padding:30px 30px}
.btn-lg{padding:14px 40px;font-size:15px;border-radius:10px}
@media(max-width:640px){
  .emp-wrap{padding:22px 14px 40px}
  .emp-wrap .panel-pad{padding:20px 18px}
  .req-head h1{font-size:23px}
}
/* ===== EMPLOYEE PAGE — MOBILE OPTIMISED (all languages) ===== */
@media(max-width:640px){
  /* top bar: keep logo + lang button tidy, let title shrink/wrap */
  .empbar-inner{padding:10px 14px;gap:10px;flex-wrap:nowrap}
  .empbar img{height:30px;max-width:120px}
  .empbar .sys{font-size:12.5px;line-height:1.3;flex:1;min-width:0}
  .empbar .lt{padding:6px 10px;font-size:12px;flex-shrink:0}
  /* form fields: comfortable touch targets, 16px to stop iOS zoom */
  .emp-wrap input,.emp-wrap select,.emp-wrap textarea{font-size:16px;padding:13px 14px;border-radius:10px}
  .emp-wrap label{font-size:13.5px;margin-bottom:2px}
  .emp-wrap .form-grid{gap:15px}
  .emp-wrap textarea{min-height:96px}
  /* submit: full width, easy to tap */
  .emp-wrap .btnrow{margin-top:20px!important}
  .emp-wrap .btn-lg{width:100%;justify-content:center;padding:15px 20px;font-size:16px}
  /* image upload: full-width tap area + bigger previews */
  .emp-wrap .img-btn{width:100%;justify-content:center;padding:14px;font-size:14px}
  .emp-wrap .img-prev{width:80px;height:80px}
  .req-head{margin-bottom:18px}
  .req-head h1{font-size:22px}
  .req-head p{font-size:13.5px}
}
@media(max-width:380px){
  .empbar .sys{font-size:11.5px}
  .emp-wrap .panel-pad{padding:18px 14px}
}
@media(max-width:640px){
  .thanks-card{padding:30px 20px}
  .thanks-card h1{font-size:21px}
  .thanks-card .btn{width:100%;justify-content:center;padding:14px}
  .thanks-phone{font-size:20px}
}
/* bilingual settings input (Arabic + English + add) */
.additem.bi{flex-wrap:wrap}
.additem.bi input{flex:1 1 120px;min-width:0}
.additem.bi .btn.sm{flex:0 0 auto}
/* ===== EMPLOYEE STAGE — navy background, single white card ===== */
.emp-stage{min-height:100vh;width:100%;background:linear-gradient(160deg,var(--navy) 0%,#0f2236 60%,#0a1a2b 100%);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px 60px;position:relative;overflow-x:hidden}
.lang-float{position:fixed;top:18px;inset-inline-end:18px;z-index:60;background:#fff;color:var(--navy);border:none;border-radius:8px;padding:9px 18px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:.15s}
.lang-float:hover{background:var(--lblue);color:var(--navy)}
.emp-stage .emp-wrap{max-width:680px;width:100%;margin:0 auto;padding:0}
.emp-card{padding:38px 38px 34px;border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.35);border:none}
.emp-logo{display:flex;justify-content:flex-start;margin-bottom:8px;direction:ltr}
.emp-logo img{height:54px;width:auto;max-width:230px;object-fit:contain}
.emp-card .req-head{text-align:center;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--grid)}
.emp-card .req-head h1{font-size:27px;color:var(--navy);margin-top:2px}
.emp-card .req-head .eyebrow{display:block;color:var(--accent)}
.emp-card .req-head p{max-width:480px;margin:8px auto 0;color:var(--grey);font-size:13.5px;line-height:1.6}
/* thanks card on navy stage */
.emp-stage .thanks-wrap{min-height:auto;width:100%}
.emp-stage .thanks-card{margin:0 auto}
@media(max-width:640px){
  .emp-stage{padding:20px 12px 40px}
  .lang-float{top:12px;inset-inline-end:12px;padding:7px 13px;font-size:12.5px}
  .emp-card{padding:26px 18px 24px;border-radius:15px}
  .emp-logo img{height:44px;max-width:180px}
  .emp-card .req-head h1{font-size:22px}
  .emp-card .form-grid{grid-template-columns:1fr;gap:15px}
  .emp-card input,.emp-card select,.emp-card textarea{font-size:16px;padding:13px 14px;border-radius:10px}
  .emp-card .btn-lg{width:100%;justify-content:center;padding:15px;font-size:16px}
  .emp-card .img-btn{width:100%;justify-content:center;padding:14px}
}
/* ===== TRACK & STAFF PAGES ===== */
.track-wrap{max-width:680px;width:100%;margin:0 auto;padding:0}
.trk-panel,.staff-panel{padding:34px 32px 30px}
.trk-stats{display:flex;gap:14px;margin:18px 0}
.trk-stat{flex:1;background:var(--lgray);border-radius:14px;padding:16px;text-align:center}
.trk-stat .num{display:block;font-size:32px;font-weight:800;color:var(--navy)}
.trk-stat .lab{font-size:12.5px;color:var(--grey);font-weight:600}
.trk-search{margin-bottom:16px}
.trk-search input{width:100%;font-size:16px;padding:13px 16px;border-radius:12px;border:1.5px solid var(--grid)}
.trk-list{display:flex;flex-direction:column;gap:10px}
.trk-card{background:#fff;border:1px solid var(--grid);border-radius:14px;padding:14px 16px;box-shadow:0 2px 8px rgba(20,49,76,.05)}
.trk-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.trk-id{font-weight:800;color:var(--accent);font-size:14px;letter-spacing:.04em}
.trk-badge{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:20px}
.trk-title{font-size:15px;color:var(--txt);font-weight:600;line-height:1.4}
.trk-meta{font-size:12.5px;color:var(--grey);margin-top:4px}
.trk-empty{text-align:center;color:var(--grey);padding:36px 10px;font-size:14px}
/* staff */
.staff-names{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.staff-name-btn{background:#fff;border:1.5px solid var(--grid);border-radius:12px;padding:16px;font-family:inherit;font-size:16px;font-weight:700;color:var(--navy);cursor:pointer;transition:.15s;text-align:center}
.staff-name-btn:hover{border-color:var(--accent);background:var(--lblue)}
.stf-head{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--grid);padding-bottom:14px}
.stf-back{background:var(--lgray);border:none;border-radius:8px;padding:9px 16px;font-family:inherit;font-size:13px;font-weight:700;color:var(--navy);cursor:pointer}
.stf-who{font-weight:800;color:var(--navy);font-size:15px}
.stf-list{display:flex;flex-direction:column;gap:11px;margin-top:6px}
.stf-card{background:#fff;border:1.5px solid var(--grid);border-radius:14px;padding:15px 16px;cursor:pointer;transition:.15s}
.stf-card:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(20,49,76,.08)}
.stf-open{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--accent)}
.stf-pend{font-size:11px;font-weight:700;color:#9A6B1E;background:#FBEFD6;padding:3px 9px;border-radius:12px}
.stf-detail{padding-top:6px}
.stf-d-id{font-weight:800;color:var(--accent);font-size:15px;letter-spacing:.04em}
.stf-d-title{font-size:19px;font-weight:700;color:var(--navy);margin:6px 0 16px;line-height:1.4}
.stf-d-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stf-d-grid>div{background:var(--lgray);border-radius:10px;padding:11px 13px}
.stf-d-grid span{display:block;font-size:11px;color:var(--grey);font-weight:600;margin-bottom:3px}
.stf-d-grid b{font-size:14px;color:var(--navy)}
.stf-note{background:#FFF8E8;border:1px solid #F0E3C0;border-radius:10px;padding:12px 14px;margin-bottom:16px}
.stf-note span{display:block;font-size:11px;color:#9A6B1E;font-weight:700;margin-bottom:4px}
.stf-note p{font-size:14px;color:var(--txt);line-height:1.5}
.stf-imgs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.stf-imgs img{width:90px;height:90px;object-fit:cover;border-radius:10px;cursor:pointer;border:1px solid var(--grid)}
.stf-done{width:100%;justify-content:center;background:var(--green)}
.stf-pend-msg{background:#FBEFD6;color:#9A6B1E;border-radius:12px;padding:16px;text-align:center;font-weight:700;font-size:14px}
/* pending-confirm badge in admin tables */
.pend-badge{display:inline-block;font-size:10.5px;font-weight:700;color:#9A6B1E;background:#FBEFD6;padding:2px 8px;border-radius:11px;vertical-align:middle;white-space:nowrap}
tr.pendrow{background:rgba(251,239,214,.32)}
@media(max-width:640px){
  .trk-panel,.staff-panel{padding:24px 16px}
  .stf-d-grid{grid-template-columns:1fr}
}
/* ===== PDF ATTACHMENTS ===== */
.file-btn{background:#fff;border:1.5px dashed var(--accent);color:var(--accent)}
.file-previews{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.file-prev{display:flex;align-items:center;gap:10px;background:var(--lgray);border:1px solid var(--grid);border-radius:10px;padding:10px 12px;font-size:13px}
.file-prev .fic{font-size:20px}
.file-prev .fnm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt);font-weight:600}
.file-prev .upl{color:var(--grey);font-size:12px}
.file-prev button{background:none;border:none;color:var(--red);font-size:20px;cursor:pointer;line-height:1;padding:0 4px}
.pdf-lk{color:#B0504A!important;font-weight:700}
.stf-files{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.stf-file{display:flex;align-items:center;gap:8px;background:#FCF0EF;border:1px solid #ECD3D1;border-radius:10px;padding:12px 14px;color:#B0504A;font-weight:700;text-decoration:none;font-size:14px}
.stf-file:hover{background:#F8E5E3}
/* ===== MANAGE — 3 COLUMNS SIDE BY SIDE ===== */
.manage-cols{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;align-items:start}
.mcol{background:var(--lgray);border:1px solid var(--grid);border-radius:14px;padding:0;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.mcol-head{display:flex;align-items:center;gap:8px;padding:14px 16px;font-weight:800;color:var(--navy);font-size:14px;background:var(--white);border-bottom:2px solid var(--grid);position:sticky;top:0;z-index:2}
.mcol-head .count-chip{margin-inline-start:auto}
.mcol-body{padding:12px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 230px);overflow-y:auto;overflow-x:hidden;min-width:0}
.mcol-body::-webkit-scrollbar{width:7px}
.mcol-body::-webkit-scrollbar-thumb{background:#c3ccd6;border-radius:6px}
.mcard{background:var(--white);border:1px solid var(--grid);border-radius:12px;padding:13px 14px;box-shadow:0 1px 4px rgba(20,49,76,.05);overflow:hidden;flex-shrink:0}
.mcard .mc-title,.mcard .mc-note,.mcard .mc-meta span,.mcard .mc-att{overflow-wrap:anywhere;word-break:break-word;min-width:0}
.mcard.ov{border-color:#E8C9C7;background:#FFFBFB}
.mcard.pendrow{background:#FFFCF5;border-color:#EDD9B0}
.mc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.mc-id{font-weight:800;color:var(--accent);font-size:13px;letter-spacing:.03em}
.mc-title{font-size:14px;font-weight:600;color:var(--txt);line-height:1.4;margin-bottom:9px}
.mc-meta{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:12px;color:var(--steel);margin-bottom:9px}
.mc-meta span{white-space:nowrap}
.mc-rows{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.mc-row{display:flex;align-items:baseline;gap:8px;font-size:12.5px;line-height:1.4}
.mc-lab{flex:0 0 88px;color:var(--grey);font-weight:600;font-size:11.5px}
.mc-val{flex:1;color:var(--txt);font-weight:600;overflow-wrap:anywhere;word-break:break-word}
.mc-note{background:#FFF8E8;border:1px solid #F0E3C0;border-radius:8px;padding:9px 11px;font-size:12.5px;color:var(--txt);margin-bottom:9px;line-height:1.5;overflow-wrap:anywhere;word-break:break-word}
.mc-note-lab{display:block;font-size:11px;color:#9A6B1E;font-weight:700;margin-bottom:3px}
.mc-att{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:9px;overflow:hidden}
.mc-att .pdf-lk{max-width:140px}
.mc-acts{display:flex;flex-wrap:wrap;gap:7px}
.donecard .mc-acts{flex-direction:column;gap:8px}
.donecard .mc-acts .btn{width:100%;flex:none;white-space:nowrap;font-size:12.5px;padding:9px 12px}
.mc-acts .btn.sm{flex:1;min-width:60px;justify-content:center;padding:8px 10px;white-space:nowrap}
.mc-empty{text-align:center;color:var(--grey);font-size:13px;padding:30px 10px}
@media(max-width:980px){
  .manage-cols{grid-template-columns:1fr;gap:20px}
  .mcol-body{max-height:none}
}
/* ===== MANAGE VIEW TOGGLE ===== */
.phead-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.view-toggle{display:inline-flex;background:var(--lgray);border:1px solid var(--grid);border-radius:10px;padding:3px;gap:2px}
.view-toggle button{background:none;border:none;padding:8px 16px;font-family:inherit;font-size:13px;font-weight:700;color:var(--steel);cursor:pointer;border-radius:8px;transition:.15s;white-space:nowrap}
.view-toggle button.on{background:var(--white);color:var(--navy);box-shadow:0 1px 4px rgba(20,49,76,.12)}
/* elegant status badge (base, used in cards) */
.st{display:inline-block;font-size:11px;font-weight:700;padding:3px 11px;border-radius:20px;white-space:nowrap;letter-spacing:.01em}
.mc-top .st{font-size:11px}
/* track: category groups + assignee */
.trk-group{margin-bottom:20px}
.trk-group-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--navy);padding:8px 2px 10px;border-bottom:2px solid var(--grid);margin-bottom:12px}
.trk-group-head .count-chip{font-size:12px}
.trk-who{margin-top:7px;padding-top:7px;border-top:1px dashed var(--grid);font-size:12.5px;color:var(--accent);font-weight:600}
/* ===== CHOOSE SCREEN (employee landing) ===== */
.emp-back{background:var(--lgray);border:none;border-radius:8px;padding:8px 15px;font-family:inherit;font-size:13px;font-weight:700;color:var(--navy);cursor:pointer;margin-bottom:14px;transition:.15s}
.emp-back:hover{background:var(--lblue)}
.choose-card{text-align:center}
.choose-grid{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.choose-btn{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--grid);border-radius:14px;padding:18px 20px;cursor:pointer;font-family:inherit;transition:.18s;text-align:start;width:100%}
.choose-btn:hover{border-color:var(--accent);box-shadow:0 6px 20px rgba(20,49,76,.1);transform:translateY(-1px)}
.choose-ic{flex-shrink:0;width:48px;height:48px;border-radius:12px;background:var(--lblue);color:var(--accent);display:flex;align-items:center;justify-content:center}
.choose-ic svg{width:24px;height:24px}
.choose-txt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.choose-lab{font-size:16px;font-weight:800;color:var(--navy)}
.choose-sub{font-size:12.5px;color:var(--grey);font-weight:600}
.choose-arrow{flex-shrink:0;font-size:24px;color:var(--grid);font-weight:400;transition:.18s}
.choose-btn:hover .choose-arrow{color:var(--accent);transform:translateX(2px)}
[dir="rtl"] .choose-arrow{transform:scaleX(-1)}
[dir="rtl"] .choose-btn:hover .choose-arrow{transform:scaleX(-1) translateX(2px)}
/* ===== TRACK SECURE BOARD ===== */
.trk-search-fixed{display:flex;align-items:center;background:#fff;border:1.5px solid var(--grid);border-radius:12px;overflow:hidden;direction:ltr;max-width:280px;margin-inline:auto}
.trk-search-fixed .trk-prefix{padding:0 10px;font-weight:800;color:var(--accent);font-size:16px;background:var(--lgray);align-self:stretch;display:flex;align-items:center;letter-spacing:.03em}
.trk-search-fixed input{border:none!important;border-radius:0!important;font-size:18px;font-weight:700;letter-spacing:.08em;padding:12px 14px;text-align:left}
.trk-search-fixed input:focus{box-shadow:none!important}
.trk-cols{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;margin-top:4px}
.trk-col{flex:1 1 230px;max-width:300px;min-width:0;background:var(--lgray);border:1px solid var(--grid);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.trk-col-head{display:flex;align-items:center;gap:8px;padding:11px 14px;font-weight:800;color:var(--navy);font-size:13.5px;background:#fff;border-bottom:2px solid var(--grid)}
.trk-col-head .count-chip{margin-inline-start:auto;font-size:11px}
.trk-col-body{padding:10px;display:flex;flex-direction:column;gap:9px;max-height:62vh;overflow-y:auto}
.trk-col-body .trk-card{padding:11px 13px;flex-shrink:0}
.trk-search-res{display:flex;flex-direction:column;gap:10px;max-width:420px;margin-inline:auto}
.trk-phone{color:var(--accent);font-weight:700;font-size:13px}
@media(max-width:640px){
  .trk-cols{flex-direction:column;flex-wrap:nowrap}
  .trk-col{max-width:none;flex-basis:auto}
  .trk-col-body{max-height:none}
}
/* ===== STAFF DIRECTORY (settings) ===== */
.staff-card-full h3{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--navy);margin-bottom:12px}
.staff-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.staff-row{display:flex;align-items:center;gap:12px;background:var(--lgray);border:1px solid var(--grid);border-radius:10px;padding:9px 12px;flex-wrap:wrap}
.staff-row-names{flex:1;min-width:140px;display:flex;flex-direction:column;gap:1px}
.staff-row-names b{font-size:13.5px;color:var(--txt)}
.staff-en{font-size:11.5px;color:var(--grey)}
.staff-row-code{display:flex;align-items:center;gap:6px}
.staff-code-lab{font-size:11px;color:var(--grey);font-weight:600}
.staff-code-inp{width:60px;text-align:center;font-weight:800;font-size:15px;letter-spacing:.1em;border:1.5px solid var(--grid);border-radius:8px;padding:6px;color:var(--accent);background:#fff}
.staff-code-inp:focus{border-color:var(--accent);outline:none}
.staff-row-acts{display:flex;gap:4px}
.staff-edit,.staff-del{width:30px;height:30px;border:1px solid var(--grid);background:#fff;border-radius:7px;cursor:pointer;font-size:14px;line-height:1}
.staff-edit:hover{border-color:var(--accent);color:var(--accent)}
.staff-del{color:var(--red)}.staff-del:hover{background:#FBF0EF;border-color:#E8C9C7}
.staff-add{display:flex;gap:8px;flex-wrap:wrap}
.staff-add input{flex:1;min-width:90px}
.staff-add input#add_staff_code{flex:0 0 70px;text-align:center;letter-spacing:.1em;font-weight:700}
/* staff login */
.staff-login{text-align:center}
.stf-code-box{display:flex;flex-direction:column;gap:14px;max-width:240px;margin:0 auto}
.stf-code-box input{font-size:32px;text-align:center;letter-spacing:.4em;font-weight:800;padding:16px;border:2px solid var(--grid);border-radius:14px;color:var(--navy)}
.stf-code-box input:focus{border-color:var(--accent);outline:none}
.stf-login-err{margin-top:14px;color:var(--red);font-weight:700;font-size:13.5px}
.stf-welcome{font-size:16px;font-weight:700;color:var(--accent);margin:6px 0 2px}
/* staff directory phone + add block */
.staff-row-phone{display:flex;align-items:center;gap:6px}
.staff-phone-inp{width:120px;text-align:left;font-weight:600;font-size:13px;border:1.5px solid var(--grid);border-radius:8px;padding:6px 8px;color:var(--txt);background:#fff}
.staff-phone-inp:focus{border-color:var(--accent);outline:none}
.staff-add-block{border-top:1px dashed var(--grid);padding-top:16px;margin-top:6px}
.staff-add-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:10px}
.staff-add input#add_staff_phone{flex:0 0 130px}
/* ===== DASHBOARD: collapsible cards + donut ===== */
.chart-card h3{cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px;transition:.15s}
.chart-card h3:hover{color:var(--accent)}
.cc-caret{font-size:11px;color:var(--grey);transition:.2s}
.chart-card.closed .cc-body{display:none}
.cc-body{margin-top:4px}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:6px 0}
.donut{width:140px;height:140px;flex-shrink:0}
.donut-tot{font-size:26px;font-weight:800;fill:var(--navy)}
.donut-lab{font-size:10px;fill:var(--grey);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.dlegend{flex:1;min-width:140px;display:flex;flex-direction:column;gap:7px}
.dleg{display:flex;align-items:center;gap:8px;font-size:12.5px}
.ddot{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.dlk{flex:1;color:var(--txt);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlv{font-weight:800;color:var(--navy)}
/* department name under logo (employee screens) */
.dept-name{font-size:12.5px;font-weight:700;color:var(--steel);margin:2px 0 14px;letter-spacing:.01em;text-align:start}
/* close-out photos */
.co-photo{margin:14px 0;text-align:start}
.co-photo .hint{display:block;font-size:11.5px;color:var(--grey);margin-top:6px}
.co-shots{margin-bottom:9px}
.co-shots-lab{font-size:11px;font-weight:700;color:var(--green);margin-bottom:5px}
.co-shots-grid{display:flex;flex-wrap:wrap;gap:6px}
.co-shots-grid img{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--grid);cursor:pointer}
/* recently completed section */
.sec-dot.done-dot{background:var(--green)}
.done-hint{font-size:11px;color:var(--grey);font-weight:600;margin-inline-start:6px}
.done-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:12px}
.mcard.donecard{background:#F6FBF8;border-color:#CFE6D9}
/* reports card */
.reports-card{border:1.5px solid var(--lblue)}
.reports-head{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--navy);margin-bottom:14px}
.reports-head .rep-ic{font-size:20px}
.reports-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.rep-daily{flex-shrink:0}
.rep-range{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--lgray);padding:8px 12px;border-radius:10px}
.rep-lab{font-size:12px;font-weight:700;color:var(--steel)}
.rep-range input[type=date]{border:1px solid var(--grid);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:13px;color:var(--txt)}
.rep-day{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--lblue);padding:8px 12px;border-radius:10px}
.rep-day input[type=date]{border:1px solid var(--grid);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:13px;color:var(--txt)}
/* reports detailed table */
.rep-tbl{min-width:1000px}
.rep-tbl .c-time{font-size:11.5px;color:var(--steel);white-space:nowrap}
.rep-tbl .c-dur{font-weight:700;color:var(--navy);white-space:nowrap}
/* reports day grouping */
.rep-tbl .day-row td{background:var(--navy)!important;color:#fff;padding:8px 12px;position:sticky;top:0}
.rep-tbl .day-lab{font-weight:800;font-size:13px}
.rep-tbl .day-count{font-size:11px;opacity:.85;margin-inline-start:10px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:10px}
/* daily live dashboard */
.daily-dash{margin-bottom:20px}
.dd-date{font-size:12px;color:var(--grey);font-weight:700;margin-inline-start:8px}
.dd-live{font-size:11px;color:var(--green);font-weight:800;margin-inline-start:8px;letter-spacing:.03em}
.dd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:14px}
.dd-card{display:flex;align-items:center;gap:14px;background:var(--lgray);border:1px solid var(--grid);border-radius:14px;padding:16px 18px}
.dd-ic{flex-shrink:0;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;filter:saturate(1.1)}
.dd-n{font-size:30px;font-weight:800;color:var(--navy);line-height:1}
.dd-l{font-size:12px;color:var(--grey);font-weight:700;margin-top:3px}
/* daily dashboard total card */
.dd-total{margin-top:14px}
.dd-total .dd-card{background:var(--lblue);border-color:var(--accent)}
.dd-total .dd-n{font-size:34px}
/* reports redesigned blocks */
.rep-block{margin-bottom:20px}
.rep-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--grid)}
.rep-bar-l{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--navy)}
.rep-bar-l .rep-ic{font-size:19px}
.rep-bar-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rep-bar-r input[type=date]{border:1px solid var(--grid);border-radius:8px;padding:7px 10px;font-family:inherit;font-size:13px;color:var(--txt)}
.rep-chart{margin-top:16px;width:100%}
.rep-svg{width:100%;height:auto;display:block}
.rep-chart-title{margin-top:14px;font-size:12.5px;font-weight:700;color:var(--steel)}
/* project stats panel inside All Requests */
.stats-panel{margin-bottom:22px}
.stats-head{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--navy);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--grid)}
.stats-head .rep-ic{font-size:19px}
/* daily dashboard cards clickable + SVG icons */
.dd-card{cursor:pointer;border:1px solid var(--grid);font-family:inherit;text-align:start;transition:.15s;width:100%}
.dd-card:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(20,49,76,.1);transform:translateY(-1px)}
.dd-card.on{border-color:var(--accent);box-shadow:0 4px 16px rgba(20,49,76,.16)}
.dd-ic{color:#fff}
.dd-ic svg{width:22px;height:22px}
.dd-detail{margin-top:16px;border:1px solid var(--grid);border-radius:12px;overflow:hidden}
.dd-detail-head{display:flex;align-items:center;gap:10px;background:var(--lgray);padding:11px 14px;font-weight:800;color:var(--navy);font-size:13.5px}
.dd-close{margin-inline-start:auto;background:none;border:none;font-size:16px;color:var(--grey);cursor:pointer;font-weight:700}
.dd-close:hover{color:var(--red)}
.dd-detail .tbl-wrap{border:none;border-radius:0;box-shadow:none;margin:0}
/* needs attention */
.na-panel{margin:14px 0 4px;border:1px solid #F0D9A8;background:#FFFBF3}
.na-head{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--navy);margin-bottom:12px}
.na-warn{font-size:17px;color:var(--amber)}
.na-list{display:flex;flex-direction:column;gap:6px}
.na-row{display:flex;align-items:center;gap:12px;padding:9px 12px;background:#fff;border:1px solid var(--grid);border-radius:9px;cursor:pointer;transition:.15s;font-size:12.5px}
.na-row:hover{border-color:var(--accent);box-shadow:0 3px 10px rgba(20,49,76,.08)}
.na-id{font-weight:700;color:var(--med);flex-shrink:0}
.na-title{flex:1;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.na-assignee{color:var(--grey);flex-shrink:0}
.na-reason{font-weight:800;flex-shrink:0;font-size:11.5px}
/* mini inline download button + dashboard header row */
.dd-headrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dd-headl{display:flex;align-items:center;gap:8px}
.btn-mini{display:inline-flex;align-items:center;gap:5px;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
.btn-mini:hover{background:var(--accent);transform:translateY(-1px);box-shadow:0 3px 10px rgba(20,49,76,.18)}
.rep-chart-title .rep-ic{font-size:16px;margin-inline-end:4px}
.rep-chart-title{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.dd-headr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dd-headr input[type=date]{border:1px solid var(--grid);border-radius:8px;padding:6px 9px;font-family:inherit;font-size:12px;color:var(--txt)}
/* period (recurring) tasks */
.period-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:14px 0 18px;padding:14px 16px;background:var(--lblue);border:1px solid var(--accent);border-radius:12px}
.pt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.pt-card{background:#fff;border:1px solid var(--grid);border-radius:14px;padding:16px;box-shadow:var(--shadow);transition:.15s}
.pt-card.off{opacity:.62;background:var(--lgray)}
.pt-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.pt-title{font-weight:800;color:var(--navy);font-size:15px;line-height:1.35}
.pt-acts{display:flex;gap:4px;flex-shrink:0}
.pt-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pt-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--lgray);color:var(--steel);border:1px solid var(--grid)}
.pt-pill.pt-staff{background:var(--lblue);color:var(--accent);border-color:var(--accent)}
.pt-pill.pt-paused{background:#FBF0EF;color:var(--red);border-color:#E8C4C0}
.pt-stats{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--grey);margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--grid)}
.pt-count b{color:var(--med);font-size:14px}
.pt-links{font-size:12px;color:var(--grey)}
.pt-links-lab{font-weight:700}
.pt-chip{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--lblue);border:1px solid var(--accent);border-radius:6px;padding:2px 7px;margin:3px 3px 0 0;cursor:pointer;transition:.12s}
.pt-chip:hover{background:var(--accent);color:#fff}
.pt-none{font-style:italic;color:var(--grey)}
.period-modal .pf-row{display:flex;gap:12px}
.period-modal .pf-row>.field{flex:1}
.period-modal .field{margin-bottom:12px}
.period-modal label{display:block;font-size:12px;font-weight:700;color:var(--steel);margin-bottom:5px}
.period-modal input,.period-modal select,.period-modal textarea{width:100%;border:1px solid var(--grid);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:13.5px;color:var(--txt);box-sizing:border-box}
.gen-list{background:var(--lgray);border:1px solid var(--grid);border-radius:9px;padding:12px 14px;margin:12px 0;font-size:13px;color:var(--txt);line-height:1.9;max-height:200px;overflow-y:auto}
.pf-checkrow{display:flex;align-items:center;gap:9px;cursor:pointer;font-weight:600!important;color:var(--txt)!important}
.pf-checkrow input{width:auto!important}
.pt-pill.pt-nofri{background:#FBF6EC;color:#8A6D1E;border-color:#E8D9B0}
/* period button + back button in manage */
.btn-period{display:inline-flex;align-items:center;gap:7px;background:var(--med);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
.btn-period:hover{background:var(--accent);transform:translateY(-1px);box-shadow:0 4px 14px rgba(20,49,76,.2)}
.btn-back{white-space:nowrap}
/* period tasks formal table */
.pt-tbl{width:100%}
.pt-tbl thead th{font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.pt-trow{cursor:pointer;transition:.12s}
.pt-trow:hover{background:var(--lblue)}
.pt-trow.open{background:var(--lblue)}
.pt-trow.paused{opacity:.6}
.pt-c-exp{width:30px;text-align:center}
.pt-caret{color:var(--accent);font-size:11px}
.pt-c-title b{color:var(--navy)}
.pt-tag{display:inline-block;font-size:10px;font-weight:700;background:#FBF6EC;color:#8A6D1E;border:1px solid #E8D9B0;border-radius:10px;padding:1px 7px;margin-inline-start:6px}
.pt-c-num{text-align:center}
.pt-c-num b{color:var(--med);font-size:15px}
.pt-status{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.pt-status.on{background:#E6F4EA;color:#1E7E45}
.pt-status.off{background:#FBF0EF;color:var(--red)}
.pt-c-act{white-space:nowrap}
.pt-detailrow td{padding:0!important;background:var(--lgray)}
.pt-detail-wrap{padding:14px 18px}
.pt-detail-head{font-size:12.5px;font-weight:800;color:var(--navy);margin-bottom:10px}
.pt-inner-tbl{width:100%;background:#fff;border:1px solid var(--grid);border-radius:8px;overflow:hidden}
.pt-inner-tbl thead th{background:var(--lgray);font-size:10.5px}
.pt-empty-inner{padding:16px;text-align:center;color:var(--grey);font-style:italic;background:#fff;border:1px solid var(--grid);border-radius:8px}
/* period categories */
/* period categories — refined, breathable layout */
.period-bar-info{justify-content:flex-start;background:linear-gradient(180deg,var(--lblue),#fff);border-color:var(--accent);padding:13px 18px;margin-bottom:22px}
/* ===== professional category tiles + panel ===== */
.pt-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.pt-tile{display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:78px;background:#fff;border:1px solid var(--grid);border-radius:12px;padding:13px 14px;cursor:pointer;transition:border-color .15s,box-shadow .15s,background .15s}
.pt-tile:hover{border-color:var(--steel);box-shadow:0 2px 10px rgba(21,64,110,.07)}
.pt-tile.active{background:var(--pale);border-color:var(--med);box-shadow:0 2px 12px rgba(21,64,110,.10)}
.pt-tile-main{display:flex;align-items:center;gap:9px;min-width:0}
.pt-tile-main b{font-weight:700;font-size:13.5px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.pt-tile-bar{width:3px;height:16px;border-radius:3px;background:var(--med);flex-shrink:0}
.pt-tile-foot{display:flex;align-items:center;justify-content:space-between}
.pt-tile-foot .count-chip{background:var(--lgray);color:var(--steel);border:1px solid var(--grid)}
.pt-tile.active .count-chip{background:var(--med);color:#fff;border-color:var(--med)}
.pt-tile-add{width:26px;height:26px;border-radius:7px;border:1px solid var(--grid);background:#fff;color:var(--med);font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.pt-tile-add:hover{background:var(--med);color:#fff;border-color:var(--med)}
/* open category panel (full width, below the tiles) */
.pt-panel{background:#fff;border:1px solid var(--grid);border-radius:14px;overflow:hidden;box-shadow:0 2px 14px rgba(21,64,110,.07);margin-bottom:28px;animation:ptIn .18s ease}
@keyframes ptIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pt-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;background:var(--pale);border-bottom:1px solid var(--grid);border-inline-start:3px solid var(--med)}
.pt-panel-title{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--navy)}
.pt-panel-title b{font-weight:800;letter-spacing:-.01em}
.pt-panel-title .count-chip{background:#fff;color:var(--med);border:1px solid var(--grid)}
.pt-panel .tbl-wrap{padding:6px 10px 12px;overflow-x:auto}
.pt-panel .pt-tbl{border:none}
.pt-cat-empty{padding:30px 18px;text-align:center;color:var(--grey);font-style:italic;font-size:13.5px;background:#fff}
.btn-mini{flex-shrink:0}
/* master full table */
.pt-master{margin-top:4px;border:1px dashed var(--grid);border-radius:16px;overflow:hidden;background:#FbFcFd}
.pt-master-head{display:flex;align-items:center;gap:11px;padding:15px 20px;cursor:pointer;color:var(--steel);font-size:14px;font-weight:700;transition:background .15s}
.pt-master-head:hover{background:var(--lgray)}
.pt-master-head .count-chip{background:var(--grid);color:var(--steel)}
.pt-master .tbl-wrap{padding:0 10px 12px}

@media(max-width:1100px){.pt-tiles{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.pt-tiles{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.pt-tiles{grid-template-columns:1fr}}
/* technician closeout: photo + file boxes inside opened task */
.stf-closeout{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.stf-lock-badge{display:inline-flex;align-items:center;gap:4px;background:#FEF3C7;color:#92400E;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.stf-locked-block{margin-top:10px;padding:14px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:12px;display:flex;flex-direction:column;gap:8px}
.stf-locked-status{font-size:16px;font-weight:800;color:#92400E}
.stf-locked-hint{font-size:13px;color:#78716C;line-height:1.5}
.stf-mgr-note,.stf-reject-note{background:#fff;border-radius:8px;padding:8px 10px}
.stf-mgr-note span,.stf-reject-note span{display:block;font-size:11px;font-weight:700;color:#92400E;margin-bottom:2px}
.stf-mgr-note p,.stf-reject-note p{margin:0;font-size:14px;color:#1C1917;line-height:1.5}
.stf-reject-note span{color:#B91C1C}
.prev-st{font-size:11px;color:#9CA3AF;margin-top:2px;font-style:italic}
.co-block{display:flex;flex-direction:column;gap:9px}
.co-btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;background:var(--lblue);color:var(--accent);border:1.5px dashed var(--accent);border-radius:11px;padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s}
.co-btn:hover{background:var(--accent);color:#fff}
.co-btn.file-btn{background:#F4F6F9;color:var(--steel);border-color:var(--steel)}
.co-btn.file-btn:hover{background:var(--steel);color:#fff}
.co-filelist{display:flex;flex-direction:column;gap:6px}
.co-fileitem{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid var(--grid);border-radius:8px;padding:8px 11px;font-size:12.5px;color:var(--txt);text-decoration:none}
.co-fileitem .upl{color:var(--grey);font-style:italic}
.co-fileitem button{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;line-height:1;padding:0 2px}
.co-files-grid{display:flex;flex-wrap:wrap;gap:7px}
.co-files-grid .co-fileitem{flex:0 0 auto}
.co-summary{font-size:12.5px;color:var(--steel);font-weight:600;margin:4px 0 0}

/* ===== Work Evidence — Phase 1 =====
   Lightroom principle: the PAGE stays in the app's light identity; only the
   gallery area goes dark, so photos gain contrast without the admin feeling
   they left the system. */
.we-hd{margin-bottom:14px}
.we-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.we-modes{display:flex;border:1px solid var(--grid);background:var(--white);overflow:hidden}
.we-mode{padding:7px 14px;border:0;border-inline-end:1px solid var(--grid);background:var(--white);
  color:var(--steel);font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:5px}
.we-mode:last-child{border-inline-end:0}
.we-mode.on{background:var(--navy);color:var(--white)}
.we-mode:disabled{opacity:.45;cursor:not-allowed}
.we-soon{font-size:9px;background:var(--lblue);color:var(--med);padding:1px 4px;font-weight:700}
.we-mode.on .we-soon{background:var(--accent);color:var(--white)}

.we-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0 14px}
.we-kpi{background:var(--white);border:1px solid var(--grid);box-shadow:var(--shadow);
  padding:14px 16px;border-inline-start:3px solid var(--navy);display:flex;
  align-items:center;gap:12px}
.we-kpi .ki{font-size:20px;font-style:normal;opacity:.75;flex:none}
.we-kpi .kb{min-width:0}
.we-kpi .kx{font-size:10px;color:var(--steel);font-weight:600;display:block;margin-top:1px}
.we-kpi.claim{border-inline-start-color:var(--amber)}
.we-kpi.proof{border-inline-start-color:var(--green)}
.we-kpi.pair{border-inline-start-color:var(--accent)}
.we-kpi b{display:block;font-size:26px;color:var(--navy);font-weight:700;line-height:1.1;
  font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;letter-spacing:-.02em}
.we-kpi span{font-size:11px;color:var(--grey);font-weight:600;display:block;margin-top:2px}

.we-ctl{background:var(--white);border:1px solid var(--grid);box-shadow:var(--shadow);
  padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.we-row1{display:flex}
.we-srch{flex:1;width:100%;height:36px;padding:0 12px;border:1px solid var(--grid);
  font-size:13px;font-family:inherit;color:var(--txt);background:var(--white)}
.we-srch:focus{outline:2px solid var(--accent);outline-offset:-1px}
/* one flat row: every control visible, nothing hidden behind a toggle */
.we-row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.we-fld{display:flex;flex-direction:column;gap:3px;flex:1 1 132px;min-width:118px}
.we-fld label{font-size:10px;color:var(--grey);font-weight:700;letter-spacing:.02em}
.we-sel{height:34px;padding:0 8px;border:1px solid var(--grid);background:var(--white);
  color:var(--txt);font-size:12px;font-family:inherit;width:100%}
.we-sel:focus{outline:2px solid var(--accent);outline-offset:-1px}
.we-dt{height:34px;padding:0 8px;border:1px solid var(--grid);background:var(--white);
  color:var(--txt);font-size:12px;font-family:inherit;width:100%}
.we-dt:focus{outline:2px solid var(--accent);outline-offset:-1px}
.we-acts{display:flex;gap:8px;align-items:flex-end;flex:0 0 auto;padding-bottom:0}
.we-acts .btn{height:34px;white-space:nowrap}
.we-meta{display:flex;justify-content:space-between;align-items:center;margin:12px 0 8px;
  font-size:12px;color:var(--grey);flex-wrap:wrap;gap:6px}
.we-meta b{color:var(--navy);font-family:ui-monospace,Consolas,monospace;font-size:14px}

/* the stage — the only dark surface on the page */
.we-stage{background:#1F2937;padding:22px;border:1px solid #16202B}
.we-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:18px;
  align-items:start}
.we-tile{background:#2A3744;border:1px solid #16202B;cursor:pointer;display:flex;flex-direction:column;
  overflow:hidden;transition:border-color .12s,transform .12s}
.we-tile:hover{border-color:#5B9BD5;transform:translateY(-3px);
  box-shadow:0 10px 28px rgba(0,0,0,.42)}
.we-tile:hover .we-half img{transform:scale(1.04)}
.we-tile:hover .we-open{opacity:1;transform:translateY(0)}
.we-tile.sel{border-color:#5B9BD5;box-shadow:0 0 0 2px rgba(91,155,213,.45)}
.we-tile:focus-visible{outline:2px solid #5B9BD5;outline-offset:2px}

.we-imgs{display:flex;height:220px;min-height:220px;max-height:220px;flex:none;
  background:#16202B;position:relative;overflow:hidden}
.we-half{flex:1 1 0;position:relative;overflow:hidden;min-width:0;height:100%}
.we-half+.we-half{border-inline-start:2px solid #16202B}
.we-half img{width:100%;height:100%;object-fit:cover;display:block;max-height:220px;
  transition:transform .25s ease}
.we-tag{position:absolute;top:7px;inset-inline-start:7px;font-size:9px;font-weight:700;
  padding:3px 7px;letter-spacing:.04em;color:#fff;z-index:2}
.we-tag.claim{background:var(--amber)}
.we-tag.proof{background:var(--green)}
.we-more-n{position:absolute;bottom:7px;inset-inline-end:7px;background:rgba(0,0,0,.72);color:#fff;
  font-size:10px;font-weight:700;padding:2px 6px;z-index:2}
/* nothing on the tile said it was clickable — this appears on hover/focus */
.we-open{position:absolute;bottom:8px;inset-inline-start:8px;background:rgba(21,64,110,.94);
  color:#fff;font-size:10px;font-weight:700;padding:4px 9px;z-index:3;opacity:0;
  transform:translateY(4px);transition:opacity .16s,transform .16s;pointer-events:none;
  display:flex;align-items:center;gap:4px}
.we-tile:focus-visible .we-open{opacity:1;transform:translateY(0)}

/* an image that fails (heic on Windows) must not leave a hole */
.we-fb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px;background:#1F2937;color:#6E8299;font-size:10px;text-align:center;padding:8px}
.we-fb i{font-size:22px;font-style:normal}

/* files-only tasks get a real tile, never an empty photo frame */
.we-docs{height:220px;min-height:220px;max-height:220px;flex:none;
  background:linear-gradient(160deg,#1C2733,#141D26);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  padding:18px;overflow:hidden}
.we-docs i{font-size:44px;font-style:normal;line-height:1}
.we-docs .nm{font-size:12px;color:#C7D3DF;text-align:center;word-break:break-word;
  max-width:100%;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;
  -webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.we-docs .ct{font-size:10px;color:#6E8299}

.we-ft{padding:11px 13px;background:#2A3744;border-top:1px solid #16202B}
.we-r1{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.we-id{font-size:13px;font-weight:700;color:#8FB4D9;font-family:ui-monospace,Consolas,monospace;
  letter-spacing:.01em}
.we-ti{font-size:13px;color:#E3EAF1;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;margin-bottom:7px}
.we-r2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:#8296AB}
.we-pj{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.we-ct{display:flex;gap:7px;white-space:nowrap}

.we-pg{display:flex;gap:8px;align-items:center;justify-content:center;padding:16px 0 4px}
.we-pg button{padding:6px 13px;border:1px solid var(--grid);background:var(--white);color:var(--med);
  font-size:12px;font-family:inherit;cursor:pointer;font-weight:600}
.we-pg button:hover:not(:disabled){border-color:var(--accent);background:var(--lgray)}
.we-pg button:disabled{opacity:.4;cursor:default}
.we-pgn{font-size:12px;color:var(--grey);font-family:ui-monospace,Consolas,monospace}

.we-empty{padding:56px 20px;text-align:center;color:#8FA3B8}
.we-empty h3{color:#C7D3DF;font-size:16px;margin:0 0 6px;font-weight:600}
.we-empty p{font-size:13px;margin:0;color:#6E8299}

@media(max-width:1024px){.we-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .we-fld{flex:1 1 46%;min-width:0}
  .we-acts{flex:1 1 100%}
  .we-acts .btn{flex:1}
}
@media(max-width:600px){
  .we-grid{grid-template-columns:1fr}
  .we-stage{padding:12px}
  .we-fld{flex:1 1 100%}
  .we-kpi b{font-size:20px}
}
@media(prefers-reduced-motion:reduce){.we-tile{transition:none}.we-tile:hover{transform:none}}

/* ===== Work Evidence — Phase 2: details panel =====
   Slides in from the inline-end edge, so it is right in English and left in
   Arabic without a second rule. The gallery stays visible behind it. */
.wp-back{position:fixed;inset:0;background:rgba(10,16,22,.5);z-index:800;
  opacity:0;animation:wpFade .16s ease forwards}
@keyframes wpFade{to{opacity:1}}
.wp{position:fixed;inset-block:0;inset-inline-end:0;width:min(460px,100%);
  background:var(--white);z-index:801;display:flex;flex-direction:column;
  box-shadow:-10px 0 40px rgba(10,16,22,.28);
  transform:translateX(100%);animation:wpIn .2s cubic-bezier(.22,.61,.36,1) forwards}
@keyframes wpIn{to{transform:translateX(0)}}
html[dir="rtl"] .wp{box-shadow:10px 0 40px rgba(10,16,22,.28);transform:translateX(-100%)}
html[dir="rtl"] .wp{animation-name:wpInR}
@keyframes wpInR{to{transform:translateX(0)}}

.wp-hd{padding:16px 18px;border-bottom:1px solid var(--grid);background:var(--lgray);flex:none}
.wp-r1{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.wp-id{font-size:14px;font-weight:700;color:var(--navy);
  font-family:ui-monospace,Consolas,monospace}
.wp-x{margin-inline-start:auto;background:transparent;border:1px solid var(--grid);
  color:var(--steel);width:28px;height:28px;font-size:15px;cursor:pointer;line-height:1;
  display:flex;align-items:center;justify-content:center;font-family:inherit}
.wp-x:hover{background:var(--white);border-color:var(--red);color:var(--red)}
.wp-x:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wp-ttl{font-size:14px;color:var(--txt);line-height:1.5;font-weight:600}

.wp-tabs{display:flex;border-bottom:1px solid var(--grid);background:var(--white);flex:none}
.wp-tab{flex:1;padding:10px 8px;border:0;border-bottom:2px solid transparent;
  background:transparent;color:var(--steel);font-size:12px;font-weight:600;
  font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.wp-tab:hover{color:var(--med);background:var(--lgray)}
.wp-tab.on{color:var(--navy);border-bottom-color:var(--navy)}
.wp-tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.wp-n{background:var(--lblue);color:var(--med);font-size:10px;font-weight:700;padding:1px 5px}
.wp-tab.on .wp-n{background:var(--navy);color:var(--white)}

.wp-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:18px}
.wp-sec h4{font-size:11px;font-weight:700;color:var(--steel);letter-spacing:.05em;
  margin:0 0 9px;padding-bottom:6px;border-bottom:1px solid var(--grid);text-transform:uppercase}
.wp-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.wp-th{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--grid);
  cursor:pointer;background:var(--pale);display:block}
.wp-th:hover{border-color:var(--accent)}
.wp-th:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wp-docs{display:flex;flex-direction:column;gap:6px}
.wp-doc{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--lgray);
  border:1px solid var(--grid);text-decoration:none;color:var(--txt);font-size:12px}
.wp-doc:hover{background:var(--lblue);border-color:var(--accent)}
.wp-doc i{font-size:17px;font-style:normal;flex:none}
.wp-doc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wp-doc b{margin-inline-start:auto;font-size:10px;color:var(--grey);font-weight:600;flex:none}

.wp-info{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12px}
.wp-info dt{color:var(--grey);font-weight:600;white-space:nowrap}
.wp-info dd{margin:0;color:var(--txt);word-break:break-word}

.wp-tl{display:flex;flex-direction:column;gap:0}
.wp-ev{display:flex;gap:11px;padding-bottom:14px;position:relative}
.wp-ev:last-child{padding-bottom:0}
.wp-ev::before{content:'';position:absolute;inset-inline-start:4px;top:12px;bottom:0;
  width:1px;background:var(--grid)}
.wp-ev:last-child::before{display:none}
.wp-dot{width:9px;height:9px;border-radius:50%;background:var(--steel);flex:none;
  margin-top:3px;position:relative;z-index:1}
.wp-dot.ok{background:var(--green)}
.wp-dot.no{background:var(--red)}
.wp-ec{min-width:0}
.wp-ec b{display:block;font-size:12px;color:var(--txt);font-weight:600}
.wp-ec span{font-size:11px;color:var(--grey);font-family:ui-monospace,Consolas,monospace}

.wp-note{background:var(--lgray);border-inline-start:2px solid var(--steel);padding:9px 11px;
  font-size:12px;color:var(--txt);line-height:1.5}
.wp-note.rej{border-inline-start-color:var(--red)}

.wp-ft{padding:12px 18px;border-top:1px solid var(--grid);background:var(--lgray);flex:none;
  display:flex;gap:8px}
.wp-ft .btn{flex:1}

@media(max-width:640px){
  .wp{width:100%}
  .wp-thumbs{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
}
@media(prefers-reduced-motion:reduce){
  .wp,.wp-back{animation:none;transform:none;opacity:1}
}

/* ===== Work Evidence — Phase 3: ZIP export progress ===== */
.wz-back{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:900;
  display:flex;align-items:center;justify-content:center;padding:20px}
.wz{background:var(--white);border:1px solid var(--grid);width:min(420px,100%);
  box-shadow:0 20px 60px rgba(10,16,22,.35)}
.wz-hd{padding:14px 18px;border-bottom:1px solid var(--grid);background:var(--lgray);
  font-size:14px;font-weight:700;color:var(--navy)}
.wz-bd{padding:18px}
.wz-bar{height:7px;background:var(--lgray);border:1px solid var(--grid);overflow:hidden;margin-bottom:11px}
.wz-fill{height:100%;background:var(--navy);width:0;transition:width .2s ease}
.wz-fill.done{background:var(--green)}
.wz-st{display:flex;justify-content:space-between;font-size:12px;color:var(--grey);margin-bottom:5px}
.wz-st b{color:var(--navy);font-family:ui-monospace,Consolas,monospace}
.wz-now{font-size:11px;color:var(--grey);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;direction:ltr;text-align:start;min-height:15px}
.wz-err{font-size:11px;color:var(--red);font-weight:600;margin-top:6px}
.wz-ft{padding:12px 18px;border-top:1px solid var(--grid);background:var(--lgray);
  display:flex;gap:8px;justify-content:flex-end}
@media(prefers-reduced-motion:reduce){.wz-fill{transition:none}}

/* ===== Department Manager designation ===== */
.staff-row-mgr{display:flex;align-items:center}
.mgr-pick{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--grey);
  cursor:pointer;white-space:nowrap;font-weight:600}
.mgr-pick.on{color:var(--navy)}
.mgr-pick input{accent-color:var(--navy);cursor:pointer;margin:0}
.mgr-pick input:disabled{cursor:not-allowed}
.mgr-pick input:disabled+span{opacity:.4}
.mgr-none{color:var(--grey);font-size:12px;font-style:italic}
.mgr-tel{color:inherit;text-decoration:none;font-weight:700}
.thanks-mgr{margin-top:4px}

/* ===== Image & Document Studio — Phase 4: table view ===== */
.we-modes{display:flex;gap:6px}
.we-mode{background:transparent;border:1px solid var(--grid);color:var(--steel);
  font-size:11px;font-weight:700;font-family:inherit;padding:6px 11px;cursor:pointer}
.we-mode:hover{background:var(--lgray);color:var(--med)}
.we-mode.on{background:var(--navy);border-color:var(--navy);color:var(--white)}
.we-mode:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.we-tbl-wrap{background:var(--white);border:1px solid var(--grid);box-shadow:var(--shadow);
  overflow:auto;max-height:calc(100vh - 300px)}
.we-tbl{width:100%;border-collapse:collapse;font-size:12px;min-width:1080px}
.we-tbl thead th{position:sticky;top:0;z-index:2;background:var(--navy);color:var(--white);
  padding:9px 8px;text-align:start;font-size:10.5px;font-weight:700;white-space:nowrap;
