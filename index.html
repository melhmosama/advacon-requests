@media(max-width:820px){
  /* a wide table on a phone is unusable — each row becomes a card */
  .we-tbl-wrap{border:0;box-shadow:none;background:transparent;overflow:visible;max-height:none}
  .we-tbl{min-width:0;display:block}
  .we-tbl thead{display:none}
  .we-tbl tbody,.we-tbl tr,.we-tbl td{display:block}
  .we-tbl tbody tr{background:var(--white)!important;border:1px solid var(--grid);
    box-shadow:var(--shadow);margin-bottom:10px;padding:10px 12px}
  .we-tbl tbody tr.sel{box-shadow:inset 3px 0 0 var(--navy),var(--shadow)}
  .we-tbl tbody td{border:0;padding:3px 0;display:flex;justify-content:space-between;
    align-items:center;gap:10px}
  .we-tbl tbody td::before{content:attr(data-l);font-size:10px;font-weight:700;

}

/* ===================== PHASE D — REPORT PRINT / PDF ===================== */
/* Screen: the print-only footer never shows on screen */
.rep-print-footer{display:none}
@media print{
  /* page geometry */
  @page{ size:A4; margin:14mm 12mm; }
  /* reset chrome: hide everything, then reveal only the report preview */
  body{ background:#fff !important; }
  body.printing-report .gate, body.printing-report #gate,
  body.printing-report .sidebar,
  body.printing-report .wh-breadcrumb,
  body.printing-report .rep-form,
  body.printing-report .rph-export,
  body.printing-report .rep-reg-actions,
  body.printing-report .rep-reg-pager,
  body.printing-report .toast,
  body.printing-report .rep-exp{ display:none !important; }
  /* collapse layout wrappers so the report uses the full page width */
  body.printing-report .app{ display:block !important; }
  body.printing-report .content{ margin:0 !important; padding:0 !important; width:100% !important; }
  body.printing-report .wrap{ margin:0 !important; padding:0 !important; max-width:none !important; }
  /* the report card itself: flat on paper, no shadow/rounded/overflow clipping */
  body.printing-report .rep-preview{ box-shadow:none !important; border:none !important; border-radius:0 !important; overflow:visible !important; }
  /* header band prints in ink-friendly form (dark bg wastes toner + unreadable grayscale) */
  body.printing-report .rep-preview-head{ background:#fff !important; color:#111 !important; border-bottom:2px solid #111 !important; padding:0 0 10px 0 !important; margin-bottom:10px !important; }
  body.printing-report .rph-brand{ color:#111 !important; font-weight:800 !important; letter-spacing:1px !important; }
  body.printing-report .rep-preview-head h2{ color:#111 !important; }
  body.printing-report .rph-preset{ color:#333 !important; }
  body.printing-report .rph-meta span{ color:#555 !important; }
  /* force backgrounds/colors to actually print */
  body.printing-report .rep-preview *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  /* section = keep together where possible, break before major ones */
  body.printing-report .rep-sec{ break-inside:avoid; page-break-inside:avoid; margin-bottom:12px !important; }
  body.printing-report .rep-sec h3{ break-after:avoid; page-break-after:avoid; }
  /* KPI grids shouldn't split a tile */
  body.printing-report .rep-kpi{ break-inside:avoid; page-break-inside:avoid; }
  /* tables: repeat header rows on each page, don't split a row */
  body.printing-report .rep-preview table{ page-break-inside:auto; }
  body.printing-report .rep-preview thead{ display:table-header-group; }
  body.printing-report .rep-preview tr{ break-inside:avoid; page-break-inside:avoid; }
  /* status chips: add a text glyph so meaning survives grayscale (color not sole signal) */
  body.printing-report .rep-preview{ font-size:11.5px !important; }
  /* wide detailed register: compact but readable */
  body.printing-report .rep-reg-table{ font-size:10px !important; }
  body.printing-report .rep-reg-table th, body.printing-report .rep-reg-table td{ padding:3px 5px !important; }
  /* print-only official footer */
  body.printing-report .rep-print-footer{ display:block !important; margin-top:14px; padding-top:8px; border-top:1px solid #999; font-size:10px; color:#555; text-align:center; }
}

// sign in with email+password → returns {ok:true,session} or {ok:false,error}
async function admSignIn(email,password){
  let login=null;
  try{
    const res=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{
      method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email:email,password:password})
    });
    login=await res.json();
    if(!res.ok||!login.access_token){
      return {ok:false,error:(login&&(login.error_description||login.msg||login.error))||('http_'+res.status)};
    }
  }catch(e){return {ok:false,error:'network'};}
  // verify this user is actually an admin
  let isAdmin=false;
  try{
    const ar=await fetch(SB_URL+'/rest/v1/rpc/is_admin',{
      method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+login.access_token,'Content-Type':'application/json'},body:'{}'
    });
    isAdmin=(await ar.json())===true;
  }catch(e){return {ok:false,error:'network'};}
  if(!isAdmin){
    // not an admin — fetch the role so the UI can point them to the right portal
    let role=null;
    try{
      const rr=await fetch(SB_URL+'/rest/v1/rpc/get_my_role',{method:'POST',
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+login.access_token,'Content-Type':'application/json'},body:'{}'});
      if(rr.ok){const v=await rr.json(); role=(typeof v==='string'&&v)?v:null;}
    }catch(e){}
    return {ok:false,error:'not_admin',role:role};
  }
  const sess={access_token:login.access_token,refresh_token:login.refresh_token,
    expires_at:login.expires_at||null,user_id:(login.user&&login.user.id)||null};
  admSetSession(sess);
  return {ok:true,session:sess};
}

}

      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify(args||{})});
    if(!res.ok){
      let code='http_'+res.status;
      try{ const b=await res.json(); code=b.message||b.error||b.details||code; }catch(e){}
      return {ok:false,error:code};

  }catch(e){return {ok:false,error:'network'};}

async function admRpc(fn,args){
  const okSess=await admEnsureSession();
  if(!okSess)return {ok:false,error:'session'};
  const sess=admGetSession();
  try{
    const res=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+sess.access_token,'Content-Type':'application/json'},
      body:JSON.stringify(args||{})});
    if(!res.ok){
      if(res.status===401||res.status===403)return {ok:false,error:'session'};
      let dbmsg=null; try{ const j=await res.json(); dbmsg=(j&&j.message)?String(j.message):null; }catch(_){}
      return {ok:false,error: dbmsg || ('http_'+res.status), http:res.status};
    }
    return await res.json();
  }catch(e){return {ok:false,error:'network'};}
}

// A7: shared wiring — route an admin state action through admin_task_action RPC.
// action ∈ on_hold|needs_review|needs_update|cancel|return_to_technician|return_to_acceptance
// When the action is 'cancel', route through the atomic task+materials
// cancel contract so a linked material request is cancelled in the same
// transaction (pending→logical ends, allocated→reservations released,
// issued→blocked with material_return_required). All other actions use
// admin_task_action unchanged.
async function admActionOrCancel(id,action,note,okMsgKey){
  if(action!=='cancel') return admTaskAction(id,action,note,okMsgKey);
  if(adminActionBusy)return false;

// verify an access token really belongs to an admin (server-side, not just localStorage)
async function admVerifyIsAdmin(accessToken){
  try{
    const r=await AdvaconUI.sessionFetch(SB_URL+'/rest/v1/rpc/is_admin',{method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},body:'{}'});
    if(!r.ok)return false;
    return (await r.json())===true;
  }catch(e){throw e;}
}
// exchange a refresh token for a fresh access token
async function admRefresh(refreshToken){
  try{
    const r=await AdvaconUI.sessionFetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',
      headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refreshToken})});
    const j=await r.json();
    if(!r.ok||!j.access_token)return null;
    return {access_token:j.access_token,refresh_token:j.refresh_token||refreshToken,
      expires_at:j.expires_at||null,user_id:(j.user&&j.user.id)||null};
  }catch(e){throw e;}
}
// A5 (reviewer fix): a stored session is only valid if the SERVER confirms it.
// - refresh the access token when expired (or near expiry)
// - then call is_admin() with the (fresh) token
// - confirmed invalid credentials clear the session; temporary failures deny access but retain tokens
// This makes a hand-forged localStorage value useless.
async function admEnsureSession(){try{
  let sess=admGetSession();
  if(!sess||!sess.access_token||!sess.refresh_token){admClearSession();return false;}
  const nowSec=Math.floor(Date.now()/1000);
  const exp=Number(sess.expires_at||0);
  // refresh if expired or within 60s of expiring (or if expires_at is missing/garbage)
  if(!exp || exp<=nowSec+60){
    const fresh=await admRefresh(sess.refresh_token);
    if(!fresh){admClearSession();return false;}
    admSetSession(fresh);sess=fresh;
  }
  // always confirm with the server that this token maps to an admin
  const ok=await admVerifyIsAdmin(sess.access_token);
  if(!ok){
    // token might be valid but just expired between checks → one refresh+retry
    const fresh=await admRefresh(sess.refresh_token);
    if(fresh){admSetSession(fresh);if(await admVerifyIsAdmin(fresh.access_token))return true;}
    admClearSession();return false;
  }
  return true;
}catch(error){AdvaconUI.sessionUnavailable(error);return false;}}

// H2 Phase 2: resolve a stored public image/file URL to a short-lived SIGNED url
// via the sign-image Edge Function. Admin JWT (header) or staff token (body) is
// attached automatically; the server decides if the caller may see this object.
// TRANSITIONAL: while the bucket is still public, any sign failure falls back to
// the original public URL so nothing breaks. (After Phase 5 this fallback is
// replaced by a retry state - see Phase 3.) Not yet wired to any render site.
async function signedUrl(storedUrl){
  if(!storedUrl || storedUrl.indexOf('/request-images/')<0) return storedUrl;
  const key=storedUrl.split('/request-images/')[1];
  if(!key) return storedUrl;
  try{
    const headers={'Content-Type':'application/json'};
    const body={key:key};
    const a=admGetSession();
    if(a && a.access_token) headers['Authorization']='Bearer '+a.access_token;
    const s=stfGetSession();
    if(s && s.token) body.staffToken=s.token;
    const r=await fetch(SB_URL+'/functions/v1/sign-image',{
      method:'POST', headers:headers, body:JSON.stringify(body)
    });
    if(!r.ok) return storedUrl;
    const d=await r.json();
    return (d && d.signedUrl) ? d.signedUrl : storedUrl;
  }catch(e){ return storedUrl; }
}

/* Filter dropdowns: active technicians, PLUS any deactivated one who still has
   tasks in the data — otherwise their open work becomes unfindable and cannot be
   reassigned. Assignment pickers use activeStaffNames() and never show them. */
function filterStaffNames(){
  const act=activeStaffNames();
  const seen={};
  act.forEach(n=>{seen[n]=1;});
  const extra=[];
  (state.requests||[]).forEach(r=>{
    const n=r.assignedTo;
    if(n&&!seen[n]){seen[n]=1;extra.push(n);}
  });
  return act.concat(extra.sort());
}
 /* Assignment pickers only: a deactivated technician must not be selectable.
   filterStaffNames() is the FILTER counterpart — it keeps an inactive technician
   visible while they still hold tasks, so historical work stays findable. */ function activeStaffNames(){
  // Staff Directory is the ONLY source (§3). No legacy fallback: if the
  // directory is empty or everyone is disabled, nobody is assignable — the
  // honest answer, rather than resurrecting hardcoded names.
  return staffList().filter(x=>x.active!==false).map(x=>x.en);

/* ===== DEPARTMENT MANAGER =====
   Staff Directory is the source of truth. Settings stores the manager's stable
   staff id PLUS a public snapshot of the three fields a visitor must see.

   Why a snapshot is unavoidable: load() sets wantStaff=(role==='admin'), so a
   visitor NEVER loads state.staff — the staff table holds LOGIN CODES and must
   not be readable with the public key (A0/A1). An id-only pointer therefore
   resolves to null for every visitor, which is exactly the bug this fixes.
   app_settings IS loaded for every role, so the snapshot rides that path.

   The snapshot is never edited by hand: it is written FROM the staff record at
   designation time and refreshed whenever that staff member's name, phone or
   active flag changes. mgrSync() is the single writer.

   Stored under `widgets` because admin_patch_app_settings whitelists exactly
   {lists, widgets}, and rejects any non-array key inside `lists`. `widgets` only
   has to be an object — and already holds a nested object (widgets.closed). */
function mgrId(){
  const v=state.widgets&&state.widgets.departmentManagerStaffId;
  return (v===undefined||v===null||v==='')?null:String(v);
}
/* Tolerant of legacy rows: active may be true/false, 1/0, "true"/"false", or
   absent. Only an explicit falsey value means inactive. */
function staffActive(s){
  if(!s)return false;
  const a=s.active;
  if(a===undefined||a===null)return true;          // legacy row: no flag = active
  if(a===false||a===0||a==='false'||a==='0'||a==='')return false;
  return true;
}
/* Admin-side resolver: live from Staff Directory. */
function getDepartmentManager(){
  const id=mgrId();
  if(!id)return null;
  return staffList().find(s=>String(s.id)===id&&staffActive(s))||null;
}
/* What every page renders. Admin resolves live; a visitor (who has no staff
   table) falls back to the snapshot written from that same record. */
function mgrCard(){
  // An id saved by an older build may not match any staff row (a real case: id 1
  // when the real ids are 21/6/8). Without a snapshot it is unresolvable, so it
  // must read as "not configured" rather than break the page.
  const live=getDepartmentManager();
  if(live)return {en:live.en||live.ar||'', ar:live.ar||live.en||'', phone:live.phone||''};
  const id=mgrId();
  const snap=state.widgets&&state.widgets.departmentManagerSnapshot;
  // the snapshot is only valid for the currently designated id
  if(id&&snap&&String(snap.id)===id&&snap.active!==false){
    return {en:snap.en||snap.ar||'', ar:snap.ar||snap.en||'', phone:snap.phone||''};
  }
  return null;
}

/* The single writer of the snapshot. Called on designation and after any edit
   to a staff member — so a phone change in Staff Directory reaches the visitor.
   Returns false only if the settings save fails. */
async function mgrSync(){
  const id=mgrId();
  if(!id){ state.widgets.departmentManagerSnapshot=null; return await saveWidgets(true); }
  const s=staffList().find(x=>String(x.id)===id);
  // A miss must NOT silently persist an id with no snapshot — that is exactly how
  // the manager became unresolvable. Refuse the write instead of storing a
  // pointer that can never resolve.
  if(!s){ return false; }
  state.widgets.departmentManagerSnapshot={
    id:s.id, en:s.en||'', ar:s.ar||'', phone:s.phone||'', active:staffActive(s)
  };
  return await saveWidgets(true);
}
/* Designate (or un-designate) the manager. The UI is NOT updated optimistically:
   on a failed save the previous value is restored and the radio does not move. */
async function setDeptManager(id){
  const selectedId=String(id);
  // A radio must never unselect itself: clicking the current manager again used
  // to clear the designation, which silently removed the public contact.
  if(mgrId()===selectedId)return;
  const member=staffList().find(x=>String(x.id)===selectedId&&staffActive(x));
  if(!member){ toast(t('connErr')); render(); return; }
  const prev=JSON.parse(JSON.stringify(state.widgets));
  state.widgets.departmentManagerStaffId=member.id;
  state.widgets.departmentManagerSnapshot={
    id:member.id, en:member.en||'', ar:member.ar||'', phone:member.phone||'', active:true
  };
  const ok=await saveWidgets(true);
  if(!ok){ state.widgets=prev; render(); return; }
  render();
  toast(t('saved'));
}
/* Clearing the designation needs its own explicit action — it must not be a
   side effect of clicking the selected radio. */
async function clearDeptManager(){
  if(!mgrId())return;
  const prev=JSON.parse(JSON.stringify(state.widgets));
  state.widgets.departmentManagerStaffId=null;
  state.widgets.departmentManagerSnapshot=null;
  const ok=await saveWidgets(true);
  if(!ok){ state.widgets=prev; render(); return; }
  render(); toast(t('saved'));
}
/* BUG 2 — an installation may already hold an id saved before snapshots existed,
   or a stale snapshot after the record changed. Visitors cannot repair it (no
   staff table), so the admin session heals it once after load. */
async function repairManagerSnapshot(){
  const id=mgrId();
  if(!id)return;
  const m=staffList().find(x=>String(x.id)===id);
  if(!m)return;                                  // unknown id: leave it for the admin to see
  const cur=state.widgets.departmentManagerSnapshot;
  const okSnap = cur && String(cur.id)===id && cur.en===(m.en||'') &&
                 cur.ar===(m.ar||'') && cur.phone===(m.phone||'') &&
                 cur.active===staffActive(m);
  if(okSnap)return;
  state.widgets.departmentManagerSnapshot={
    id:m.id, en:m.en||'', ar:m.ar||'', phone:m.phone||'', active:staffActive(m)
  };
  await saveWidgets(false);                      // silent: this is a background repair
}

function today(){const d=new Date(Date.now()+3*3600000);return d.toISOString().slice(0,10);}
function saudiDateOf(ms){return new Date(ms+3*3600000).toISOString().slice(0,10);}

function calc(r){
  const o={...r};
  // scheduled-start tasks: Future (before start) or Ready (start passed, not yet begun)
  o.isScheduled=!!(r.schedStart && r.status==='Not Started' && r.accepted && !r.archived);
  o.isFuture=o.isScheduled && new Date(r.schedStart).getTime()>Date.now();
  o.isReady=o.isScheduled && new Date(r.schedStart).getTime()<=Date.now();
  if(r.start&&r.duration){const d=new Date(r.start);d.setDate(d.getDate()+Number(r.duration)-1);o.due=d.toISOString().slice(0,10);}else o.due='';
  o.effStatus=r.status;
  // overdue counts from the scheduled start; a future task is never overdue
  if(o.due&&r.status!=='Complete'&&r.status!=='Cancelled'&&!o.isFuture){if(new Date(o.due)<new Date(today()))o.effStatus='Overdue';}
  if(o.effStatus==='Complete')o.daysleft='✓';
  else if(o.isFuture)o.daysleft='';
  else if(o.due){o.daysleft=Math.round((new Date(o.due)-new Date(today()))/86400000);}else o.daysleft='';
  const P={'Not Started':0,'Complete':1,'On Hold':.1,'Overdue':.1,'Needs Review':0,'Needs Update':0,'Cancelled':1};
  if(o.effStatus==='In Progress'){let p=.1;if(r.startedAt){const days=Math.round((new Date(today())-new Date(saudiDateOf(new Date(r.startedAt).getTime())))/86400000)+1;p=Math.min(.8,Math.max(.1,days*.1));}o.progress=p;}
  else o.progress=P[o.effStatus]!=null?P[o.effStatus]:0;
  return o;
}
function isOpen(r){return r.accepted && !r.archived && r.effStatus!=='Complete' && r.effStatus!=='Cancelled' && r.status!=='Cancelled';}
function isArchived(r){return r.archived || r.status==='Cancelled' || r.status==='Rejected';} /* Admin archive = a business OUTCOME (rejected/cancelled), NOT the `archived` housekeeping flag. `archived` only means the requester's 8h tracking window has closed; a Complete task that got archived is still successfully DONE and must never appear as archived/restorable to the admin. isArchived() is left untouched: it has 15 callers (isIncoming/isAccepted etc.) whose operational meaning must not shift. */ function isAdminArchived(r){return r.status==='Cancelled' || r.status==='Rejected';}
function isIncoming(r){return !isArchived(r) && !r.accepted;}
function isAccepted(r){return !isArchived(r) && r.accepted;}

   other shape degrades cleanly.

   Phase 1 scope: header, KPIs, controls, gallery, pagination. The side panel,
   Timeline/Table views, ZIP and lightbox are Phase 2+ — openEvidencePanel() is
   the seam they attach to.

   Data: state.requests, already loaded by admin_get_requests() (is_admin()
   gated). No new table read, no new grant. */

const WE_PAGE=24;          // gallery tiles per page — a clean grid, unchanged
let WE_ROWS=25;            // table rows per page — user-selectable (§7)
let weF={q:'',from:'',to:'',proj:'',cat:'',tech:'',stat:'',src:'',kind:''};
let wePg=1;
let weSel=0;          // selected task id, Phase 2 reads this

function weUrls(raw){
  if(!raw)return[];
  try{const a=JSON.parse(raw);if(!Array.isArray(a))return[];
    return a.filter(u=>typeof u==='string'&&u);}catch(e){return[];}
}
function weDocs(raw){
  try{const a=JSON.parse(raw||'[]');if(!Array.isArray(a))return[];
    return a.filter(f=>f&&typeof f==='object'&&f.url);}catch(e){return[];}
}
function weAtt(r){
  return {ci:weUrls(r.images), pi:weUrls(r.closeoutImages),
          cd:weDocs(r.files),  pd:weDocs(r.closeoutFiles)};
}
/* Riyadh calendar date. received is stored as a Riyadh date; toISOString() is
   UTC and would return yesterday for the three hours after local midnight. */
function weDay(back){
  return new Date(Date.now()-(back||0)*864e5).toLocaleDateString('en-CA',{timeZone:'Asia/Riyadh'});
}
/* §7: one classifier for every count. The DB stores images and files in separate
   columns, but a file column can still hold an image, so classify by type rather
   than by which column it came from. MIME first (when the record carries one),
   extension as the fallback. */
const WE_IMG_EXT=['jpg','jpeg','png','gif','webp','heic','heif','bmp','tif','tiff','svg','avif'];
function weIsImage(f){
  if(f&&f.type)return String(f.type).toLowerCase().indexOf('image/')===0;
  const u=String((f&&(f.name||f.url))||f||'').split('?')[0];
  const e=u.split('.').pop().toLowerCase();
  return WE_IMG_EXT.indexOf(e)>=0;
}
function weIcon(n){
  const e=String(n||'').toLowerCase().split('.').pop();
  if(e==='pdf')return'📕';
  if(e==='doc'||e==='docx')return'📘';
  if(e==='xls'||e==='xlsx')return'📗';
  if(e==='ppt'||e==='pptx')return'📙';
  return'📄';
}

/* The Studio shows work that happened. A rejected or cancelled request is not
   evidence of work, so it leaves the Studio entirely — gallery, KPIs and ZIP all
   read weRows(), so one exclusion here covers all three. The records themselves
   are untouched: All Requests, reports and history still show them. */
function weEligible(){
  return state.requests.map(calc).filter(r=>r.status!=='Rejected'&&r.status!=='Cancelled');
}
function weRows(){
  const q=(weF.q||'').trim().toLowerCase().replace(/^#/,'').replace(/^tsk-?/,'');
  return weEligible().filter(r=>{
    const a=weAtt(r);
    // Classify with weIsImage — the same helper the KPIs and the ZIP use — so a
    // photo uploaded through the files field counts as an image everywhere, and
    // a PDF that arrived in the images column counts as a document everywhere.
    let nI=0,nD=0;
    a.ci.forEach(u=>{ weIsImage(u)?nI++:nD++; });
    a.pi.forEach(u=>{ weIsImage(u)?nI++:nD++; });
    a.cd.forEach(f=>{ weIsImage(f)?nI++:nD++; });
    a.pd.forEach(f=>{ weIsImage(f)?nI++:nD++; });
    if(nI+nD===0)return false;                       // no attachments -> nothing to show

    if(weF.kind==='img'&&nI===0)return false;
    if(weF.kind==='file'&&nD===0)return false;
    if(weF.src==='req'&&a.ci.length+a.cd.length===0)return false;
    if(weF.src==='tech'&&a.pi.length+a.pd.length===0)return false;
    if(weF.proj&&r.project!==weF.proj)return false;
    if(weF.cat&&r.category!==weF.cat)return false;
    if(weF.tech&&r.assignedTo!==weF.tech)return false;
    if(weF.stat&&r.effStatus!==weF.stat)return false;

    const d=(r.received||'').slice(0,10);
    if(weF.from&&d&&d<weF.from)return false;
    if(weF.to&&d&&d>weF.to)return false;

    if(q){
      if(/^\d+$/.test(q)){
        // numeric = an ID lookup and nothing else: '341' must not match a task
        // whose title merely contains 341, nor 3410.
        if(String(r.id)!==q)return false;
      }else{
        const hay=[r.title,r.project,r.category,r.assignedTo,r.effStatus,r.requestedBy]
          .join(' ').toLowerCase();
        if(hay.indexOf(q)<0)return false;
      }
    }
    return true;
  }).sort((a,b)=>b.id-a.id);
}

/* §7: counted from request DATA across the whole filtered set — never from the
   DOM, never from just the visible page. A file column can hold an image (a photo
   of paper uploaded as .jpeg), so weIsImage() decides the category, not the column. */
function weStats(rows){
  let ci=0,pi=0,cd=0,pd=0;
  rows.forEach(r=>{
    const a=weAtt(r);
    ci+=a.ci.length; pi+=a.pi.length;
    a.cd.forEach(f=>{ if(weIsImage(f))ci++; else cd++; });
    a.pd.forEach(f=>{ if(weIsImage(f))pi++; else pd++; });
  });
  return {tasks:rows.length, ci:ci, pi:pi, img:ci+pi, cd:cd, pd:pd, doc:cd+pd};
}

/* A broken image (heic on Windows) must leave a labelled placeholder, not a hole.
   Built with DOM calls: putting HTML inside an onerror="" attribute breaks the tag
   the moment that HTML contains a double quote. */
function weFallback(img){
  if(!img||img.dataset.fb)return;
  img.dataset.fb='1';
  img.style.display='none';
  const d=document.createElement('div');
  d.className='we-fb';
  const i=document.createElement('i');
  i.textContent='🖼';
  d.appendChild(i);
  d.appendChild(document.createTextNode(t('wePrev')));
  if(img.parentNode)img.parentNode.appendChild(d);
}

function weTile(r){
  const a=weAtt(r);
  const nI=a.ci.length+a.pi.length, nD=a.cd.length+a.pd.length;
  const both=a.ci.length>0&&a.pi.length>0;
  const half=(url,tag,cls,extra)=>`<div class="we-half">
      <span class="we-tag ${cls}">${tag}</span>
      <img src="${esc(url)}" loading="lazy" alt="${esc(r.title||'')}" onerror="weFallback(this)"/>
      ${extra||''}</div>`;

  let media;
  if(both){
    media=`<div class="we-imgs">
      ${half(a.ci[0],t('weClaim'),'claim')}
      ${half(a.pi[0],t('weProof'),'proof', nI>2?`<span class="we-more-n">+${nI-2}</span>`:'')}
    </div>`;
  }else if(a.pi.length){
    media=`<div class="we-imgs">${half(a.pi[0],t('weProof'),'proof',
      nI>1?`<span class="we-more-n">+${nI-1}</span>`:'')}</div>`;
  }else if(a.ci.length){
    media=`<div class="we-imgs">${half(a.ci[0],t('weClaim'),'claim',
      nI>1?`<span class="we-more-n">+${nI-1}</span>`:'')}</div>`;
  }else{
    // files only: a real document tile, never an empty photo frame
    const d=a.cd.length?a.cd[0]:a.pd[0];
    const src=a.cd.length?t('weSReq'):t('weSTech');
    media=`<div class="we-docs">
      <i>${weIcon(d.name||d.url)}</i>
      <span class="nm">${esc(d.name||t('weDoc'))}</span>
      <span class="ct">${src} · ${nD} ${nD===1?t('weFile1'):t('weFileN')}</span>
    </div>`;
  }

  return `<div class="we-tile ${weSel===r.id?'sel':''}" tabindex="0" onclick="weePick(${r.id})"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();weePick(${r.id});}">
    <div style="position:relative">${media}<span class="we-open">${t('weOpen')}</span></div>
    <div class="we-ft">
      <div class="we-r1"><span class="we-id">${fmtID(r.id)}</span>${effBadge(r)}</div>
      <div class="we-ti">${esc(r.title||'—')}</div>
      <div class="we-r2">
        <span class="we-pj">${esc(r.project||'—')}${r.assignedTo?' · '+esc(r.assignedTo):''}</span>
        <span class="we-ct">${nI?`<span>🖼 ${nI}</span>`:''}${nD?`<span>📄 ${nD}</span>`:''}</span>
      </div>
    </div>
  </div>`;
}

function viewMedia(){
  const all=weRows();
  const s=weStats(all);
  const pages=Math.max(1,Math.ceil(all.length/WE_PAGE));
  if(wePg>pages)wePg=pages;
  const rows=all.slice((wePg-1)*WE_PAGE, wePg*WE_PAGE);

  const opt=(arr,cur)=>arr.map(v=>`<option value="${esc(v)}" ${cur===v?'selected':''}>${esc(v)}</option>`).join('');
  // §2: every list comes from live Settings — anything added or removed there
  // appears or disappears here, with no separate array to maintain.
  const cats=(state.lists.categories||[]).map(c=>typeof c==='string'?c:(c.en||''));
  // §3: activeStaffNames() already exists for exactly this rule — deactivated
  // technicians vanish from selection while historical names stay intact.
  const techs=activeStaffNames().slice().sort();
  // Work Evidence dropdown only: Rejected/Cancelled are not useful to filter TO
  // when browsing proof of work. Their tasks still appear under "All statuses" —
  // no filtering logic changed.
  const sts=["Not Started","In Progress","On Hold","Needs Review","Needs Update","Complete"];

  const head=`<div class="we-hd">
    <div class="we-top">
      <div class="phead" style="margin:0"><h1 style="margin:0">${t('weTitle')}</h1><p class="sub" style="margin:2px 0 0">${t('weSub')}</p></div>
      <div class="we-modes">
        <button class="we-mode ${weView==='grid'?'on':''}" onclick="weSetView('grid')">▦ ${t('weGal')}</button>
        <button class="we-mode ${weView==='table'?'on':''}" onclick="weSetView('table')">☰ ${t('weTbl')}</button>
        <button class="we-mode" disabled title="${t('weSoonT')}">⋮ ${t('weTime')} <span class="we-soon">${t('weSoon')}</span></button>
      </div>
    </div>
    <div class="we-kpis">
      <div class="we-kpi proof"><i class="ki">📷</i><span class="kb"><b>${s.img}</b>
        <span>${t('weKImages')}</span>
        <span class="kx">${t('weKClaim')}: ${s.ci} · ${t('weKProof')}: ${s.pi}</span></span></div>
      <div class="we-kpi pair"><i class="ki">📄</i><span class="kb"><b>${s.doc}</b>
        <span>${t('weKDocs')}</span>
        <span class="kx">${t('weKClaim')}: ${s.cd} · ${t('weKProof')}: ${s.pd}</span></span></div>
    </div>
  </div>
  <div class="we-ctl">
    <div class="we-row1">
      <input class="we-srch" type="search" id="we_q" value="${esc(weF.q)}" placeholder="${t('wePh')}"
        oninput="weeSet('q',this.value)" aria-label="${t('weSearch')}"/>
    </div>
    <div class="we-row2">
      <div class="we-fld"><label for="we_cat">${t('weCat')}</label>
        <select class="we-sel" id="we_cat" onchange="weeSet('cat',this.value)">
          <option value="">${t('weAllC')}</option>${opt(cats,weF.cat)}</select></div>
      <div class="we-fld"><label for="we_tech">${t('weTech')}</label>
        <select class="we-sel" id="we_tech" onchange="weeSet('tech',this.value)">
          <option value="">${t('weAllT')}</option>${opt(techs,weF.tech)}</select></div>
      <div class="we-fld"><label for="we_proj">${t('weProj')}</label>
        <select class="we-sel" id="we_proj" onchange="weeSet('proj',this.value)">
          <option value="">${t('weAllP')}</option>${opt(allProjectCodes(),weF.proj)}</select></div>
      <div class="we-fld"><label for="we_stat">${t('weStat')}</label>
        <select class="we-sel" id="we_stat" onchange="weeSet('stat',this.value)">
          <option value="">${t('weAllS')}</option>${opt(sts,weF.stat)}</select></div>
      <div class="we-fld"><label for="we_from">${t('weFrom')}</label>
        <input class="we-dt" id="we_from" type="date" value="${weF.from}" onchange="weeSet('from',this.value)"/></div>
      <div class="we-fld"><label for="we_to">${t('weTo')}</label>
        <input class="we-dt" id="we_to" type="date" value="${weF.to}" onchange="weeSet('to',this.value)"/></div>
      <div class="we-acts">
        <button class="btn sm sec" onclick="weeClear()">${t('weReset')}</button>
        <button class="btn sm" onclick="weZip()" ${wzBusy||!all.length?'disabled':''}
          title="${t('wzHint')}">⬇ ${t('wzBtn')}</button>
      </div>
    </div>
  </div>`;

  if(!all.length){
    return head+`<div class="we-stage"><div class="we-empty">
      <h3>${t('weNoneT')}</h3><p>${t('weNoneS')}</p></div></div>`;
  }

  const pg=pages>1?`<div class="we-pg">
    <button onclick="weeGo(${wePg-1})" ${wePg<=1?'disabled':''}>${t('wePrevP')}</button>
    <span class="we-pgn">${wePg} / ${pages}</span>
    <button onclick="weeGo(${wePg+1})" ${wePg>=pages?'disabled':''}>${t('weNextP')}</button>
  </div>`:'';

  // The table is a LENS over the same `all` rows — one pipeline, two views.
  if(weView==='table'){
    return head+
      `<div class="we-meta"><span>${t('weShow')} <b>${all.length}</b> ${t('weResults')}</span></div>
      ${weTable(weTblRows())}`;
  }
  return head+
    `<div class="we-meta"><span>${t('weShow')} <b>${all.length}</b> ${t('weResults')}</span>
      <span>${(wePg-1)*WE_PAGE+1}–${Math.min(wePg*WE_PAGE,all.length)}</span></div>
    <div class="we-stage"><div class="we-grid">${rows.map(weTile).join('')}</div></div>${pg}`;
}

/* ===== IMAGE & DOCUMENT STUDIO — Phase 4: table view =====
   The table is a LENS over weRows() — the same filtered set the gallery, the KPI
   cards and the ZIP already use. No second filtering pipeline exists.

   §10 performance: weAtt()+weIsImage() run once per row per render and the result
   is cached on weTblCache, keyed by the row id and the filter signature. Sorting
   and paging read the cache instead of re-classifying every attachment. */
let weView='grid';          // 'grid' | 'table'
let weSort='id';            // id | received | updated | status | staff | img | doc
let weDir=-1;               // -1 desc, 1 asc
let weTblCache=null;        // {sig, rows}

/* No updated_at column exists in the schema, so "last updated" is derived from
   the newest real timestamp the row actually carries. Nothing is invented. */
function weUpdated(r){
  const c=[r.confirmedAt,r.rejectedAt,r.pendingConfirmAt,r.startedAt,r.receivedAt,r.closed,r.received]
    .filter(Boolean).map(x=>String(x));
  if(!c.length)return '';
  return c.sort().pop();
}
/* One classification pass per row, cached. */
function weTblRows(){
  // The signature must be computable WITHOUT touching the rows, otherwise
  // weRows() re-classifies every attachment on what should be a cache hit.
  // weF + the request count + the sort fully determine the result.
  // The signature must change whenever the DATA changes, not just its length —
  // editing a task in place (same count) must not serve stale counts. Summing the
  // ids and attachment lengths is cheap and catches edits, adds and deletes,
  // without touching 10 call sites that could fall out of sync.
  let stamp=0;
  const src=state.requests||[];
  for(let i=0;i<src.length;i++){
    const r=src[i];
    stamp+=(r.id||0)
      +(r.images?r.images.length:0)+(r.closeoutImages?r.closeoutImages.length:0)
      +(r.files?r.files.length:0)+(r.closeoutFiles?r.closeoutFiles.length:0)
      +(r.status?r.status.length:0)+(r.assignedTo?r.assignedTo.length:0);
  }
  const sig=JSON.stringify(weF)+'|'+src.length+'|'+stamp+'|'+weSort+'|'+weDir;
  if(weTblCache&&weTblCache.sig===sig)return weTblCache.rows;
  const base=weRows();
  const rows=base.map(r=>{
    const a=weAtt(r);
    let ci=0,pi=0,cd=0,pd=0;
    a.ci.forEach(u=>{ weIsImage(u)?ci++:cd++; });
    a.pi.forEach(u=>{ weIsImage(u)?pi++:pd++; });
    a.cd.forEach(f=>{ weIsImage(f)?ci++:cd++; });
    a.pd.forEach(f=>{ weIsImage(f)?pi++:pd++; });
    return {r:r, a:a, ci:ci, pi:pi, img:ci+pi, cd:cd, pd:pd, doc:cd+pd, upd:weUpdated(r)};
  });
  const key=(x)=>{
    switch(weSort){
      case 'received': return String(x.r.received||'');
      case 'updated' : return x.upd;
      case 'status'  : return String(x.r.effStatus||'');
      case 'staff'   : return String(x.r.assignedTo||'');
      case 'img'     : return x.img;
      case 'doc'     : return x.doc;
      default        : return x.r.id;
    }
  };
  rows.sort((p,q)=>{
    const A=key(p),B=key(q);
    if(A<B)return -1*weDir;
    if(A>B)return  1*weDir;
    return (p.r.id-q.r.id)*weDir;      // stable tiebreak
  });
  weTblCache={sig:sig, rows:rows};
  return rows;
}
function weSetView(v){ weView=v; wePg=1; render(); }
function weSetSort(k){
  if(weSort===k)weDir=-weDir; else { weSort=k; weDir=(k==='id'||k==='received'||k==='updated')?-1:1; }
  wePg=1; render();
}
function weSetRows(n){ WE_ROWS=parseInt(n,10)||25; wePg=1; try{LS.set('advacon_we_rows',String(WE_ROWS));}catch(e){} render(); }

/* Open the gallery straight from a count — no navigation, no drawer first. */
function weGoImgs(id,side){
  const r=state.requests.map(calc).find(x=>x.id===id);
  if(!r)return;
  const a=weAtt(r);
  const list=(side==='c'?a.ci:a.pi).filter(u=>weIsImage(u))
    .concat((side==='c'?a.cd:a.pd).filter(f=>weIsImage(f)).map(f=>f.url));
  if(!list.length)return;
  openGallery(id,list,0);
}
/* Documents open in the details panel's Files tab — the component that already
   lists them, rather than a second list widget. */
function weGoDocs(id,side){
  if(state.role==='admin'){adminDetail(id,1);return;}
  weSel=id; wpFor=id; wpTab='docs';
  renderPanel();
}

function weTable(rows){
  if(!rows.length)return `<div class="we-tbl-wrap"><div class="we-empty2">${t('weNoRes')}</div></div>`;
  const total=Math.max(1,Math.ceil(rows.length/WE_ROWS));
  if(wePg>total)wePg=total;
  const page=rows.slice((wePg-1)*WE_ROWS,(wePg-1)*WE_ROWS+WE_ROWS);
  const ar=(k)=>weSort===k?(weDir===1?'▲':'▼'):'';
  const th=(k,lab)=>`<th class="srt ${weSort===k?'on':''}" onclick="weSetSort('${k}')">${lab}<span class="ar">${ar(k)||'⇅'}</span></th>`;
  const cnt=(n,id,fn,side)=>n?`<button class="we-cnt" onclick="event.stopPropagation();${fn}(${id},'${side}')">${n}</button>`
    :`<span class="we-cnt zero">0</span>`;

  const body=page.map(x=>{
    const r=x.r;
    return `<tr class="${weSel===r.id?'sel':''}" tabindex="0" onclick="weePick(${r.id})"
      onkeydown="if(event.key==='Enter'){event.preventDefault();weePick(${r.id});}">
      <td data-l="${t('weCID')}" class="we-tid">${fmtID(r.id)}</td>
      <td data-l="${t('weCat')}" class="hide-m">${esc(r.category||'—')}</td>
      <td data-l="${t('weProj')}">${esc(r.project||'—')}</td>
      <td data-l="${t('weCTtl')}" class="we-ttl2" title="${esc(r.title||'')}">${esc(r.title||'—')}</td>
      <td data-l="${t('weTech')}">${esc(r.assignedTo?staffDisp(r.assignedTo):'—')}</td>
      <td data-l="${t('weStat')}">${effBadge(r)}</td>
      <td data-l="${t('weCCI')}" class="we-num">${cnt(x.ci,r.id,'weGoImgs','c')}</td>
      <td data-l="${t('weCEI')}" class="we-num">${cnt(x.pi,r.id,'weGoImgs','p')}</td>
      <td data-l="${t('weCTI')}" class="we-num we-tot">${x.img}</td>
      <td data-l="${t('weCCD')}" class="we-num">${cnt(x.cd,r.id,'weGoDocs','c')}</td>
      <td data-l="${t('weCED')}" class="we-num">${cnt(x.pd,r.id,'weGoDocs','p')}</td>
      <td data-l="${t('weCTD')}" class="we-num we-tot">${x.doc}</td>
      <td data-l="${t('weCCrt')}" class="we-dt2 hide-m">${esc((r.received||'').slice(0,10)||'—')}</td>
      <td data-l="${t('weCUpd')}" class="we-dt2 hide-m">${esc((x.upd||'').slice(0,10)||'—')}</td>
      <td data-l="${t('weCAct')}"><button class="we-act"
        onclick="event.stopPropagation();weePick(${r.id})">${t('weCOpen')}</button></td>
    </tr>`;
  }).join('');

  return `<div class="we-tbl-wrap"><table class="we-tbl">
    <thead><tr>
      ${th('id',t('weCID'))}
      <th class="hide-m">${t('weCat')}</th>
      <th>${t('weProj')}</th>
      <th>${t('weCTtl')}</th>
      ${th('staff',t('weTech'))}
      ${th('status',t('weStat'))}
      <th>${t('weCCI')}</th>
      <th>${t('weCEI')}</th>
      ${th('img',t('weCTI'))}
      <th>${t('weCCD')}</th>
      <th>${t('weCED')}</th>
      ${th('doc',t('weCTD'))}
      ${th('received',t('weCCrt'))}
      ${th('updated',t('weCUpd'))}
      <th>${t('weCAct')}</th>
    </tr></thead><tbody>${body}</tbody></table></div>
  <div class="we-pg">
    <span>${t('weShow')} <b>${(wePg-1)*WE_ROWS+1}–${Math.min(wePg*WE_ROWS,rows.length)}</b> / ${rows.length}</span>
    <div class="sp">
      <label for="we_rows">${t('weRowsL')}</label>
      <select class="we-rows" id="we_rows" onchange="weSetRows(this.value)">
        ${[10,25,50,100].map(n=>`<option ${WE_ROWS===n?'selected':''}>${n}</option>`).join('')}
      </select>
      ${total>1?`<button class="btn sm sec" ${wePg<=1?'disabled':''} onclick="weeGo(${wePg-1})">‹</button>
      <span>${wePg} / ${total}</span>
      <button class="btn sm sec" ${wePg>=total?'disabled':''} onclick="weeGo(${wePg+1})">›</button>`:''}

}

/* ===== WORK EVIDENCE — Phase 3: filtered ZIP export =====
   Exports the CURRENT FILTERED result set (weRows()), not the visible page and
   not the whole archive. No RPC, no table read, no Storage change: it fetches
   only the attachment URLs already present in state.requests.

   JSZip 3.10.1 is already loaded from cdnjs in <head> — no new library.

   Concurrency is capped so a 300-file export does not fire 300 requests at once
   and does not freeze the tab. A failed file never aborts the package; it is
   recorded in failed-downloads.txt instead. */
const WZ_CONC=4;                 // parallel downloads — enough to be quick, small enough to be polite
let wzBusy=false;
let wzCancel=false;

function wzSafe(name){
  // strip what Windows and macOS reject, keep Arabic and the rest of Unicode
  let s=String(name||'').replace(/[<>:"/\\|?*\x00-\x1F]/g,'_').replace(/\s+/g,' ').trim();
  s=s.replace(/^\.+/,'').replace(/\.+$/,'');
  if(!s)s='file';
  if(s.length>90){                       // keep the extension when truncating
    const d=s.lastIndexOf('.');
    const ext=(d>0&&s.length-d<=8)?s.slice(d):'';
    s=s.slice(0,90-ext.length)+ext;
  }
  return s;
}
function wzExt(u){
  const m=String(u||'').split('?')[0].match(/\.([A-Za-z0-9]{1,5})$/);
  return m?('.'+m[1].toLowerCase()):'';
}
/* a name already used in this folder becomes name_2, name_3 … */
function wzUniq(used,folder,name){
  const key=folder+'/'+name.toLowerCase();
  if(!used[key]){used[key]=1;return name;}
  const d=name.lastIndexOf('.');
  const base=d>0?name.slice(0,d):name;
  const ext=d>0?name.slice(d):'';
  let n=used[key]+1;
  while(used[folder+'/'+(base+'_'+n+ext).toLowerCase()])n++;
  used[key]=n;
  const out=base+'_'+n+ext;
  used[folder+'/'+out.toLowerCase()]=1;
  return out;
}
function wzCsvCell(v){
  // Titles and names come from the public request form. Excel treats a leading
  // = + - @ as a formula, so neutralise it with a leading apostrophe first.
  let s=String(v==null?'':v);
  if(/^[=+\-@\t\r]/.test(s.replace(/^[\s\u00A0]+/,'')))s="'"+s;
  return '"'+s.replace(/"/g,'""')+'"';
}

function wzProgress(done,total,files,fails,now,finished){
  const el=document.getElementById('wz_box');
  if(!el)return;
  const pct=total?Math.round(done/total*100):0;
  const fill=el.querySelector('.wz-fill');
  if(fill){fill.style.width=pct+'%';if(finished)fill.classList.add('done');}
  const s=el.querySelector('.wz-st');
  if(s)s.innerHTML='<span>'+t('wzTasks')+' <b>'+done+' / '+total+'</b></span>'+
    '<span>'+t('wzFiles')+' <b>'+files+'</b></span>';
  const n=el.querySelector('.wz-now');
  if(n)n.textContent=now||'';
  const e=el.querySelector('.wz-err');
  if(e)e.textContent=fails?(fails+' '+t('wzFailed')):'';
}
function wzClose(){
  const b=document.getElementById('wz_back');
  if(b)b.remove();
}
function wzStop(){ wzCancel=true; }

/* fetch one url -> blob; never throws, so one bad file cannot kill the package */
function wzGet(url){
  return fetch(url,{cache:'no-store'})
    .then(function(r){ if(!r.ok)throw new Error('HTTP '+r.status); return r.blob(); })
    .then(function(b){ return {ok:true,blob:b}; })
    .catch(function(e){ return {ok:false,err:(e&&e.message)||'failed'}; });
}
/* run jobs with a fixed number of workers instead of Promise.all on everything */
function wzPool(jobs,limit,onEach){
  let i=0;
  const worker=function(){
    if(wzCancel||i>=jobs.length)return Promise.resolve();
    const job=jobs[i++];
    return wzGet(job.url).then(function(res){
      onEach(job,res);
      return worker();
    });
  };
  const n=Math.min(limit,jobs.length);
  const runners=[];
  for(let k=0;k<n;k++)runners.push(worker());
  return Promise.all(runners);
}

async function weZip(){
  if(wzBusy)return;
  // §8: same filtered set, in the order the user is actually looking at.
  // weTblRows() IS weRows() + the active sort — one pipeline, not a second one.
  const rows=weTblRows().map(x=>x.r);        // CURRENT filtered set, sorted, all pages
  if(!rows.length){ toast(t('weNoneT')); return; }
  if(typeof JSZip==='undefined'){ toast(t('wzNoLib')); return; }

  wzBusy=true; wzCancel=false;
  render();

  const back=document.createElement('div');
  back.id='wz_back'; back.className='wz-back';
  back.innerHTML='<div class="wz" id="wz_box" role="dialog" aria-modal="true">'+
    '<div class="wz-hd">'+t('wzTitle')+'</div>'+
    '<div class="wz-bd"><div class="wz-bar"><div class="wz-fill"></div></div>'+
    '<div class="wz-st"></div><div class="wz-now"></div><div class="wz-err"></div></div>'+
    '<div class="wz-ft"><button class="btn sm sec" onclick="wzStop()">'+t('wzCancel')+'</button></div>'+
    '</div>';
  document.body.appendChild(back);

  const zip=new JSZip();
  const root='Image-Document-Studio_'+weDay(0);
  const folder=zip.folder(root);
  const used={};
  const failed=[];
  let filesOk=0, taskN=0;

  // index.csv — built from the same rows, so it always matches the folders
  const csv=[['Task ID','Title','Project','Category','Status','Requester','Technician',
    'Received Date','Completion Date','Complaint Images','Evidence Images','Total Images',
    'Complaint Documents','Evidence Documents','Total Documents']
    .map(wzCsvCell).join(',')];

  for(const r of rows){
    if(wzCancel)break;
    const a=weAtt(r);
    const tid=fmtID(r.id);
    const tf=folder.folder(tid);

    // Classify with weIsImage — the SAME helper the KPI cards use — so the CSV
    // counts and the folder each file lands in always agree with the cards.
    // A photo uploaded through the files field belongs in Images/, and a PDF
    // that arrived through the images column belongs in Files/.
    const bins={ci:[],pi:[],cd:[],pd:[]};
    a.ci.forEach(u=>{ (weIsImage(u)?bins.ci:bins.cd).push({url:u,name:null}); });
    a.pi.forEach(u=>{ (weIsImage(u)?bins.pi:bins.pd).push({url:u,name:null}); });
    a.cd.forEach(f=>{ (weIsImage(f)?bins.ci:bins.cd).push({url:f.url,name:f.name||null}); });
    a.pd.forEach(f=>{ (weIsImage(f)?bins.pi:bins.pd).push({url:f.url,name:f.name||null}); });

    csv.push([tid, r.title||'', r.project||'', r.category||'', r.effStatus||'',
      r.requestedBy||'', r.assignedTo||'', (r.received||'').slice(0,10), r.closed||'',
      bins.ci.length, bins.pi.length, bins.ci.length+bins.pi.length,
      bins.cd.length, bins.pd.length, bins.cd.length+bins.pd.length].map(wzCsvCell).join(','));

    // requester = Complaint, technician = Evidence — the page's own vocabulary
    const jobs=[];
    const add=(list,dir,prefix,isImg)=>list.forEach((f,i)=>{
      const nm=f.name?wzSafe(f.name)
        :(prefix+'_'+String(i+1).padStart(2,'0')+(wzExt(f.url)||(isImg?'.jpg':'')));
      jobs.push({url:f.url, dir:dir, name:wzUniq(used,dir,nm)});
    });
    add(bins.ci, tid+'/Complaint/Images','Complaint_Image',true);
    add(bins.pi, tid+'/Evidence/Images', 'Evidence_Image', true);
    add(bins.cd, tid+'/Complaint/Files', 'Complaint_File', false);
    add(bins.pd, tid+'/Evidence/Files',  'Evidence_File',  false);

    await wzPool(jobs, WZ_CONC, function(job,res){
      if(res.ok){ zip.file(root+'/'+job.dir+'/'+job.name, res.blob); filesOk++; }
      else { failed.push(tid+'  '+job.dir+'/'+job.name+'  —  '+res.err+'  —  '+job.url); }
      wzProgress(taskN, rows.length, filesOk, failed.length, job.name);
    });

    taskN++;
    wzProgress(taskN, rows.length, filesOk, failed.length, tid);
    await new Promise(r2=>setTimeout(r2,0));   // yield so the UI stays alive
  }

  if(wzCancel){ wzClose(); wzBusy=false; render(); toast(t('wzCancelled')); return; }

  folder.file('index.csv','\ufeff'+csv.join('\r\n'));
  if(failed.length){
    folder.file('failed-downloads.txt',
      t('wzFailHdr')+'\r\n\r\n'+failed.join('\r\n')+'\r\n');
  }

  // Compression cannot be cancelled — retire the control rather than leave a
  // button that does nothing.
  const ft=document.querySelector('#wz_box .wz-ft');
  if(ft)ft.innerHTML='<span class="wz-now">'+t('wzZipping')+'</span>';
  wzProgress(rows.length, rows.length, filesOk, failed.length, t('wzZipping'));
  try{
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',
      compressionOptions:{level:6}}, function(m){
        const el=document.getElementById('wz_box');
        if(el){const n=el.querySelector('.wz-now');if(n)n.textContent=t('wzZipping')+' '+Math.round(m.percent)+'%';}
      });
    const a2=document.createElement('a');
    a2.href=URL.createObjectURL(blob);
    a2.download=root+'.zip';
    a2.click();
    setTimeout(function(){URL.revokeObjectURL(a2.href);},4000);
    wzProgress(rows.length, rows.length, filesOk, failed.length, '', true);
    toast(filesOk+' '+t('wzDone')+(failed.length?(' · '+failed.length+' '+t('wzFailed')):''));
  }catch(e){
    toast(t('wzErr'));
  }
  setTimeout(wzClose,700);
  wzBusy=false;
  render();
}

/* ===== WORK EVIDENCE — Phase 2: the details panel =====
   Slides in over the gallery, which stays visible behind it. No refetch: the
   task comes from state.requests, already loaded by admin_get_requests().
   Images reuse the existing openGallery(id,list,start) — no second lightbox.

   Documented gap: the schema has no accepted_at, so there is no "Accepted"
   timeline event. The brief says only show events with real dates, so it is
   omitted rather than faked. sched_start carries when work was scheduled. */
let wpTab='';       // '', 'claim', 'proof', 'docs' — '' means pick the first non-empty
let wpFor=0;        // which task wpTab belongs to; without this the tab leaks between tasks

function openEvidencePanel(taskId){
  if(state.role==='admin'){weSel=0;adminDetail(taskId,1);return;}
  if(wpFor!==taskId){ wpTab=''; wpFor=taskId; }
  renderPanel();
}
function weClosePanel(){
  weSel=0; wpTab=''; wpFor=0;
  const b=document.getElementById('wp_back'), p=document.getElementById('wp_panel');
  if(b)b.remove();
  if(p)p.remove();
  document.removeEventListener('keydown', wpKey);
  render();
}
function wpKey(e){ if(e.key==='Escape')weClosePanel(); }
function wpGo(tab){ wpTab=tab; renderPanel(); }

function wpDate(v){
  if(!v)return '';
  const s=String(v);
  if(s.length<=10)return s;                       // already a plain date
  const d=new Date(s);
  if(isNaN(d))return s.slice(0,10);
  return d.toLocaleString('en-CA',{timeZone:'Asia/Riyadh',hour12:false,
    year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(',','');
}

function renderPanel(){
  const r=state.requests.map(calc).find(x=>x.id===weSel);
  if(!r){ weClosePanel(); return; }
  const a=weAtt(r);

  const has={claim:a.ci.length+a.cd.length>0, proof:a.pi.length+a.pd.length>0,
             docs:a.cd.length+a.pd.length>0};
  // a tab chosen for a DIFFERENT task must not carry over
  if(wpFor!==r.id){ wpTab=''; wpFor=r.id; }
  // evidence first — proving the work was done is the point of the page
  if(!wpTab||!has[wpTab]) wpTab = has.proof?'proof' : (has.claim?'claim' : 'docs');

  const thumbs=(list)=>{
    if(!list.length)return '';
    const urls=JSON.stringify(list.map(x=>x.url||x)).replace(/"/g,'&quot;');
    return `<div class="wp-thumbs">`+list.map((im,i)=>{
      const u=im.url||im;
      return `<img class="wp-th" src="${esc(u)}" loading="lazy" tabindex="0"
        alt="${esc(r.title||'')} ${i+1}" onerror="weFallback(this)"
        onclick="openGallery(${r.id},${urls},${i})"
        onkeydown="if(event.key==='Enter')openGallery(${r.id},${urls},${i});"/>`;
    }).join('')+`</div>`;
  };
  const docs=(list,prefix)=>{
    if(!list.length)return '';
    return `<div class="wp-docs">`+list.map((f,i)=>{
      const nm=f.name||(prefix+'_'+String(i+1).padStart(3,'0'));
      const ext=String(f.name||f.url||'').split('.').pop().toUpperCase().slice(0,4);
      return `<a class="wp-doc" href="${esc(f.url)}" target="_blank" rel="noopener">
        <i>${weIcon(f.name||f.url)}</i><span>${esc(nm)}</span><b>${esc(ext)}</b></a>`;
    }).join('')+`</div>`;
  };

  let media='';
  if(wpTab==='claim'){
    media=`${a.ci.length?`<div class="wp-sec"><h4>${t('weReqImg')}</h4>${thumbs(a.ci)}</div>`:''}
           ${a.cd.length?`<div class="wp-sec"><h4>${t('weReqDoc')}</h4>${docs(a.cd,'Requester_Document')}</div>`:''}`;
  }else if(wpTab==='proof'){
    media=`${a.pi.length?`<div class="wp-sec"><h4>${t('weTecImg')}</h4>${thumbs(a.pi)}</div>`:''}
           ${a.pd.length?`<div class="wp-sec"><h4>${t('weTecDoc')}</h4>${docs(a.pd,'Technician_Document')}</div>`:''}
           ${r.closeoutNote?`<div class="wp-sec"><h4>${t('wpCloseNote')}</h4><div class="wp-note">${esc(r.closeoutNote)}</div></div>`:''}`;
  }else{
    media=`${a.cd.length?`<div class="wp-sec"><h4>${t('weReqDoc')}</h4>${docs(a.cd,'Requester_Document')}</div>`:''}
           ${a.pd.length?`<div class="wp-sec"><h4>${t('weTecDoc')}</h4>${docs(a.pd,'Technician_Document')}</div>`:''}`;
  }

  const tab=(k,lab,n)=>has[k]?`<button class="wp-tab ${wpTab===k?'on':''}" onclick="wpGo('${k}')">${lab}<span class="wp-n">${n}</span></button>`:'';
  const row=(k,v)=>v?`<dt>${k}</dt><dd>${esc(v)}</dd>`:'';

  // only events that carry a real date
  const evs=[];
  const push=(lab,d,cls)=>{ if(d)evs.push({lab:lab,d:wpDate(d),cls:cls||''}); };
  push(t('wpEvRec'),  r.receivedAt||r.received);
  push(t('wpEvSched'),r.schedStart);
  push(t('wpEvStart'),r.startedAt);
  push(t('wpEvSub'),  r.pendingConfirmAt);
  if(r.status==='Rejected'||r.status==='Cancelled') push(t('wpEvClosed'), r.rejectedAt||r.closed, 'no');
  else push(t('wpEvDone'), r.confirmedAt||r.closed, 'ok');

  const timeline=evs.length?`<div class="wp-sec"><h4>${t('wpTimeline')}</h4><div class="wp-tl">`+
    evs.map(e=>`<div class="wp-ev"><span class="wp-dot ${e.cls}"></span>
      <div class="wp-ec"><b>${e.lab}</b><span>${esc(e.d)}</span></div></div>`).join('')+
    `</div></div>`:'';

  const reason=(r.rejectReason&&(r.status==='Rejected'||r.status==='Cancelled'))
    ? `<div class="wp-sec"><h4>${t('wpReason')}</h4><div class="wp-note rej">${esc(r.rejectReason)}</div></div>`:'';

  const html=`<div class="wp-hd">
      <div class="wp-r1"><span class="wp-id">${fmtID(r.id)}</span>${effBadge(r)}
        <button class="wp-x" onclick="weClosePanel()" aria-label="${t('wpClose')}">✕</button></div>
      <div class="wp-ttl">${esc(r.title||'—')}</div>
    </div>
    <div class="wp-tabs">
      ${tab('claim',t('weClaim'),a.ci.length+a.cd.length)}
      ${tab('proof',t('weProof'),a.pi.length+a.pd.length)}
      ${tab('docs', t('weKFile'),a.cd.length+a.pd.length)}
    </div>
    <div class="wp-body">
      ${media||`<div class="wp-sec"><div class="wp-note">${t('weNoneG')}</div></div>`}
      <div class="wp-sec"><h4>${t('wpInfo')}</h4><dl class="wp-info">
        ${row(t('weProj'),  r.project)}
        ${row(t('weCat'),   r.category)}
        ${row(t('wpPrio'),  r.priority)}
        ${row(t('wpBy'),    r.requestedBy)}
        ${row(t('weTech'),  r.assignedTo)}
        ${row(t('wpRec'),   (r.received||'').slice(0,10))}
        ${row(t('wpSched'), r.schedStart?wpDate(r.schedStart):'')}
        ${row(t('wpDone'),  r.closed)}
      </dl></div>
      ${timeline}
      ${reason}
      ${r.managerNote?`<div class="wp-sec"><h4>${t('wpMgr')}</h4><div class="wp-note">${esc(r.managerNote)}</div></div>`:''}
    </div>
    <div class="wp-ft">
      <button class="btn sm sec" onclick="weClosePanel()">${t('wpClose')}</button>
      <button class="btn sm" onclick="wpOpenTask(${r.id})">${t('wpOpenTask')}</button>
    </div>`;

  let back=document.getElementById('wp_back'), p=document.getElementById('wp_panel');
  if(!back){
    back=document.createElement('div');
    back.id='wp_back'; back.className='wp-back';
    back.onclick=weClosePanel;
    document.body.appendChild(back);
  }
  if(!p){
    p=document.createElement('aside');
    p.id='wp_panel'; p.className='wp';
    p.setAttribute('role','dialog');
    p.setAttribute('aria-modal','true');
    document.body.appendChild(p);
    document.addEventListener('keydown', wpKey);
  }
  p.innerHTML=html;
  const x=p.querySelector('.wp-x');
  if(x)x.focus();
}

/* ===== REQUEST + THANKS ===== */

// ══════════════════════════════════════════════════════════════════════
//  Material Picker (visitor "New Request" page) — INDEPENDENT overlay.

let reqMaterials=[];      // [{item_id, code, name_ar, name_en, unit_ar, unit_en, available, qty}]
let mpList=null;          // fetched available materials (loaded on open)

// working edit map while the picker is open: item_id → qty(string)
let mpDraft={};

function mpName(m){ return L==='ar' ? (m.name_ar||m.name_en||'') : (m.name_en||m.name_ar||''); }
function mpUnit(m){ return L==='ar' ? (m.unit_name_ar||m.unit_name_en||'') : (m.unit_name_en||m.unit_name_ar||''); }

// ── open / close ──────────────────────────────────────────────────────
async function openMaterialPicker(){

  mpDraft={};

// ── draft edits (in-place, no full re-render → keep input focus) ───────
function mpSetQty(itemId,val){
  mpDraft[itemId]=val;
  mpRefreshRow(itemId);
}
function mpStep(itemId,delta){
  const m=(mpList||[]).find(x=>x.item_id===itemId);
  if(!m)return;
  const cur=Number(mpDraft[itemId]||0);
  let n=cur+delta;
  if(n<0)n=0;
  if(n>Number(m.available_to_request)) n=Number(m.available_to_request);  // clamp to available_to_request
  mpDraft[itemId]=String(n);
  // stepper changes the field value too → refresh the row fully
  const inp=document.getElementById('mpq_'+itemId);
  if(inp) inp.value=mpDraft[itemId];
  mpRefreshRow(itemId);
}
function mpRowState(m){
  const raw=mpDraft[m.item_id];
  const q=(raw===''||raw==null)?0:Number(raw);
  const max=Number(m.available_to_request);
  const bad = isNaN(q) || q<0 || q>max;
  return {q, max, bad};
}
function mpRefreshRow(itemId){
  const m=(mpList||[]).find(x=>x.item_id===itemId);
  if(!m)return;

// ── search ────────────────────────────────────────────────────────────
function mpOnSearch(v){
  const wasSearching=(mpSearch||'').trim().length>0;
  mpSearch=v;
  const nowSearching=(v||'').trim().length>0;
  // toggling between category-grid and search results changes what the body
  // shows, so a full re-render is needed on that transition; otherwise just
  // refresh the list body (keeps focus).
  if(wasSearching!==nowSearching && mpCat==null){ mpRender(); const el=document.getElementById('mp_search'); if(el){el.focus();el.value=v;} }
  else { const box=document.getElementById('mp_list'); if(box) box.innerHTML=((v||'').trim().length>0||mpCat!=null)?mpListBodyHtml():mpCatGridHtml(); mpRefreshFooter(); }
}
function mpFiltered(){
  const q=(mpSearch||'').trim().toLowerCase();
  let arr=mpList||[];
  // when searching, ignore category grouping and search ALL items;
  // otherwise show only the selected category's items.
  if(q){
    arr=arr.filter(m=>{
      return (m.item_code||'').toLowerCase().includes(q)
        || (m.name_ar||'').toLowerCase().includes(q)
        || (m.name_en||'').toLowerCase().includes(q);
    });
  }else if(mpCat!=null){
    if(mpCat==='_none') arr=arr.filter(m=>m.category_id==null);
    else arr=arr.filter(m=>String(m.category_id)===String(mpCat));
  }
  return arr;
}
// distinct categories present in the loaded list, each with its item count.
function mpCategories(){
  const map={};
  (mpList||[]).forEach(m=>{
    const id=m.category_id==null?'_none':String(m.category_id);
    if(!map[id]) map[id]={id:m.category_id, name_ar:m.category_name_ar, name_en:m.category_name_en, count:0};
    map[id].count++;
  });
  return Object.values(map).sort((a,b)=>
    (L==='ar'?(a.name_ar||'zzz'):(a.name_en||'zzz')).localeCompare(
     L==='ar'?(b.name_ar||'zzz'):(b.name_en||'zzz')));
}
function mpCatName(c){ return L==='ar'?(c.name_ar||t('mpNoCat')):(c.name_en||t('mpNoCat')); }
function mpPickCat(id){ mpCat=id; mpSearch=''; mpRender(); }  // id is category uuid or "_none"
function mpBackToCats(){ mpCat=null; mpSearch=''; mpRender(); }

  }else if(!mpList||mpList.length===0){
    body=`<div class="mp-note">${t('mpEmpty')}</div>`;

    // search box is always available; below it either the category grid
    // (no category chosen, no active search) or the item list.
    const searching=(mpSearch||'').trim().length>0;
    const showCats = (mpCat==null && !searching);

      ? `<button class="mp-back" onclick="mpBackToCats()">‹ ${t('mpAllCats')}</button>`

function setSubmitState(){const b=document.getElementById('submitBtn');if(!b)return;if(uploadingCount>0){b.disabled=true;b.classList.add('loading');b.textContent=t('waitUpload');}else{b.disabled=false;b.classList.remove('loading');b.innerHTML=t('submit')+' →';}}
async function handleReqImages(input){
  const files=Array.from(input.files||[]);
  if(!files.length)return;
  const wrap=document.getElementById('img-previews');
  for(const f of files){
    // images had no size check at all — an oversized one used to fail with a raw
    // server error after the upload had already started
    if(!uploadAllowed(f)){toast(t('fileRejected'));continue;}
    const tmpId='t'+Math.random().toString(36).slice(2,8);
    if(wrap){const d=document.createElement('div');d.className='img-prev';d.id=tmpId;d.innerHTML='<span class="upl">'+t('uploading')+'</span>';wrap.appendChild(d);}
    uploadingCount++;setSubmitState();
    try{const url=await sbUploadImage(f);reqImages.push({url,name:f.name});const el=document.getElementById(tmpId);if(el)el.innerHTML='<img src="'+url+'"/><button type="button" onclick="removeReqImage(\''+url+'\')">×</button>';}
    catch(e){console.error('upload failed:',e&&e.message?e.message:e);const el=document.getElementById(tmpId);if(el)el.remove();toast(t('connErr'));}
    finally{uploadingCount=Math.max(0,uploadingCount-1);setSubmitState();}
  }
  input.value='';
}
function removeReqImage(url){reqImages=reqImages.filter(x=>x.url!==url);const wrap=document.getElementById('img-previews');if(wrap){[...wrap.children].forEach(c=>{const img=c.querySelector('img');if(img&&img.src===url)c.remove();});}}
// Storage bucket enforces these server-side (20MB, images+pdf+office only, and
// deliberately NOT svg/html/js — an SVG executes script if opened directly).
// We mirror the rules here so the user gets a clear message instead of a raw
// server rejection; the bucket remains the real guard.
const UPLOAD_MAX_BYTES=20*1024*1024;
const UPLOAD_MIME_OK=['image/jpeg','image/png','image/webp','image/heic','image/heif',
  'application/pdf','application/msword',
  'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  'application/vnd.ms-excel',
  'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  'application/vnd.ms-powerpoint',
  'application/vnd.openxmlformats-officedocument.presentationml.presentation'];
function uploadAllowed(f){
  if(f.size>UPLOAD_MAX_BYTES)return false;
  if(f.type&&UPLOAD_MIME_OK.indexOf(f.type)>=0)return true;
  // some browsers report an empty type; fall back to the extension
  return /\.(jpe?g|png|webp|heic|heif|pdf|docx?|xlsx?|pptx?)$/i.test(f.name);
}
async function handleReqFiles(input){
  const files=Array.from(input.files||[]);
  if(!files.length)return;
  const wrap=document.getElementById('file-previews');
  for(const f of files){
    if(!uploadAllowed(f)){toast(t('fileRejected'));continue;}
    const tmpId='f'+Math.random().toString(36).slice(2,8);
    if(wrap){const d=document.createElement('div');d.className='file-prev';d.id=tmpId;d.innerHTML='<span class="upl">'+t('uploading')+'</span>';wrap.appendChild(d);}
    uploadingCount++;setSubmitState();
    try{const url=await sbUploadFile(f);reqFiles.push({url,name:f.name});const el=document.getElementById(tmpId);if(el)el.innerHTML='<span class="fic">📄</span><span class="fnm">'+esc(f.name)+'</span><button type="button" onclick="removeReqFile(\''+url+'\')">×</button>';}
    catch(e){console.error('upload failed:',e&&e.message?e.message:e);const el=document.getElementById(tmpId);if(el)el.remove();toast(t('connErr'));}
    finally{uploadingCount=Math.max(0,uploadingCount-1);setSubmitState();}
  }
  input.value='';
}
function removeReqFile(url){reqFiles=reqFiles.filter(x=>x.url!==url);const wrap=document.getElementById('file-previews');if(wrap){[...wrap.children].forEach(c=>{const b=c.querySelector('button');if(b&&b.getAttribute('onclick')&&b.getAttribute('onclick').includes(url))c.remove();});}}

function identityError(code){const ar=L==='ar';return ({invalid_iqama:ar?'أدخل رقم إقامة من 10 أرقام.':'Enter a 10-digit identity number.',employee_not_registered:ar?'الإقامة غير معرّفة أو حساب الموظف غير نشط. راجع المسؤول.':'Identity is not registered or employee is inactive. Contact the administrator.',employee_phone_missing:ar?'رقم الجوال غير مسجّل في ملفك. راجع المسؤول لتحديثه.':'Your employee record has no mobile number. Contact the administrator.',lookup_rate_limited:ar?'محاولات كثيرة. انتظر دقيقة وأعد المحاولة.':'Too many attempts. Wait one minute and retry.',identity_expired:ar?'انتهت مدة التحقق. اضغط تحقق مجددًا.':'Identification expired. Select Verify again.',identity_required:ar?'أدخل الإقامة وتحقق من بياناتك أولًا.':'Enter your identity number first.',ticket_already_used:ar?'تم استخدام هذا التحقق لطلب سابق. تحقق مجددًا لطلب آخر.':'This identification was used for a previous request. Verify again.',request_details_required:ar?'أكمل تفاصيل الطلب.':'Complete the request details.'})[code]|| (ar?'تعذر التحقق. حاول مجددًا.':'Could not identify employee. Please retry.');}
function paintIdentity(message=''){const name=document.getElementById('f_req'),phone=document.getElementById('f_phone'),msg=document.getElementById('identity_msg');if(name)name.value=visitorIdentity.ticket?(L==='ar'?visitorIdentity.name_ar:visitorIdentity.name_en||visitorIdentity.name_ar):'';if(phone)phone.value=visitorIdentity.ticket?visitorIdentity.phone||'':'';if(msg)msg.textContent=message;}
function visitorIdentityChanged(input){clearTimeout(identityTimer);identitySequence++;visitorIdentity={value:input.value.replace(/[٠-٩۰-۹]/g,c=>String(c.charCodeAt(0)-(c<='٩'?1632:1776))).trim(),ticket:null,name_ar:'',name_en:'',phone:''};paintIdentity();if(/^\d{10}$/.test(visitorIdentity.value))identityTimer=setTimeout(identifyVisitor,400);}
async function identifyVisitor(){clearTimeout(identityTimer);const seq=++identitySequence;visitorIdentity.ticket=null;paintIdentity(L==='ar'?'جارٍ جلب بيانات الموظف…':'Loading employee details…');if(!/^\d{10}$/.test(visitorIdentity.value)){paintIdentity(identityError('invalid_iqama'));return;}const r=await submitReqRpc('advacon_visitor_identify',{p_iqama:visitorIdentity.value});if(seq!==identitySequence)return;if(r?.ok){Object.assign(visitorIdentity,r);paintIdentity(L==='ar'?'تم العثور على الموظف. أكمل تفاصيل الطلب.':'Employee found. Complete the request details.');}else paintIdentity(identityError(r?.error));}

// Map wrapper/backend error codes to a clear visitor message.
function submitReqErr(res){
  const e=(res&&res.error)||'';
  const ar=(L==='ar');
  if(e.indexOf('insufficient_available')>=0)
    return ar?'تغيّرت الكميات المتاحة. افتح المواد وحدّث الكميات.':'Available quantities changed. Open materials and update.';
  if(e==='material_request_already_exists')
    return ar?'يوجد طلب مواد قائم لهذا الطلب.':'A material request already exists for this task.';
  if(e==='invalid_material_lines')
    return ar?'بيانات المواد غير صحيحة.':'Material data is invalid.';
  return admOpError(res);   // fall back to the generic mapper
}
async function submitReq(){
  if(uploadingCount>0){toast(t('waitUpload'));return;}
  const req=document.getElementById('f_req').value.trim(),phone=document.getElementById('f_phone').value.trim(),proj=document.getElementById('f_proj').value,cat=document.getElementById('f_cat').value,title=document.getElementById('f_title').value.trim();
  if(!visitorIdentity.ticket){toast(identityError('identity_required'));return;}if(!proj||!cat||!title){toast(t('fillReq'));return;}
  const btn=document.getElementById('submitBtn');if(btn){btn.disabled=true;btn.classList.add('loading');btn.textContent=t('sending');}
  // Visitor submit via the ATOMIC wrapper: creates the service request AND
  // (if any) the material request in ONE transaction. Materials fail →
  // whole thing rolls back, no orphan service request.
  const imagesJson=JSON.stringify(reqImages.map(x=>x.url));
  const filesJson=JSON.stringify(reqFiles.map(x=>({url:x.url,name:x.name})));
  const materialLines = reqMaterials.length
    ? reqMaterials.map(r=>({item_id:r.item_id, requested_qty:Number(r.qty)}))
    : null;   // null → plain service request (pkg17 rule)
  let id=null;
  try{
    const res=await submitReqRpc('advacon_submit_employee_request',{
      p_ticket:visitorIdentity.ticket, p_project:proj, p_category:cat,
      p_priority:document.getElementById('f_pri').value||'Medium', p_title:title,
      p_images:imagesJson, p_files:filesJson,
      p_lines:materialLines});
    if(res&&res.ok===true){id=res.task_id;}

let mrProc=null;   // {taskId, det, loading, err, edit:{line_id:{approved, allocs:{iw:qty}}}, busy, rejecting}

// admRpc collapses PG errors to http_<code>; this reads the JSON error body on
// non-2xx so codes like approved_qty_mismatch / insufficient_stock survive.
let mrIssuing=false;
async function mrRpc(fn,args){
  const okSess=await admEnsureSession();
  if(!okSess)return {ok:false,error:'session'};
  const sess=admGetSession();
  try{
    const res=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+sess.access_token,'Content-Type':'application/json'},
      body:JSON.stringify(args||{})});
    if(res.status===401||res.status===403)return {ok:false,error:'session'};
    if(!res.ok){
      let code='http_'+res.status;
      try{ const b=await res.json(); code=b.message||b.error||b.details||code; }catch(e){}
      return {ok:false,error:code};
    }
    try{ return await res.json(); }catch(e){ return null; }
  }catch(e){return {ok:false,error:'network'};}
}

function openMaterialProc(taskId){

async function mrLoadProcDetail(taskId){
  try{
    const res=await mrRpc('material_request_detail_by_request',{p_request_id:taskId});
    if(res&&res.mr_id){
      mrProc.det=res;
      const edit={};
      (res.lines||[]).forEach(ln=>{ edit[ln.line_id]={approved:'', allocs:{}}; });
      mrProc.edit=edit;
    }else{
      mrProc.err=(res&&res.error)||'load';
    }
  }catch(e){ mrProc.err='load'; }
  mrProc.loading=false;
  if(modal&&modal.type==='material') renderModal();
}
function mrCloseProc(){ mrProc=null; modal=null; renderModal(); }

function mrNum(v){ if(v===''||v==null)return 0; const n=Number(v); return isNaN(n)?NaN:n; }
function mrLineAllocated(lineId){
  const e=mrProc.edit[lineId]; if(!e)return 0;
  let s=0; for(const k in e.allocs){ const n=mrNum(e.allocs[k]); if(!isNaN(n))s+=n; } return s;
}
function mrLineState(ln){
  const e=mrProc.edit[ln.line_id]||{approved:'',allocs:{}};
  const decided = e.approved!=='';
  const appr = mrNum(e.approved);
  const req = Number(ln.requested_qty);
  const allocated = mrLineAllocated(ln.line_id);
  let ok=true, why='';
  if(!decided){ ok=false; why='undecided'; }
  else if(isNaN(appr)||appr<0){ ok=false; why='bad_approved'; }
  else if(appr>req){ ok=false; why='over_requested'; }
  else {
    for(const w of (ln.warehouses||[])){
      const q=mrNum(e.allocs[w.item_warehouse_id]);
      if(isNaN(q)||q<0){ ok=false; why='bad_alloc'; break; }
      if(q>Number(w.available)){ ok=false; why='over_avail'; break; }
      if(q>0 && w.warehouse_is_open===false){ ok=false; why='closed_wh'; break; }
    }
    if(ok && allocated!==appr){ ok=false; why='sum_mismatch'; }
  }
  return {decided, appr, req, allocated, ok, why};
}
function mrAllLinesOk(){
  if(!mrProc||!mrProc.det)return false;
  return (mrProc.det.lines||[]).every(ln=>mrLineState(ln).ok);
}
function mrSetApproved(lineId,val){
  if(!mrProc.edit[lineId])mrProc.edit[lineId]={approved:'',allocs:{}};
  mrProc.edit[lineId].approved=val;
  mrRefreshLine(lineId);
}
function mrSetAlloc(lineId,iwId,val){
  if(!mrProc.edit[lineId])mrProc.edit[lineId]={approved:'',allocs:{}};
  mrProc.edit[lineId].allocs[iwId]=val;
  mrRefreshLine(lineId);
}
// in-place counter + button update — no innerHTML rebuild → input keeps focus
function mrRefreshLine(lineId){
  if(!mrProc||!mrProc.det)return;
  const ln=(mrProc.det.lines||[]).find(x=>x.line_id===lineId);
  if(!ln)return;
  const st=mrLineState(ln);
  const el=document.getElementById('mrc_'+lineId);
  if(el){
    el.className='mrp-counter '+(st.decided?(st.ok?'mrp-ok':'mrp-bad'):'mrp-idle');
    el.innerHTML = st.decided
      ? `${t('mrAllocated')}: <b>${st.allocated}</b> / ${t('mrApproved')} <b>${isNaN(st.appr)?'—':st.appr}</b> ${st.ok?'✓':''}`
      : t('mrDecideHint');
  }
  const btn=document.getElementById('mr_approve_btn');
  if(btn){ btn.disabled = !mrAllLinesOk() || mrProc.busy; }
}
function mrBuildDecisions(){
  const decisions=[];
  (mrProc.det.lines||[]).forEach(ln=>{
    const e=mrProc.edit[ln.line_id];
    const allocations=[];
    (ln.warehouses||[]).forEach(w=>{
      const q=mrNum(e.allocs[w.item_warehouse_id]);
      if(q>0) allocations.push({item_warehouse_id:w.item_warehouse_id, qty:q});
    });
    decisions.push({line_id:ln.line_id, approved_qty:mrNum(e.approved), allocations});
  });
  return decisions;
}
async function mrDoApprove(){   // now: PREPARE (allocate) — reserves, does not issue
  if(!mrAllLinesOk()||mrProc.busy)return;
  mrProc.busy=true; renderModal();
  try{
    const res=await mrRpc('allocate_material_request',
      {p_mr_id:mrProc.det.mr_id, p_decisions:mrBuildDecisions()});
    if(res===null || (res&&res.ok!==false && !res.error)){
      toast(t('mrPreparedToast')); mrCloseProc(); await admReloadRequests(); return;
    }
    mrProc.err=(res&&res.error)||'fail'; mrProc.busy=false; renderModal();
  }catch(e){ mrProc.err='network'; mrProc.busy=false; renderModal(); }
}

async function mrDoIssue(taskId){

function mrApproveErr(res){
  const e=(res&&res.error)||(res&&res.message)||'';
  const ar=(L==='ar');
  const M={
    approved_qty_mismatch: ar?'مجموع التوزيع لا يساوي الكمية المعتمدة':'Allocation sum must equal approved qty',
    not_all_lines_decided: ar?'يجب اتخاذ قرار لكل مادة':'Every line needs a decision',
    not_in_pending_state: ar?'الطلب لم يعد بانتظار المعالجة':'Request is no longer pending',
    insufficient_stock: ar?'المخزون غير كافٍ':'Insufficient stock',
    would_break_reserved: ar?'المتاح غير كافٍ (جزء محجوز)':'Not enough available (some reserved)',
    material_request_not_found: ar?'طلب المواد غير موجود':'Material request not found',
    no_material_request: ar?'لا يوجد طلب مواد لهذه المهمة':'No material request for this task',
    session: ar?'انتهت الجلسة — سجّل الدخول ثانية':'Session expired — sign in again'
  };
  return M[e] || (ar?'تعذّرت العملية. حاول مجدداً.':'Action failed. Please try again.');
}

/* ── Feature #5: admin edits a task's CLOSEOUT (note/images/files) BEFORE closing.

let coEdit=null;   // {id, note, images:[], files:[], busy, upl}
function openCloseoutEdit(id){

async function coAddImages(input){
  if(!coEdit||!input.files||!input.files.length) return;
  const files=Array.from(input.files); input.value='';

    if(!uploadAllowed(f)){ toast(t('fileRejected')); continue; }

    finally{ coEdit.upl--; if(coEdit.upl<=0)coEdit.busy=false; renderModal(); }
  }
}
async function coAddFiles(input){
  if(!coEdit||!input.files||!input.files.length) return;
  const files=Array.from(input.files); input.value='';

    if(!uploadAllowed(f)){ toast(t('fileRejected')); continue; }
    coEdit.upl++; coEdit.busy=true; renderModal();

async function saveCloseoutEdit(){
  if(!coEdit||coEdit.busy) return;
  if(adminActionBusy) return;
  adminActionBusy=true; coEdit.busy=true; renderModal();
  try{
    const args={
      p_task_id: coEdit.id,
      p_note: (coEdit.note||'').trim()||null,
      p_images: coEdit.images,                       // full replacement array
      p_files: coEdit.files.map(f=>({url:f.url,name:f.name||'PDF'}))
    };

function addInterval(date,n,unit){
  const d=new Date(date);
  if(unit==='hour')d.setTime(d.getTime()+n*3600000);
  else if(unit==='day')d.setTime(d.getTime()+n*86400000);
  else if(unit==='week')d.setTime(d.getTime()+n*7*86400000);
  else if(unit==='month')d.setMonth(d.getMonth()+n);
  else if(unit==='year')d.setFullYear(d.getFullYear()+n);
  return d;
}
let _genRunning=false;
// Maps a schedule to its label and back (weekly <-> 1 week). This lived next to the
// dead runRecurringGenerator and was removed with it — freqKeyOf/freqFromKey below
// still need it, so the Periodic Tasks screen would have thrown on render.
const FREQ_MAP=[['hourly',1,'hour'],['daily',1,'day'],['weekly',1,'week'],['biweekly',2,'week'],['monthly',1,'month'],['bimonthly',2,'month'],['quarterly',3,'month'],['semiannual',6,'month'],['yearly',1,'year']];
function freqKeyOf(n,unit){const m=FREQ_MAP.find(p=>p[1]===Number(n)&&p[2]===unit);return m?m[0]:'daily';}
function freqFromKey(key){const m=FREQ_MAP.find(p=>p[0]===key);return m?{everyN:m[1],everyUnit:m[2]}:{everyN:1,everyUnit:'day'};}
function unitLabel(n,unit){
  return t('freq_'+freqKeyOf(n,unit))||unit;
}
