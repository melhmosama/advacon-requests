<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#15406E">
<title>ADVACON — نظام المستودعات</title>
<style>
  /* ==================================================================
     Design tokens (mirror index.html — keep visually aligned)
     ================================================================== */
  :root{
    --navy:#15406E; --navy2:#1B4D7E; --med:#2A5C8A; --accent:#3E6E9E; --steel:#5B7A99;
    --lblue:#DCE6F0; --pale:#EEF2F7; --lgray:#F4F6F9; --head:#EAEEF3; --grid:#D3DAE3;
    --txt:#23303D; --grey:#6E7A87; --white:#fff;
    --green:#3C7D5A; --amber:#C08A3E; --red:#B0504A; --purple:#6E5C8A;
    --shadow:0 1px 3px rgba(21,64,110,.08),0 4px 16px rgba(21,64,110,.06);
    --sidew:230px; --topbarh:56px; --radius:8px;
    --panel:#fff; --panel-alt:var(--lgray); --border:var(--grid); --muted:var(--grey); --text:var(--txt);
  }
  html,body{margin:0;padding:0;height:100%;background:var(--pale);color:var(--text);
    font:14px/1.5 "Segoe UI",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  html[dir="rtl"] body{font-family:"Segoe UI",Tahoma,"Segoe UI Arabic","Noto Sans Arabic",sans-serif;}
  *{box-sizing:border-box}
  button{font:inherit;color:inherit}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  /* Grid layout (topbar + sidebar + main) */
  #app{min-height:100vh;display:grid;grid-template-columns:var(--sidew) 1fr;
    grid-template-rows:var(--topbarh) 1fr;grid-template-areas:"sidebar topbar" "sidebar main";}
  html[dir="rtl"] #app{grid-template-areas:"topbar sidebar" "main sidebar";grid-template-columns:1fr var(--sidew);}
  .topbar{grid-area:topbar;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:var(--shadow);}
  .topbar .logo{font-weight:800;font-size:15px;letter-spacing:.3px}
  .topbar .mod-name{font-size:13px;opacity:.85}
  .topbar .spacer{flex:1}
  .topbar .user-info{font-size:12px;opacity:.8;font-family:monospace}
  .topbar .btn{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px}
  .topbar .btn:hover{background:rgba(255,255,255,.1)}
  .topbar .btn.btn-ghost{border-color:transparent}
  .sidebar{grid-area:sidebar;background:var(--panel);border-inline-end:1px solid var(--border);padding:20px 0;overflow-y:auto;}
  .sidebar .brand{padding:0 20px 16px;border-bottom:1px solid var(--border);margin-bottom:10px}
  .sidebar .brand-title{font-weight:700;color:var(--navy);font-size:15px}
  .sidebar .brand-sub{color:var(--muted);font-size:11px;margin-top:4px}
  .sidebar .ctx-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;margin-top:6px;font-weight:600;letter-spacing:.3px}
  .sidebar .ctx-badge.admin{background:var(--navy);color:#fff}
  .sidebar .ctx-badge.asset{background:var(--purple);color:#fff}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;color:var(--txt);cursor:pointer;font-size:14px;border-inline-start:3px solid transparent;position:relative}
  .nav-item:hover{background:var(--lgray)}
  .nav-item.active{background:var(--pale);border-inline-start-color:var(--navy);color:var(--navy);font-weight:600}
  .nav-item.disabled{opacity:.5;cursor:not-allowed}
  .nav-item .ic{font-size:15px;width:20px;text-align:center}
  .nav-item .soon{font-size:9px;background:var(--amber);color:#fff;padding:1px 5px;border-radius:6px;margin-inline-start:auto}
  main{grid-area:main;padding:24px;overflow-y:auto;max-width:100%}
  .page-header{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border)}
  .page-header h1{margin:0;color:var(--navy);font-size:20px;font-weight:700}
  .page-header .spacer{flex:1}
  .breadcrumb{font-size:12px;color:var(--muted);margin-bottom:8px}
  .breadcrumb a{color:var(--muted)}

  /* Cards & panels */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
  .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  .stat-value{font-size:22px;font-weight:700;color:var(--navy)}

  /* Buttons */
  .btn{background:var(--panel);border:1px solid var(--border);color:var(--txt);padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px;transition:background .15s}
  .btn:hover{background:var(--pale)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
  .btn-primary:hover{background:var(--navy2)}
  .btn-sm{padding:4px 8px;font-size:12px}
  .btn-ghost{background:transparent;border-color:transparent}
  .btn-ghost:hover{background:var(--pale)}

  /* Forms */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:0}
  .field.spanall{grid-column:1 / -1}
  .field label{font-size:12px;color:var(--muted);font-weight:500}
  .field .req{color:var(--red)}
  .field input,.field select,.field textarea{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font:inherit;background:var(--panel);color:var(--text)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(62,110,158,.15)}
  .field input[readonly]{background:var(--panel-alt);color:var(--muted)}
  .field select.readonly-select{background:var(--panel-alt);color:var(--muted);cursor:not-allowed;opacity:1}
  .field .hint{font-size:11px;color:var(--muted)}

  /* Tables */
  .table-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)}
  table.data{width:100%;border-collapse:collapse;font-size:13px}
  table.data th{background:var(--head);color:var(--navy);font-weight:600;padding:9px 12px;text-align:start;border-bottom:1px solid var(--border);font-size:12px}
  table.data td{padding:9px 12px;border-bottom:1px solid var(--border)}
  table.data tr:last-child td{border-bottom:none}
  table.data tr:hover{background:var(--pale)}
  table.data .num-cell{font-variant-numeric:tabular-nums}
  table.data .code-cell{font-family:monospace;font-weight:600}
  .row-actions{display:flex;gap:6px;justify-content:flex-end}

  /* Badges */
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;line-height:1.5}
  .badge-gray{background:var(--head);color:var(--muted)}
  .badge-green{background:#d1e7dd;color:#0f5132}
  .badge-red{background:#f8d7da;color:#842029}
  .badge-amber{background:#fff3cd;color:#664d03}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
  .modal{background:var(--panel);border-radius:var(--radius);max-width:600px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal.wide{max-width:900px}
  .modal-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .modal-header h3{margin:0;font-size:15px;color:var(--navy)}
  .modal-close{background:transparent;border:none;font-size:20px;cursor:pointer;color:var(--muted)}
  .modal-body{padding:20px}
  .modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

  /* Toast */
  #toast-mount{position:fixed;top:20px;inset-inline-end:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
  .toast{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px 14px;box-shadow:var(--shadow);max-width:360px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
  .toast.success{border-inline-start:4px solid var(--green)}
  .toast.error{border-inline-start:4px solid var(--red)}
  .toast .toast-close{background:transparent;border:none;cursor:pointer;color:var(--muted);margin-inline-start:auto}

  /* Sub-nav (WH_SUBNAV pills) */
  .subnav{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:6px;border-bottom:1px solid var(--border)}
  .subnav .sub-tab{padding:8px 14px;border-radius:6px 6px 0 0;font-size:13px;color:var(--txt);cursor:pointer;border:1px solid transparent;border-bottom:none;background:transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .subnav .sub-tab:hover{background:var(--lgray)}
  .subnav .sub-tab.active{background:var(--panel);border-color:var(--border);color:var(--navy);font-weight:600;position:relative;top:1px}

  /* Loading / empty / error */
  .loading{padding:40px;text-align:center;color:var(--muted)}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .error-box{background:#f8d7da;color:#842029;padding:14px;border-radius:6px;border:1px solid #f5c2c7;font-size:13px;margin:12px 0}
  .info-box{background:var(--pale);color:var(--navy);padding:10px 14px;border-radius:6px;border:1px solid var(--lblue);font-size:12px}

  /* Utility */
  .flex{display:flex;align-items:center}
  .spacer{flex:1}
  .text-muted{color:var(--muted)}
  .mb-2{margin-bottom:10px}
  .mb-3{margin-bottom:16px}
  .mt-3{margin-top:16px}
  .hidden{display:none !important}

  /* Mobile drawer */
  .nav-toggle{display:none}
  .drawer-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90;opacity:0;transition:opacity .2s ease}
  .drawer-backdrop.open{display:block;opacity:1}
  @media (max-width: 900px){
    #app{grid-template-columns:1fr;grid-template-areas:"topbar" "main"}
    html[dir="rtl"] #app{grid-template-columns:1fr;grid-template-areas:"topbar" "main"}
    main{padding:16px}
    .form-grid{grid-template-columns:1fr}
    .nav-toggle{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid rgba(255,255,255,.25);background:transparent;border-radius:6px;cursor:pointer;font-size:18px;color:#fff;margin-inline-end:4px}
    .sidebar{position:fixed;top:0;bottom:0;width:280px;max-width:85vw;z-index:100;padding-top:calc(var(--topbarh) + 16px);transition:transform .25s ease;box-shadow:0 0 24px rgba(0,0,0,.15);overflow-y:auto;display:block}
    html[dir="ltr"] .sidebar{inset-inline-start:0;transform:translateX(-100%);border-inline-end:1px solid var(--border);border-inline-start:none}
    html[dir="ltr"] .sidebar.open{transform:translateX(0)}
    html[dir="rtl"] .sidebar{inset-inline-start:0;transform:translateX(100%);border-inline-start:1px solid var(--border);border-inline-end:none}
    html[dir="rtl"] .sidebar.open{transform:translateX(0)}
  }

  /* Access screen (when no valid session) */
  .access-shell{max-width:520px;margin:80px auto;text-align:center}
  .access-shell .card{padding:36px}
  .access-shell h2{color:var(--navy);margin:0 0 12px}
  .access-shell .portal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
  .access-shell .portal-card{border:1px solid var(--border);border-radius:var(--radius);padding:22px;text-decoration:none;color:var(--txt);transition:all .15s;display:block}
  .access-shell .portal-card:hover{border-color:var(--accent);background:var(--pale);transform:translateY(-2px)}
  .access-shell .portal-card .icon{font-size:32px;margin-bottom:8px}
  .access-shell .portal-card .name{font-weight:700;color:var(--navy)}
  .access-shell .portal-card .desc{font-size:12px;color:var(--muted);margin-top:4px}

  /* Phase-0 placeholder for sub-nav tab bodies */
  .phase-placeholder{background:var(--panel);border:2px dashed var(--border);border-radius:var(--radius);padding:60px 30px;text-align:center;color:var(--muted)}
  .phase-placeholder .icon{font-size:56px;margin-bottom:16px;opacity:.5}
  .phase-placeholder .phase-name{font-size:15px;color:var(--navy);font-weight:600;margin-bottom:6px}
  .phase-placeholder .detail{font-size:12px}

  /* ======================================================================
     PHASE 1 — Dashboard / Inventory / Catalog screens (ported from index.html)
     Design tokens and class names preserved for parity.
     ====================================================================== */
  .phead{margin:0 0 14px}
  .phead.sm{margin:0 0 8px}
  .phead h1{margin:2px 0 4px;color:var(--navy);font-size:20px;font-weight:700}
  .phead h2{margin:2px 0 4px;color:var(--navy);font-size:14px;font-weight:700}
  .phead p{margin:0;color:var(--grey);font-size:12px}
  .phead .eyebrow,.eyebrow{color:var(--steel);font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)}
  table.tbl{width:100%;border-collapse:collapse;font-size:13px}
  table.tbl th{background:var(--head);color:var(--navy);font-weight:600;padding:9px 12px;text-align:start;border-bottom:1px solid var(--border);font-size:12px}
  table.tbl td{padding:9px 12px;border-bottom:1px solid var(--border)}
  table.tbl tr:last-child td{border-bottom:none}
  table.tbl .num{text-align:end;font-variant-numeric:tabular-nums}

  /* Dashboard */
  .dash-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .dash-wh select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--panel);font:inherit;min-width:180px}
  .dash-back{background:none;border:none;color:var(--med);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:10px;padding:0}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border-inline-start:4px solid var(--steel)}
  .kpi.k-navy{border-inline-start-color:var(--navy)}
  .kpi.k-amber{border-inline-start-color:var(--amber)}
  .kpi.k-red{border-inline-start-color:var(--red)}
  .kpi.k-grey{border-inline-start-color:var(--grey)}
  .kpi.clickable{cursor:pointer;transition:transform .1s,box-shadow .15s}
  .kpi.clickable:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(21,64,110,.15)}
  .kpi-v{font-size:24px;font-weight:800;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums}
  .kpi-l{font-size:11px;color:var(--grey);text-transform:uppercase;letter-spacing:.5px;margin-top:6px}
  .cat-panel .cat-tbl{font-size:12px}
  .cat-panel .cat-tbl .cat-nm{font-weight:600;color:var(--txt)}
  .cat-panel .cat-tbl .cat-bar{background:var(--pale);height:5px;margin-top:4px;border-radius:3px;overflow:hidden}
  .cat-panel .cat-tbl .cat-bar span{display:block;background:var(--accent);height:100%}
  .cat-panel .cat-tbl .cat-n{text-align:end;font-variant-numeric:tabular-nums;color:var(--txt)}
  .cat-panel .cat-tbl .cat-row{cursor:pointer}
  .cat-panel .cat-tbl .cat-row:hover td{background:var(--pale)}
  .mv-panel .mv-tbl .mv-dt{color:var(--grey);font-size:11px;white-space:nowrap}
  .mv-panel .mv-tbl .mv-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:var(--head);color:var(--txt)}
  .mv-panel .mv-tbl .mv-badge.mv-in{background:#d1e7dd;color:#0f5132}
  .mv-panel .mv-tbl .mv-badge.mv-out{background:#f8d7da;color:#842029}
  .mv-panel .mv-tbl .mv-badge.mv-adj{background:#fff3cd;color:#664d03}
  .mv-panel .mv-tbl .mv-item .mv-code{font-family:monospace;font-weight:700;color:var(--navy);margin-inline-end:6px}
  .mv-panel .mv-tbl .mv-q{text-align:end;font-variant-numeric:tabular-nums;font-weight:700}
  .mv-panel .mv-tbl .mv-q.q-pos{color:var(--green)}
  .mv-panel .mv-tbl .mv-q.q-neg{color:var(--red)}
  .mv-panel .mv-tbl .mv-actor{font-size:11px;color:var(--grey);font-family:monospace}
  .mv-new{background:var(--navy);color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px;font-weight:600}
  .mv-new:hover{background:var(--navy2)}

  /* Inventory */
  .inv-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .inv-search{position:relative;flex:1;min-width:220px}
  .inv-search .si{position:absolute;inset-inline-start:10px;top:8px;color:var(--grey);font-size:14px}
  .inv-search input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--border);border-radius:6px;font:inherit;background:var(--panel)}
  html[dir="rtl"] .inv-search input{padding:8px 32px 8px 10px}
  .inv-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .inv-filters select{padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--panel);font:inherit;font-size:13px}
  .toggle{border:1px solid var(--border);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--txt);background:var(--panel);user-select:none}
  .toggle.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .filterbar{display:flex;align-items:center;gap:8px;margin:6px 0}
  .filterbar .spacer{flex:1}
  .count-chip{font-size:11px;color:var(--grey);background:var(--head);padding:3px 8px;border-radius:10px}
  .inv-th-img{width:44px}
  .inv-thumb{width:36px;height:36px;object-fit:cover;border-radius:5px;cursor:zoom-in;border:1px solid var(--border);background:var(--panel-alt);display:inline-block;text-align:center;line-height:34px;font-size:18px}
  .inv-thumb-ph{cursor:default}
  .c-thumb{width:44px;padding:6px !important}
  .c-id{font-family:monospace;font-weight:600;color:var(--navy);white-space:nowrap}
  .c-title .ttl{font-weight:600;color:var(--txt)}
  .c-title .nt{font-size:11px;color:var(--grey)}
  .noshelf{color:var(--amber);font-size:11px;font-style:italic}
  .av-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
  .av-badge.av-ok{background:#d1e7dd;color:#0f5132}
  .av-badge.av-low{background:#fff3cd;color:#664d03}
  .av-badge.av-zero{background:#f8d7da;color:#842029}
  .st-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px;background:var(--grey);vertical-align:middle}
  .st-dot.st-on{background:var(--green)}
  .st-dot.st-off{background:var(--red)}
  .inv-row{cursor:pointer}
  .inv-row.sel{background:var(--pale)}

  /* Inventory drawer */
  .dwr-scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
  .dwr-scrim.open{opacity:1;pointer-events:auto}
  .dwr{position:fixed;top:0;bottom:0;inset-inline-end:0;width:460px;max-width:92vw;background:var(--panel);z-index:201;box-shadow:-6px 0 24px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .25s ease;overflow-y:auto}
  html[dir="rtl"] .dwr{box-shadow:6px 0 24px rgba(0,0,0,.15);transform:translateX(-100%)}
  .dwr.open{transform:translateX(0)}
  .dwr-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between}
  .dwr-head .code{font-family:monospace;font-weight:700;color:var(--navy);font-size:12px;letter-spacing:.3px}
  .dwr-head h3{margin:6px 0 2px;color:var(--txt);font-size:15px;font-weight:600}
  .dwr-head .en{color:var(--grey);font-size:12px}
  .dwr-x{background:transparent;border:none;font-size:22px;cursor:pointer;color:var(--grey);line-height:1}
  .dwr-body{padding:16px 20px}
  .dwr-img-block{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .dwr-img{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:zoom-in}
  .dwr-img-ph{width:80px;height:80px;border-radius:8px;background:var(--panel-alt);border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:26px;color:var(--grey)}
  .dwr-img-ph span{font-size:10px;margin-top:2px}
  .dwr-img-btn{display:inline-block;padding:6px 12px;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px;background:var(--panel-alt);color:var(--txt)}
  .dwr-img-btn:hover{background:var(--pale)}

/* =====================================================================
   SESSION MANAGEMENT — two independent stores (admin + asset)
   Follows the same JWT + refresh + verify pattern used by index.html
   and housing.html; we NEVER call storage/rpc with just the anon key.
   ===================================================================== */

/* -- ADMIN session -- */
function admGetSession(){ try{ const r=localStorage.getItem(CFG.adminSessionKey); if(!r) return null; const s=JSON.parse(r); return (s && s.access_token) ? s : null; }catch(_){ return null; } }
function admSetSession(s){ try{ localStorage.setItem(CFG.adminSessionKey, JSON.stringify(s)); }catch(_){} }
function admClearSession(){ try{ localStorage.removeItem(CFG.adminSessionKey); }catch(_){} }
async function admRefresh(refreshToken){
  try{
    const r = await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST', headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: refreshToken})});
    const j = await r.json();
    if(!r.ok || !j.access_token) return null;
    return { access_token:j.access_token, refresh_token:j.refresh_token||refreshToken,
             expires_at:j.expires_at||null, user_id:(j.user&&j.user.id)||null };
  }catch(_){ return null; }
}
async function admVerifyIsAdmin(accessToken){
  try{
    const r = await fetch(SB_URL+'/rest/v1/rpc/is_admin',{
      method:'POST', headers:{'apikey':SB_KEY,'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},
      body:'{}'});
    if(!r.ok) return false;
    return (await r.json()) === true;
  }catch(_){ return false; }
}
async function admEnsureSession(){
  let s = admGetSession();
  if(!s || !s.access_token || !s.refresh_token){ admClearSession(); return false; }
  const nowSec = Math.floor(Date.now()/1000);
  const exp = Number(s.expires_at||0);
  if(!exp || exp <= nowSec+60){
    const fresh = await admRefresh(s.refresh_token);
    if(!fresh){ admClearSession(); return false; }
    admSetSession(fresh); s = fresh;
  }
  const ok = await admVerifyIsAdmin(s.access_token);
  if(!ok){
    const fresh = await admRefresh(s.refresh_token);
    if(fresh){ admSetSession(fresh); if(await admVerifyIsAdmin(fresh.access_token)){ await syncSbAuth(fresh); return true; } }
    admClearSession(); return false;
  }
  await syncSbAuth(s);
  return true;
}
async function admSignOut(){
  const s = admGetSession();
  if(s && s.access_token){
    try{ await fetch(SB_URL+'/auth/v1/logout',{ method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+s.access_token,'Content-Type':'application/json'}, body:'{}'});
    }catch(_){}
  }
  admClearSession();
}

/* -- ASSET session (storekeeper etc.) -- */
function assetGetSession(){ try{ const r=localStorage.getItem(CFG.assetSessionKey); if(!r) return null; const s=JSON.parse(r); return (s && s.access_token) ? s : null; }catch(_){ return null; } }
function assetSetSession(s){ try{ localStorage.setItem(CFG.assetSessionKey, JSON.stringify(s)); }catch(_){} }
function assetClearSession(){ try{ localStorage.removeItem(CFG.assetSessionKey); }catch(_){} }
async function assetRefresh(refreshToken){
  try{
    const r = await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST', headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({refresh_token: refreshToken})});
    const j = await r.json();
    if(!r.ok || !j.access_token) return null;
    return { access_token:j.access_token, refresh_token:j.refresh_token||refreshToken,
             expires_at:j.expires_at||null, user_id:(j.user&&j.user.id)||null };
  }catch(_){ return null; }
}
async function assetFetchRole(accessToken){
  try{
    const r = await fetch(SB_URL+'/rest/v1/rpc/get_my_role',{
      method:'POST', headers:{'apikey':SB_KEY,'Authorization':'Bearer '+accessToken,'Content-Type':'application/json'},
      body:'{}'});
    if(!r.ok) return null;
    return await r.json(); // string like 'storekeeper' or null
  }catch(_){ return null; }
}
async function assetEnsureSession(){
  let s = assetGetSession();
  if(!s || !s.access_token || !s.refresh_token){ assetClearSession(); return false; }
  const nowSec = Math.floor(Date.now()/1000);
  const exp = Number(s.expires_at||0);
  if(!exp || exp <= nowSec+60){
    const fresh = await assetRefresh(s.refresh_token);
    if(!fresh){ assetClearSession(); return false; }
    fresh.role = s.role; assetSetSession(fresh); s = fresh;
  }
  const role = await assetFetchRole(s.access_token);
  if(!role || assetModuleAccess(role).length === 0){
    const fresh = await assetRefresh(s.refresh_token);
    if(fresh){
      const r2 = await assetFetchRole(fresh.access_token);
      if(r2 && assetModuleAccess(r2).length > 0){
        fresh.role = r2; assetSetSession(fresh);
        await syncSbAuth(fresh); return true;
      }
    }
    assetClearSession(); return false;
  }
  s.role = role; assetSetSession(s);
  await syncSbAuth(s);
  return true;
}
async function assetSignOut(){
  const s = assetGetSession();
  if(s && s.access_token){
    try{ await fetch(SB_URL+'/auth/v1/logout',{ method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+s.access_token,'Content-Type':'application/json'}, body:'{}'});
    }catch(_){}
  }
  assetClearSession();
}

/* Sync current session with the sb JS client (so sb.storage.* carries the JWT). */
async function syncSbAuth(sess){
  if(!sess || !sess.access_token) return;
  try{ await sb.auth.setSession({ access_token: sess.access_token, refresh_token: sess.refresh_token||'' }); }catch(_){}
}

/* =====================================================================
   CONTEXT DETECTION — decides whether we run as ADMIN or ASSET
   Precedence:
     1. URL ?from=admin | ?from=asset  → try that one, if it fails show
        access screen (rather than silently falling through)
     2. No ?from param:
        a. Valid admin session → ADMIN
        b. Else valid asset session → ASSET
        c. Else → Access screen
   Result stored in `CTX.mode` = 'admin' | 'asset' | null (unauthenticated)
   ===================================================================== */
const CTX = { mode: null, role: null, userId: null };

function urlFromParam(){
  try{
    const p = new URLSearchParams(location.search).get('from');
    return (p === 'admin' || p === 'asset') ? p : null;
  }catch(_){ return null; }
}

async function detectContext(){
  const from = urlFromParam();
  if(from === 'admin'){
    if(await admEnsureSession()){
      const s = admGetSession(); CTX.mode = 'admin'; CTX.role = 'admin'; CTX.userId = s && s.user_id;
      return true;
    }
    return false;
  }
  if(from === 'asset'){
    if(await assetEnsureSession()){
      const s = assetGetSession(); CTX.mode = 'asset'; CTX.role = (s && s.role) || 'storekeeper'; CTX.userId = s && s.user_id;
      return true;
    }
    return false;
  }
  // No ?from → try admin first, then asset (admin priority when both valid)
  if(await admEnsureSession()){
    const s = admGetSession(); CTX.mode = 'admin'; CTX.role = 'admin'; CTX.userId = s && s.user_id;
    return true;
  }
  if(await assetEnsureSession()){
    const s = assetGetSession(); CTX.mode = 'asset'; CTX.role = (s && s.role) || 'storekeeper'; CTX.userId = s && s.user_id;
    return true;
  }
  return false;
}

async function ensureCurrentSession(){
  if(CTX.mode === 'admin') return admEnsureSession();
  if(CTX.mode === 'asset') return assetEnsureSession();
  return false;
}
function currentAccessToken(){
  const s = (CTX.mode === 'admin') ? admGetSession() : (CTX.mode === 'asset') ? assetGetSession() : null;
  return s && s.access_token;
}
async function currentSignOut(){
  resetPhase1Caches();
  if(CTX.mode === 'admin') await admSignOut();
  else if(CTX.mode === 'asset') await assetSignOut();
  const from = urlFromParam();
  location.href = (from === 'asset' || CTX.mode === 'asset') ? '/asset' : '/admin';
}

function translateError(code){
  if(!code) return code;
  const table = (LANG === 'ar') ? ERR_AR : ERR_EN;
  return table[code] || code;

/* Translate Supabase Storage errors — bucket-not-found is the most common
   cause of "upload appears to succeed but nothing happens" bugs. */
function translateStorageError(err){
  const raw = String((err && (err.message || err.error || err)) || '');
  const lower = raw.toLowerCase();
  if(LANG === 'ar'){
    if(lower.includes('bucket not found') || lower.includes('bucket does not exist'))
      return `مستودع الملفات "${CFG.imagesBucket}" غير موجود. أنشئه من Supabase Dashboard → Storage → New bucket (خاص).`;
    if(lower.includes('violates row-level security') || lower.includes('permission denied'))
      return 'لا توجد صلاحية للرفع على المستودع. تحقق من سياسات الوصول (RLS).';
    if(lower.includes('duplicate') || lower.includes('already exists')) return 'ملف بنفس المسار موجود مسبقاً.';
    if(lower.includes('payload too large') || lower.includes('too large')) return 'حجم الملف تجاوز الحد المسموح به.';
    if(lower.includes('network') || lower.includes('failed to fetch')) return 'فشل الاتصال أثناء الرفع.';
    return `خطأ في رفع الملف: ${raw}`;
  }
  return raw || 'Storage error';
}

/* =====================================================================
   RPC WRAPPER — warehouseRpc(fn, args)
   ---------------------------------------------------------------------
   The single entry point for all warehouse RPC calls. It:
     • ensures the current-context session is valid (admin or asset)
     • sends the user's JWT (never the anon key)
     • parses JSON error body so Postgres error codes bubble up
     • translates well-known codes into Arabic messages
     • treats 401/403 as "session gone" → clears session + shows access screen
   ===================================================================== */
async function warehouseRpc(fn, args){
  const okSess = await ensureCurrentSession();
  if(!okSess){ showAccessScreen('session_expired'); throw new Error(translateError('session')); }
  const token = currentAccessToken();
  if(!token) throw new Error(translateError('session'));
  let res;
  try{
    res = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer '+token, 'Content-Type': 'application/json' },
      body: JSON.stringify(args || {}),
    });
  }catch(_){ throw new Error(translateError('network')); }
  if(res.status === 401 || res.status === 403){
    // Session lost mid-request; wipe and route to access screen
    if(CTX.mode === 'admin') admClearSession();
    else if(CTX.mode === 'asset') assetClearSession();
    showAccessScreen('http_'+res.status);
    throw new Error(translateError('session'));
  }
  if(!res.ok){
    let msg = 'http_' + res.status;
    try{
      const b = await res.json();
      msg = (b && (b.message || b.error || b.details || b.hint)) || msg;
    }catch(_){}
    throw new Error(translateError(String(msg).trim()));
  }
  return await res.json();
}

/* =====================================================================
   STORAGE HELPERS — signed URLs + JWT-authenticated upload/remove
   All storage calls go through here so we can never accidentally
   authenticate a storage request with the anon key.
   ===================================================================== */

/* Upload a file to the warehouse-images bucket at the given path. Returns
   { path } on success. Never uses the anon key — always the current JWT. */
async function uploadWarehouseImage(file, path){
  const okSess = await ensureCurrentSession();
  if(!okSess) throw new Error(translateError('session'));
  const { error: upErr } = await sb.storage.from(CFG.imagesBucket).upload(path, file, { contentType: file.type });
  if(upErr) throw new Error(translateStorageError(upErr));
  return { path };
}

/* Create a short-lived signed URL for viewing an image. */
async function getWarehouseImageSignedUrl(path, expiresIn){
  const okSess = await ensureCurrentSession();
  if(!okSess) throw new Error(translateError('session'));
  const { data, error } = await sb.storage.from(CFG.imagesBucket).createSignedUrl(path, expiresIn || 300);
  if(error) throw new Error(translateStorageError(error));
  return data.signedUrl;
}

/* Remove files from the warehouse bucket. Never throws — reports failure
   to the caller as the array of paths that failed (or via return {removed, failed}).
   Later phases will hook orphan-cleanup logging here (mirrors housing pattern). */
async function removeWarehouseImages(paths){
  if(!paths || !paths.length) return { removed: 0, failed: paths || [] };
  try{
    const okSess = await ensureCurrentSession();
    if(!okSess) throw new Error('session_expired');
    const { error } = await sb.storage.from(CFG.imagesBucket).remove(paths);
    if(error) throw error;
    return { removed: paths.length, failed: [] };
  }catch(e){
    toast(translateStorageError(e), 'error');
    return { removed: 0, failed: paths };
  }
}

function openModal({ title, body, footer, wide }){
  const mount = document.getElementById('modal-mount');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const modal = document.createElement('div');
  modal.className = 'modal' + (wide?' wide':'');
  modal.innerHTML = `
    <div class="modal-header"><h3>${esc(title||'')}</h3><button class="modal-close">×</button></div>
    <div class="modal-body"></div>
    <div class="modal-footer"></div>`;
  const bodyEl = modal.querySelector('.modal-body');
  const footEl = modal.querySelector('.modal-footer');
  if(body instanceof HTMLElement) bodyEl.appendChild(body);
  else if(typeof body === 'string') bodyEl.innerHTML = body;
  if(footer instanceof HTMLElement) footEl.appendChild(footer);
  else if(footer === null) footEl.remove();
  const close = () => { overlay.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if(e.key === 'Escape') close(); };
  modal.querySelector('.modal-close').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) close(); });
  document.addEventListener('keydown', onKey);
  overlay.appendChild(modal);
  mount.appendChild(overlay);
  return { close, modal, body: bodyEl };
}

async function confirmAction({ title, message, danger }){
  return new Promise(resolve => {
    const body = document.createElement('div');
    body.innerHTML = `<div style="font-size:14px;color:var(--text)">${esc(message || '')}</div>`;
    const footer = document.createElement('div');
    footer.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;flex:1';
    const cancel = document.createElement('button'); cancel.className = 'btn'; cancel.textContent = (LANG==='ar')?'إلغاء':'Cancel';
    const ok = document.createElement('button'); ok.className = 'btn ' + (danger?'':'btn-primary');
    if(danger){ ok.style.background = 'var(--red)'; ok.style.color = '#fff'; ok.style.borderColor = 'var(--red)'; }
    ok.textContent = (LANG==='ar')?'تأكيد':'Confirm';
    footer.appendChild(cancel); footer.appendChild(ok);
    const m = openModal({ title: title || '', body, footer });
    cancel.addEventListener('click', () => { m.close(); resolve(false); });
    ok.addEventListener('click',     () => { m.close(); resolve(true);  });
  });
}

/* =====================================================================
   ROUTE — renders the tab body from currentTab()
   Dispatches to the ported viewWhDashboard / viewInventory /
   viewItemCatalog screens when the tab is live; falls back to the
   placeholder for later-phase tabs.
   ===================================================================== */
async function route(){
  if(!CTX.mode){ showAccessScreen('no_context'); return; }
  const key = currentTab();
  const tab = WH_SUBNAV.find(x => x.key === key);
  const el = document.getElementById('content');
  renderSidebar();
  if(!tab){
    el.innerHTML = `<div class="empty">${esc((LANG==='ar')?'شاشة غير معروفة':'Unknown screen')}</div>`;
    return;
  }
  if(!tab.live){
    renderPhasePlaceholder(el, tab);
    return;
  }
  // Real screen dispatch — view functions are pure string renderers that
  // trigger their own data loads on first call; loaders call the matching
  // renderer again when data arrives.
  switch(tab.key){
    case 'dashboard': el.innerHTML = viewWhDashboard(); break;
    case 'inventory': el.innerHTML = viewInventory();   break;
    case 'catalog':   el.innerHTML = viewItemCatalog(); break;
    default:
      el.innerHTML = `<div class="empty">screen "${esc(tab.key)}" is marked live but has no renderer wired yet</div>`;
  }
}

function renderPhasePlaceholder(el, tab){
  const label = (LANG==='ar') ? tab.label_ar : tab.label_en;
  el.innerHTML = `
    <div class="breadcrumb">${esc((LANG==='ar')?'المستودعات':'Warehouse')} / ${esc(label)}</div>
    <div class="phase-placeholder">
      <div class="icon">${tab.ic}</div>
      <div class="phase-name">${esc(label)}</div>
      <div class="detail">${esc(t('phasePlaceholderDesc'))} ${tab.phase}.</div>
    </div>`;
}

function dashSetWh(v){ dashWh = v; dashLoaded = false; loadDashboard(true); }

/* Cross-tab jumps from Dashboard KPI cards → Inventory with a single filter set,
   clearing all others; keeps the dashboard's selected warehouse as context. */
function dashGoInv(setFilter){
  invFilters.low = false; invFilters.out = false; invFilters.noshelf = false; invFilters.category = '';
  if(setFilter) invFilters[setFilter] = true;
  invFilters.warehouse = dashWh || '';
  location.hash = 'inventory';
}
function dashGoCat(catId){
  invFilters.low = false; invFilters.out = false; invFilters.noshelf = false;
  invFilters.category = catId || '';
  invFilters.warehouse = dashWh || '';
  location.hash = 'inventory';
}

function viewWhDashboard(){
  if(!dashLoaded){ loadDashboard(); return `<div class="empty">${t('dashLoading')}</div>`; }
  if(!dashData || !dashData.kpis){ return `<div class="empty">${t('dashNone')}</div>`; }
  const k = dashData.kpis;
  const mv = Array.isArray(dashData.recent_movements) ? dashData.recent_movements : [];
  const n = v => fmtInt(v);

  // warehouse filter (populated from the RPC's own warehouses list — independent of Inventory data)
  let whOpts = `<option value="">${t('dashAllWh')}</option>`;
  const whList = Array.isArray(dashData.warehouses) ? dashData.warehouses : [];
  whList.forEach(w => {
    const nm = (LANG==='ar') ? (w.name_ar || w.code) : (w.name_en || w.code);
    whOpts += `<option value="${w.id}" ${dashWh===w.id?'selected':''}>${esc(nm)}</option>`;
  });

  const card = (label, val, cls, click) => `<div class="kpi ${cls||''} ${click?'clickable':''}" ${click?`onclick="${click}"`:''}>
    <div class="kpi-v">${val}</div><div class="kpi-l">${label}</div></div>`;

  const row1 = `<div class="kpi-row">
    ${card(t('dashTotalItems'), n(k.total_items),     'k-navy')}
    ${card(t('dashOnHand'),     n(k.total_on_hand),   'k-navy')}
    ${card(t('dashAvailable'),  n(k.total_available), 'k-navy')}
    ${card(t('dashReserved'),   n(k.total_reserved),  'k-navy')}
  </div>`;
  const row2 = `<div class="kpi-row">
    ${card(t('dashLow'),      n(k.low_stock),     'k-amber', "dashGoInv('low')")}
    ${card(t('dashOut'),      n(k.out_of_stock),  'k-red',   "dashGoInv('out')")}
    ${card(t('dashNoShelf'),  n(k.without_shelf), 'k-grey',  "dashGoInv('noshelf')")}
    ${card(t('dashExpiring'), n(k.expiring_soon), 'k-amber')}
  </div>`;

  // Category breakdown — table with inline bars, follows the warehouse filter
  const cats = Array.isArray(dashData.category_breakdown) ? dashData.category_breakdown : [];
  const maxOnHand = cats.reduce((mx, c) => Math.max(mx, Number(c.on_hand) || 0), 0) || 1;
  const catRows = cats.length ? cats.map(c => {
    const nm = (LANG==='ar') ? (c.category_name_ar || c.category_name_en) : (c.category_name_en || c.category_name_ar);
    const oh = Number(c.on_hand) || 0;
    const pct = Math.round((oh / maxOnHand) * 100);
    return `<tr class="cat-row" onclick="dashGoCat('${c.category_id}')" title="${t('dashCatOpen')}">
      <td class="cat-nm">${esc(nm || '')}<div class="cat-bar"><span style="width:${pct}%"></span></div></td>
      <td class="cat-n">${n(c.item_count)}</td>
      <td class="cat-n">${n(c.on_hand)}</td>
      <td class="cat-n">${n(c.available)}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="4" class="empty">${t('dashNoCat')}</td></tr>`;
  const catPanel = `<div class="panel cat-panel">
    <div class="phead sm"><h2>${t('dashCatTitle')}</h2></div>
    <div class="tbl-wrap"><table class="tbl cat-tbl">
      <thead><tr>
        <th>${t('dashCatCat')}</th><th class="cat-n">${t('dashCatItems')}</th>
        <th class="cat-n">${t('dashOnHand')}</th><th class="cat-n">${t('dashAvailable')}</th>
      </tr></thead>
      <tbody>${catRows}</tbody>
    </table></div>
  </div>`;

  // Recent movements panel
  const typeLabel = mt => t('mvT_' + mt) || mt;
  const typeCls = mt => ({RECEIPT:'mv-in',OPENING_BALANCE:'mv-in',RETURN:'mv-in',TRANSFER_IN:'mv-in',ISSUE:'mv-out',TRANSFER_OUT:'mv-out',DISPOSAL:'mv-out',ADJUSTMENT:'mv-adj'})[mt] || '';
  const showActor = mv.some(m => m.actor_email);
  const rowsHtml = mv.length ? mv.map(m => {
    const nm = (LANG==='ar') ? (m.item_name_ar || m.item_code) : (m.item_name_en || m.item_name_ar || m.item_code);
    const wh = (LANG==='ar') ? (m.warehouse_name_ar || m.warehouse_code) : (m.warehouse_name_en || m.warehouse_code);
    const dt = new Date(m.created_at);
    const loc = (LANG==='ar') ? 'ar' : 'en-GB';
    const dstr = dt.toLocaleDateString(loc, {day:'2-digit', month:'short'}) + ' ' + dt.toLocaleTimeString(loc, {hour:'2-digit', minute:'2-digit'});
    const q = Number(m.qty);
    const qCls = q > 0 ? 'q-pos' : (q < 0 ? 'q-neg' : '');
    return `<tr>
      <td class="mv-dt">${dstr}</td>
      <td><span class="mv-badge ${typeCls(m.movement_type)}">${typeLabel(m.movement_type)}</span></td>
      <td class="mv-item"><span class="mv-code">${esc(m.item_code || '')}</span> ${esc(nm || '')}</td>
      <td class="mv-q ${qCls}">${q > 0 ? '+' : ''}${n(q)}</td>
      <td>${esc(wh || '')}</td>
      ${showActor ? `<td class="mv-actor">${esc(m.actor_email || '')}</td>` : ''}
    </tr>`;
  }).join('') : `<tr><td colspan="${showActor ? 6 : 5}" class="empty">${t('dashNoMv')}</td></tr>`;

  const mvPanel = `<div class="panel mv-panel">
    <div class="phead sm"><h2>${t('dashRecent')}</h2></div>
    <div class="tbl-wrap"><table class="tbl mv-tbl">
      <thead><tr>
        <th>${t('dashCDate')}</th><th>${t('dashCType')}</th><th>${t('dashCItem')}</th>
        <th>${t('dashCQty')}</th><th>${t('dashCWh')}</th>${showActor ? `<th>${t('dashCActor')}</th>` : ''}
      </tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>
  </div>`;

  return `
    <div class="dash-head">
      <div><div class="eyebrow">${t('dashEye')}</div><h1>${t('dashH1')}</h1></div>
      <div class="dash-wh"><select onchange="dashSetWh(this.value)">${whOpts}</select></div>
    </div>
    ${row1}
    ${row2}
    ${catPanel}
    ${mvPanel}`;
}

/* =====================================================================
   INVENTORY  (Phase 1: read-only — no shelf edit, no image upload)
   ===================================================================== */
async function loadInventory(force){
  if(invLoaded && !force){ invRender(); return; }
  if(invLoading) return;
  invLoading = true;
  try{
    const res = await warehouseRpc('inventory_list', {});
    invData = Array.isArray(res) ? res : [];
    invLoaded = true;
  }catch(e){
    invData = []; invLoaded = true;
    toast(e.message || t('errorOccurred'), 'error');
  }finally{
    invLoading = false;
  }
  invRender();
}
function invRender(){
  const el = document.getElementById('content');
  if(el && currentTab() === 'inventory') el.innerHTML = viewInventory();
}

/* Filter-source pickers: derive warehouse/category options from loaded data
   (only options that exist in the current dataset appear). */
function invWarehouses(){
  const m = {};
  invData.forEach(r => {
    if(r.warehouse_id) m[r.warehouse_id] = ((LANG==='ar') ? r.warehouse_name_ar : r.warehouse_name_en) || r.warehouse_code;
  });
  return Object.entries(m).map(([id, name]) => ({id, name}));
}
function invCategories(){
  const m = {};
  invData.forEach(r => {
    if(r.category_id) m[r.category_id] = ((LANG==='ar') ? r.category_name_ar : r.category_name_en) || r.category_name_ar;
  });
  return Object.entries(m).map(([id, name]) => ({id, name})).sort((a,b) => a.name.localeCompare(b.name));
}
function invApply(){
  const f = invFilters, q = (f.q || '').trim().toLowerCase();
  return invData.filter(r => {
    if(f.warehouse && r.warehouse_id !== f.warehouse) return false;
    if(f.category  && r.category_id  !== f.category ) return false;
    if(f.low       && !r.is_low_stock              ) return false;
    if(f.out       && Number(r.available) > 0      ) return false;
    if(f.noshelf   && r.shelf_id                   ) return false;
    if(q){
      const hay = ((r.item_code || '') + ' ' + (r.name_ar || '') + ' ' + (r.name_en || '')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function invSet(k, v){ invFilters[k] = v; invRender(); }
function invToggle(k){ invFilters[k] = !invFilters[k]; invRender(); }
function invOpen(id){ invSel = id; invRender(); }
function invClose(){ invSel = null; invRender(); }

/* Drawer — view mode only in Phase 1. Shelf-edit + image-upload UI is
   intentionally NOT rendered here even for admin; those are write actions
   that will land in the follow-up phase (Phase 1.5 or Phase 2 wave). */

  const avCls = (Number(r.available) <= 0) ? 'av-zero' : (r.is_low_stock ? 'av-low' : 'av-ok');
  const shelfVal = r.shelf_id ? esc(r.shelf_name) : `<span class="noshelf">${t('invNoShelf')}</span>`;
  return `<div class="dwr-scrim open" onclick="invClose()"></div>
  <aside class="dwr open">
    <div class="dwr-head">
      <div><span class="code">${esc(r.item_code)}</span><h3>${esc(r.name_ar)}</h3>${r.name_en ? `<div class="en">${esc(r.name_en)}</div>` : ''}</div>
      <button class="dwr-x" onclick="invClose()">×</button>
    </div>
    <div class="dwr-body">
      <div class="dwr-img-block">
        ${r.image_url
          ? `<img class="dwr-img" src="${esc(r.image_url)}" onclick="openLightbox('${esc(r.image_url)}')" alt=""/>`
          : `<div class="dwr-img-ph">📦<span>${t('invNoImg')}</span></div>`}
      </div>
      <div class="dwr-sep"></div>
      <div class="dwr-grid">
        <div class="dwr-f"><span class="lb">${t('invCat')}</span><span class="vl">${esc((LANG==='ar')?r.category_name_ar:(r.category_name_en||r.category_name_ar))}</span></div>
        <div class="dwr-f"><span class="lb">${t('invType')}</span><span class="vl">${esc((LANG==='ar')?r.item_type_name_ar:(r.item_type_name_en||r.item_type_name_ar))}</span></div>
        <div class="dwr-f"><span class="lb">${t('invUnit')}</span><span class="vl">${esc((LANG==='ar')?r.unit_name_ar:(r.unit_name_en||r.unit_name_ar))}</span></div>
        <div class="dwr-f"><span class="lb">${t('invWh')}</span><span class="vl">${esc((LANG==='ar')?r.warehouse_name_ar:(r.warehouse_name_en||r.warehouse_code))}</span></div>
      </div>
      <div class="dwr-sep"></div>
      <div class="dwr-grid">
        <div class="dwr-f"><span class="lb">${t('invOnHand')}</span><span class="vl">${fmtInt(r.on_hand)}</span></div>
        <div class="dwr-f"><span class="lb">${t('invReserved')}</span><span class="vl">${fmtInt(r.reserved)}</span></div>
        <div class="dwr-f"><span class="lb">${t('invAvail')}</span><span class="vl"><span class="av-badge ${avCls}">${fmtInt(r.available)}</span></span></div>
        <div class="dwr-f"><span class="lb">${t('invMin')}</span><span class="vl">${r.min_level == null ? '—' : fmtInt(r.min_level)}</span></div>
      </div>
      <div class="dwr-sep"></div>
      <div class="dwr-grid">
        <div class="dwr-f full"><span class="lb">${t('invShelf')}</span><div class="dwr-shelf-row"><span class="vl">${shelfVal}</span></div></div>
        <div class="dwr-f full"><span class="lb">${t('invStatus')}</span><span class="vl">${r.item_active ? `<span class="st-dot st-on"></span>${t('invActive')}` : `<span class="st-dot st-off"></span>${t('invInactive')}`}</span></div>
      </div>
    </div>
  </aside>`;
}

function viewInventory(){
  if(!invLoaded){ loadInventory(); return `<div class="empty">${t('invLoading')}</div>`; }
  const rows = invApply();
  const whs = invWarehouses(), cats = invCategories();
  const whOpts = `<option value="">${t('invAllWh')}</option>` + whs.map(w => `<option value="${w.id}" ${invFilters.warehouse===w.id?'selected':''}>${esc(w.name)}</option>`).join('');
  const catOpts = `<option value="">${t('invAllCat')}</option>` + cats.map(c => `<option value="${c.id}" ${invFilters.category===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  const body = rows.length ? `<div class="tbl-wrap"><table class="tbl">
    <thead><tr>
      <th class="inv-th-img"></th><th>${t('invCode')}</th><th>${t('invName')}</th><th>${t('invCat')}</th><th>${t('invType')}</th><th>${t('invUnit')}</th>
      <th class="num">${t('invOnHand')}</th><th class="num">${t('invReserved')}</th><th class="num">${t('invAvail')}</th>
      <th>${t('invWh')}</th><th>${t('invShelf')}</th><th>${t('invStatus')}</th>
    </tr></thead><tbody>` + rows.map(r => {
      const avCls = (Number(r.available) <= 0) ? 'av-zero' : (r.is_low_stock ? 'av-low' : 'av-ok');
      const shelf = r.shelf_id ? esc(r.shelf_name) : `<span class="noshelf">${t('invNoShelf')}</span>`;
      const nm = `<div class="ttl">${esc(r.name_ar)}</div>` + (r.name_en ? `<div class="nt">${esc(r.name_en)}</div>` : '');
      const st = r.item_active ? `<span class="st-dot st-on"></span>${t('invActive')}` : `<span class="st-dot st-off"></span>${t('invInactive')}`;
      const thumb = r.image_url
        ? `<img class="inv-thumb" src="${esc(r.image_url)}" onclick="event.stopPropagation();openLightbox('${esc(r.image_url)}')" alt=""/>`
        : `<span class="inv-thumb inv-thumb-ph">📦</span>`;
      return `<tr class="inv-row ${invSel===r.item_warehouse_id?'sel':''}" onclick="invOpen('${r.item_warehouse_id}')">
        <td class="c-thumb">${thumb}</td>
        <td class="c-id">${esc(r.item_code)}</td><td class="c-title">${nm}</td>
        <td>${esc((LANG==='ar')?r.category_name_ar:(r.category_name_en||r.category_name_ar))}</td>
        <td>${esc((LANG==='ar')?r.item_type_name_ar:(r.item_type_name_en||r.item_type_name_ar))}</td>
        <td>${esc((LANG==='ar')?r.unit_name_ar:(r.unit_name_en||r.unit_name_ar))}</td>
        <td class="num">${fmtInt(r.on_hand)}</td><td class="num">${fmtInt(r.reserved)}</td>
        <td class="num"><span class="av-badge ${avCls}">${fmtInt(r.available)}</span></td>
        <td>${esc(r.warehouse_code)}</td><td>${shelf}</td><td>${st}</td>
      </tr>`;
    }).join('') + `</tbody></table></div>` : `<div class="empty">${t('invNoMatch')}</div>`;

  return `<div class="phead"><div class="eyebrow">${t('invEye')}</div><h1>${t('invH1')}</h1><p>${t('invP')}</p></div>
  <div class="inv-toolbar">
    <div class="inv-search"><span class="si">🔍</span>
      <input type="text" value="${esc(invFilters.q)}" placeholder="${t('invSearchPh')}" oninput="invSet('q',this.value)"></div>
    <div class="inv-filters">
      <select onchange="invSet('warehouse',this.value)">${whOpts}</select>
      <select onchange="invSet('category',this.value)">${catOpts}</select>
      <div class="toggle ${invFilters.low?'on':''}" onclick="invToggle('low')">⚠ ${t('invLow')}</div>
      <div class="toggle ${invFilters.out?'on':''}" onclick="invToggle('out')">⛔ ${t('invOutF')}</div>
      <div class="toggle ${invFilters.noshelf?'on':''}" onclick="invToggle('noshelf')">📍 ${t('invNoShelfF')}</div>
    </div>
  </div>
  <div class="filterbar" style="margin-top:-4px"><div class="spacer"></div><span class="count-chip">${rows.length} / ${invData.length} ${t('invItems')}</span></div>
  ${body}
  ${invDrawer()}`;
}

/* =====================================================================
   ITEM CATALOG  (Phase 1: read-only — no "+ New Item" creation)
   ===================================================================== */
async function loadCatalog(force){
  if(catLoaded && !force){ catRender(); return; }
  if(catLoading) return;
  catLoading = true;
  try{
    const res = await warehouseRpc('item_catalog_list', {});
    catData = Array.isArray(res) ? res : [];
    catLoaded = true;
  }catch(e){
    catData = []; catLoaded = true;
    toast(e.message || t('errorOccurred'), 'error');
  }finally{
    catLoading = false;
  }
  catRender();
}
function catRender(){
  const el = document.getElementById('content');
  if(el && currentTab() === 'catalog') el.innerHTML = viewItemCatalog();
}
function catSearch(v){
  catQuery = v; catRender();
  // Focus restoration — search input is rebuilt on each keystroke; put the
  // caret back at the end so typing keeps working smoothly.
  setTimeout(() => {
    const el = document.getElementById('catSearch');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 0);
}
function catSetStatus(v){ catStatusFilter = v; catRender(); }

function viewItemCatalog(){
  if(!catLoaded){ loadCatalog(); return `<div class="empty">${t('catLoading')}</div>`; }
  const rows = Array.isArray(catData) ? catData : [];
  const n = v => fmtInt(v);

  const q = (catQuery || '').trim().toLowerCase();
  const filtered = rows.filter(r => {
    if(catStatusFilter === 'active'   && !r.is_active) return false;
    if(catStatusFilter === 'inactive' &&  r.is_active) return false;
    if(q){
      return (r.item_code || '').toLowerCase().includes(q)
          || (r.name_ar   || '').toLowerCase().includes(q)
          || (r.name_en   || '').toLowerCase().includes(q);
    }
    return true;
  });

  const head = `<tr>
    <th class="cat-th-img"></th><th>${t('catCode')}</th><th>${t('catName')}</th><th>${t('catCategory')}</th>
    <th>${t('catType')}</th><th>${t('catUnit')}</th><th>${t('catWhCount')}</th><th>${t('catStatus')}</th>
  </tr>`;
  const body = filtered.length ? filtered.map(r => {
    const nm  = (LANG==='ar') ? (r.name_ar || r.name_en) : (r.name_en || r.name_ar);
    const cat = (LANG==='ar') ? (r.category_name_ar  || '') : (r.category_name_en  || r.category_name_ar  || '');
    const typ = (LANG==='ar') ? (r.item_type_name_ar || '') : (r.item_type_name_en || r.item_type_name_ar || '');
    const unit= (LANG==='ar') ? (r.unit_name_ar      || '') : (r.unit_name_en      || r.unit_name_ar      || '');
    const status = r.is_active ? `<span class="cat-badge on">${t('catActive')}</span>` : `<span class="cat-badge off">${t('catInactive')}</span>`;
    const thumb = r.image_url
      ? `<img class="inv-thumb" src="${esc(r.image_url)}" onclick="openLightbox('${esc(r.image_url)}')" alt=""/>`
      : `<span class="inv-thumb inv-thumb-ph">📦</span>`;
    return `<tr>
      <td class="c-thumb">${thumb}</td>
      <td class="cat-code">${esc(r.item_code || '')}</td>
      <td>${esc(nm || '')}</td>
      <td>${esc(cat)}</td>
      <td>${esc(typ)}</td>
      <td>${esc(unit)}</td>
      <td class="cat-num">${n(r.warehouses_count)}</td>
      <td>${status}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="8" class="cat-empty">${t('catNoRows')}</td></tr>`;

  const statusTabs = `<div class="cat-filters">
    <button class="cat-fbtn ${catStatusFilter==='all'     ?'on':''}" onclick="catSetStatus('all')">${t('catAll')}</button>
    <button class="cat-fbtn ${catStatusFilter==='active'  ?'on':''}" onclick="catSetStatus('active')">${t('catActive')}</button>
    <button class="cat-fbtn ${catStatusFilter==='inactive'?'on':''}" onclick="catSetStatus('inactive')">${t('catInactive')}</button>
  </div>`;

  return `
    <div class="dash-head">
      <div><div class="eyebrow">${t('mvEye')}</div><h1>${t('catH1')}</h1><div class="cat-sub">${t('catSubtitle')}</div></div>
    </div>
    <div class="cat-toolbar">
      <input id="catSearch" class="rc-in cat-search" placeholder="${t('catSearchPh')}" value="${esc(catQuery)}" oninput="catSearch(this.value)"/>
      ${statusTabs}
    </div>
    <div class="cat-count">${n(filtered.length)} ${t('catResults')}</div>
    <div class="cat-tablewrap"><table class="cat-table"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

/* =====================================================================
   Reset Phase-1 caches on sign-out / context change so a subsequent
   login (or portal switch) always re-fetches fresh data.
   ===================================================================== */
function resetPhase1Caches(){
  dashData = null;    dashLoaded  = false; dashLoading  = false; dashWh = '';
  invData  = [];      invLoaded   = false; invLoading   = false; invSel = null;
  invFilters = { q:'', warehouse:'', category:'', low:false, out:false, noshelf:false };
  catData  = [];      catLoaded   = false; catLoading   = false;
  catQuery = '';      catStatusFilter = 'all';
}

/* =====================================================================
   BOOTSTRAP
   ===================================================================== */
document.addEventListener('DOMContentLoaded', async () => {
  applyLang();
  document.getElementById('langToggleBtn').addEventListener('click', toggleLang);
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await currentSignOut();
  });

  // Mobile drawer
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('drawerBackdrop');
  const toggle = document.getElementById('navToggle');
  const openDrawer  = () => { sidebar.classList.add('open'); backdrop.classList.add('open'); };
  const closeDrawer = () => { sidebar.classList.remove('open'); backdrop.classList.remove('open'); };
  toggle.addEventListener('click', () => { if(sidebar.classList.contains('open')) closeDrawer(); else openDrawer(); });
  backdrop.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => { if(e.key==='Escape' && sidebar.classList.contains('open')) closeDrawer(); });
  document.getElementById('mainNav').addEventListener('click', (e) => { if(e.target.closest('.nav-item')) closeDrawer(); });
  window.addEventListener('resize', () => { if(window.innerWidth > 900) closeDrawer(); });

  window.addEventListener('hashchange', route);

  const ok = await detectContext();
  if(!ok){ showAccessScreen('no_valid_session'); return; }
  await route();
});
</script>
</body>
</html>
