/* localized name helper for warehouses */
function repWhName(w){ return LANG==='ar'?(w.name_ar||w.code):(w.name_en||w.code); }
function repFmtDT(iso){
  if(!iso) return '—';
  const dt=new Date(iso);
  // timestamps (generated_at, movement created_at) shown in Riyadh time
  return dt.toLocaleDateString(LANG==='ar'?'ar':'en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'Asia/Riyadh'})
    +' '+dt.toLocaleTimeString(LANG==='ar'?'ar':'en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Riyadh'});
}
function repFmtDate(iso){
  if(!iso) return '—';
  // format in Riyadh time so a +03:00 midnight never renders as the previous day
  return new Date(iso).toLocaleDateString(LANG==='ar'?'ar':'en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'Asia/Riyadh'});
}
/* DISPLAY-ONLY: backend uses half-open [from,to); the header shows the last INCLUDED day
   (to − 1 day). Single-day ranges collapse to one date. Never affects what is sent.
   All math is done on the Riyadh calendar date STRING (no local-tz Date drift). */
function repRiyadhYmd(iso){ // ISO -> 'YYYY-MM-DD' as seen in Riyadh
  return new Date(iso).toLocaleDateString('en-CA',{timeZone:'Asia/Riyadh'});
}
function repYmdMinus1(ymd){ // subtract one calendar day via UTC-noon anchor (drift-free)
  const d=new Date(ymd+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()-1);
  return d.toISOString().slice(0,10);
}
function repFmtYmd(ymd){ // 'YYYY-MM-DD' -> localized label (anchor at Riyadh noon so the day is stable)
  return new Date(ymd+'T12:00:00+03:00').toLocaleDateString(LANG==='ar'?'ar':'en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'Asia/Riyadh'});
}
function repFmtRange(fromIso,toIso){
  if(!fromIso||!toIso) return '—';
  const fromYmd=repRiyadhYmd(fromIso);
  const lastIncl=repYmdMinus1(repRiyadhYmd(toIso));
  if(fromYmd===lastIncl) return repFmtYmd(fromYmd);
  return repFmtYmd(fromYmd)+' → '+repFmtYmd(lastIncl);
}

/* the control form (always visible) */
function repForm(){
  const periods=[['today','repPToday'],['yesterday','repPYesterday'],['week','repPWeek'],
    ['lastweek','repPLastWeek'],['month','repPMonth'],['lastmonth','repPLastMonth'],['custom','repPCustom']];
  const chipBar=periods.map(([k,lbl])=>
    `<button class="rep-chip ${repState.period===k?'on':''}" onclick="repSetPeriod('${k}')">${t(lbl)}</button>`).join('');
  // custom date inputs (only when custom)
  let custom='';
  if(repState.period==='custom'){
    custom=`<div class="rep-custom">
      <label>${t('repFrom')} <input type="date" value="${repState.from||''}" onchange="repSetCustom('from',this.value)"/></label>
      <label>${t('repTo')} <input type="date" value="${repState.to||''}" onchange="repSetCustom('to',this.value)"/></label>
    </div>`;
  }
  // warehouse: All vs one
  let whOpts=`<option value="">${t('repAllWh')}</option>`;
  (repState.wh||[]).forEach(w=>{ whOpts+=`<option value="${w.warehouse_id}" ${repState.whId===w.warehouse_id?'selected':''}>${esc(repWhName(w))}</option>`; });
  const whBlock=`<div class="rep-whrow">
    <button class="rep-chip ${repState.whMode==='all'?'on':''}" onclick="repSetWhMode('all')">${t('repAllWh')}</button>
    <button class="rep-chip ${repState.whMode==='one'?'on':''}" onclick="repSetWhMode('one')">${t('repOneWh')}</button>
    ${repState.whMode==='one'?`<select class="rep-sel" onchange="repSetWh(this.value)">${whOpts}</select>`:''}
  </div>`;
  // preset
  const presets=[['full','repRepFull'],['daily','repRepDaily'],['weekly','repRepWeekly'],
    ['monthly','repRepMonthly'],['inventory','repRepInventory'],['movement','repRepMovement'],
    ['expiry','repRepExpiry'],['approvals','repRepApprovals']];
  let presetOpts=presets.map(([k,lbl])=>`<option value="${k}" ${repState.preset===k?'selected':''}>${t(lbl)}</option>`).join('');
  const presetBlock=`<div class="rep-field"><label>${t('repPreset')}</label><select class="rep-sel" onchange="repSetPreset(this.value)">${presetOpts}</select></div>`;
  // More Filters (advanced, hidden by default)
  const moreBtn=`<button class="rep-more" onclick="repToggleFilters()">${repState.showFilters?'▾':'▸'} ${t('repMoreFilters')}</button>`;
  let moreBox='';
  if(repState.showFilters){
    moreBox=`<div class="rep-morebox">
      <label class="rep-check"><input type="checkbox" ${repState.compare?'checked':''} onchange="repSetCompare(this.checked)"/> ${t('repCompare')}</label>
    </div>`;
  }
  return `<div class="rep-form">
    <div class="rep-field"><label>${t('repPeriod')}</label><div class="rep-chips">${chipBar}</div>${custom}</div>
    <div class="rep-field"><label>${t('repWarehouses')}</label>${whBlock}</div>
    ${presetBlock}
    <div class="rep-actions">
      <button class="rep-gen" onclick="repGenerate()">${t('repGenerate')}</button>
      ${moreBtn}
    </div>
    ${moreBox}
  </div>`;
}

/* Attention Required */
function repAttention(alerts){
  return ''; // Attention Required section removed from all reports (user request)
  if(!repSectionOn('attention')) return '';
  if(!alerts || !alerts.length) return `<div class="rep-sec"><h3>${t('repAttention')}</h3><div class="rep-empty rep-ok">${t('repNoAlerts')}</div></div>`;
  const rows=alerts.map(a=>{
    const tone=a.severity==='critical'?'crit':(a.severity==='warning'?'warn':'info');
    const ic=a.severity==='critical'?'🔴':(a.severity==='warning'?'🟠':'🔵');
    return `<div class="rep-alert ${tone}">${ic} <span class="ra-msg">${t('repAlert_'+a.code)||a.code}</span> <span class="ra-cnt">${fmtNum(a.count)}</span></div>`;
  }).join('');
  return `<div class="rep-sec"><h3>${t('repAttention')}</h3>${rows}</div>`;
}

/* Observations */
function repObservations(obs){
  if(!repSectionOn('observations')) return '';
  if(!obs || !obs.length) return '';
  const rows=obs.map(o=>{
    let txt=t('repObs_'+o.code)||o.code;
    let extra='';
    if(o.code==='top_issue_warehouse'){ const wn=LANG==='ar'?(o.warehouse_name_ar||o.warehouse_code):(o.warehouse_name_en||o.warehouse_code); extra=` — ${esc(wn||'')}`; }
    return `<li>${txt}: <b>${fmtNum(o.value)}</b>${extra}</li>`;
  }).join('');
  return `<div class="rep-sec"><h3>${t('repObservations')}</h3><ul class="rep-obs">${rows}</ul></div>`;
}

/* Movement Summary + Comparison */
function repMovementSummary(ms,cmp){
  if(!repSectionOn('movement_summary')) return '';
  if(!ms) return '';
  const rowsData=[
    ['receipts','mvT_RECEIPT'],['issues','mvT_ISSUE'],['returns','mvT_RETURN'],
    ['transfers_in','mvT_TRANSFER_IN'],['transfers_out','mvT_TRANSFER_OUT'],
    ['disposals','mvT_DISPOSAL'],['adjustments','mvT_ADJUSTMENT']
  ];
  const showCmp=repSectionOn('comparison') && cmp;
  const head=`<tr><th>${t('repMvType')}</th><th>${t('repCount')}</th>${showCmp?`<th>${t('repPrevCount')}</th><th>${t('repChange')}</th>`:''}</tr>`;
  const body=rowsData.map(([k,lbl])=>{
    const cur=Number(ms[k]||0);
    let cmpCells='';
    if(showCmp){
      const prev=Number(cmp['prev_'+k]||0);
      const diff=cur-prev;
      const arrow=diff>0?'▲':(diff<0?'▼':'—');
      const cls=diff>0?'up':(diff<0?'down':'');
      cmpCells=`<td>${fmtNum(prev)}</td><td class="rep-chg ${cls}">${arrow} ${fmtNum(Math.abs(diff))}</td>`;
    }
    return `<tr><td>${t(lbl)}</td><td>${fmtNum(cur)}</td>${cmpCells}</tr>`;
  }).join('');
  const totalRow=`<tr class="rep-total"><td>${t('repTotalMv')}</td><td>${fmtNum(ms.total_movements)}</td>${showCmp?`<td>${fmtNum(cmp.prev_total_movements)}</td><td></td>`:''}</tr>`;
  let cmpNote='';
  if(showCmp){ cmpNote=`<div class="rep-cmpnote">${t('repCompareVs')}: ${repFmtRange(cmp.prev_from, cmp.prev_to)}</div>`; }
  return `<div class="rep-sec"><h3>${t('repMovementSummary')}</h3>
    <table class="rep-tbl">${head}${body}${totalRow}</table>${cmpNote}</div>`;
}

/* Warehouse Summary (dynamic rows) */
function repWarehouseSummary(ws){
  if(!repSectionOn('warehouse_summary')) return '';
  if(!ws || !ws.length) return '';
  const head=`<tr><th>${t('repWh')}</th><th>${t('repItems')}</th><th>${t('repOutStock')}</th><th>${t('repLowStock')}</th>
    <th>${t('mvT_RECEIPT')}</th><th>${t('mvT_ISSUE')}</th><th>${t('repMvTotal')}</th><th>${t('repExpired')}</th></tr>`;
  const body=ws.map(w=>{
    const wn=LANG==='ar'?(w.warehouse_name_ar||w.warehouse_code):(w.warehouse_name_en||w.warehouse_code);
    return `<tr><td>${esc(wn||'')}</td><td>${fmtNum(w.item_lines)}</td>
      <td class="${w.out_of_stock>0?'rep-c-crit':''}">${fmtNum(w.out_of_stock)}</td>
      <td class="${w.low_stock>0?'rep-c-warn':''}">${fmtNum(w.low_stock)}</td>
      <td>${fmtNum(w.receipts)}</td><td>${fmtNum(w.issues)}</td><td>${fmtNum(w.total_movements)}</td>
      <td class="${w.expired_batches>0?'rep-c-crit':''}">${fmtNum(w.expired_batches)}</td></tr>`;

  return `<div class="rep-sec"><h3>${t('repWarehouseSummary')}</h3><table class="rep-tbl">${head}${body}</table></div>`;
}

/* Item Summary (opening/closing per item — item-level ONLY, no grand totals) */
function repItemSummary(items){
  if(!repSectionOn('item_summary')) return '';
  if(!items || !items.length) return `<div class="rep-sec"><h3>${t('repItemSummary')}</h3><div class="rep-empty">${t('repNoItems')}</div></div>`;
  const head=`<tr><th></th><th>${t('repCode')}</th><th>${t('repItem')}</th><th>${t('repWh')}</th><th>${t('repUnit')}</th>
    <th>${t('repOpening')}</th><th>${t('mvT_RECEIPT')}</th><th>${t('mvT_ISSUE')}</th><th>${t('repClosing')}</th><th>${t('repStatus')}</th></tr>`;
  const body=items.map(it=>{
    const nm=LANG==='ar'?(it.name_ar||it.name_en):(it.name_en||it.name_ar);
    const wn=LANG==='ar'?(it.warehouse_name_ar||it.warehouse_code):(it.warehouse_name_en||it.warehouse_code);
    const un=LANG==='ar'?(it.unit_name_ar||it.unit_name_en):(it.unit_name_en||it.unit_name_ar);
    const img=it.image_url?`<img class="rep-thumb" src="${esc(it.image_url)}" onclick="openLightbox('${esc(it.image_url)}')" alt=""/>`:`<div class="rep-thumb rep-thumb-none">📦</div>`;
    const st=it.stock_status;
    const stCls=st==='out'?'rep-c-crit':(st==='low'?'rep-c-warn':'rep-c-ok');
    const stLbl=st==='out'?t('repOutStock'):(st==='low'?t('repLowStock'):t('repHealthy'));
    return `<tr><td>${img}</td><td>${esc(it.item_code||'')}</td><td>${esc(nm||'')}</td><td>${esc(wn||'')}</td><td>${esc(un||'')}</td>
      <td>${fmtNum(it.opening)}</td><td>${fmtNum(it.receipts)}</td><td>${fmtNum(it.issues)}</td>
      <td><b>${fmtNum(it.closing)}</b></td><td class="${stCls}">${stLbl}</td></tr>`;
  }).join('');
  return `<div class="rep-sec"><h3>${t('repItemSummary')}</h3><div class="rep-scroll"><table class="rep-tbl rep-tbl-items">${head}${body}</table></div></div>`;
}

    <div class="rep-kpis">

/* Audit Summary */
function repAuditSummary(a){
  if(!repSectionOn('audit_summary')) return '';
  if(!a) return '';

  const by=a.by_action||{};

/* Movement Register card (stub) + detailed (lazy) */
function repRegisterCard(reg){
  if(!repSectionOn('movement_register')) return '';
  if(!reg) return '';
  const n=Number(reg.total_rows||0);
  if(!repState.regOpen){
    return `<div class="rep-sec"><h3>${t('repMovementRegister')}</h3>
      <div class="rep-regcard">
        <span>${fmtNum(n)} ${t('repMovements')}</span>
        ${n>0?`<button class="rep-regbtn" onclick="repOpenRegister()">${t('repViewRegister')}</button>`:`<span class="rep-empty-inline">${t('repNoMovements')}</span>`}
      </div></div>`;
  }
  // opened → detailed table
  let inner='';
  if(repState.regLoading){ inner=`<div class="rep-loading">${t('repLoading')}</div>`; }
  else if(repState.regError){ inner=`<div class="rep-err">${t('repErr_'+repState.regError)||t('repErrGeneric')}</div>`; }
  else if(repState.regData){
    const d=repState.regData;
    const mvs=d.movements||[];
    // type filter chips
    const types=['','RECEIPT','ISSUE','RETURN','TRANSFER_IN','TRANSFER_OUT','DISPOSAL','ADJUSTMENT'];
    const typeSel=`<select class="rep-sel" onchange="repRegType(this.value)">
      <option value="">${t('mvAllTypes')}</option>
      ${types.slice(1).map(tp=>`<option value="${tp}" ${repState.regType===tp?'selected':''}>${t('mvT_'+tp)}</option>`).join('')}
    </select>`;
    if(!mvs.length){ inner=`${typeSel}<div class="rep-empty">${t('repNoMovements')}</div>`; }
    else {
      const isAdm=CTX.mode==='admin';
      const head=`<tr><th>${t('repDate')}</th><th>${t('repMvType')}</th><th>${t('repItem')}</th><th>${t('repWh')}</th><th>${t('repQty')}</th><th>${t('repBatch')}</th>${isAdm?`<th>${t('repActor')}</th>`:''}<th>${t('repNote')}</th></tr>`;
      const rows=mvs.map(m=>{
        const nm=LANG==='ar'?(m.item_name_ar||m.item_name_en):(m.item_name_en||m.item_name_ar);
        const wn=LANG==='ar'?(m.warehouse_name_ar||m.warehouse_code):(m.warehouse_name_en||m.warehouse_code);
        const un=LANG==='ar'?(m.unit_name_ar||m.unit_name_en):(m.unit_name_en||m.unit_name_ar);
        const q=Number(m.qty); const qCls=q<0?'rep-q-neg':'rep-q-pos';
        const img=m.image_url?`<img class="rep-thumb-sm" src="${esc(m.image_url)}" onclick="openLightbox('${esc(m.image_url)}')" alt=""/>`:'';
        return `<tr>
          <td>${repFmtDT(m.created_at)}</td>
          <td><span class="rep-mvtype rep-mv-${esc(m.movement_type)}">${t('mvT_'+m.movement_type)||m.movement_type}</span></td>
          <td>${img} ${esc(m.item_code||'')} <span class="rep-itname">${esc(nm||'')}</span></td>
          <td>${esc(wn||'')}</td>
          <td class="${qCls}">${fmtNum(q)} ${esc(un||'')}</td>
          <td>${esc(m.batch_no||'—')}</td>
          ${isAdm?`<td>${esc(m.actor_email||'—')}</td>`:''}
          <td>${esc(m.note||'')}</td>
        </tr>`;
      }).join('');
      // pagination
      const total=Number(d.total_count||0);
      const from=repState.regOffset+1, to=Math.min(repState.regOffset+repState.regLimit,total);
      const pager=`<div class="rep-pager">
        <button class="rep-pbtn" ${repState.regOffset<=0?'disabled':''} onclick="repRegPage(-1)">${t('mvPrev')}</button>
        <span>${fmtNum(from)}–${fmtNum(to)} ${t('mvOf')} ${fmtNum(total)}</span>
        <button class="rep-pbtn" ${!d.has_more?'disabled':''} onclick="repRegPage(1)">${t('mvNext')}</button>
      </div>`;
      inner=`${typeSel}<div class="rep-scroll"><table class="rep-tbl rep-tbl-reg">${head}${rows}</table></div>${pager}`;
    }
  }
  return `<div class="rep-sec"><h3>${t('repMovementRegister')}</h3>${inner}</div>`;
}

/* the preview (all sections, gated by preset) */
function repPreview(){
  const d=repState.data; if(!d) return '';
  const m=d.meta||{};
  // scope label
  let scopeLbl;
  if(m.is_all_warehouses){ scopeLbl=t('repAllWh'); }
  else {
    const w=(repState.wh||[]).find(x=>x.warehouse_id===repState.whId);
    scopeLbl=w?repWhName(w):t('repOneWh');
  }
  const header=`<div class="rep-preview-head">
    <div class="rph-title">
      <div class="rph-brand">ADVACON</div>
      <h2>${t('repReportTitle')}</h2>
      <div class="rph-preset">${t('repRep'+({full:'Full',daily:'Daily',weekly:'Weekly',monthly:'Monthly',inventory:'Inventory',movement:'Movement',expiry:'Expiry',approvals:'Approvals'}[repState.preset]||'Full'))}</div>
    </div>
    <div class="rph-meta">
      <div><span>${t('repPeriod')}:</span> ${repFmtRange(m.from, m.to)}</div>
      <div><span>${t('repScope')}:</span> ${esc(scopeLbl)} ${m.is_all_warehouses?`(${fmtNum(m.scope_warehouse_count)})`:''}</div>
      <div><span>${t('repGenerated')}:</span> ${repFmtDT(m.generated_at)}</div>
    </div>
    <div class="rph-export">
      <button class="rep-exp" onclick="repPrintReport()" title="${t('repPdfHint')}">${t('repExportPdf')}</button>
      <button class="rep-exp" disabled title="${t('repSoon')}">${t('repExportExcel')}</button>
      <button class="rep-exp" onclick="repPrintReport()">${t('repPrint')}</button>
    </div>
  </div>`;
  const printFooter=`<div class="rep-print-footer">ADVACON — ${t('repFooterSys')} · ${t('repGenerated')}: ${repFmtDT(m.generated_at)}</div>`;
  return `<div class="rep-preview">
    ${header}
    ${repExecSummary(d.summary)}
    ${repObservations(d.observations)}
    ${repMovementSummary(d.movement_summary, d.comparison)}
    ${repWarehouseSummary(d.warehouse_summary)}
    ${repInventoryHealth(d.inventory_health)}
    ${repItemSummary(d.item_summary)}
    ${repBatchesSummary(d.batches_summary)}
    ${repApprovalsSummary(d.movement_approvals_summary)}
    ${repMaterialSummary(d.material_requests_summary)}
    ${repExceptions(d.exceptions)}
    ${repAuditSummary(d.audit_summary)}
    ${repRegisterCard(d.movement_register)}
    ${printFooter}
  </div>`;
}

/* PHASE D — Print / PDF. Same flow for both buttons; user picks "Save as PDF"
   in the browser dialog. Prints exactly what's on screen (register included only
   if the user opened it — NO background fetch of extra pages). */
function repPrintReport(){
  if(!repState.data){ return; }
  document.body.classList.add('printing-report');
  const cleanup=()=>{ document.body.classList.remove('printing-report'); window.removeEventListener('afterprint',cleanup); };
  window.addEventListener('afterprint',cleanup);
  // Safety net for browsers that don't fire afterprint reliably
  setTimeout(cleanup, 60000);
  try{ window.print(); }
  catch(e){ cleanup(); }
}

/* main entry */
function viewWhReports(){
  if(repState.wh===null){ repEnsureWh().then(repRender); }
  let body='';
  if(repState.loading){ body=`<div class="rep-loading">${t('repGenerating')}</div>`; }
  else if(repState.error){ body=`<div class="rep-err">${t('repErr_'+repState.error)||t('repErrGeneric')}</div>`; }
  else if(repState.data){ body=repPreview(); }
  else { body=`<div class="rep-hint-box">${t('repStartHint')}</div>`; }
  return `<div class="phead"><div class="eyebrow">${t('dashEye')}</div><h1>${t('awh_reports')}</h1></div>
    ${repForm()}
    ${body}`;
}
